utils.warppile$shrinkeffect.message=周遭世界正在膨胀...
utils.warppile$regrowtheffect.message=脚下野草疯长...
utils.warppile$hungereffect.message=如历千年饥馑...
utils.warppile$spawneffect.message=不速之客将至...
