actors.hero.talent.messis_potentiae.desc=_+1:_ 修道者可施展_力贯寰瀛_法术，该法术以消耗2点法力值为代价，为其精神注入能量，持续_20回合_。此效果持续期间，每次击杀敌人可获得0.5点法典充能。\n\n_+2:_ 修道者可施展_力贯寰瀛_法术，该法术以消耗2点法力值为代价，为其精神注入能量，持续_30回合_。效果持续期间，每次击杀敌人可恢复0.5点法典充能。\n\n_+3:_ 修道者可施展_力贯寰瀛_，该法术以消耗2点能量为代价，为其精神注入能量持续_40回合_。效果持续期间，每次击杀敌人可恢复0.5点法典充能。
actors.hero.talent.emendatio_icatus.desc=修道者可施展_圣光普惠_法术，该法术能增强相当于不同数量充能的法术效果——具体增强数量和修道者技能中占主导地位的天赋息息相关，消耗4点充能。\n\n_+1_：_圣光普惠_每种天赋属性增加_1点充能_。\n\n_+2_：_圣光普惠_每种天赋属性增加_1.5点充能_。\n\n_+3_：_圣光普惠_每种天赋属性增加_2点充能_。\n\n_-_ 每次使用后，修复之光需消耗25回合冷却时间恢复每点能量值。\n_-_ 修复之光生效期间，即使能量不足或未满足天赋要求，仍可施放法术。\n_-_ 修复之光不受法典当前能量值限制，但无法在负能量状态下施放。
