items.armor.curses.antientropy.name=反熵%s
items.armor.curses.antientropy.desc=反熵诅咒与宇宙法则背道而驰，将热能从攻击者转移到穿戴者身上。这会导致攻击方短时间内被冰冻，并使穿戴者燃烧起来。
items.armor.curses.bulk.name=臃肿%s
items.armor.curses.bulk.desc=臃肿诅咒的护甲看上去更加厚重，但实际上防御力并没有增强。硕大的体积反而让使用者难以穿过门口。
items.armor.curses.corrosion.name=腐蚀%s
items.armor.curses.corrosion.desc=腐蚀护甲会喷溅出侵蚀性液体，为区域内的所有东西盖上一层黏糊糊的酸性泥浆。
items.armor.curses.displacement.name=定相%s
items.armor.curses.displacement.desc=定相诅咒会在穿戴者受到攻击时试图将其传送到安全地带。不过，过强的威力反倒会导致使用者被随机传送到层内各处。
items.armor.curses.metabolism.name=代谢%s
items.armor.curses.metabolism.desc=代谢诅咒在穿戴者受伤时能直接将饱腹度转化为生命值，提供额外的治疗，但你会很快陷入饥饿之中。
items.armor.curses.multiplicity.name=分身%s
items.armor.curses.multiplicity.desc=受到分身诅咒的防具含有一种危险的复制魔法。有时候它会复制出穿戴者的镜像，但也有同等几率复制攻击者！
items.armor.curses.overgrowth.name=丛生%s
items.armor.curses.overgrowth.desc=丛生诅咒的护甲上生长着各种植物。从美学的角度来讲颇为有趣，但这些花花草草对防御力没有任何贡献，只会在战斗中随机发动效果！
items.armor.curses.stench.name=恶臭%s
items.armor.curses.stench.desc=受到恶臭诅咒的防具会释放出团团毒雾，对一切来不及逃离的对象造成伤害。
items.armor.glyphs.affection.name=魅惑%s
items.armor.glyphs.affection.desc=这个强大的刻印能够操控攻击者的心智，暂时地魅惑他们。
items.armor.glyphs.antimagic.name=敌法%s
items.armor.glyphs.antimagic.desc=该强大刻印能使护甲在防御物理伤害的同时抵御魔法伤害。这种魔法防御不受护甲等阶影响。
items.armor.glyphs.brimstone.name=狱火%s
items.armor.glyphs.brimstone.desc=这个刻印会保护穿戴者和其所有物免受火焰的伤害及其他影响。
items.armor.glyphs.camouflage.name=迷彩%s
items.armor.glyphs.camouflage.desc=这个刻印能让使用者与高草融为一体，得到短暂的隐身效果。
items.armor.glyphs.entanglement.name=缠绕%s
items.armor.glyphs.entanglement.desc=这个刻印会在使用者周围生出能吸收伤害的地根护甲。这种地根护甲会在使用者移动后散落失效。
items.armor.glyphs.flow.name=涌流%s
items.armor.glyphs.flow.desc=这个刻印能操控使用者周身的水流，让使用者在水中移动时速度大大加快。
items.armor.glyphs.obfuscation.name=晦暗%s
items.armor.glyphs.obfuscation.desc=这个刻印会掩盖使用者的气息，让使用者更难以被发现。
items.armor.glyphs.potential.name=电势%s
items.armor.glyphs.potential.desc=这个刻印在被击中时会积蓄能量，在生效时为使用者的法杖充能。
items.armor.glyphs.repulsion.name=反斥%s
items.armor.glyphs.repulsion.desc=这个刻印会将敌人攻击的冲击力反弹回去，使攻击者飞至远处。
items.armor.glyphs.stone.name=磐岩%s
items.armor.glyphs.stone.desc=这个刻印使用沉重的魔法石包裹了整个铠甲让使用者无法闪避，但会根据原有的闪避能力吸收伤害。
items.armor.glyphs.swiftness.name=迅捷%s
items.armor.glyphs.swiftness.desc=这个刻印会在近范围内没有敌人时使提高使用者的移动速度。
items.armor.glyphs.thorns.name=荆棘%s
items.armor.glyphs.thorns.desc=这个强大的刻印会使怪物攻击穿戴者时受到一定的反弹伤害
items.armor.glyphs.viscosity.name=粘稠%s
items.armor.glyphs.viscosity.deferred=延缓%d点伤害
items.armor.glyphs.viscosity$defereddamage.name=延缓伤害
items.armor.glyphs.viscosity$defereddamage.ondeath=被延迟的伤害还是杀掉了你……
items.armor.glyphs.viscosity$defereddamage.rankings_desc=死于延迟伤害
items.armor.glyphs.viscosity$defereddamage.desc=瞬时的伤害被延缓，随着时间慢慢释放。\n\n剩余的延迟伤害：%d。
items.armor.glyphs.viscosity.desc=这个刻印可以储存对使用者造成的伤害，让使用者缓慢受伤而不是一下子受到重击。
items.armor.armor.ac_detach=拆卸
items.armor.armor.detach_seal=你将纹章从护甲上摘了下来。
items.armor.armor.equip_cursed=这件护甲生疼地勒住了你。
items.armor.armor.identify=你对你的护甲已经足够熟悉并且可以因此将其完全鉴定。
items.armor.armor.hardening_gone=这件盔甲上的硬化已经磨损！
items.armor.armor.incompatible=不同属性的魔法相冲突，消除了护甲上的刻印！
items.armor.armor.curr_absorb=这件_%1$d阶_护甲能抵挡_%2$d~%3$d点伤害_并且需要_%4$d点力量_来正常使用。
items.armor.armor.avg_absorb=一般情况下此类_%1$d阶_护甲能抵挡_%2$d~%3$d点伤害_，并且需要%4$d点力量来正常使用。
items.armor.armor.too_heavy=由于你的力量不足，使用这件护甲会降低你的移动、闪避以及防御能力。
items.armor.armor.probably_too_heavy=这套护甲对你来说或许太重了。
items.armor.armor.excess_str=你的额外力量使你穿戴着这件护甲时_更易闪避_。
items.armor.armor.evasion=这件护甲强化了_闪避_能力。
items.armor.armor.defense=这件护甲强化了_防御_能力。
items.armor.armor.inscribed=上面镌刻着_%s_。
items.armor.armor.glyph_hardened=它已经被_硬化_。
items.armor.armor.hardened_no_glyph=这件盔甲已经被_硬化_，但目前没有刻上附魔。
items.armor.armor.cursed_worn=这套护甲被诅咒了，你无法卸下它。
items.armor.armor.cursed=你能感觉到这套护甲里潜伏着一股充满恶意的魔力。
items.armor.armor.weak_cursed=尽管有诅咒，你仍然可以卸下这件盔甲。
items.armor.armor.not_cursed=这件护甲没有被诅咒。
items.armor.armor.seal_attached=战士的破损纹章被贴附于这件护甲上，它正为战士提供_%d点护盾_。
items.armor.armor$glyph.glyph=刻印
items.armor.armor$glyph.killed=%s害死了你…
items.armor.armor$glyph.rankings_desc=死于符文效果
items.armor.classarmor.ac_ability=选择技能
items.armor.classarmor.ac_transfer=转移
items.armor.classarmor.no_ability=你的护甲当前没有技能，你应该选择一项！
items.armor.classarmor.not_equipped=你需要穿戴这套护甲才能使用它的特技！
items.armor.classarmor.low_charge=护甲没有足够的能量来释放技能！
items.armor.classarmor.charge_use=现在使用该能力将消耗_%s_的充能。
items.armor.classarmor.transfer_title=转移护甲
items.armor.classarmor.transfer_desc=矮人王冠中蕴藏的魔法可以被转移到另一套护甲中去。注意，此过程中原先的护甲会被销毁。
items.armor.classarmor.transfer_prompt=选择一件护甲
items.armor.classarmor.transfer_cancel=取消
items.armor.classarmor.transfer_complete=你的英雄铠甲的特殊技能已被转移！
items.armor.clericarmor.name=英雄祭服
items.armor.clericarmor.desc=穿上这套内衬护甲的衣服时，牧师可以使用一项特殊技能
items.armor.clotharmor.name=布甲
items.armor.clotharmor.desc=这件轻便的护甲能提供最基本的防御。
items.armor.duelistarmor.name=英雄胸甲
items.armor.duelistarmor.desc=穿上这件板甲和披风，决斗家可以执行特殊技能。
items.armor.huntressarmor.name=英雄披风
items.armor.huntressarmor.no_enemies=视野中未发现敌人。
items.armor.huntressarmor.desc=穿着此披风时，女猎手可以施展一项特殊技能。
items.armor.scoutarmor.name=武装披风
items.armor.scoutarmor.ac_special=超级射击
items.armor.scoutarmor.not_ready=超级射击尚未准备就绪！
items.armor.scoutarmor.no_bow=你没有用于射击的灵能弓。
items.armor.scoutarmor.not_equipped=你必须装备披风以使用超级射击。
items.armor.scoutarmor$scoutcooldown.name=超级射击冷却
items.armor.scoutarmor$scoutcooldown.desc=耐心等待...\n\n在冷却时间，女猎手不能使用超级射击。剩余回合数：%s
items.armor.scoutarmor.desc=穿上这身斥候标配，女猎手能够为她的灵能弓蓄力，准备一次超级射击，其依据射击距离造成额外伤害。每次超级射击需要一些时间来重新蓄力，并且要花费2回合来使用。\n\n这件披风在未装备时也能使用。\n当前效能: 初始充能: _+%s%%_, 距离因子: _+%s%%_, 最大伤害: _%s%%_
items.armor.leatherarmor.name=皮甲
items.armor.leatherarmor.desc=用鞣制的兽皮制成的护甲。没有布甲轻，但提供更好的防御。
items.armor.magearmor.name=英雄法袍
items.armor.magearmor.desc=穿着这件华贵的法袍时，法师可以释放一项特殊的技能。
items.armor.mailarmor.name=链甲
items.armor.mailarmor.desc=由金属链环环相扣制成的一套结实又不失灵活的护甲。
items.armor.platearmor.name=板甲
items.armor.platearmor.desc=厚重的金属板拼接到一起，为能承受其骇人重量的冒险者提供无与伦比的防御。
items.armor.ratkingarmor.name=王冠
items.armor.ratkingarmor.ac_special=鼠王之怒
items.armor.ratkingarmor.desc=如果我愿意，这可能就是游戏的目标。纯粹的强大。有了它，没有什么能阻止我获胜…
items.armor.roguearmor.name=英雄风衣
items.armor.roguearmor.desc=穿着这身隐蔽气息的风衣，盗贼能够施展一项特殊技能：
items.armor.scalearmor.name=鳞甲
items.armor.scalearmor.desc=在厚实的皮背心中缝入金属鳞片，形成了灵活而高防御的护甲。
items.armor.warriorarmor.name=英雄铠甲
items.armor.warriorarmor.desc=这套铠甲看起来很沉重，但能让战士施展一项特殊技能：
items.artifacts.alchemiststoolkit.name=炼金工具箱
items.artifacts.alchemiststoolkit.ac_brew=酿造
items.artifacts.alchemiststoolkit.ac_energize=加注
items.artifacts.alchemiststoolkit.not_ready=你的炼金工具箱还没有准备好。
items.artifacts.alchemiststoolkit.cursed=受诅咒的炼金箱正在阻止你炼金！
items.artifacts.alchemiststoolkit.omni_cursed=你不知道如何使用这些东西。
items.artifacts.alchemiststoolkit.need_energy=要这么做你需要至少 5 点能量。
items.artifacts.alchemiststoolkit.energize_desc=每 5 个能量水晶可供炼金工具箱升 1 级，这能增加工具箱随时间自然产生的能量。并且更快地进行预热。\n\n你打算花费多少能量呢？
items.artifacts.alchemiststoolkit.energize_1=5 能量：+1 级
items.artifacts.alchemiststoolkit.energize_all=%1$d能量：+%2$d 级
items.artifacts.alchemiststoolkit.desc=这套工具箱内存放着各式各样的试剂，草药和一个小摇瓶，让使用者能够随时随地进行炼金实验。这个摇瓶里貌似装载着液态的炼金能量水晶。
items.artifacts.alchemiststoolkit.desc_cursed=被诅咒的工具箱将自己紧紧固定在你的身上，抑制你使用炼金工具的能力。
items.artifacts.alchemiststoolkit.desc_warming=工具箱正在预热中，等待片刻即可使用。
items.artifacts.alchemiststoolkit.desc_hint=手中的工具箱正随着你获得经验值缓慢生成炼金能量。摇瓶中的液体似乎能通过添加炼金能量水晶来增加。
items.artifacts.artifact.cannot_wear_two=你不能装备两件相同的神器。
items.artifacts.artifact.equip_cursed=这件神器令人痛苦地缠住了你的灵魂。
items.artifacts.artifact.curse_known=你能感觉到在这个神器上潜伏着一股充满恶意的魔力。
items.artifacts.artifact.not_cursed=这件神器没有被诅咒。
items.artifacts.artifact.need_to_equip=你需要装备神器才能进行该操作。
items.artifacts.capeofthorns.name=荆棘斗篷
items.artifacts.capeofthorns.desc=这些从DM-300上掉落的金属片构成了一件坚硬的斗篷。它似乎能储存很多能量，也许它还残留有少量DM-300的能力？
items.artifacts.capeofthorns.desc_inactive=斗篷压在你的肩上的感觉非常沉重，它似乎能从你受的伤里获得能量。
items.artifacts.capeofthorns.desc_active=斗篷似乎在释放其存储的能量，并将其辐射出一种防护力场。
items.artifacts.capeofthorns$thorns.inert=你的斗篷再次失效了。
items.artifacts.capeofthorns$thorns.radiating=你的斗篷正在释放存储的能量，你感到自己正在被保护着！
items.artifacts.capeofthorns$thorns.levelup=你的斗篷变得更强大了！
items.artifacts.capeofthorns$thorns.name=荆棘
items.artifacts.capeofthorns$thorns.desc=你的斗篷在你周围辐射能量，产生了一个偏斜力场！ \n\n该效果下你受到的所有伤害都会被减少。此外，如果攻击者就在你旁边，被减少的伤害会反弹给攻击者。\n\n荆棘效果持续时间：%s回合
items.artifacts.chaliceofblood.name=蓄血圣杯
items.artifacts.chaliceofblood.ac_prick=血祭
items.artifacts.chaliceofblood.yes=是的，我知道我在做什么
items.artifacts.chaliceofblood.no=不，我改主意了
items.artifacts.chaliceofblood.prick_warn=每次使用圣杯都会消耗更多的生命能量，要是不够小心，这种行为可以轻易地杀死你。\n\n你确定要给它更多的生命能量吗？
items.artifacts.chaliceofblood.onprick=你刺破了自己的手指，使你的生命精华流入了圣杯。
items.artifacts.chaliceofblood.ondeath=圣杯将你的生命精华吸噬殆尽了…
items.artifacts.chaliceofblood.desc=这个闪闪发光的银质酒杯在边沿突兀地装饰着几颗造型尖锐的宝石。
items.artifacts.chaliceofblood.desc_cursed=被诅咒的圣杯将自己固定在你手上，抑制着你回复生命的能力。
items.artifacts.chaliceofblood.desc_1=握住圣杯的那一刻，你涌起一股想在那些尖锐宝石上刺伤自己的奇特冲动。
items.artifacts.chaliceofblood.desc_2=你的一些血液汇集到圣杯里，你可以隐约感受到杯子在为你送来生命能量。你还想用圣杯继续割伤自己，即便你知道那很疼。
items.artifacts.chaliceofblood.desc_3=圣杯已经被你的生命精华填满。你可以感觉到圣杯正将生命能量倾泻般回馈给你。
items.artifacts.kromercloak.name=克罗默斗篷
items.artifacts.kromercloak.desc=克罗默经济的精髓所覆盖的斗篷。\n\n这个神器的充能速度比普通的暗影斗篷快很多，但会随机伤害使用者。
items.artifacts.cloakofshadows.name=暗影斗篷
items.artifacts.cloakofshadows.ac_stealth=潜行
items.artifacts.cloakofshadows.ac_teleport=传送
items.artifacts.cloakofshadows.cooldown=你的斗篷还需要%d回合来重新激活。
items.artifacts.cloakofshadows.cursed=你不能使用受诅咒的斗篷
items.artifacts.cloakofshadows.no_charge=你的斗篷充能不足无法使用。
items.artifacts.cloakofshadows.desc=这是盗贼多年前从皇家军械库窃取的一件无价的魔法斗篷。穿上时，能够使你在短时间内完全隐身。\n\n被使用得越频繁，斗篷就会变得越强，使盗贼更频繁地隐身，持续时间也更长。
items.artifacts.cloakofshadows.prompt=选择要传送的位置
items.artifacts.cloakofshadows.cant_reach=你的斗篷没有足够的能量传送到这里。
items.artifacts.cloakofshadows$cloakrecharge.action_name=斗篷传送
items.artifacts.cloakofshadows$cloakstealth.no_charge=你的斗篷耗尽了能量。
items.artifacts.cloakofshadows$cloakstealth.levelup=你的斗篷变得更强大了！
items.artifacts.cloakofshadows$cloakstealth.name=斗篷之下
items.artifacts.cloakofshadows$cloakstealth.desc=你身上的暗影斗篷正给予你隐形效果。\n\n当你在隐形时敌人无法追踪或攻击你。大部分物理攻击和魔法(比如卷轴和法杖)会不可避免地消除隐形效果。\n\n你会一直拥有该状态，直到你自行取消或斗篷耗尽能量。
items.artifacts.driedrose.name=干枯玫瑰
items.artifacts.driedrose.ac_summon=召唤
items.artifacts.driedrose.ac_direct=指引
items.artifacts.driedrose.ac_outfit=装备
items.artifacts.driedrose.spawned=你已经召唤出幽灵了。
items.artifacts.driedrose.no_charge=你的玫瑰尚未充能完毕。
items.artifacts.driedrose.cursed=你不能使用受诅咒的玫瑰。
items.artifacts.driedrose.no_space=你附近没有可用于召唤的空地。
items.artifacts.driedrose.charged=你的玫瑰已经充能完毕！
items.artifacts.driedrose.desc=这就是那朵在幽灵消失前被提及的玫瑰吗？它似乎拥有某种精神力量，也许能以此为媒介触及这位陨落战士的能量。
items.artifacts.driedrose.desc_no_quest=一株因岁月而干枯却没有完全凋零的玫瑰。\n\n它上面看起来残留了一些精神力量，但你现在还不知道如何使用它。
items.artifacts.driedrose.desc_hint=它似乎缺少了一些花瓣。也许把花瓣拼回来可以增强玫瑰。
items.artifacts.driedrose.desc_cursed=受诅咒的玫瑰将自己绑在了你的手上，你感觉到它出奇的冷。
items.artifacts.driedrose.desc_weapon=幽灵的武器：%s。
items.artifacts.driedrose.desc_armor=幽灵的盔甲：%s。
items.artifacts.driedrose.desc_strength=幽灵的力量：%s
items.artifacts.driedrose$petal.name=干枯的花瓣
items.artifacts.driedrose$petal.no_rose=你没有玫瑰来添加这片花瓣。
items.artifacts.driedrose$petal.no_room=你的玫瑰已经放不下这片花瓣了，所以你无视了它。
items.artifacts.driedrose$petal.maxlevel=玫瑰再一次完整了！
items.artifacts.driedrose$petal.levelup=你将花瓣放在了玫瑰上。
items.artifacts.driedrose$petal.desc=一片干枯脆弱的花瓣，它居然能够在这么深的地牢之中幸存下来。
items.artifacts.driedrose$wndghosthero.title=幽灵的装备
items.artifacts.driedrose$wndghosthero.desc=幽灵本身十分脆弱，但她的形体已经完整到足以装备一件武器和防具。她可以和你一样自如使用这些装备。\n\n幽灵目前最高可装备_力量需求为%d_的物品。
items.artifacts.driedrose$wndghosthero.weapon_prompt=选择一件武器
items.artifacts.driedrose$wndghosthero.armor_prompt=选择一件护甲
items.artifacts.driedrose$wndghosthero.cant_unique=幽灵无法使用特殊装备。
items.artifacts.driedrose$wndghosthero.cant_unidentified=你对于那个道具并不是十分了解。
items.artifacts.driedrose$wndghosthero.cant_cursed=你不能让幽灵使用有诅咒的物品。
items.artifacts.driedrose$wndghosthero.cant_strength=幽灵的形体还不够强大，无法装备此物品。
items.artifacts.driedrose$ghosthero.name=悲伤幽灵
items.artifacts.driedrose$ghosthero.def_verb=躲避
items.artifacts.driedrose$ghosthero.hello=再次向你问好，%s。
items.artifacts.driedrose$ghosthero.introduce=我的灵魂与这朵玫瑰相连，它对我非常珍贵，是我在地面上相别的爱人送给我的礼物。\n\n我无法回去见他了，但感谢你给我再一次完成旅程的机会。当我准备好后，我会回应你的呼唤与你并肩作战。\n\n只要你拿着玫瑰我就可以听到你的声音，你可以在远处指引我前进。\n\n希望你能在我倒下的地方继续走下去……
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=下水道以前是安全的，人们甚至会住进来过冬。
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=不知道这里的守卫怎么了，他们放弃守护这片地方了吗？
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=我在地牢外还有家人，希望他们一切安好。
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=守卫没能解决这些怪物，但也许我们能。
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=连下水道都这么危险，不知道更深处会有些什么……
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=这些老鼠和螃蟹是怎么长这么大的？
items.artifacts.driedrose$ghosthero.dialogue_prison_1=我听过不少关于这里的传闻，没有一个是好消息。
items.artifacts.driedrose$ghosthero.dialogue_prison_2=虽说这里是座监狱，但怎么看都更像个地牢。
items.artifacts.driedrose$ghosthero.dialogue_prison_3=我都不敢想象，这里被遗弃之后究竟发生过什么。
items.artifacts.driedrose$ghosthero.dialogue_prison_4=看来这里的囚犯和狱卒都被变成怪物了。
items.artifacts.driedrose$ghosthero.dialogue_prison_5=这么多骷髅都是怎么搞来的？
items.artifacts.driedrose$ghosthero.dialogue_prison_6=这些人其实没必要落得这种下场的……
items.artifacts.driedrose$ghosthero.dialogue_caves_1=看起来这里已经很久未被人类和矮人们踏足了。
items.artifacts.driedrose$ghosthero.dialogue_caves_2=究竟是什么原因让矮人放弃这一整座黄金矿脉的？
items.artifacts.driedrose$ghosthero.dialogue_caves_3=这里的黄金在地表上没什么用，真是太可惜了。
items.artifacts.driedrose$ghosthero.dialogue_caves_4=就像下水道里的一样，这些生物也都被扭曲了。
items.artifacts.driedrose$ghosthero.dialogue_caves_5=这里连蝙蝠都这么狂暴嗜血。
items.artifacts.driedrose$ghosthero.dialogue_caves_6=没有看到任何采矿设备，它们都被矮人回收了吗？
items.artifacts.driedrose$ghosthero.dialogue_city_1=矮人一族勤奋但贪婪。
items.artifacts.driedrose$ghosthero.dialogue_city_2=看来，矮人都城确实是没落了。
items.artifacts.driedrose$ghosthero.dialogue_city_3=我真心希望地表上永远不会变成这副样子。
items.artifacts.driedrose$ghosthero.dialogue_city_4=矮人的皮肤不应该这么苍白的。
items.artifacts.driedrose$ghosthero.dialogue_city_5=矮人，还有他们造的东西，说不好哪种更糟糕。
items.artifacts.driedrose$ghosthero.dialogue_city_6=看来矮人也成了没有思维的怪物。
items.artifacts.driedrose$ghosthero.dialogue_halls_1=这是什么地方？
items.artifacts.driedrose$ghosthero.dialogue_halls_2=这里太可怕了……
items.artifacts.driedrose$ghosthero.dialogue_halls_3=矮人到底怎么想的，试图将这股力量玩弄股掌？
items.artifacts.driedrose$ghosthero.dialogue_halls_4=这里的怪物太诡异了，它们究竟从何而来？
items.artifacts.driedrose$ghosthero.dialogue_halls_5=感觉到了吗？好像有什么东西在盯着我们。
items.artifacts.driedrose$ghosthero.dialogue_halls_6=还好有火把，这里太暗了！
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=为什么会发生这种事，我以为我们成功了？
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=那个东西怎么还能影响这个世界？
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=我希望你知道你在用那个护身符做什么。
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=我想我们还没有完成。
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=我们已经走了这么远，我们可以完成这个！
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=再走一点，我们就可以离开这里！
items.artifacts.driedrose$ghosthero.dialogue_abyss_1=所有的墙壁看起来都像是一团灰色的混乱...
items.artifacts.driedrose$ghosthero.dialogue_abyss_2=这就是他们所说的“虚空”吗？
items.artifacts.driedrose$ghosthero.dialogue_abyss_3=我为你在处理这些生物时的安全祈祷。
items.artifacts.driedrose$ghosthero.dialogue_abyss_4=这里的怪物似乎利用我们最大的弱点。
items.artifacts.driedrose$ghosthero.dialogue_abyss_5=真的没有尽头... 你为什么会同意这个？
items.artifacts.driedrose$ghosthero.dialogue_abyss_6=随着我们越来越深入，一切都变得越来越强大...
items.artifacts.driedrose$ghosthero.seen_goo_1=当心粘咕！
items.artifacts.driedrose$ghosthero.seen_goo_2=有太多朋友死在这个家伙手上了，此仇必报！
items.artifacts.driedrose$ghosthero.seen_goo_3=不能让这个魔障活着离开！
items.artifacts.driedrose$ghosthero.seen_tengu_1=唯一剩下的囚犯是个危险的暗杀者。真应景……
items.artifacts.driedrose$ghosthero.seen_tengu_2=我们被他困住了！
items.artifacts.driedrose$ghosthero.seen_tengu_3=有关那个面具的鬼故事我听过不少……
items.artifacts.driedrose$ghosthero.seen_dm300_1=让挖矿的机器追杀外来者这种事只有矮人才干得出来。
items.artifacts.driedrose$ghosthero.seen_dm300_2=真是个大家伙……
items.artifacts.driedrose$ghosthero.seen_dm300_3=这东西怎么弄的，能运作这么久？
items.artifacts.driedrose$ghosthero.seen_king_1=「力量使人腐败」的说法指的就是这种情况。
items.artifacts.driedrose$ghosthero.seen_king_2=什么国王，根本就是个巫妖。
items.artifacts.driedrose$ghosthero.seen_king_3=就算死了，矮人也听令于他们的老主子。
items.artifacts.driedrose$ghosthero.seen_yog_1=呃，这看起来不妙。
items.artifacts.driedrose$ghosthero.seen_yog_2=原来神是长这样的？
items.artifacts.driedrose$ghosthero.seen_yog_3=这下子要吃苦了……
items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=祝你接下来好运……
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=暂时有点……累了……
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=我会回来的……
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=抱歉……祝好……
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=别管我……消灭它……
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=我……不能……
items.artifacts.driedrose$ghosthero.blessed_ankh_1=刚才你怎么活下来的？
items.artifacts.driedrose$ghosthero.blessed_ankh_2=我当时有个这种东西该多好……
items.artifacts.driedrose$ghosthero.blessed_ankh_3=我的天！你还活着！
items.artifacts.driedrose$ghosthero.player_killed_1=不要！……
items.artifacts.driedrose$ghosthero.player_killed_2=我没能帮上忙……
items.artifacts.driedrose$ghosthero.player_killed_3=怎么会这样……
items.artifacts.driedrose$ghosthero.direct_prompt=我应该怎么办？
items.artifacts.driedrose$ghosthero.directed_follow_1=好，我会跟紧的。
items.artifacts.driedrose$ghosthero.directed_follow_2=我会跟在你后面。
items.artifacts.driedrose$ghosthero.directed_follow_3=跟着你……
items.artifacts.driedrose$ghosthero.directed_follow_4=好，走吧！
items.artifacts.driedrose$ghosthero.directed_follow_5=我掩护你背后。
items.artifacts.driedrose$ghosthero.directed_attack_1=好，我打过去。
items.artifacts.driedrose$ghosthero.directed_attack_2=我去解决那只。
items.artifacts.driedrose$ghosthero.directed_attack_3=正在接近……
items.artifacts.driedrose$ghosthero.directed_attack_4=一起上！
items.artifacts.driedrose$ghosthero.directed_attack_5=那只让我来。
items.artifacts.driedrose$ghosthero.directed_position_1=好，我守住那里。
items.artifacts.driedrose$ghosthero.directed_position_2=我去那里防守。
items.artifacts.driedrose$ghosthero.directed_position_3=正在过去……
items.artifacts.driedrose$ghosthero.directed_position_4=在路上！
items.artifacts.driedrose$ghosthero.directed_position_5=那我就去那里。
items.artifacts.driedrose$ghosthero.desc=看起来很脆弱的人型幻影，身形飘渺。它的力量似乎与你手上的玫瑰有关。\n\n这个幽灵并没有什么过人之处，但它应该是你在这里唯一的挚友了。
items.artifacts.etherealchains.name=虚空锁链
items.artifacts.etherealchains.ac_cast=施放
items.artifacts.etherealchains.rooted=锁链无法拉动被缠绕的你。
items.artifacts.etherealchains.no_charge=你的锁链充能不足。
items.artifacts.etherealchains.cursed=你不能使用受诅咒的锁链。
items.artifacts.etherealchains.does_nothing=这样并没有用。
items.artifacts.etherealchains.cant_pull=你的锁链不能拉动那个目标。
items.artifacts.etherealchains.cant_reach=你的锁链无法触及那里。
items.artifacts.etherealchains.inside_wall=你的锁链只能使自己穿越墙壁，而不是穿透它们
items.artifacts.etherealchains.nothing_to_grab=目标区域没有可供抓取的物件。
items.artifacts.etherealchains.prompt=选择要瞄准的地方
items.artifacts.etherealchains.desc=这些巨大但轻盈的锁链散发着灵魂能量。它们可以用来把你拉向一些地形，或将敌人拉向你。无实体的天然特质甚至可以允许其穿透墙壁！
items.artifacts.etherealchains.desc_cursed=被诅咒的锁链将自己锁在了你的身边，不断地在周围晃动，试图绊倒或绑住你。
items.artifacts.etherealchains.desc_equipped=锁链围绕在你的身边，缓慢地收集被你击败者的精神能量。每一发充能都是锁链中的一环，每一个环节都能正好延长一格。
items.artifacts.etherealchains$chainsrecharge.levelup=你的锁链变得更强大了！
items.artifacts.holytome.name=圣典
items.artifacts.holytome.ac_cast=施放
items.artifacts.holytome.no_spell=当前无法施放该法术
items.artifacts.holytome.cursed=无法使用被诅咒的圣典
items.artifacts.holytome.levelup=圣典力量增强了！
items.artifacts.holytome.desc=作为牧师神圣魔法媒介的圣典。使用圣典可让牧师施放多种神圣魔法。\n\n随着牧师使用，圣典会稳步增强，提供更多充能上限并略微提升充能速度。
items.artifacts.holytome.empowered=圣典当前处于强化状态，可无视充能状态使用
items.artifacts.holytome.depleted=圣典因过度使用正在恢复
items.artifacts.hornofplenty.name=丰饶之角
items.artifacts.hornofplenty.ac_snack=小吃一口
items.artifacts.hornofplenty.ac_eat=食用
items.artifacts.hornofplenty.ac_store=贮存
items.artifacts.hornofplenty.eat=你吃光了号角中的食物。
items.artifacts.hornofplenty.prompt=选择一个食物
items.artifacts.hornofplenty.no_food=你的号角里没有食物可供食用！
items.artifacts.hornofplenty.full=你的号角装满了食物！
items.artifacts.hornofplenty.reject=你的号角并不接受未经烹煮的无味果。
items.artifacts.hornofplenty.maxlevel=你的号角已经吞噬了尽可能多的食物！
items.artifacts.hornofplenty.levelup=号角吞噬了你提供的食物，变得更加强大了。
items.artifacts.hornofplenty.feed=号角吞噬了你提供的食物。
items.artifacts.hornofplenty.desc=这个号角不能被用来吹奏，不过会随着你深入地牢获得经验而逐渐填充食物。
items.artifacts.hornofplenty.desc_hint=也许可以通过给予它食物的能量来增加号角的力量。
items.artifacts.hornofplenty.desc_cursed=被诅咒的号角把自己绑在了你的身边，它似乎在渴望得到食物而不是制造食物。
items.artifacts.lloydsbeacon.name=时空道标
items.artifacts.lloydsbeacon.ac_zap=释放
items.artifacts.lloydsbeacon.ac_set=设置
items.artifacts.lloydsbeacon.ac_return=返回
items.artifacts.lloydsbeacon.no_charge=你的信标现在并没有足够的能量支撑发射传送魔法。
items.artifacts.lloydsbeacon.tele_fail=传送魔法失败了。
items.artifacts.lloydsbeacon.prompt=选择要释放魔法的位置
items.artifacts.lloydsbeacon.levelup=你的信标变得更强大了！
items.artifacts.lloydsbeacon.preventing=这里强大的魔力流使你无法使用时空道标！
items.artifacts.lloydsbeacon.creatures=邻近生物的心灵信号正在干扰你的时空道标并使其无法被使用。
items.artifacts.lloydsbeacon.return=时空道标被成功设置在了你的当前位置，现在你可以随时返回这里。
items.artifacts.lloydsbeacon.desc=时空道标是一个赋予使用者控制传送魔法能力的复杂魔法装置。该信标可以用来返回一个预定地点，但其在装备时的充能也可以用来对指定目标发射随机传送魔法。这个魔法可以针对某个目标或使用者自身。
items.artifacts.lloydsbeacon.desc_set=信标被设置在了像素地牢第%d层的某处。
items.artifacts.masterthievesarmband.name=神偷袖章
items.artifacts.masterthievesarmband.ac_steal=窃取
items.artifacts.masterthievesarmband.no_charge=你的袖章充能不足。
items.artifacts.masterthievesarmband.cursed=你不能使用受诅咒的袖章。
items.artifacts.masterthievesarmband.full=你的袖章充满了能量！
items.artifacts.masterthievesarmband.prompt=选择一个敌人作为目标。
items.artifacts.masterthievesarmband.no_target=你只能选择一个邻近你的目标！
items.artifacts.masterthievesarmband.steal_shopkeeper=你不能直接从商店老板窃取物品。
items.artifacts.masterthievesarmband.no_steal=这个敌人身上没什么好偷的。
items.artifacts.masterthievesarmband.stole_item=你偷到了：%s 。
items.artifacts.masterthievesarmband.failed_steal=你没有尝试偷取任何东西。
items.artifacts.masterthievesarmband.level_up=你的袖章变得更强大了！
items.artifacts.masterthievesarmband.desc=这个紫色的天鹅绒袖标是盗贼大师的标志。它不属于你，但它大概也不属于上一个主人。
items.artifacts.masterthievesarmband.desc_cursed=被诅咒的袖章紧紧地束在你的手腕上，不知怎么你感觉自己的钱袋正在慢慢变轻……
items.artifacts.masterthievesarmband.desc_worn=当你获得经验时，你感觉到袖章正在积累力量。你可以利用这个力量从商店偷取东西，或者洗劫敌人！\n\n洗劫敌人不消耗回合，且会暂时扰乱它，并给你一个获得它的战利品的机会！对未察觉的敌人洗劫效果更强。多次洗劫同一个敌人不会多次判定战利品。
items.artifacts.sandalsofnature.name=自然之履
items.artifacts.sandalsofnature.name_1=自然之鞋
items.artifacts.sandalsofnature.name_2=自然之靴
items.artifacts.sandalsofnature.name_3=自然护腿
items.artifacts.sandalsofnature.ac_feed=喂食
items.artifacts.sandalsofnature.ac_root=扎根
items.artifacts.sandalsofnature.prompt=选择一个种子
items.artifacts.sandalsofnature.levelup=你的鞋子尺寸变大了！
items.artifacts.sandalsofnature.absorb_seed=鞋子吸收了种子，看起来更健康了。
items.artifacts.sandalsofnature.no_effect=你必须先给你的鞋子喂一颗种子。
items.artifacts.sandalsofnature.low_charge=你的鞋子没有足够的充能。
items.artifacts.sandalsofnature.prompt_target=选择一个位置
items.artifacts.sandalsofnature.out_of_range=那个位置超出范围。
items.artifacts.sandalsofnature.desc_1=初看像是用麻绳编成的凉鞋实际上是两株植物！它们看上去既虚弱又苍白，也许它们需要一点营养？
items.artifacts.sandalsofnature.desc_2=这双鞋子已经长大了，现在更像是一双合脚的鞋。它们已经没那么苍白了，也许还可以进一步成长？
items.artifacts.sandalsofnature.desc_3=这两株植物又长大了。像是一双树皮制成的厚靴子。植物似乎已经恢复了它们的力量，但也许仍能进一步成长？
items.artifacts.sandalsofnature.desc_4=植物们似乎已长到最大，就像是一对装甲护胫。这对深棕色护腿看上去仿如一棵非常坚毅的树。
items.artifacts.sandalsofnature.desc_hint=穿上这件神器时你感到更加亲近自然了。
items.artifacts.sandalsofnature.desc_cursed=被诅咒的鞋子切断了一切你与自然的联系。
items.artifacts.sandalsofnature.desc_ability=这双鞋闪着你喂的上一个种子的颜色。它们可以短时间扎根并在三格范围内产生对应植物的效果。\n种子： _%s_\n需要充能：_%d%%
items.artifacts.sandalsofnature.desc_seeds=你已经给鞋子喂过了%d类种子。
items.artifacts.talismanofforesight.name=先见护符
items.artifacts.talismanofforesight.ac_scry=探查
items.artifacts.talismanofforesight.low_charge=护符需要至少 5% 的充能才可以再次使用“探查”。
items.artifacts.talismanofforesight.prompt=选择要探查的位置
items.artifacts.talismanofforesight.levelup=你的护符变得更强大了！
items.artifacts.talismanofforesight.full_charge=你的护符充满了能量！
items.artifacts.talismanofforesight.desc=一块雕着奇怪刻纹的光滑石头。它好像是在观察着你周围的一切，留意任何不寻常的东西。
items.artifacts.talismanofforesight.desc_worn=手里拿着护符时，你感到五感都更敏锐了。护符正随着时间慢慢积攒能量，当你发现被隐藏的门或陷阱时会获得额外能量。\n\n护符可以花费能量去「探查」一个扇形的区域，揭示范围内所有的地格与秘密，并且暂时赋予你对范围内敌人与道具的灵视。
items.artifacts.talismanofforesight.desc_cursed=被诅咒的护符深刻地凝视着你，使你的感知钝化。
items.artifacts.talismanofforesight$foresight.name=先见
items.artifacts.talismanofforesight$foresight.uneasy=你感到很不安。
items.artifacts.talismanofforesight$foresight.desc=你感到非常焦虑，仿佛周遭有未被发现的危险。
items.artifacts.timekeepershourglass.name=时光沙漏
items.artifacts.timekeepershourglass.ac_activate=激活
items.artifacts.timekeepershourglass.deactivate=你取消了时间冻结。
items.artifacts.timekeepershourglass.no_charge=你的沙漏充能还不足以用来激活。
items.artifacts.timekeepershourglass.cursed=你不能使用受诅咒的沙漏。
items.artifacts.timekeepershourglass.onstasis=你周遭的世界似乎就在这一瞬间变化了。
items.artifacts.timekeepershourglass.onfreeze=你周围的一切突然都彻底静止下来。
items.artifacts.timekeepershourglass.stasis=使我彻底静止
items.artifacts.timekeepershourglass.freeze=冻结周围时间
items.artifacts.timekeepershourglass.prompt=你想要如何使用沙漏的魔法？\n\n停滞你自己的时间，周遭的时间会继续正常流动，而你将身处冻结的时间中，动弹不得却也刀枪不入。每这样做一次，沙漏都会消耗两点能量。\n\n冻结外界的时间，你的一举一动都将瞬间完成。这种冻结能够通过再次使用沙漏或进行攻击随时取消。
items.artifacts.timekeepershourglass.desc=这只大型的华贵沙漏看起来却并不怎么起眼，但你仍觉得它精雕细刻的框架内蕴含着某种强大的力量。在翻转沙漏、在看着沙子流下的同时，你能感受到一种魔法正在拉扯着你，使用这种魔法肯定能给你一些控制时间的方法。
items.artifacts.timekeepershourglass.desc_hint=沙漏似乎失去了一些沙子，如果你能再找到一些……
items.artifacts.timekeepershourglass.desc_cursed=被诅咒的沙漏把它自己锁在了你的身边，你可以感觉它试图操纵你的时间流动。
items.artifacts.timekeepershourglass$timefreeze.name=时间冻结
items.artifacts.timekeepershourglass$timefreeze.desc=周身的时间已被冻结，现在你可以在一瞬间完成任何行动。该状态会一直持续下去，除非你主动取消了它，或者你的沙漏用尽了能量。实施攻击或使用魔法同样会取消该效果。
items.artifacts.timekeepershourglass$sandbag.name=一包魔力流沙
items.artifacts.timekeepershourglass$sandbag.levelup=你将沙子填入到你的沙漏中。
items.artifacts.timekeepershourglass$sandbag.maxlevel=你的沙漏填满了魔法沙子！
items.artifacts.timekeepershourglass$sandbag.no_hourglass=你没有沙漏来存放这些沙子。
items.artifacts.timekeepershourglass$sandbag.desc=这一小袋细砂应该能够在你的沙漏上完美使用。\n\n每次当你需要这种东西时，店主都会摆出来一些，看起来很奇怪……
items.artifacts.unstablespellbook.name=无序魔典
items.artifacts.unstablespellbook.ac_read=阅读
items.artifacts.unstablespellbook.ac_add=加入
items.artifacts.unstablespellbook.blinded=你不能在失明的时候阅读书籍。
items.artifacts.unstablespellbook.no_charge=你的咒语书耗尽了能量。
items.artifacts.unstablespellbook.cursed=受诅咒的咒语书锁死了书页，你无法阅读它。
items.artifacts.unstablespellbook.prompt=选择一个卷轴
items.artifacts.unstablespellbook.infuse_scroll=你将卷轴的能量注入了书中。
items.artifacts.unstablespellbook.unable_scroll=你无法将这个卷轴添加到书中。
items.artifacts.unstablespellbook.unknown_scroll=你仍然不清楚这个卷轴的类型。
items.artifacts.unstablespellbook.desc=这本魔典就其年岁而言被保养得异常好。当你翻动页面时它不断地噼啪作响并发出嘶嘶声，涌动着不稳定的能量。一旦诵读这本书，没人能笃定你会释放出什么咒语。
items.artifacts.unstablespellbook.desc_cursed=被诅咒的魔典将自己绑在了你身上，并在抑制你使用大部分卷轴的能力。
items.artifacts.unstablespellbook.desc_index=这本魔典的目录并不完整，目录指向的白页上写着：
items.artifacts.unstablespellbook.desc_empowered=被你放进书中的卷轴闪耀着魔力的微光。你能够利用魔典进一步激发卷轴能力，展现出秘卷效果，但这样也会消耗你额外的充能。
items.artifacts.unstablespellbook.read_empowered=被你放入魔典的卷轴都充满了魔法能量。你可以自主选择导引出该卷轴的正常或秘卷能力。\n\n如果选择释放秘卷能力，则会消耗2点魔典充能。
items.artifacts.soulofyendor.name=Yendor之魂
items.artifacts.soulofyendor.desc=由混沌魔法创造的终极饰品，这颗水晶之心结合了 8 种用于创造它的不同神器的属性和能力。\n\nYendor之魂可以为你提供食物、炼金术能量、制造锁链和天然盔甲、从商店窃取物品、操纵时间流，使你的伤口再生和凭空变出随机卷轴。
items.artifacts.soulofyendor.desc_cursed=不知何故，这个神器被诅咒了：你不能使用它的任何能力，而且你会经常被时间力量减速。
items.artifacts.soulofyendor.desc_worn=当你拿着这个混合体时，你会感觉到传说中Rodney的力量在手中涌动。
items.artifacts.soulofyendor.ac_use=使用能力
items.artifacts.soulofyendor.ac_useagain=再次使用
items.artifacts.soulofyendor.usage_title=选择能力
items.artifacts.soulofyendor.usage_message=你可以使用 Yendor之魂的充能来执行从组件神器继承的不同操作。
items.artifacts.soulofyendor.horn_of_plenty=从号角里食用
items.artifacts.soulofyendor.alchemist_toolkit=酿造药剂
items.artifacts.soulofyendor.ethereal_chains=释放锁链
items.artifacts.soulofyendor.sandals_of_nature=形成天然护甲
items.artifacts.soulofyendor.talisman_of_foresight=探查地图
items.artifacts.soulofyendor.timekeeper_hourglass=操控时间
items.artifacts.soulofyendor.unstable_spellbook=阅读随机卷轴
items.artifacts.soulofyendor.master_armband=从敌人那里偷窃
items.artifacts.bookofwonder.name=奇迹之书
items.artifacts.bookofwonder.desc=这本法术书注入了万能克罗默的魔力。翻动书页时发出滋滋作响的不稳定能量。阅读此书可能触发任意法术效果。#且后果无法预料#
items.artifacts.bookofwonder.desc_cursed=诅咒之书已与你绑定，阻碍你使用多数卷轴
items.artifacts.bookofwonder.desc_index=本书不完整。当前索引指向以下空白页：
items.artifacts.bookofwonder.desc_empowered=你添加的卷轴正散发强化光芒，其魔力似乎比置入前更强大
items.bags.bag.name=背包
items.bags.potionbandolier.name=药剂挎带
items.bags.potionbandolier.desc=这副厚实的挎带能像肩带一样缠在身上，上面有许多用来放药瓶的隔热革带。 \n\n挎带能为存放其中的药瓶抵御寒冷。
items.bags.scrollholder.name=卷轴筒
items.bags.scrollholder.desc=这个管状的容器看起来可以装下一整份天文学家的手书和仪器，不过你的卷轴也刚好能放在里面。里面甚至有一些能用来放置法力结晶，奥术刻笔以及奥术聚酯的小隔间。\n\n这个容器看起来并不是很可燃，所以你的卷轴在里面一定很安全。
items.bags.velvetpouch.name=绒布袋
items.bags.velvetpouch.desc=这个丝绒制作的小袋子能装下很多种子、符石，炼金原料等小件道具。
items.bags.magicalholster.name=魔法筒袋
items.bags.magicalholster.desc=这款细长的皮制筒袋由某种异域动物的毛皮制成。强大的附魔使其拥有能收纳大量远程类武器道具的能力。\n\n只需伸手一探，想要的道具就会出现在你的手上。\n\n筒袋中涌动的魔力流还能小幅强化其中法杖的充能及投掷武器的耐久度。
items.bombs.arcanebomb.name=奥术炸弹
items.bombs.arcanebomb.desc=这枚炸弹里灌注了奥术能量，当它爆炸时会释放出等同粘咕蓄力攻击一般的强大能量。这股爆发能量会对2格范围内的所有目标造成_%1$d-%2$d 魔法伤害_。
items.bombs.bomb.name=炸弹
items.bombs.bomb.ac_lightthrow=点燃并扔出
items.bombs.bomb.snuff_fuse=你迅速掐灭了炸弹引线。
items.bombs.bomb.ondeath=死于爆炸
items.bombs.bomb.rankings_desc=死于爆炸
items.bombs.bomb.desc=一颗颇庞大的黑火药炸弹。爆炸会对周围所有单位造成_%1$d-%2$d 伤害_并会摧毁部分地形和物品。
items.bombs.bomb.desc_fuse=看起来引信在点燃后还能烧几回合。
items.bombs.bomb.desc_burning=引信快烧完了，保持距离或者赶紧掐灭！
items.bombs.bomb$doublebomb.name=一对炸弹
items.bombs.bomb$doublebomb.desc=两枚装的黑火药重装炸弹，看起来多出来的那个是免费送你的！
items.bombs.firebomb.name=燃烧弹
items.bombs.firebomb.desc=这枚改造过的炸弹会在爆炸时释放出一大片持续燃烧的火海，在2格距离内造成_%1$d-%2$d 伤害_并传播持续的火焰。
items.bombs.flashbangbomb.name=闪光弹
items.bombs.flashbangbomb.desc=特制炸弹，爆炸时释放强光、音波与电流。2格距离内目标受爆炸造成_%1$d-%2$d伤害_，附加25%%电击伤害并麻痹10回合
items.bombs.frostbomb.name=寒霜炸弹
items.bombs.frostbomb.desc=这枚改造过的炸弹会在爆炸时对周围2格距离内造成 _%1$d-%2$d 伤害_并释放出持续的冰霜之风。
items.bombs.holybomb.name=神圣炸弹
items.bombs.holybomb.desc=这枚改造过的炸弹会在爆炸的一瞬间闪耀出神圣的光芒，2格范围内所有目标会受到_%1$d-%2$d 伤害_，且亡灵和恶魔类敌人会受到50%额外圣光伤害。
items.bombs.kromerizedbomb.name=克罗默炸弹
items.bombs.kromerizedbomb.desc=这颗炸弹被注入了美味的克罗默的混乱与振奋人心的性质。它爆炸会产生一股强大的元素碎片爆炸，爆炸时碎片会飞得到处都是，超大范围内的目标都将被破坏和迷失方向，对不死生物和恶魔造成更多伤害，并将每个人都包裹在冰冻的火焰中。该爆炸穿透装甲，还会在区域内释放再生之力，爆炸范围比普通炸弹更无穷远。\n\n#虽然该炸弹不会伤害使用者，它仍然非常危险，可能只应在特殊情况下使用...#
items.bombs.noisemaker.name=鞭炮
items.bombs.noisemaker.desc=这枚改造过的炸弹会间断性地发出杂响，直到引信燃尽。在此期间，它会在被触碰到时立即爆炸，对2格内所有目标造成_%1$d-%2$d 伤害_ ！
items.bombs.noisemaker.desc_burning=鞭炮引信已点燃，有东西接近时就会爆炸！
items.bombs.smokebomb.name=烟雾弹
items.bombs.smokebomb.desc=改良炸弹在爆炸时喷出浓密气雾。造成_%1$d-%2$d伤害_并在2格内扩散遮蔽烟雾
items.bombs.regrowthbomb.name=再生炸弹
items.bombs.regrowthbomb.desc=这枚改造的炸弹在触发时不会爆炸，而是向四周3格范围溅射出拥有再生能力的药液。被药液影响到的区域会迅速生长出植被，在范围内的友方单位也会被治疗。
items.bombs.shrapnelbomb.name=破片爆弹
items.bombs.shrapnelbomb.desc=这枚炸弹里封装了DM-300的金属破片，当炸弹爆炸时这些破片会携带着能量向四周迸发，对超大范围内的所有对象造成_%1$d-%2$d 伤害_。使用它时你最好躲在一处掩体后面......
items.bombs.woollybomb.name=绵绵炸弹
items.bombs.woollybomb.desc=这枚改造过的炸弹在爆炸后会召出一群魔法绵羊。爆炸对2格内所有人造成_%1$d-%2$d 伤害_。 这群羊会留在原地一阵，在此期间成为阻碍几乎一切行动的障碍物。
items.food.berry.name=地牢浆果
items.food.berry.eat_msg=酸甜可口，真棒！
items.food.berry.desc=这些小浆果是女猎手在地牢的植被中摘下的，可以迅速地吃下以稍稍填饱肚子，且有可能找到有用的种子！
items.food.blandfruit.name=无味果
items.food.blandfruit.cooked=煮熟的无味果
items.food.blandfruit.sunfruit=阳光果
items.food.blandfruit.rotfruit=腐朽果
items.food.blandfruit.earthfruit=大地果
items.food.blandfruit.blindfruit=目盲果
items.food.blandfruit.firefruit=火焰果
items.food.blandfruit.icefruit=冰霜果
items.food.blandfruit.fadefruit=渐隐果
items.food.blandfruit.sorrowfruit=忧伤果
items.food.blandfruit.stormfruit=暴风果
items.food.blandfruit.dreamfruit=梦乡果
items.food.blandfruit.starfruit=星陨果
items.food.blandfruit.swiftfruit=速行果
items.food.blandfruit.raw=你没法忍受生吃这玩意儿。
items.food.blandfruit.desc=干燥且没肉，或许加点其他材料再煮能够增强它的效果。
items.food.blandfruit.desc_cooked=这个果实已经因为吸收锅中的汤而鼓胀，并且吸收了其中种子的属性。它具有这个种子对应的药剂效果。
items.food.blandfruit.desc_eat=看起来已经可以吃了！
items.food.blandfruit.desc_throw=它似乎性质很不稳定，最好作为武器丢出去。
items.food.blandfruit$chunks.name=无味果块
items.food.blandfruit$chunks.desc=无味果触地爆炸，碎成了一地的普通果块。\n\n尽管上面沾上了尘土，这些大块的熟制无味果应该可以安全食用。
items.food.chargrilledmeat.name=烤肉
items.food.chargrilledmeat.desc=看起来像块好肉排。
items.food.food.name=口粮
items.food.food.ac_eat=食用
items.food.food.eat_msg=吃起来不错！
items.food.food.desc=里面没什么有意思的东西：肉干和一些饼干——这之类的东西。
items.food.frozencarpaccio.name=冷冻生肉片
items.food.frozencarpaccio.invis=你看到自己的手隐形了！
items.food.frozencarpaccio.hard=你感到皮肤变硬了！
items.food.frozencarpaccio.refresh=神清气爽！
items.food.frozencarpaccio.better=你感觉好多了！
items.food.frozencarpaccio.desc=这是份速冻生肉，只能切成薄片取食，而且意外的好吃。
items.food.meatpie.name=全肉大饼
items.food.meatpie.eat_msg=这食物味道真棒！
items.food.meatpie.desc=一份填满了美味肉馅的诱人大饼。吃下它后你会获得远高于其他食物的饱足感。
items.food.mysterymeat.name=神秘的肉
items.food.mysterymeat.eat_msg=这玩意儿吃起来很……奇怪。
items.food.mysterymeat.hot=嗷！好烫！
items.food.mysterymeat.legs=你的腿没有知觉了！
items.food.mysterymeat.not_well=你感觉……不太好
items.food.mysterymeat.stuffed=你撑着了。
items.food.mysterymeat.desc=想吃可以，风险自担！
items.food.mysterymeat$placeholder.name=肉
items.food.phantommeat.name=幻影鱼肉
items.food.phantommeat.desc=一块大而闪亮的透明鱼肉，从幻影食人鱼身上切下。这种神奇的肉不需要烹饪，除了完全满足你的饥饿感外，还提供一些防御效果。食用后会赋予隐形、树皮、一些治疗以及治愈许多有害效果。
items.food.pasty.name=馅饼
items.food.pasty.fish_name=清蒸荷叶鱼
items.food.pasty.amulet_name=Yendor护符？
items.food.pasty.egg_name=复活节彩蛋
items.food.pasty.rainbow_name=彩虹药水
items.food.pasty.shattered_name=绿色蛋糕
items.food.pasty.pie_name=南瓜派
items.food.pasty.vanilla_name=蓝色蛋糕
items.food.pasty.cane_name=拐棍糖
items.food.pasty.sparkling_name=气泡药水
items.food.pasty.desc=一份正宗的康郡肉烘饼，里面填充着传统的牛肉和土豆。美味！
items.food.pasty.fish_desc=一整条蒸鱼，被魔法保存在一床青菜上。在这个时候留一些鱼以备后用是传统，所以你会留下一些剩菜而不是一次性吃光。\n\n新年快乐！
items.food.pasty.amulet_desc=你终于找到了它，魔法护身符 - 等一下，这只是一个包着巧克力的箔纸，看起来像护身符！它不会给予你无限的力量，但至少会填饱你并给你一点神器能量。\n\n愚人节快乐！
items.food.pasty.egg_desc=一个巨大的巧克力蛋，包裹在色彩斑斓的黄色箔纸中。这里有足够的巧克力填饱你的肚子，而糖可能会给你的神器一点额外能量。\n\n复活节快乐！
items.food.pasty.rainbow_desc=液态食物，满足饥饿感的同时蕴含魔力，能安抚相邻非首领敌人使其暂时不愿与你战斗\n\n彩虹庆典快乐！
items.food.pasty.shattered_desc=撒满彩糖粒的香草蛋糕切片，绿色糖霜。食用可获得少量经验值\n\n《破碎像素地牢》首发于2014年8月5日，生日快乐！
items.food.pasty.pie_desc=好大的一块南瓜派！甘甜又微辣，它会填饱你的肚子并让你恢复少量生命。\n\n万圣节快乐！
items.food.pasty.vanilla_desc=撒满彩糖粒的香草蛋糕切片，蓝色糖霜。食用可获得少量经验值\n\n原版《像素地牢》首发于2012年12月4日，生日快乐！
items.food.pasty.cane_desc=甜度爆表的巨型拐杖糖！大到够你一次吃饱，其中的糖分或许还能让你的法杖获得一点点额外充能。\n\n节日快乐!
items.food.pasty.sparkling_desc=气泡药水满足饥饿感并模拟起泡酒效果（非酒精）。腹中暖意将提供少量护盾\n\n新年快乐！
items.food.pasty$fishleftover.name=鱼肉剩菜
items.food.pasty$fishleftover.eat_msg=那食物尝起来还可以。
items.food.pasty$fishleftover.desc=前一顿饭剩下的一些多余鱼肉。你可以随时吃一点来恢复一点饥饿感。
items.food.smallration.name=小包口粮
items.food.smallration.eat_msg=吃起来还行。
items.food.smallration.desc=它看起来和普通口粮一样，就是小了点。
items.food.stewedmeat.name=炖肉
items.food.stewedmeat.eat_msg=吃起来还行。
items.food.stewedmeat.desc=烹煮的过程中杀死了肉上面可能携带的任何病菌或是寄生虫。现在应该可以安全的食用它了。
items.food.supplyration.name=补给口粮
items.food.supplyration.desc=盗贼公会留置于地牢的特制便携口粮\n\n虽饱食度低于常规口粮，但能快速食用，提供少量直接治疗，并为盗贼的暗影斗篷恢复1次充能
items.journal.documentpage.name=被撕下的书页
items.journal.documentpage.desc=一张被遗弃的书页，似乎是从一本书上撕下来的。你需要捡起它才能阅读上面的内容。
items.journal.alchemypage.name=被撕下的炼金指南书页
items.journal.alchemypage.desc=从一本炼金指南书上撕下来的一页。\n\n在远处你只能看到一行行密密麻麻的小字，不过你仍然可以看清书页上的标题\n\n_"%s"_
items.journal.guidebook.name=地牢探索指南
items.journal.guidebook.hint_mobile=指南书有新提示！点击闪烁的日志按钮查看
items.journal.guidebook.hint_desktop=指南书有新提示！选择闪烁的日志按钮(%s)查看
items.journal.guidebook.hint_status=指南书
items.journal.guidebook.desc=一本静静躺在地上的地牢探索指南，不知被谁遗弃在此。看来冒险不是很适合它的旧主人！\n\n这本精致而独特的书附有魔法，会在需要的时候主动提醒冒险家去翻阅它。\n\n除去强大的功能，这本书走红的原因还有一点：它的封面上用友好而亲切的大字写着“不 要 慌 张 ！”
items.journal.guidepage.name=被撕下的指南书页
items.journal.guidepage.desc=从一本冒险指南书上撕下来的一页。\n\n在远处你只能看见一行行密密麻麻的小字，不过你可以看清书页上的标题：\n\n_"%s"_
items.journal.regionlorepage$sewers.name=破旧信件
items.journal.regionlorepage$sewers.desc=看起来像一封信，写在一个沾满泥土的纸片上。你需要捡起它才能看清上面写的内容。
items.journal.regionlorepage$prison.name=破旧日记条目
items.journal.regionlorepage$prison.desc=一篇日记条目，或其他一些记录，写在一张古老的纸上。它似乎比你在下水道发现的信件保存得更好，但你仍需要捡起它才能阅读。
items.journal.regionlorepage$caves.name=古老日志条目
items.journal.regionlorepage$caves.desc=看起来像一个探险家日志的条目，尽管它看起来应该很古老，保存得出奇地好。捡起来阅读。
items.journal.regionlorepage$city.name=生锈的碑文
items.journal.regionlorepage$city.desc=一块小小的生锈金属碑文，上面刻着一条神奇的信息。尽管这块碑文很古老，字迹仍然清晰，但你需要捡起它来阅读。
items.journal.regionlorepage$halls.name=发光碑文
items.journal.regionlorepage$halls.desc=一块带有发光绿色字母的小黑色碑文。远处看发光字母会模糊成一片雾气，你需要捡起来阅读。
items.journal.terminuspage.name=研究日志条目
items.journal.terminuspage.desc=某高级研究员日志中的条目，虽具异界特性却保存异常完好。拾取可阅读
items.journal.terminuspage.complete=研究笔记让你洞悉世界本质！终极武器已解锁！
items.journal.specialseedspage.name=黄金指南页
items.journal.specialseedspage.desc=来自高阶元探索书籍的残页\n\n远处文字过小难辨，但可识别标题：\n\n_"%s"_
items.keys.goldenkey.name=金钥匙
items.keys.goldenkey.desc=这把金色钥匙的齿纹精妙而复杂。或许可以用它来打开某个上锁的宝箱？
items.keys.crystalkey.name=水晶钥匙
items.keys.crystalkey.desc=这把水晶钥匙在黑暗中反射着光芒。或许可以用它来打开某个水晶宝箱？
items.keys.ironkey.name=铁钥匙
items.keys.ironkey.desc=这个铁钥匙的匙齿已经严重磨损；皮制系带也久经年岁摧残。它对应的是哪扇门呢?
items.keys.skeletonkey.name=骷髅钥匙
items.keys.skeletonkey.desc=这个钥匙看起来不能等闲视之：其顶端被制成头骨的形状。或许它能打开什么不得了的大门。
items.potions.potion.ac_drink=饮用
items.potions.potion.turquoise=青绿药剂
items.potions.potion.crimson=猩红药剂
items.potions.potion.azure=湛蓝药剂
items.potions.potion.jade=碧绿药剂
items.potions.potion.golden=金黄药剂
items.potions.potion.magenta=品红药剂
items.potions.potion.charcoal=煤黑药剂
items.potions.potion.ivory=乳白药剂
items.potions.potion.amber=琥珀药剂
items.potions.potion.bistre=深褐药剂
items.potions.potion.indigo=靛紫药剂
items.potions.potion.silver=银灰药剂
items.potions.potion.unknown_desc=瓶子里装着些不断打旋的彩色液体。谁知道饮用或投掷它时会有什么效果呢？
items.potions.potion.harmful=有害药剂！
items.potions.potion.beneficial=有益药剂
items.potions.potion.yes=是的，我知道我在做什么
items.potions.potion.no=不，我改变主意了
items.potions.potion.sure_drink=你确定要饮用它吗? 大多数情况下你该把它扔向敌人的。
items.potions.potion.sure_throw=你确定要投掷它吗? 大多数情况下把它喝下去会更有用。
items.potions.potion.shatter=药瓶碎裂开，溅出了无害的液体。
items.potions.potion$placeholder.name=药剂
items.potions.potion$seedtopotion.name=随机药剂
items.potions.potionofexperience.name=经验药剂
items.potions.potionofexperience.desc=众多战斗积累而来的经验被浓缩为液态，这种药剂能够瞬间提升你的等级。
items.potions.potionofexperience.ondeath=你因技艺生疏而力竭...
items.potions.potionofexperience.rankings_desc=等级归零而湮灭
items.potions.potionoffrost.name=冰霜药剂
items.potions.potionoffrost.desc=一旦暴露在空气里，这种化学药剂会挥发成为一片冰冷的气雾。
items.potions.potionofhaste.name=极速药剂
items.potions.potionofhaste.energetic=你感觉充满了活力！
items.potions.potionofhaste.desc=喝下这甜到掉牙的奇怪液体后，体内会爆发一股巨大的能量，让你可以短时间内飞速奔跑。
items.potions.potionofhealing.name=治疗药剂
items.potions.potionofhealing.heal=你的伤口开始愈合。
items.potions.potionofhealing.desc=一支让你快速回满生命值并清除毒素的万能药剂。
items.potions.potionofinvisibility.name=隐形药剂
items.potions.potionofinvisibility.invisible=你看到你的手隐形了！
items.potions.potionofinvisibility.desc=饮用这种药剂会使你暂时隐形。隐身期间，敌人将无法看见你。攻击敌人，或在敌人面前使用法杖和卷轴，会让药剂效果立即消失。
items.potions.potionoflevitation.name=浮空药剂
items.potions.potionoflevitation.float=你漂浮到了空中！
items.potions.potionoflevitation.desc=饮用这种古怪的药剂能让你漂浮到空中，从而轻易地越过陷阱和裂隙。扔出它会产生一片未知气体，让其中的所有生物迷失方向。
items.potions.potionofliquidflame.name=液火药剂
items.potions.potionofliquidflame.desc=该药瓶里装着一种不稳定的化合物，一旦暴露在空气中就会猛烈地燃烧起来。
items.potions.potionofmindvision.name=灵视药剂
items.potions.potionofmindvision.see_mobs=你可以感受到其他生物的存在！
items.potions.potionofmindvision.see_none=你能判定现在本层内就只有你一个人。
items.potions.potionofmindvision.desc=喝下这个，你的心智将与大范围内的生物精神同调，让你能感受到围墙背后的生体所在。该药剂还能够让你的视野无视身边门墙的阻挡。
items.potions.potionofparalyticgas.name=麻痹药剂
items.potions.potionofparalyticgas.desc=暴露于空气时，烧瓶里的液体会气化成一片令人失去知觉的黄色云雾。任何吸入气雾的生物都可能立即麻痹，直到云雾消散后一段时间才能行动。可以把该物件扔到远处的敌群中，让气体覆盖影响它们。
items.potions.potionofpurity.name=净化药剂
items.potions.potionofpurity.freshness=你闻到了空气中不寻常的清新气息。
items.potions.potionofpurity.protected=你被一层薄薄的魔法屏障包裹住保护着！
items.potions.potionofpurity.desc=这种魔法试剂能迅速中和掉大范围内的各种有害环境。饮用它将使你暂时免疫这种环境。
items.potions.potionofstrength.name=力量药剂
items.potions.potionofstrength.msg=新发现的力量涌入你的身体，你现在有 %d 的力量！
items.potions.potionofstrength.desc=这种强力的液体会洗刷你的肌肉，永久性增加1点力量值。
items.potions.potionoftoxicgas.name=毒气药剂
items.potions.potionoftoxicgas.desc=打开或摔碎这个密封的药瓶将导致内容物爆发成一团剧毒的绿色烟雾。你应该选择从远处将这瓶药剂扔向敌人，而不是手动开封。
items.potions.brews.aquabrew.name=水酿
items.potions.brews.aquabrew.desc=碎裂时释放高压水柱\n\n仅对火系敌人造成伤害，但能润湿周边地形、熄灭火焰并击退附近角色
items.potions.brews.blizzardbrew.name=冰暴魔药
items.potions.brews.blizzardbrew.desc=当瓶子破裂时，这瓶魔药会使周围卷起一阵不断扩散的暴风雪。
items.potions.brews.causticbrew.name=淤泥魔药
items.potions.brews.causticbrew.desc=这瓶魔药在打碎时会大范围地溅出腐蚀淤泥。被腐蚀淤泥影响的单位将会缓慢融化，除非他们能及时在水中冲洗掉淤泥。
items.potions.brews.infernalbrew.name=炼狱魔药
items.potions.brews.infernalbrew.desc=当瓶子破裂时，这瓶魔药会释放出一阵四处肆虐的狂暴烈焰。
items.potions.brews.shockingbrew.name=雷鸣魔药
items.potions.brews.shockingbrew.desc=当瓶子破裂时，这瓶魔药会在附近释放出一阵闪电风暴。
items.potions.brews.unstablebrew.name=不稳定酿剂
items.potions.brews.unstablebrew.desc=虹彩流动的魔法酿剂\n\n饮用或投掷时随机触发药水效果：饮用必有益，投掷必有害
items.potions.elixirs.elixirofarcanearmor.name=抗魔秘药
items.potions.elixirs.elixirofarcanearmor.desc=这瓶秘药会赋予饮用者持续时间很长的魔法抗性。
items.potions.elixirs.elixirofaquaticrejuvenation.name=水灵秘药
items.potions.elixirs.elixirofaquaticrejuvenation.desc=这瓶秘药中包含着被粘咕力量强化的治疗液体。它不会为你提供立即的治疗效果，而会当你站在水中时逐渐为你恢复总量更大的生命值。
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=水灵恢复
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=你暂时获得了如同粘咕一样的恢复能力。\n\n当站在水面上时，你每回合都能够回复少量生命值。生命值全满或离开水面时会暂停该效果。\n\n剩余的恢复量：%d。
items.potions.elixirs.elixirofdragonsblood.name=龙血秘药
items.potions.elixirs.elixirofdragonsblood.desc=饮用后，这瓶秘药会使饮用者的血管里充斥着烈焰的力量。这个效果能让引用者对火焰完全免疫，并且还能通过物理攻击点燃敌人。
items.potions.elixirs.elixiroffeatherfall.name=羽落灵药
items.potions.elixirs.elixiroffeatherfall.light=身轻如羽！
items.potions.elixirs.elixiroffeatherfall.desc=提供可控弱效浮空，允许饮用者短时间内无伤坠落
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=羽落
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=羽落灵药生效中，坠入深渊无伤！\n\n剩余回合：%s
items.potions.elixirs.elixirofhoneyedhealing.name=圣愈蜜药
items.potions.elixirs.elixirofhoneyedhealing.desc=这瓶秘药不仅有着治愈效果，还混杂了蜂蜜的甜香。饮用后，会回复一小部分饥饿，它也能被丢出去用来治疗盟友。\n\n如果将这瓶秘药丢向和蜂蜜有联系的生物也能使它们平静下来。
items.potions.elixirs.elixiroficytouch.name=晶触秘药
items.potions.elixirs.elixiroficytouch.desc=饮用后，这瓶秘药会使饮用者获得从敌人身上抽取热量的能力。这样的效果让使用者能够在药效持续期间免疫冻伤，同时他的物理攻击也能对敌人造成冻伤效果。
items.potions.elixirs.elixirofmight.name=根骨秘药
items.potions.elixirs.elixirofmight.msg=新发现的力量涌入你的身体，你现在有 %d 的力量！
items.potions.elixirs.elixirofmight.desc=这种强力的液体会冲刷你的根骨，永久性增加1点力量值并在一段时间内增加%d点生命上限。增强的生命上限值取决于你当前的最大生命值，不过增强值会随着等级提升而逐渐消失。
items.potions.elixirs.elixirofmight$htboost.name=生命力强化
items.potions.elixirs.elixirofmight$htboost.desc=你觉得自己不同寻常的强壮与健康。\n\n你的最大生命在一段时间内会有所提升。生命提升会随着你的升级缓慢而稳定地消失。\n\n当前生命提升量: %d。\n剩余生效等级: %d。
items.potions.elixirs.elixiroftoxicessence.name=毒粹秘药
items.potions.elixirs.elixiroftoxicessence.desc=该秘药能够向使用者注入强大的毒素之力，使用者在持续时间内将免疫毒气和毒素，并会在周身不断释放出致命的毒雾。
items.potions.elixirs.donotdieelixir.name=不死秘药
items.potions.elixirs.donotdieelixir.desc=饮用后，这种异界物质会使你的生命值变成负值，而不是使你死亡。可能应该在这东西用完之前喝一些治疗药剂...
items.potions.elixirs.kromerpotion.name=神力药剂
items.potions.elixirs.kromerpotion.desc=这种药剂极大地增加了你的力量，让你可以骗取怪物宝贵的生命值。_尽管他就是这么说的。_
items.potions.elixirs.kromerpotion.msg_1=+7力量，吸血
items.potions.elixirs.kromerpotion.msg_2=[大人物]的力量在你的灵魂中闪耀！
items.potions.exotic.exoticpotion.turquoise=青绿合剂
items.potions.exotic.exoticpotion.crimson=猩红合剂
items.potions.exotic.exoticpotion.azure=湛蓝合剂
items.potions.exotic.exoticpotion.jade=碧绿合剂
items.potions.exotic.exoticpotion.golden=金黄合剂
items.potions.exotic.exoticpotion.magenta=品红合剂
items.potions.exotic.exoticpotion.charcoal=煤黑合剂
items.potions.exotic.exoticpotion.ivory=乳白合剂
items.potions.exotic.exoticpotion.amber=琥珀合剂
items.potions.exotic.exoticpotion.bistre=深褐合剂
items.potions.exotic.exoticpotion.indigo=靛紫合剂
items.potions.exotic.exoticpotion.silver=银灰合剂
items.potions.exotic.exoticpotion.unknown_desc=这口圆底瓶里装着些有沉淀物的彩色液体。它似乎并不属于这个世界，谁知道饮用或投掷它时会有什么效果呢？
items.potions.exotic.exoticpotion.warning=你真的想终止这瓶药剂的使用？它仍会被消耗掉。
items.potions.exotic.exoticpotion.yes=是的，我确定
items.potions.exotic.exoticpotion.no=不，我改变主意了
items.potions.exotic.potionofcleansing.name=全面净化合剂
items.potions.exotic.potionofcleansing.desc=当这种合剂被饮用时，它可以完全驱散饮用者的所有负面状态，包括但不限于饥饿，中毒，燃烧等。它同样可以扔向某个单位来驱散该单位的异常状态。
items.potions.exotic.potionofcleansing$cleanse.name=净化
items.potions.exotic.potionofcleansing$cleanse.desc=全面净化合剂给予了该单位对所有负面效果的暂时抗性！\n\n剩余时长：%s回合。
items.potions.exotic.potionofcorrosivegas.name=腐蚀酸雾合剂
items.potions.exotic.potionofcorrosivegas.desc=打开或摔碎这个密封的药瓶将导致内容物爆发成一团高腐蚀性的锈色酸雾。不过爆发出的酸雾浓度较低，不能保留太久。
items.potions.exotic.potionofdragonsbreath.name=火龙吐息合剂
items.potions.exotic.potionofdragonsbreath.prompt=选择要灼烧的位置
items.potions.exotic.potionofdragonsbreath.desc=瓶子内奇特的化合物会在接触口腔后爆燃。迅速吐出液体就能让使用者从口中喷射火焰！
items.potions.exotic.potionofearthenarmor.name=大地护甲合剂
items.potions.exotic.potionofearthenarmor.desc=与麻痹药剂不同的是，饮用这瓶合剂能够使使用者的皮肤硬化，在一段时间内形成一道天然护甲。
items.potions.exotic.potionofdivineinspiration.name=神意启发合剂
items.potions.exotic.potionofdivineinspiration.no_more_points=你无法再获得更多天赋点奖励了。
items.potions.exotic.potionofdivineinspiration.select_tier=选择一个天赋以获得两个额外点数。该天赋必须已被解锁。
items.potions.exotic.potionofdivineinspiration.bonus=天赋点 +2 ！
items.potions.exotic.potionofdivineinspiration.desc=这股神圣的力量会化作液态，灌注进饮用者的身体，赋予其钟意的天赋两个额外天赋点。\n\n这种药剂对每一层天赋只能生效一次。
items.potions.exotic.potionofmagicalsight.name=魔能透视合剂
items.potions.exotic.potionofmagicalsight.desc=饮用这瓶合剂后，你的五感被提高到了一种无法想象的地步，使你看穿墙壁后面的事物！
items.potions.exotic.potionofmastery.name=肌肉记忆合剂
items.potions.exotic.potionofmastery.prompt=精通一件物品
items.potions.exotic.potionofmastery.weapon_easier=你摆弄这件武器时感到空前的顺手！
items.potions.exotic.potionofmastery.armor_easier=你穿着这件护甲时感到前所未有的合身！
items.potions.exotic.potionofmastery.desc=这个药剂不会直接增强你的力量，但却会为你建立使用特定物品的肌肉记忆。使你对其的运用更加得心应手，仿佛已经练习了千百遍。\n\n所选武器或护甲所需要的力量减少 2。此药剂在每个物品上只能使用一次。
items.potions.exotic.potionofshielding.name=奥术护盾合剂
items.potions.exotic.potionofshielding.desc=与治疗药剂不同的是，饮用这瓶合剂能够使周身被护盾环绕，抵挡所受到的伤害。
items.potions.exotic.potionofshroudingfog.name=暗夜迷雾合剂
items.potions.exotic.potionofshroudingfog.desc=瓶中的合剂遇到空气就会释放出能完全阻挡视线的浓浓烟雾。
items.potions.exotic.potionofsnapfreeze.name=极速冰冻合剂
items.potions.exotic.potionofsnapfreeze.desc=一旦暴露在空气里，这种化学混合物会瞬间冻结并缠绕范围内一切对象。
items.potions.exotic.potionofstamina.name=精力回复合剂
items.potions.exotic.potionofstamina.desc=喝下这甜到掉牙的奇怪液体后，体内会爆发一股巨大的能量，让你可以在长时间内飞速奔跑。
items.potions.exotic.potionofstormclouds.name=暴风骤雨合剂
items.potions.exotic.potionofstormclouds.desc=这瓶合剂被丢出后会形成一团浓厚的水汽，其凝结后会化为雨水降下。大部分地形都会化为水滩，且陷阱会因浸透而损毁。
items.quest.ceremonialcandle.name=仪祭蜡烛
items.quest.ceremonialcandle.desc=配套的蜡烛，在使用中融化在了一起。\n\n单独看来它们毫无价值，但与其它蜡烛按特定排布共用时却能为召唤仪式聚集能量。
items.quest.corpsedust.name=尸尘
items.quest.corpsedust.chill=一股寒意穿透了你的脊背。
items.quest.corpsedust.desc=在外观上这团尸尘和普通灰尘差不多。而你却能够感受到其中潜伏着一股充满恶意的魔力。\n\n尽快脱手为好。
items.quest.darkgold.name=暗金矿
items.quest.darkgold.you_now_have=你现在有 %d 暗金。
items.quest.darkgold.desc=这种金属名中的暗并非源于其色泽(它看起来和普通金子一样)，而是因为它会在阳光下熔化，令其在地表上毫无用处。
items.quest.dwarftoken.name=矮人徽记
items.quest.dwarftoken.desc=很多矮人和他们的造物都携带着这种小块金属，理由不详。兴许它是装饰品或什么身份识别牌。 矮人都挺奇怪的。
items.quest.embers.name=元素余烬
items.quest.embers.desc=只能从新生火元素身上采集到的特殊余烬.。它们散发着温暖的能量。
items.quest.gooblob.name=黏咕球
items.quest.gooblob.desc=一团晃动着的黏糊糊球体，是从在粘咕裂开之后滚落出来的。看起来像是一个大果冻球，不过大概不能食用。\n\n该物品自身并没有什么实际用途，不过它在与特定药水或炸弹共炼时可能有用。至少它还能转换成一些炼金能量。
items.quest.metalshard.name=邪能碎片
items.quest.metalshard.desc=一块被诅咒的金属锈片，它是DM-300的机甲外壳被击碎时分离出来的。你能感受到某种尚未激活的恶毒魔力潜藏其中。\n\n该物品自身并没有什么实际用途，不过它在与特定卷轴或炸弹共炼时可能有用。至少它还能转换成一些炼金能量。
items.quest.pickaxe.name=镐子
items.quest.pickaxe.ability_name=穿刺
items.quest.pickaxe.ability_desc=决斗家可以用镐头_穿刺_敌人。这是一个必中的攻击，使目标虚弱 3 回合，并对皮肤坚硬的敌人造成双倍伤害。
items.quest.pickaxe.upgrade_ability_stat_name=技能伤害
items.quest.pickaxe.desc=这是一件巨大且耐用的凿岩工具。也许能当武器用。
items.quest.ratskull.name=巨鼠头骨
items.quest.ratskull.desc=一颗大得吓人的老鼠头骨。如果你能找到一面合适的墙来挂，它会是件不错的狩猎纪念品。
items.quest.kromer.name=克罗默
items.quest.kromer.ac_use=做一笔[最佳交易]
items.quest.kromer.ac_focus=施放[负面]能量
items.quest.kromer.desc=一种异界物质，声称是来自另一个维度的货币。拿着它，你觉得你不应该拥有这个，但现实就是如此。\n\n它看起来像一顶帽子，这也许可以解释为什么...克罗默就是这样称呼的，但你们不能穿，因为它是无形的。\n\n投掷克罗默会产生某种未知的力量来帮助你，这似乎与老鼠有关？ 把它扔到脚下也有效。\n\n_它似乎也可以用来从拥有这个的家伙那里购买更多的知识？_这应该是货币吗？\n\n最后，这个克罗默似乎被诅咒了。或许可以请主人施展魔法？
items.quest.kromer.wnd_title=[新天赋]
items.quest.kromer.wnd_message=你的老朋友斯潘顿给你一个[新经验]和知识的[交易]。选择你想在哪个[专业水平]上花费克罗默。
items.quest.kromer.too_many=你有太多[技能份数]，[小海绵]。
items.quest.kromer.new_talent=交易就是交易。释放[上面的教程]为您提供酷炫的[速成课程]。
items.quest.kromer.no_way_back=[客户的愿望就是法律]对我来说，享受烟花！
items.quest.kromer.on_death=你没有[解决]债务...
items.quest.kromer.rankings_desc=生命值破产了
items.quest.nerfgun.name=NERF枪
items.quest.nerfgun.stats=NERF枪无法直接升级，但会随着你获得经验值而升级。以目前的等级，这把枪的子弹会造成 _%1$d-%2$d 伤害_ ，并且能在不重新装弹的情况下射击 _%3$d 次_ 。\n你可以把种子灌注进这把枪中，在下次重新装弹前种子的特性将对每发子弹生效。
items.quest.nerfgun.desc=这个奇怪的塑料制品能以高速射出飞镖或飞盘子弹。\n #这玩意很牛逼，前提是你得知道怎么用……#
items.quest.nerfgun.exp=你还需要 _%s 经验值_ 来升级这把枪到 _%s级_ 。
items.quest.nerfgun$nerfmode.normal.name=常规飞镖
items.quest.nerfgun$nerfmode.normal.desc=_常规飞镖_没有什么特殊的效果。
items.quest.nerfgun$nerfmode.rapid.name=小型飞镖
items.quest.nerfgun$nerfmode.rapid.desc=_小型飞镖_体积更小，飞得更快，射的也更快。
items.quest.nerfgun$nerfmode.disc.name=飞盘
items.quest.nerfgun$nerfmode.disc.desc=_飞盘_更沉，射速更慢，但造成以目标敌人为中心的3x3范围伤害。
items.quest.nerfgun.ac_shoot=射击
items.quest.nerfgun.ac_restock=更换子弹类型
items.quest.nerfgun.ac_imbue=灌注
items.quest.nerfgun.inv_title=选择一颗种子来灌注
items.quest.nerfgun.restock=你的枪现在以%s作为子弹。
items.quest.nerfgun.fizzles=你的枪没子弹了，重新装弹中……
items.quest.nerfgun.upgrade=你的枪升级了！
items.quest.flextape.name=防水胶带
items.quest.flextape.ac_use=贴封
items.quest.flextape.desc=美国胶带之王,强大的防水胶带Flex Tape！这个奇怪的橡胶胶带能够修补、贴封绝大部分东西。\n\n把胶带丢向敌人，会把它从这个世界中_抹除_；把胶带丢向友方单位，比如幽灵，镜像，甚至是自己，就能_瞬间治疗_它们。\n\n把胶带对准到处乱窜的敌人丢过去能把他们贴封在原地77个回合。\n\n#凡事都要付出一定代价，哪怕是用于水下的防水胶带也一样。#
items.quest.redcrystal.name=赤红晶簇
items.quest.redcrystal.desc=蕴含深渊物质的碎片，带有奇异而熟悉的强化能量。单簇能量不足提升力量，或许三簇可酿成可用之物？
items.remains.remainsitem.ac_use=使用
items.remains.crownshard.name=皇冠碎片
items.remains.crownshard.desc=看起来像某个皇冠的一部分。这是怎么发生的，或者这是否真实都不清楚。你仍然能感觉到一些巨大力量的碎片，但使用它可能会摧毁它。
items.remains.bowfragment.name=弓箭碎片
items.remains.bowfragment.desc=这块破碎的木头碎片曾经是一把失落的猎手之弓的一部分。你仍然能感受到碎片中留存的一点自然能量，你可以用碎片在你周围长出一些高草。不过这样做会摧毁碎片。
items.remains.brokenhilt.name=破把
items.remains.brokenhilt.desc=这个破把看起来像是从一个被击败的决斗家武器上取下的。你仍然能感受到把柄中留存的一点武力，你可以用它在接下来的两次近战攻击上获得一点额外伤害。不过这样做会摧毁把柄。
items.remains.brokenstaff.name=破法杖
items.remains.brokenstaff.desc=这个法师法杖在主人殒命后折断了一半。你仍然能感受到法杖中残留的一些魔法能量，你可以用它来为你的法杖提供一点充能。不过这样做会摧毁法杖。
items.remains.cloakscrap.name=织物碎片
items.remains.cloakscrap.desc=这块半透明织物碎片看起来像是来自一位已故潜行者的暗影披风。你仍然能感受到其中残留的一点神秘能量，你可以用它来为你的神器提供一点充能。不过这样做会摧毁织物碎片。
items.remains.sealshard.name=印章碎片
items.remains.sealshard.desc=这些小小的红色蜡块看起来像是来自一个倒下的战士的印章。你仍然能感受到一点意志力留在印章上，你可以用它来为自己提供一点护盾。不过这样做会摧毁印章碎片。
items.remains.tornpage.name=残页
items.remains.tornpage.desc=似从逝者圣典撕下的书页，残留神圣能量。使用可恢复少量生命值（使用后销毁）
items.rings.ring.diamond=钻石戒指
items.rings.ring.opal=欧珀戒指
items.rings.ring.garnet=石榴石戒指
items.rings.ring.ruby=红宝石戒指
items.rings.ring.amethyst=紫水晶戒指
items.rings.ring.topaz=黄玉戒指
items.rings.ring.onyx=黑曜石戒指
items.rings.ring.tourmaline=碧玺戒指
items.rings.ring.emerald=绿宝石戒指
items.rings.ring.sapphire=蓝宝石戒指
items.rings.ring.quartz=石英戒指
items.rings.ring.agate=玛瑙戒指
items.rings.ring.equip_cursed=这枚戒指突然紧缩，箍住了你的手指！
items.rings.ring.unknown_desc=这枚金属环镶嵌着一颗在黑暗中闪烁光芒的大块宝石。谁知道戴上后会有什么效果？
items.rings.ring.known=这是个 _%s_ 。
items.rings.ring.identify=你对你的戒指已经足够熟悉并且可以因此将其完全鉴定。它是 _%s_ 。
items.rings.ring.cursed_worn=由于这个戒指被诅咒，你无力将其除下。
items.rings.ring.curse_known=你能感觉到这件戒指里潜伏着一股充满恶意的魔力。
items.rings.ring.not_cursed=这枚戒指没有被诅咒。
items.rings.ringofaccuracy.name=精准之戒
items.rings.ringofaccuracy.stats=佩戴这枚戒指时，你的命中属性会增加_%s%%_。
items.rings.ringofaccuracy.typical_stats=佩戴这枚戒指时，你的命中属性通常会增加_%s%%_。
items.rings.ringofaccuracy.combined_stats=你所装备的戒指正在结合它们的力量，总共提高你 _%s%%_ 的命中率。
items.rings.ringofaccuracy.upgrade_stat_name_1=命中提升
items.rings.ringofaccuracy.desc=这枚戒指提高了你的专注力，使敌人难以躲闪你的攻击。负等级的戒指则会让你的攻击更易于被闪避。
items.rings.ringofarcana.name=奥术之戒
items.rings.ringofarcana.stats=佩戴时，这枚戒指将提高附魔和符文的效力 _%s%%_。
items.rings.ringofarcana.typical_stats=佩戴时，这枚戒指通常会提高附魔和符文的效力 _%s%%_。
items.rings.ringofarcana.combined_stats=你所装备的戒指正在结合它们的力量，总共提高附魔和符文的效力 _%s%%_。
items.rings.ringofarcana.upgrade_stat_name_1=奥秘提升
items.rings.ringofarcana.desc=这枚戒指增强了武器上的魔法附魔和护甲上的符文，包括诅咒！它首先增加激活几率，然后在激活几率为100%时增加效果强度。被诅咒的戒指将削弱附魔、符文和诅咒的效果。
items.rings.ringofelements.name=元素之戒
items.rings.ringofelements.stats=当佩戴这枚戒指时，你会获得_%s%%_的元素抗性。
items.rings.ringofelements.typical_stats=佩戴这枚戒指时，你通常会获得_%s%%_的元素抗性。
items.rings.ringofelements.combined_stats=你所装备的戒指正在结合它们的力量，总共提供 _%s%%_ 的元素抗性。
items.rings.ringofelements.upgrade_stat_name_1=抗性
items.rings.ringofelements.desc=这枚戒指能为佩戴者提供抗性，降低大部分元素和魔法效果的伤害和持续时间。被诅咒的戒指自然会加重这些效果。
items.rings.ringofenergy.name=能量之戒
items.rings.ringofenergy.stats=佩戴这枚戒指时，你的法杖、神器以及英雄护甲充能速度会提升_%1$s%%_。
items.rings.ringofenergy.typical_stats=佩戴这枚戒指时，通常情况下，你的法杖、神器以及英雄护甲充能速度会提升_%1$s%%_。
items.rings.ringofenergy.combined_stats=你所装备的戒指正在结合它们的力量，总共提高充能速度 _%s%%_。
items.rings.ringofenergy.upgrade_stat_name_1=充能提升
items.rings.ringofenergy.desc=在戒指的奥术领域笼罩下，你的所有法杖和神器的充能速度都会得到提升。被诅咒的戒指反而会减慢充能速度。
items.rings.ringofevasion.name=闪避之戒
items.rings.ringofevasion.stats=佩戴这枚戒指时，你的闪避属性会提升_%s%%_。
items.rings.ringofevasion.typical_stats=佩戴这枚戒指时，你的闪避属性通常会提升_%s%%_。
items.rings.ringofevasion.combined_stats=你所装备的戒指正在结合它们的力量，总共提高你 _%s%%_ 的闪避率。
items.rings.ringofevasion.upgrade_stat_name_1=闪避提升
items.rings.ringofevasion.desc=这枚戒指会加快配戴者的反应速度，令其更难被敌人击中。被诅咒的戒指反而会让配戴者更容易被击中。
items.rings.ringofforce.name=武力之戒
items.rings.ringofforce.stats=赤手空拳时，以你目前的力量，佩戴这枚戒指能够造成 _%1$d~%2$d伤害_。当装备一件武器时，这枚戒指会为其增加_%3$d_点伤害。
items.rings.ringofforce.typical_stats=赤手空拳时，以你目前的力量，佩戴这枚戒指通常能够造成 _%1$d~%2$d伤害_。当装备一件武器时，这枚戒指通常会为其增加_%3$d_点伤害。
items.rings.ringofforce.combined_stats=你所装备的戒指正在结合它们的力量，总共造成 _%1$d-%2$d 的伤害_（无需武器），或者增加 _%3$d_ 的伤害（使用武器）。
items.rings.ringofforce.upgrade_stat_name_1=徒手伤害
items.rings.ringofforce.upgrade_stat_name_2=持武伤害提升
items.rings.ringofforce.upgrade_stat_name_3=技能伤害
items.rings.ringofforce.ability_name=拳击架势
items.rings.ringofforce.typical_ability_desc=决斗家佩戴此戒可进入_格斗架势_，即使持武时普通攻击也强制使用戒指。通常造成_%1$d-%2$d伤害_并继承武器附魔与强化，但武器充能速度减缓50%%
items.rings.ringofforce.ability_desc=决斗家可以通过这枚戒指采取 _拳击架势_。在该姿势下，决斗家的常规攻击将使用这枚戒指，即使装备了武器。戒指还会继承武器的附魔和增强效果，但武器充能速度减缓50%%
items.rings.ringofforce.desc=这枚戒指能够增强配戴者的打击力度。这份额外的力量在挥舞武器时相当有限，而徒手攻击则会被大幅增强。负等级的戒指会导致配戴者的攻击变得软弱无力。
items.rings.ringofforce$brawlersstance.name=拳击架势
items.rings.ringofforce$brawlersstance.desc=在该姿势下，决斗家的常规攻击将使用装备的武力戒指，即使她装备了武器。然而，攻击仍然会使用武器的增强和附魔。\n\n，但武器充能速度减缓50%%\n\n通过使用力量戒指，可以切换该姿势的开启或关闭。频繁切换会使得充能速度减慢效果额外保留一段时间。
items.rings.ringoffuror.name=狂怒之戒
items.rings.ringoffuror.stats=佩戴这枚戒指时，你的攻击速度会提升_%s%%_。
items.rings.ringoffuror.typical_stats=佩戴这枚戒指时，你的攻击速度通常会提升_%s%%_。
items.rings.ringoffuror.combined_stats=你所装备的戒指正在结合它们的力量，总共提高你的攻击速度 _%s%%_。
items.rings.ringoffuror.upgrade_stat_name_1=攻速提升
items.rings.ringoffuror.desc=这枚戒指会激发配戴者内心的怒火，使其能够更迅猛地攻击。被诅咒的戒指则会导致穿戴者攻击迟缓。
items.rings.ringofhaste.name=疾速之戒
items.rings.ringofhaste.stats=佩戴这枚戒指时，你的移动速度会提升_%s%%_。
items.rings.ringofhaste.typical_stats=佩戴这枚戒指时，你的移动速度通常会提升_%s%%_。
items.rings.ringofhaste.combined_stats=你所装备的戒指正在结合它们的力量，总共提高你的移动速度 _%s%%_。
items.rings.ringofhaste.upgrade_stat_name_1=移速提升
items.rings.ringofhaste.desc=这枚戒指减轻了配戴者在移动时的负担，使其能够飞速奔跑。负等级的戒指则会使配戴者倍感沉重。
items.rings.ringofmight.name=根骨之戒
items.rings.ringofmight.stats=佩戴这枚戒指时，你的力量会增加_%1$d_，你的最大生命值会增加_%2$s%%_。
items.rings.ringofmight.typical_stats=佩戴这枚戒指时，你的力量通常会提升_%1$d_点，并且最大生命值通常会增加_%2$s%%_。
items.rings.ringofmight.combined_stats=你所装备的戒指正在结合它们的力量，总共提高你的力量 _%1$d_ 和最大生命值 _%2$s%%_。
items.rings.ringofmight.upgrade_stat_name_1=力量提升
items.rings.ringofmight.upgrade_stat_name_2=生命上限提升
items.rings.ringofmight.desc=这枚戒指会增强佩戴者的体质，使其拥有更强的力量与体格。负等级的戒指则会使人虚弱。
items.rings.ringofsharpshooting.name=神射之戒
items.rings.ringofsharpshooting.stats=佩戴这枚戒指时，你的投掷武器威力等级会提升_%1$d_级，耐久度会提升_%2$s%%_。
items.rings.ringofsharpshooting.typical_stats=佩戴这枚戒指时，你的投掷武器威力等级通常会提升_%1$d_级，耐久度通常会提升_%2$s%%_。
items.rings.ringofsharpshooting.combined_stats=你所装备的戒指正在结合它们的力量，总共提高你的有效投掷武器等级 _%1$d_，并提高它们的耐久度 _%2$s%%_。
items.rings.ringofsharpshooting.upgrade_stat_name_1=等级伤害提升
items.rings.ringofsharpshooting.upgrade_stat_name_2=耐久提升
items.rings.ringofsharpshooting.desc=这枚戒指会加强配戴者的瞄准能力，使投掷武器变得更加致命且耐用。被诅咒的戒指则会起反作用。
items.rings.ringoftenacity.name=韧性之戒
items.rings.ringoftenacity.stats=佩戴这枚戒指时，你受到的伤害至多减少_%s%%_。
items.rings.ringoftenacity.typical_stats=佩戴这枚戒指时，你受到的伤害通常至多减少_%s%%_。
items.rings.ringoftenacity.combined_stats=你所装备的戒指正在结合它们的力量，总共减少你受到的伤害高达 _%s%%_。
items.rings.ringoftenacity.upgrade_stat_name_1=最大减伤
items.rings.ringoftenacity.desc=这枚戒指使配戴者能够抵御本应致命的打击。配戴者受伤越重，对伤害的抗性就越高。负等级的戒指则会让敌人更容易杀死配戴者。
items.rings.ringofwealth.name=财富之戒
items.rings.ringofwealth.stats=佩戴这枚戒指时，你的整体幸运程度会提升_%s%%_。
items.rings.ringofwealth.typical_stats=佩戴这枚戒指时，你的整体幸运程度通常会提升_%s%%_。
items.rings.ringofwealth.combined_stats=你所装备的戒指正在结合它们的力量，总共提高你的幸运值 _%s%%_。
items.rings.ringofwealth.upgrade_stat_name_1=幸运提升
items.rings.ringofwealth.desc=这枚戒指有如磁石般的招财功效，佩戴者有更大的机率从敌人身上或各类宝箱中取得较有价值的道具。被诅咒的戒指反而会降低发现宝物的可能性。
items.scrolls.scroll.ac_read=阅读
items.scrolls.scroll.kaunan=KAUNAN卷轴
items.scrolls.scroll.sowilo=SOWILO卷轴
items.scrolls.scroll.laguz=LAGUZ卷轴
items.scrolls.scroll.yngvi=YNGVI卷轴
items.scrolls.scroll.gyfu=GYFU卷轴
items.scrolls.scroll.raido=RAIDO卷轴
items.scrolls.scroll.isaz=ISAZ卷轴
items.scrolls.scroll.mannaz=MANNAZ卷轴
items.scrolls.scroll.naudiz=NAUDIZ卷轴
items.scrolls.scroll.berkanan=BERKANAN卷轴
items.scrolls.scroll.odal=ODAL卷轴
items.scrolls.scroll.tiwaz=TIWAZ卷轴
items.scrolls.scroll.unknown_desc=这张羊皮纸上写满了难以破译的魔法文字。大声念出来会发生什么？
items.scrolls.scroll.blinded=你不能在失明时阅读卷轴。
items.scrolls.scroll.no_magic=你不能在魔法免疫时阅读卷轴。
items.scrolls.scroll.cursed=被诅咒的法典抑制了卷轴中法术的启动！也许祛邪卷轴足够强大还能被使用...
items.scrolls.scroll$placeholder.name=卷轴
items.scrolls.inventoryscroll.warning=你真的想终止这张卷轴的施放？它仍会被消耗掉。
items.scrolls.inventoryscroll.yes=是的，我确定
items.scrolls.inventoryscroll.no=不，我改主意了
items.scrolls.scrollofidentify.name=鉴定卷轴
items.scrolls.scrollofidentify.inv_title=选择一样要鉴定的物品
items.scrolls.scrollofidentify.it_is=你的卷轴鉴定出了%s。
items.scrolls.scrollofidentify.desc=该卷轴能永久揭示一件物品的所有秘密。
items.scrolls.scrolloflullaby.name=催眠卷轴
items.scrolls.scrolloflullaby.sooth=卷轴发出了某种舒缓的旋律。你觉得非常困倦。
items.scrolls.scrolloflullaby.desc=阅读这张卷轴会释放出一段舒缓的旋律，让所有听到它的生物陷入魔法沉眠。这种睡眠有益于阅读者及友方单位的健康。
items.scrolls.scrollofmagicmapping.name=探地卷轴
items.scrolls.scrollofmagicmapping.layout=你熟悉了这层的地形。
items.scrolls.scrollofmagicmapping.desc=阅读这张卷轴时，一副明晰的景象会刻入你的记忆中，告知你整个楼层的精确布局并揭开所有隐藏的秘密。不过道具位置和生物分布依旧是未知状态。
items.scrolls.scrollofmirrorimage.name=镜像卷轴
items.scrolls.scrollofmirrorimage.copies=卷轴制造出了你的镜像。
items.scrolls.scrollofmirrorimage.no_copies=卷轴尝试制造出你的镜像，但它们无处可去。
items.scrolls.scrollofmirrorimage.desc=卷轴上的咒文会创造使用者的两个镜像。这些像使用者的弱化版克隆体的镜像会对敌人展开追杀。不过镜像非常脆弱，受到伤害就会瞬间消散。
items.scrolls.scrollofretribution.name=复仇卷轴
items.scrolls.scrollofretribution.blast=强大的魔法能量从卷轴中爆发出来！
items.scrolls.scrollofretribution.desc=这张卷轴可以将使用者的所受的伤痛转化为能量释放而出。使用者的伤势越重，所释放的能量越大。使用者处于低血量的情况下所释放的这种能量足以杀死大部分敌人。\n\n即便如此，这张卷轴依然会影响使用者，使其短时间目盲并虚弱无比。
items.scrolls.scrollofrage.name=盛怒卷轴
items.scrolls.scrollofrage.roar=卷轴产生的激怒咆哮在地牢中回荡！
items.scrolls.scrollofrage.desc=大声诵读内容时，卷轴将释放出一声轰响的咆哮，将所有敌人引向你并激怒附近的单位。
items.scrolls.scrollofrecharging.name=充能卷轴
items.scrolls.scrollofrecharging.surge=一股能量在体内奔腾而过，使你的法杖力量充沛！
items.scrolls.scrollofrecharging.desc=纯正的魔法能量被禁锢在羊皮纸内，当这股能量被释放时会在短时间内持续为阅读者的所有法杖充能。
items.scrolls.scrollofremovecurse.name=祛邪卷轴
items.scrolls.scrollofremovecurse.inv_title=选择一件要净化的物品
items.scrolls.scrollofremovecurse.cleansed=你的道具闪耀着净化的光芒，一股恶毒的能量从中消散。
items.scrolls.scrollofremovecurse.not_cleansed=你的道具闪耀着净化的光芒，不过什么也没发生。
items.scrolls.scrollofremovecurse.spirit=你的卷轴释放了那个受折磨的灵魂！
items.scrolls.scrollofremovecurse.desc=卷轴上的咒语能够瞬间清除指定的一件武器、护甲、法杖、戒指或神器上的诅咒。
items.scrolls.scrollofteleportation.name=传送卷轴
items.scrolls.scrollofteleportation.tele=眨眼之间你就被传送到本层的另外一个位置。
items.scrolls.scrollofteleportation.no_tele=强大的魔力流阻止了你的传送！
items.scrolls.scrollofteleportation.cant_reach=你不能传送到那个位置。
items.scrolls.scrollofteleportation.prompt=选择想要传送的地点
items.scrolls.scrollofteleportation.desc=羊皮纸上的咒语能立刻让阅读者传送到本层的另一处。卷轴会优先选择阅读者还未探索的地方，但无法将人传送到门被锁或被路障堵住入口的密室中。不过，它能帮助发现通向未知区域的隐藏门。
items.scrolls.scrollofterror.name=恐惧卷轴
items.scrolls.scrollofterror.none=这个卷轴产生了一阵明亮的红色闪光。
items.scrolls.scrollofterror.one=这个卷轴产生了一阵明亮的红色闪光的同时%s逃跑了！
items.scrolls.scrollofterror.many=这个卷轴产生了一阵明亮的红色闪光的同时怪物们逃跑了！
items.scrolls.scrollofterror.desc=一道红色闪光将以恐惧压垮使用者视觉范围内生物的心智并使它们转身逃跑。攻击正在逃跑的敌人会缩短该效果的持续时长。
items.scrolls.scrolloftransmutation.name=嬗变卷轴
items.scrolls.scrolloftransmutation.inv_title=选择一件要嬗变的物品
items.scrolls.scrolloftransmutation.nothing=没发生什么有意思的事。
items.scrolls.scrolloftransmutation.morph=你的道具变成了另一样东西！
items.scrolls.scrolloftransmutation.desc=卷轴内存着强力的嬗变魔法，用在可行的道具上会将其转变成同类型的另一样道具。嬗变魔法还会保留原道具上的升级、附魔和刻印。
items.scrolls.scrollofupgrade.name=升级卷轴
items.scrolls.scrollofupgrade.inv_title=选择一件要升级的物品
items.scrolls.scrollofupgrade.weaken_curse=升级卷轴减弱了物品上的诅咒。
items.scrolls.scrollofupgrade.remove_curse=升级卷轴净化了物品上的诅咒！
items.scrolls.scrollofupgrade.desc=这张卷轴可以升级一件物品，提升其品质。法杖的魔力及充能数会获得提升，武器和护甲可以造成或吸收更多的伤害，戒指的效果将会增强。\n\n这张卷轴甚至偶尔能减弱甚至驱散诅咒效果，不过不如祛邪卷轴那么稳定。\n\n卷轴的魔力也会影响甚至消除武器的附魔或护甲的刻印。从+4开始升级装备可能会消除附魔或刻印，在+8或者更高等级则会必定消除。
items.scrolls.exotic.exoticscroll.kaunan=KAUNAN秘卷
items.scrolls.exotic.exoticscroll.sowilo=SOWILO秘卷
items.scrolls.exotic.exoticscroll.laguz=LAGUZ秘卷
items.scrolls.exotic.exoticscroll.yngvi=YNGVI秘卷
items.scrolls.exotic.exoticscroll.gyfu=GYFU秘卷
items.scrolls.exotic.exoticscroll.raido=RAIDO秘卷
items.scrolls.exotic.exoticscroll.isaz=ISAZ秘卷
items.scrolls.exotic.exoticscroll.mannaz=MANNAZ秘卷
items.scrolls.exotic.exoticscroll.naudiz=NAUDIZ秘卷
items.scrolls.exotic.exoticscroll.berkanan=BERKANAN秘卷
items.scrolls.exotic.exoticscroll.odal=ODAL秘卷
items.scrolls.exotic.exoticscroll.tiwaz=TIWAZ秘卷
items.scrolls.exotic.exoticscroll.unknown_desc=这张漆黑的羊皮纸上刻满了闪耀着魔力光芒的晦涩符文。看起来这不是这个世界的物品。大声念出来会发生什么？
items.scrolls.exotic.scrollofsirenssong.name=塞壬之歌秘卷
items.scrolls.exotic.scrollofsirenssong.prompt=选择一个目标
items.scrolls.exotic.scrollofsirenssong.no_target=这张秘卷在没有目标的情况下激活了
items.scrolls.exotic.scrollofsirenssong.cancel=你必须选择一个目标
items.scrolls.exotic.scrollofsirenssong.desc=阅读此卷轴将播放出摄人心魄的旋律，令目标敌人沉沦与你，永久地变成盟友！听到这歌声的其它敌人则是暂时被魅惑。\n\n\n\n特别强大的敌人可以抵抗沉沦效果，以魅惑效果取而代之。
items.scrolls.exotic.scrollofsirenssong$enthralled.name=沉沦
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=这个生物已因塞壬之歌的效果而沉沦。\n\n沉沦的单位将永远忠心于你，并主动攻击其遇到的所有敌人。
items.scrolls.exotic.scrollofantimagic.name=驱魔秘卷
items.scrolls.exotic.scrollofantimagic.desc=使用这张秘卷会让你被包裹在一个能够阻挡其他所有法术的魔力结界中，无论它是有利或是有害。
items.scrolls.exotic.scrollofchallenge.name=决斗秘卷
items.scrolls.exotic.scrollofchallenge.desc=大声诵读，这个卷轴将发出巨大的吼声，将敌人吸引到诵读者身边，同时在它们周围创建一个决斗区域。\n\n只要诵读者在这个竞技场里，将获得33%的伤害减免（在其它所有伤害减免计算之前），并且不会损失饱食度。\n\n决斗区域的大小将随着诵读者所在区域的大小而改变。在一些Boss战区域，决斗区会格外的小。
items.scrolls.exotic.scrollofchallenge$challengearena.name=决斗区域
items.scrolls.exotic.scrollofchallenge$challengearena.desc=决斗秘卷在你周围创造了一个决斗区域，其中翻滚着血般的红雾。\n\n当你站在雾中，你的饥饿感不会增加，你将减少 33%% 来自任何来源的伤害。如果你有其他伤害减免（比如护甲），它们会在 33%%的伤害减免之后计算。\n\n剩余时长：%d 回合。
items.scrolls.exotic.scrollofdivination.name=预知秘卷
items.scrolls.exotic.scrollofdivination.nothing_left=没有可以鉴定的道具了！
items.scrolls.exotic.scrollofdivination.desc=这张秘卷会永久鉴定随机四件物品。被鉴定的物品可能是是一瓶药水，也可能是一张卷轴或一枚戒指。不过被鉴定的物品未必是你包裹中含有的。
items.scrolls.exotic.scrollofdivination$wnddivination.desc=你的预知秘卷鉴定了下列道具：
items.scrolls.exotic.scrollofdread.name=极度恐慌秘卷
items.scrolls.exotic.scrollofdread.desc=诵读的时候，极度恐慌秘卷会爆射出一道极度可怖的红色闪光，其中的杀气仿佛已经凝成实体。这足以令你视野中所有的敌人吓得肝胆欲裂，不顾一切地想要逃离这座地牢，永远也不回来了！\n\n与恐惧效果一样，逃命的敌人也会随着时间流逝逐渐冷静下来，来自外界的伤害更能加速这一过程。\n\n意志坚定的敌人，比如Boss们，将能抵抗逃命的冲动，而只是感到恐惧而代之。
items.scrolls.exotic.scrollofenchantment.name=注魔秘卷
items.scrolls.exotic.scrollofenchantment.inv_title=附魔一件物品
items.scrolls.exotic.scrollofenchantment.weapon=为你的武器选择附魔。
items.scrolls.exotic.scrollofenchantment.armor=为你的防具选择刻印。
items.scrolls.exotic.scrollofenchantment.cancel=取消
items.scrolls.exotic.scrollofenchantment.cancel_warn=取消该行动仍然会消耗卷轴
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=确认操作
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=取消操作
items.scrolls.exotic.scrollofenchantment.desc=这张秘卷可以为武器或护甲注入强大的魔力。使用者甚至可以选择注入魔力的类型。
items.scrolls.exotic.scrollofforesight.name=先见秘卷
items.scrolls.exotic.scrollofforesight.desc=当这件秘卷被使用后，使用者将十分清晰地探查到周围地形的细节。在效果的持续时间内，使用者不需要主动探查，因为使用者将会自动发现位于探查范围内的任何事物。
items.scrolls.exotic.scrollofmetamorphosis.name=蜕变秘卷
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=选择一个天赋以进行蜕变
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=选择你希望蜕变出的天赋
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=取消仍将消耗蜕变秘卷，确定继续？
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=蜕变天赋
items.scrolls.exotic.scrollofmetamorphosis.desc=这张秘卷充满了嬗变的魔力，不过与一般的嬗变卷轴不同。这股魔力将作用于释放者本身而不是一个物品。秘卷的魔力将允许你蜕变一个自身的天赋，使其转化为来自其他英雄的三个同层天赋之一！\n\n这个效果只适用于英雄自身的天赋，对专精天赋与护甲天赋便是无效的。那些你无法使用的天赋将不会出现在蜕变选项里。
items.scrolls.exotic.scrollofmysticalenergy.name=魔能秘卷
items.scrolls.exotic.scrollofmysticalenergy.desc=奇异的魔法能量被禁锢在秘卷羊皮纸内，当这股能量被释放时会在短时间内持续为阅读者的所有神器充能。
items.scrolls.exotic.scrollofpassage.name=归返秘卷
items.scrolls.exotic.scrollofpassage.desc=这张羊皮卷内所含有的符文法术能帮助使用者快速回到本区域的初始楼层。如果想要回到商店的话使用这张秘卷会非常有用。
items.scrolls.exotic.scrollofprismaticimage.name=虹卫秘卷
items.scrolls.exotic.scrollofprismaticimage.desc=这张秘卷上的咒文会创造使用者的一个虹色幻影。这个像使用者的弱化版克隆体的幻影有着相同的防御，但生命值和造成的伤害更低。\n\n虹色幻影将吸引敌人的火力从而保护使用者。\n\n当虹色幻影存在时阅读这张秘卷将会为其恢复所有生命。
items.scrolls.exotic.scrollofpsionicblast.name=灵爆秘卷
items.scrolls.exotic.scrollofpsionicblast.ondeath=灵能震爆撕碎了你的意识……
items.scrolls.exotic.scrollofpsionicblast.desc=这张秘卷蕴含着毁灭性的能量，一旦引导出来将撕裂视野内所有生物的心灵。\n\n这股力量的释放也会对阅读者产生严重伤害，并导致暂时性的失明和眩晕。
items.quest.chaosstone.name=混沌石
items.quest.chaosstone.desc=深渊常见的宝石，这玩意在地上世界是无价之宝。甚至有谣言说混沌石里有比Yendor护符更强的力量。不管怎样，你现在的目标是弄到更多这种不稳定的物质。
items.spells.alchemize.name=炼金菱晶
items.spells.alchemize.prompt=炼化一个物品
items.spells.alchemize.desc=这个菱晶包含的转化能力与炼金釜类似。允许使用者将一件物品(或一堆物品)转化为金币或炼金能量。\n\n炼金菱晶可以在商店中买到，也可以通过炼金反应自行合成。将任意卷轴与符石或种子共炼可以得到奥术催化剂。奥术催化剂还可用于可进一步的反应，生成若干个炼金菱晶。
items.spells.alchemize$wndalchemizeitem.sell=转化为 %d 个金币
items.spells.alchemize$wndalchemizeitem.sell_1=转化一个为 %d 个金币
items.spells.alchemize$wndalchemizeitem.sell_all=转化全部为 %d 个金币
items.spells.alchemize$wndalchemizeitem.energize=转化为 %d 点能量
items.spells.alchemize$wndalchemizeitem.energize_1=转化一个为 %d 点能量
items.spells.alchemize$wndalchemizeitem.energize_all=转化全部为 %d 点能量
items.spells.beaconofreturning.name=返回晶柱
items.spells.beaconofreturning.preventing=这里强大的魔力流阻止了你的结晶效果！
items.spells.beaconofreturning.creatures=临近生物的心灵信号干扰不允许你在此刻进行传送。
items.spells.beaconofreturning.set=信标设置在了你现在的位置。
items.spells.beaconofreturning.wnd_body=新的设置会覆盖原来的信标设置的位置。\n\n返回将会让你回到上一个设置的位置并且消耗一个菱晶。
items.spells.beaconofreturning.wnd_set=设置
items.spells.beaconofreturning.wnd_return=返回
items.spells.beaconofreturning.desc_set=信标被设置在了第%d层的某处
items.spells.beaconofreturning.desc=这个复杂的菱晶给予了使用者无视距离返回到设定地点的能力。该菱晶只会在返回时消耗。你可以随时改变它的设定位置，但该菱晶只能记忆最近一次设置的位置。
items.spells.curseinfusion.name=诅咒菱晶
items.spells.curseinfusion.inv_title=诅咒一件物品
items.spells.curseinfusion.desc=这个菱晶可以向一件装备注入和DM-300内部相同的的邪恶魔法。目标物品会立刻被诅咒，且原有的附魔与刻印会被覆盖。\n\n对武器、护甲和法杖使用时，诅咒菱晶在诅咒的基础上还会升级目标物品。诅咒菱晶造成的升级不会叠加，而且去除诅咒后升级也随之消失。
items.spells.pipisfusion.name=混乱菱晶
items.spells.pipisfusion.inv_title=选择要注入混乱的武器
items.spells.pipisfusion.desc=这个菱晶可以给一件近战武器注入和克罗默同样强大的混乱魔法。使用它会获得正面附魔和混乱诅咒，以前的附魔会被覆盖。\n\n混乱附魔武器将造成双倍的伤害，但每次攻击都会获得扭曲状态。混乱诅咒不会叠加，也不能从武器中祛邪。
items.spells.spell.ac_cast=施放
items.spells.spell.no_magic=你无法再魔法免疫的情况下使用法术结晶。
items.spells.magicalinfusion.name=注魔菱晶
items.spells.magicalinfusion.inv_title=灌注一件物品/道具
items.spells.magicalinfusion.infuse=你的%s被注入了奥术之力！
items.spells.magicalinfusion.desc=这个菱晶蕴含着和升级卷轴同样强大的魔力，不过这种魔力更为稳定。\n\n这个菱晶在升级武器或护甲的同时不会消除上面的附魔或刻印。
items.spells.magicalporter.name=信使结晶
items.spells.magicalporter.inv_title=传送一个物品
items.spells.magicalporter.nowhere=没有传送物品的目标地点。
items.spells.magicalporter.desc=这个菱晶能够通过魔法传送任何成为施法目标的物品。但不同于商人信标，这些物品会被传送到下一个boss层的入口处。
items.spells.phaseshift.name=转移结晶
items.spells.phaseshift.no_target=那里没什么可传送的东西。
items.spells.phaseshift.desc=这个充满混沌的结晶法术会将目标单位传送到本层随机位置，并麻痹一段时间。强大的敌人能抵抗麻痹效果。这个菱晶可以在目标单位或施法者自身上使用。
items.spells.kromerscroll.name=财富秘卷
items.spells.kromerscroll.desc=这个神话般的秘卷打开了通往无限资源和金钱的大门。_无论如何，他在展示这件物品时就是这么说的。_
items.spells.reclaimtrap.name=陷阱晶核
items.spells.reclaimtrap.no_trap=这里没有陷阱。
items.spells.reclaimtrap.desc_trap=菱晶内当前存储着一个_%s。_
items.spells.reclaimtrap.desc=这个菱晶蕴含着DM-300残余的机械能力。当它被投掷到一个有效陷阱上时，陷阱的力量会被菱晶吸收储存，让你可以在任何地方释放这个陷阱的效果。\n\n不过，有的陷阱会在特殊地域失效，而且菱晶一次只能储存一个陷阱。
items.spells.recycle.name=回收菱晶
items.spells.recycle.inv_title=回收一件物品
items.spells.recycle.recycled=你的物品被回收为%s.
items.spells.recycle.desc=这个菱晶蕴含着弱化的嬗变魔法。虽然不能对装备使用，但它能将卷轴，药水，种子或符石转换为一个随机的同类物品。
items.spells.summonelemental.name=唤魔晶柱
items.spells.summonelemental.ac_imbue=灌注
items.spells.summonelemental.imbue_prompt=灌注一件物品
items.spells.summonelemental.desc=这个晶柱联系着用于制造它的元素余烬的能量，能够召唤出一个友好的元素助你战斗！同时只能召唤一个元素。
items.spells.summonelemental.desc_newborn=这个晶柱尚未被灌注，只能召唤一个无法远程攻击，较为虚弱的_新生元素_。你可以用已鉴定的液火药剂或冰霜药剂、充能卷轴、嬗变卷轴为其充能，以便召唤出一个完全体的元素！
items.spells.summonelemental.desc_fire=这个晶柱摸起来滚烫，可用来召唤出一个_液火元素_。你可以通过灌注的方法覆盖当前的充能类型。
items.spells.summonelemental.desc_frost=这个晶柱摸起来冰冷，可用来召唤出一个_冰霜元素_。你可以通过灌注的方法覆盖当前的充能类型。
items.spells.summonelemental.desc_shock=这个晶柱辐射出一个稳定的电场，可用来召唤出一个_电击元素_。你可以通过灌注的方法覆盖当前的充能类型。
items.spells.summonelemental.desc_chaos=这个晶柱散发着紊乱的能量流，可用来召唤出一个_混沌元素_。你可以通过灌注的方法覆盖当前的充能类型。
items.spells.scammingspell.name=骗局菱晶
items.spells.scammingspell.desc=这种异界菱晶会使店主在短时间内高度随机化他们的价格。
items.spells.scammingspell.apply=你觉得自己是一个[大人物]!
items.spells.targetedspell.prompt=选择一个目标
items.spells.targetedspell.inv_title=灌注一件物品/道具
items.spells.telekineticgrab.name=念力结晶
items.spells.telekineticgrab.cant_grab=你无法抓取它。
items.spells.telekineticgrab.no_target=这里没什么可抓取的东西。
items.spells.telekineticgrab.desc=这个结晶允许使用者远程抓取一个地上的物体，或从敌人身上取回卡住的投掷物！\n\n无法用于抓取其他角色拥有的物品，也无法抓取诸如箱子这般的容器。
items.spells.unstablespell.name=无序结晶
items.spells.unstablespell.desc=黑色方晶各面浮动着变幻符文\n\n激活时随机触发卷轴效果：视野内有敌人必触发战斗向效果，否则必触发非战斗向效果
items.spells.wildenergy.name=强能晶柱
items.spells.wildenergy.desc=这个结晶中含有部分驱动DM-300的诅咒之力。当释放时，它会为你的法杖与佩戴着的神器充能，但同时也会随机触发一种诅咒法杖的效果。幸运的是你可以指定这种诅咒能量的施放方向。
items.stones.inventorystone.ac_use=使用
items.stones.runestone$placeholder.name=符石
items.stones.stoneofaggression.name=敌意符石
items.stones.stoneofaggression.desc=当把这颗符石掷向一个盟友或敌人时，周围的所有敌人都会不受控制地攻击目标。\n\n如果对敌人使用，这种魔力只会持续很短的一段时间，但如果对自己或者盟友使用，魔力持续的时间会显著延长。
items.stones.stoneofaggression$aggression.name=众矢之的
items.stones.stoneofaggression$aggression.desc=支配魔法正强制使周围的敌人攻击该单位。\n\n效果剩余回合：%s
items.stones.stoneofaugmentation.name=强化符石
items.stones.stoneofaugmentation.inv_title=强化一件物品
items.stones.stoneofaugmentation.desc=这块符石内的强力魔法可以用于强化装备的一种属性，但是会以减弱另一种属性为代价。\n\n用于武器可以强化伤害或者速度。\n\n用于护甲可以强化防御或者闪避。
items.stones.stoneofaugmentation$wndaugment.choice=你想强化哪个属性？
items.stones.stoneofaugmentation$wndaugment.speed=速度
items.stones.stoneofaugmentation$wndaugment.damage=伤害
items.stones.stoneofaugmentation$wndaugment.evasion=闪避
items.stones.stoneofaugmentation$wndaugment.defense=防御
items.stones.stoneofaugmentation$wndaugment.none=移除强化
items.stones.stoneofaugmentation$wndaugment.cancel=算了
items.stones.stoneofblast.name=震爆符石
items.stones.stoneofblast.desc=这颗符石被扔出后会在目的地立即爆炸。和炸弹一样，爆炸会对范围内的所有东西造成伤害。
items.stones.stoneofblink.name=闪现符石
items.stones.stoneofblink.desc=这颗符石被扔出后会把使用者传送到目的地。
items.stones.stoneofclairvoyance.name=明示符石
items.stones.stoneofclairvoyance.desc=这颗符石被扔出后会瞬间搜索以目的地为中心的巨大范围内的所有地格。该搜索能力甚至不受墙壁的阻隔。
items.stones.stoneofdeepsleep.name=沉睡符石
items.stones.stoneofdeepsleep.desc=当把这颗符石掷向一个敌人时，被命中的敌人会陷入魔法睡眠。陷入魔法睡眠的敌人会永远沉睡下去，除非受到外界打扰。
items.stones.stoneofdetectmagic.name=侦魔符石
items.stones.stoneofdetectmagic.inv_title=侦测物品
items.stones.stoneofdetectmagic.detected_none=未侦测到魔法影响
items.stones.stoneofdetectmagic.detected_both=侦测到增益与诅咒双效魔法！
items.stones.stoneofdetectmagic.detected_good=侦测到增益魔法！
items.stones.stoneofdetectmagic.detected_bad=侦测到诅咒魔法！
items.stones.stoneofdetectmagic.desc=可侦测物品魔法属性的符文石。对未鉴定物品使用可揭示是否受诅咒或附魔/强化
items.stones.stoneofdisarming.name=拆除符石
items.stones.stoneofdisarming.desc=这个符石具有破坏隐藏于地牢各处的有害陷阱的魔力。它的魔力最多能拆除以投掷目的地为中心的一片区域内的9个陷阱。
items.stones.stoneofenchantment.name=附魔符石
items.stones.stoneofenchantment.inv_title=附魔一件物品
items.stones.stoneofenchantment.weapon=你的武器在暗中微微发光！
items.stones.stoneofenchantment.armor=你的护甲在暗中微微发光！
items.stones.stoneofenchantment.desc=这块符文石拥有施加附魔的能力。和升级卷轴不同，它不会直接加强一个道具的能力，但能给武器或者护甲施加附魔，使其拥有新的特性。
items.stones.stoneoffear.name=恐惧符石
items.stones.stoneoffear.desc=当把这颗符石掷向一个盟友或敌人时，被命中的角色会陷入深深的恐惧中，无法克制地逃离。攻击会刺激其从恐惧中更快恢复。
items.stones.stoneofflock.name=羊群符石
items.stones.stoneofflock.desc=这颗符石被扔出后会在目的地召唤一群魔法绵羊。
items.stones.stoneofintuition.name=感知符石
items.stones.stoneofintuition.inv_title=选择一件物品
items.stones.stoneofintuition.desc=这块符石含有的魔法就像一个弱化版的鉴定卷轴。和鉴定卷轴那种直接识别物品的魔法不一样，它会加强你的直觉，让你通过猜测来试图鉴定一种药水，卷轴或者戒指。初次正确的猜测将会顺利鉴定该物品，并保留该符石，以便第二次使用。
items.stones.stoneofintuition.break_info=感知符石可使用两次后碎裂，_下次使用不消耗石头_
items.stones.stoneofintuition.break_warn=已使用过感知符石，_下次使用将消耗石头_
items.stones.stoneofintuition$wndguess.text=猜猜这件未鉴定道具是什么。猜对了的话就会鉴定物品种类！
items.stones.stoneofintuition$wndguess.correct=猜对了。这种物品被鉴定了！
items.stones.stoneofintuition$wndguess.incorrect=你猜错了。
items.stones.stoneofintuition$wndguess.break=感知符石化为尘埃...
items.stones.stoneofshock.name=电击符石
items.stones.stoneofshock.desc=这颗符石被扔出后会爆出一阵电能量，短暂麻痹范围内所有目标并根据电到的目标数量恢复使用者的法杖充能。
items.trinkets.chaoticcenser.name=混沌香炉
items.trinkets.chaoticcenser.spew=你的香炉将要喷出：%s。
items.trinkets.chaoticcenser.desc=在炼金釜内炼制一段时间后，这个原用于焚香的香炉竟开始自发产生气体！这些气体会在炉内积聚起来，并间歇性地向敌人喷去。香炉似乎能够生成各式各样的气体，但在气体释放前你会得到片刻的预警。
items.trinkets.chaoticcenser.typical_stats_desc=这件饰物通常会每经_%d_±回合在敌人附近生成一团有害气体。气体仅在敌人存在时生成。更高等级的香炉生成稀有而强力的气体的可能性更高。
items.trinkets.chaoticcenser.stats_desc=在当前等级下，这件饰物会每经_%d_±回合在敌人附近生成一团有害气体。气体仅在敌人存在时生成。更高等级的香炉生成稀有而强力的气体的可能性更高。
items.trinkets.dimensionalsundial.name=位面日晷
items.trinkets.dimensionalsundial.warning=你的日晷不再显影，这使你倍感不安。
items.trinkets.dimensionalsundial.desc=不知为何，这块小型手持式日晷能在地牢深处显影，甚至你不将其摆正也是如此。更奇怪的是，晷影的方位似乎与这个世界的太阳无关。当晷影不再显现时，日晷似乎会招致危险。
items.trinkets.dimensionalsundial.typical_stats_desc=这件饰物通常会在实时日间(早上8:00到晚上8:00)降低_%1$d%%_的敌人生成速率并在实时夜间(晚上8:00到早上8:00)提升_%2$d%%_的敌人生成速率。
items.trinkets.dimensionalsundial.stats_desc=在当前等级下，这件饰物会在实时日间(早上8:00到晚上8:00)降低_%1$d%%_的敌人生成速率并在实时夜间(晚上8:00到早上8:00)提升_%2$d%%_的敌人生成速率。
items.trinkets.exoticcrystals.name=奇异能晶
items.trinkets.exoticcrystals.desc=这些小型粉色晶体有着和炼金能量晶体一样的几何外形。尽管它们不能直接为炼金实验供能，但不知为何似乎能影响你找到的药剂和卷轴。
items.trinkets.exoticcrystals.typical_stats_desc=这件饰物通常会使_%s%%_的药剂、卷轴转化为其对应的合剂、秘卷。转化不会影响力量药剂，升级卷轴与为解决特殊房间提供帮助而生成的物品。
items.trinkets.exoticcrystals.stats_desc=在当前等级下，这件饰物会使_%s%%_的药剂、卷轴转化为其对应的合剂、秘卷。转化不会影响力量药剂，升级卷轴与为解决特殊房间提供帮助而生成的物品。
items.trinkets.eyeofnewt.name=蝾螈魔眼
items.trinkets.eyeofnewt.desc=这颗黑金色的蝾螈之眼是一种常见的炼金原料，而现在已被附魔强化为一件饰物。魔眼似乎降低了你的视力，以为你换取其他形式的视觉。
items.trinkets.eyeofnewt.typical_stats_desc=这件饰物通常会降低你_%1$s%%_的视野范围，但也会使你获得对_%2$d_格范围内敌人的灵视感知。
items.trinkets.eyeofnewt.stats_desc=在当前等级下，这件饰物会降低你_%1$s%%_的视野范围，但也会使你获得对_%2$d_格范围内敌人的灵视感知。
items.trinkets.mimictooth.name=拟箱利齿
items.trinkets.mimictooth.desc=这颗大尖牙肯定是强行从某个非常倒霉的宝箱怪口中拔下来的。它似乎能影响地牢中的宝箱怪，使它们更常见，也更危险。
items.trinkets.mimictooth.typical_stats_desc=这件饰物通常会使所有类型的宝箱怪的出现频率变为原频率的_%1$s倍_，并使宝箱怪更难以识别，而其掉落的战利品也会更加丰厚。此外，每层地牢还会有_%2$s%%_的概率额外带有一个隐藏的黑檀宝箱怪。
items.trinkets.mimictooth.stats_desc=在当前等级下，这件饰物会使所有类型的宝箱怪的出现频率变为原频率的_%1$s倍_，并使宝箱怪更难以识别，而其掉落的战利品也会更加丰厚。此外，每层地牢还会有_%2$s%%_的概率额外带有一个隐藏的黑檀宝箱怪。
items.trinkets.mossyclump.name=苔藓丛簇
items.trinkets.mossyclump.desc=无论你如何用力挤压它，这团潮湿的苔藓似乎都能保持其水分。它似乎通过魔法与地牢本身形成链接，促使草木流水频繁出现。
items.trinkets.mossyclump.typical_stats_desc=这件饰物通常会使_%d%%_的无感觉楼层获得流水或草木感觉。\n\n这件饰物升级所消耗的炼金能量较多。
items.trinkets.mossyclump.stats_desc=在当前等级下，这件饰物会使_%d%%_的无感觉楼层获得流水或草木感觉。\n\n这件饰物升级所消耗的炼金能量较多。
items.trinkets.parchmentscrap.name=残魔余卷
items.trinkets.parchmentscrap.desc=这块小小的羊皮纸残片看起来来自一张卷轴。它仍附有一丝残存的魔力，并且似乎能影响在地牢中找到的武器和护甲。
items.trinkets.parchmentscrap.typical_stats_desc=这件饰物通常会使附魔与刻印的出现频率变为原频率的_%d倍_，而武器与护甲的诅咒的出现频率变为原频率的_%s倍_。法杖、戒指与神器的诅咒不受影响。\n\n这件饰物升级所消耗的炼金能量较多。
items.trinkets.parchmentscrap.stats_desc=在当前等级下，这件饰物会使附魔与刻印的出现频率变为原频率的_%d倍_，而武器与护甲的诅咒的出现频率变为原频率的_%s倍_。法杖、戒指与神器的诅咒不受影响。\n\n这件饰物升级所消耗的炼金能量较多。
items.trinkets.petrifiedseed.name=石化种子
items.trinkets.petrifiedseed.desc=这粒种子在缓慢的地质作用或法术作用的影响下石化了。它似乎通过魔法影响着地牢的植物群系，时不时使种子转化为符石。
items.trinkets.petrifiedseed.typical_stats_desc=这件饰物通常会有_%1$s%%_的概率使被践踏的高草掉落符石而非种子，还会使高草掉落物品的概率提升_%2$s%%_。
items.trinkets.petrifiedseed.stats_desc=在当前等级下，这件饰物会有_%1$s%%_的概率使被践踏的高草掉落符石而非种子，还会使高草掉落物品的概率提升_%2$s%%_。
items.trinkets.ratskull.name=巨鼠头骨
items.trinkets.ratskull.desc=这件可怕的饰物并不比正常老鼠的头骨大多少，但不知为何在这个地牢却很稀有。头骨的魔力似乎能吸引更多稀有的地牢住民，使它们更有可能出现。
items.trinkets.ratskull.typical_stats_desc=这件饰物通常会使稀有敌人的出现频率变为原频率的_%d倍_。然而，头骨对于提升水晶宝箱怪和装甲石像出现频率效果减半。
items.trinkets.ratskull.stats_desc=在当前等级下，这件饰物会使稀有敌人的出现频率变为原频率的_%d倍_。然而，头骨对于提升水晶宝箱怪与装甲石像出现频率效果减半。
items.trinkets.saltcube.name=盐晶立方
items.trinkets.saltcube.desc=这块巨大的盐晶被切割成近乎完美的立方体，而不知为何盐晶成功吸收了炼金釜中一半的水分而非溶解于其中。它似乎通过魔法脱水并保存了你的食物，延长了你所得的饱腹感，但也减少了你不挨饿时的生命回复。
items.trinkets.saltcube.typical_stats_desc=这件饰物通常会增加你_%1$s%%_的饥饿所需时间，但也会降低你_%2$s%%_的生命回复速率。
items.trinkets.saltcube.stats_desc=在当前等级下，这件饰物会增加你_%1$s%%_的饥饿所需时间，但也会降低你_%2$s%%_的生命回复速率。
items.trinkets.shardofoblivion.name=遗忘碎片
items.trinkets.shardofoblivion.desc=经过炼金釜的烹煮，这一小块邪能碎片已经化为了...一片虚空？光线似乎在碎片边缘发生了弯曲，而只要你不握住它，它就会悬停在原地。碎片似乎通过魔法从你的无知中获得力量，所以对此最好不要想太多。
items.trinkets.shardofoblivion.typical_stats_desc=这件饰物通常会根据你已经装备或最近使用的每件(最多_%d件_)未鉴定装备提升20%%的敌人掉落战利品的概率。碎片还会阻止你鉴定装备，你只能通过碎片手动鉴定符合鉴定条件的装备。
items.trinkets.shardofoblivion.stats_desc=在当前等级下，这件饰物会根据你已经装备或最近使用的每件(最多_%d件_)未鉴定装备提升20%%的敌人掉落战利品的概率。碎片还会阻止你鉴定装备，你只能通过碎片手动鉴定符合鉴定条件的装备。
items.trinkets.shardofoblivion.ac_identify=鉴定
items.trinkets.shardofoblivion.identify_prompt=鉴定一件物品
items.trinkets.shardofoblivion.identify_ready=符合鉴定条件的物品：%s
items.trinkets.shardofoblivion.identify_ready_worn=你所装备的物品已符合鉴定条件。
items.trinkets.shardofoblivion.identify_not_yet=这件物品尚未符合鉴定条件。
items.trinkets.shardofoblivion.identify=你鉴定了这个物品！
items.trinkets.shardofoblivion$wandusetracker.name=已使用未鉴定法杖
items.trinkets.shardofoblivion$wandusetracker.desc=你最近使用了一根未鉴定法杖，短期内遗忘碎片将其视为使用了一件未鉴定装备。\n\n效果剩余时长：%s回合
items.trinkets.thirteenleafclover.name=十三叶草
items.trinkets.thirteenleafclover.desc=不知为何，炼金釜的烹煮导致这株三叶草长出了一堆额外的叶片！这件饰物幸运与否暂且不知，也许只会增加你的运气的混乱程度？
items.trinkets.thirteenleafclover.typical_stats_desc=这件饰物通常会使你有_%1$d%%_的概率造成最大伤害，而有_%2$d%%_的概率造成最小伤害。
items.trinkets.thirteenleafclover.stats_desc=在当前等级下，这件饰物会使你有_%1$d%%_的概率造成最大伤害，而有_%2$d%%_的概率造成最小伤害。
items.trinkets.trapmechanism.name=陷阱元件
items.trinkets.trapmechanism.desc=地牢中某个塌方陷阱的核心元件，被小心地从地面中挖掘而出以便携带。它似乎通过魔法与地牢本身形成链接，促使险恶地形频繁出现，并增强了你对陷阱的探查能力。
items.trinkets.trapmechanism.typical_stats_desc=这件饰物通常会使_%1$d%%_的无感觉楼层获得陷阱或深渊感觉。此外，地牢中_%2$d%%_的隐藏陷阱会变得可见。
items.trinkets.trapmechanism.stats_desc=在当前等级下，这件饰物会使_%1$d%%_的无感觉楼层获得陷阱或深渊感觉。此外，地牢中_%2$d%%_的隐藏陷阱会变得可见。
items.trinkets.vialofblood.name=凝血试管
items.trinkets.vialofblood.desc=这根细长的试管内装有一些地牢住民的血液，当你转动试管时其中的血液也会随之缓慢流动。它似乎通过魔法增强而延迟了更强的治疗效果。
items.trinkets.vialofblood.typical_stats_desc=这件饰物通常会增加你_%1$s%%_的饮用治疗药剂、水袋或生命之泉获得的治疗总量。但上述治疗效果也会更慢地起效，每回合最多回复英雄_%2$s点_生命值(最大治疗量随英雄等级成长而成长)。
items.trinkets.vialofblood.stats_desc=在当前等级下，这件饰物会增加你_%1$s%%_的饮用治疗药剂、水袋或生命之泉获得的治疗总量。但上述治疗效果也会更慢地起效，每回合最多回复英雄_%2$s点_生命值(最大治疗量随英雄等级成长而成长)。
items.trinkets.wondrousresin.name=奇迹树脂
items.trinkets.wondrousresin.desc=这团泛着微光的蓝色树脂看起来附有某根诅咒法杖魔法的纯化精华。炼金釜中的魔力似乎在一定程度上稳定了树脂的诅咒魔法，而这种魔法现在正影响着你的法杖。
items.trinkets.wondrousresin.typical_stats_desc=这件饰物通常会有_%1$s%%_的概率迫使诅咒法杖效果变得无害或有益，还会有_%2$s%%_的概率使无诅咒的法杖施放一次额外的无害或有益的诅咒法杖效果。\n\n这件饰物升级所消耗的炼金能量较多。
items.trinkets.wondrousresin.stats_desc=在当前等级下，这件饰物会有_%1$s%%_的概率迫使诅咒法杖效果变得无害或有益，还会有_%2$s%%_的概率使无诅咒的法杖施放一次额外的无害或有益的诅咒法杖效果。\n\n这件饰物升级所消耗的炼金能量较多。
items.trinkets.trinketcatalyst.name=魔能触媒
items.trinkets.trinketcatalyst.window_text=随着魔能触媒的置入，釜中的水逐渐泛起微光。你可以就近选择一件物品，注入炼金能量并将其炼成一件魔法饰物。
items.trinkets.trinketcatalyst.desc=这团泛着微光的金色粉尘在暗无边际的地牢中熠熠生辉。魔能触媒可被置入炼金釜中，结合少许炼金能量制成一件独特饰物。\n\n饰物提供各种小幅改变地牢环境或其住民的效果。通过消耗更多炼金能量升级饰物可以进一步增幅对应效果，丢掉饰物也可以完全摆脱其施加的影响。
items.trinkets.trinketcatalyst$randomtrinket.name=随机饰物
items.trinkets.trinketcatalyst$randomtrinket.desc=就近的一件物品被塞进了一个你打不开的包裹内。\n\n炼金反应可以将包裹溶解，但是在得到饰物之前你可没法确定它到底是什么。
items.trinkets.trinket$placeholder.name=饰物
items.wands.cursedwand.ondeath=你死于自己的%s。
items.wands.cursedwand.nothing=什么事都没发生。
items.wands.cursedwand.mass_invuln=明耀的光芒从你的法杖迸射而出！
items.wands.cursedwand.petrify=你突然被定在了原地！
items.wands.cursedwand.grass=草木在你周围疯长而出！
items.wands.cursedwand.fire=你闻到了烧烤的味道...
items.wands.cursedwand.transmogrify_wand=你的法杖变化成了另一样东西！
items.wands.cursedwand.transmogrify_other=你的道具变化成了另一样东西！
items.wands.cursedwand.disguise=你的外貌在你眼前发生了变化！
items.wands.cursedwand.supernova=一颗灼热的能量球开始膨胀。情况不妙，走为上计！
items.wands.cursedwand.supernova_positive=一颗灼热的能量球开始膨胀，但不知何故它似乎很安全。
items.wands.cursedwand.sinkhole=你周围的地板在迅速崩塌！
items.wands.cursedwand.sinkhole_positive=地板在迅速崩塌，但你感觉脚下足够结实。
items.wands.cursedwand.gravity=重力突然开始向随机方向牵引！
items.wands.cursedwand.gravity_positive=重力突然开始向随机方向牵引，但这对你没有影响。
items.wands.cursedwand.gravity_end=重力混沌结束了。
items.wands.damagewand.upgrade_stat_name_1=魔法伤害
items.wands.wand.ac_zap=释放
items.wands.wand.fizzles=你的法杖滋滋作响；一定是没能量了。
items.wands.wand.robot=在备用模式下不能使用魔杖。
items.wands.wand.no_magic=你的法杖滋滋作响；你不能在魔法免疫时使用法杖。
items.wands.wand.self_target=你不能瞄准你自己！
items.wands.wand.identify=你对你的法杖已经足够熟悉并将其完全鉴定。
items.wands.wand.resin_one=这只法杖已经从奥术聚酯获得了 1 次升级。
items.wands.wand.resin_many=这只法杖已经从奥术聚酯获得了%d次升级。
items.wands.wand.cursed=这根法杖受到了诅咒，导致它的魔法混乱而随机。
items.wands.wand.not_cursed=这根法杖没有被诅咒。
items.wands.wand.curse_discover=这根%s是诅咒的！
items.wands.wand.prompt=选择要释放魔法的位置
items.wands.wand.banished=被放逐到暗影中
items.wands.wand$placeholder.name=法杖
items.wands.wandofblastwave.name=冲击波法杖
items.wands.wandofblastwave.staff_name=震波之杖
items.wands.wandofblastwave.ondeath=你用冲击波法杖炸碎了自己……
items.wands.wandofblastwave.knockback_ondeath=撞击致死...
items.wands.wandofblastwave.desc=这根法杖由一种大理石石材制成，嵌有金饰并在顶部镶着一个浑圆的黑宝石。它在你手中的感觉非常沉重。
items.wands.wandofblastwave.typical_stats_desc=法杖射出在目标点剧烈爆炸的冲击波，通常造成_%1$d-%2$d伤害_并击飞多数敌人
items.wands.wandofblastwave.stats_desc=该法杖能射出一股能量，在目标位置引发强烈的爆炸。爆炸的力量会造成_%1$d~%2$d点伤害_并强到足以击飞大多数敌人。
items.wands.wandofblastwave.upgrade_stat_name_2=击退距离
items.wands.wandofblastwave.bmage_desc=当_ %s_以震波之杖近战攻击目标时，能像弹性附魔一样有概率将其击退。
items.wands.wandofblastwave.eleblast_desc=震波之杖的元素风暴造成67%伤害，并将所有目标弹出影响区域。
items.wands.wandofcorrosion.name=酸蚀法杖
items.wands.wandofcorrosion.staff_name=酸蚀之杖
items.wands.wandofcorrosion.desc=这根法杖的灰色主干顶端镶嵌着一颗明亮的橙色宝石。
items.wands.wandofcorrosion.stats_desc=这根法杖能射出一颗会在目标位置爆炸成一团强酸性雾气的法球。进入酸雾的任何单位都会持续受到起始为_%d点_的持续递增伤害。
items.wands.wandofcorrosion.upgrade_stat_name_1=腐蚀伤害
items.wands.wandofcorrosion.upgrade_stat_name_2=毒雾范围
items.wands.wandofcorrosion.bmage_desc=当_ %s_以酸蚀之杖近战攻击目标时，有概率使其沾染腐蚀污泥。
items.wands.wandofcorrosion.eleblast_desc=酸蚀魔杖的元素风暴对所有目标造成起始伤害为6点的4回合酸蚀。
items.wands.wandofunstable.name=鼠王法杖
items.wands.wandofunstable.staff_name=鼠王之杖
items.wands.wandofunstable.desc=这根法杖由坚固的木材制成，顶端镶有闪亮的祖母绿宝石。
items.wands.wandofunstable.stats_desc=这根法杖射出一道绿色的闪电，每次都会产生完全随机的效果。
items.wands.wandofunstable.bmage_desc=当_%s_使用鼠王之杖攻击一个敌人，这将造成随机的战斗法师效果。
items.wands.wandofunstable.eleblast_desc=使用鼠王之杖释放的元素爆炸效果完全随机。
items.wands.wandofunstable2.name=克罗默法杖
items.wands.wandofunstable2.staff_name=克罗默之杖
items.wands.wandofunstable2.desc=这根法杖是鼠王法杖的升级版，被克罗默投资的力量放大了。
items.wands.wandofunstable2.stats_desc=这根法杖射出一道不可思议的强大闪电，每次都会产生完全随机的魔杖或诅咒效果。
items.wands.wandofunstable2.bmage_desc=当_%s_使用克罗默之杖攻击一个敌人，这将造成随机的战斗法师效果或诅咒效果。
items.wands.wandofunstable2.eleblast_desc=使用克罗默之杖释放的元素爆炸将对该区域内的每一个敌人释放诅咒效果。
items.wands.wandofcorruption.name=腐化法杖
items.wands.wandofcorruption.staff_name=腐化之杖
items.wands.wandofcorruption.already_corrupted=这个角色已经被你腐化。
items.wands.wandofcorruption.desc=这根法杖能发射混乱的黑暗能量，法杖尖端的那个小头骨装饰很是应景。
items.wands.wandofcorruption.stats_desc=该法杖会释放腐坏的能量，能削弱敌人并最终将他们扭曲为你的奴仆。敌人能抵抗腐化，但虚弱的敌人明显地更容易被腐化。
items.wands.wandofcorruption.upgrade_stat_name_1=腐化强度
items.wands.wandofcorruption.upgrade_stat_name_2=减益时长
items.wands.wandofcorruption.bmage_desc=当_ %s_以腐化之杖近战攻击目标时， 有概率使其陷入狂乱。
items.wands.wandofcorruption.eleblast_desc=腐化之杖的元素风暴对所有目标造成5回合狂乱。
items.wands.wandofdisintegration.name=解离法杖
items.wands.wandofdisintegration.staff_name=解离之杖
items.wands.wandofdisintegration.desc=这根法杖由一整块光滑的黑曜石制成，深紫色的光自其边缘流向法杖顶端。它闪烁着破坏性能量，准备着向前迸射。
items.wands.wandofdisintegration.stats_desc=这根法杖射出的光束能穿透任何障碍物，并将随着法杖等级的提升而射得更远。光束会造成_%1$d~%2$d点伤害_，并且会根据穿透的地形和敌人数量造成额外伤害。
items.wands.wandofdisintegration.upgrade_stat_name_2=最大射程
items.wands.wandofdisintegration.bmage_desc=当_ %s_以解离之杖作为近战武器时，魔杖会像索敌附魔一样获得额外的攻击距离。
items.wands.wandofdisintegration.eleblast_desc=解离之杖的元素风暴无视墙壁并对所有目标造成100%的伤害。
items.wands.wandoffireblast.name=焰浪法杖
items.wands.wandoffireblast.staff_name=焰浪之杖
items.wands.wandoffireblast.desc=这根法杖由红漆木制成，饰以金叶，这使它看起来相当庄严。它的顶端噼啪作响嘶嘶而鸣，渴望着释放其强大的魔法。
items.wands.wandoffireblast.stats_desc=该法杖在使用时会产生一股强大的焰浪，延伸出一个锥形区域。下一次使用它将消耗_%1$d点充能_并造成_%2$d~%3$d点伤害_。法杖一次消耗的充能数越多，其范围与威力就越大、越强。
items.wands.wandoffireblast.upgrade_stat_name_1=1充能伤害
items.wands.wandoffireblast.upgrade_stat_name_2=2充能伤害
items.wands.wandoffireblast.upgrade_stat_name_3=3充能伤害
items.wands.wandoffireblast.bmage_desc=当_ %s_以焰浪之杖近战攻击目标时，能像拥有烈焰附魔一样有概率将其点燃。
items.wands.wandoffirebolt.name=火矢法杖
items.wands.wandoffirebolt.staff_name=火矢之杖
items.wands.wandoffirebolt.desc=这根法杖拥有独特的橙色光芒，说明它拥有巨大的破坏力。\n\n据信它们都是在矮人战争之后被摧毁的，但你面前的这根魔杖是确凿的证据，证明有些人实际上仍然以最纯粹的形式存在。
items.wands.wandoffirebolt.stats_desc=这根魔杖释放出魔法之火，造成%d-%d点伤害。它们也会点燃易燃的地形以及任何不幸与之接触的东西。
items.wands.wandoffirebolt.bmage_desc=当_ %s_以火矢法杖近战攻击目标时，火焰从魔杖中喷出，燃烧着敌人和地形。
items.wands.wandoffirebolt.eleblast_desc=火矢之杖的元素风暴造成100%的伤害，冲开范围内的门，并使目标与地形起火。
items.wands.wandoffireblast.eleblast_desc=焰浪之杖的元素风暴造成100%伤害，冲开范围内的门，并使目标与地形起火。
items.wands.wandoffrost.name=冰霜法杖
items.wands.wandoffrost.staff_name=霜冻之杖
items.wands.wandoffrost.desc=这根法杖似乎由某种魔法冰块制成。它的圆顶闪着亮光。握起来很冰，但不知为何你的手仍保持着温暖。
items.wands.wandoffrost.stats_desc=这支法杖能向你的敌人射击冰霜能量，造成_%1$d~%2$d点伤害_并冻伤目标，在水中的作用似乎更强。冻伤或冻结的敌人将受到更少该法杖的伤害。
items.wands.wandoffrost.upgrade_stat_name_2=冰冻时长
items.wands.wandoffrost.bmage_desc=当_ %s_以霜冻之杖近战攻击目标时，有概率将其直接冻结。目标冻伤越严重，被冻结的概率就越高。
items.wands.wandoffrost.eleblast_desc=霜冻之杖的元素风暴造成100%伤害，冷冻目标并熄灭火焰。
items.wands.wandoflightning.name=雷霆法杖
items.wands.wandoflightning.staff_name=雷霆之杖
items.wands.wandoflightning.ondeath=你用雷霆法杖杀死了自己…
items.wands.wandoflightning.desc=这根法杖由实心金属制成，这使它惊人地沉重。电弧在顶端两个内弯的叉齿间跳跃。
items.wands.wandoflightning.stats_desc=这支法杖能向任何瞄准的地方射出强大的电弧，造成_%1$d~%2$d点伤害_。这道闪电能在附近多个目标间跳跃，在水里会更强力。要是太接近，同样可能电到你自己，却不会波及到你的同伴。
items.wands.wandoflightning.bmage_desc=当_ %s_以雷霆之杖近战攻击目标时，能像拥有电击附魔一样有概率释放电弧攻击附近的目标。
items.wands.wandoflightning.eleblast_desc=雷霆之杖的元素风暴造成100%伤害，麻痹目标5回合并使水体带电。
items.wands.wandoflivingearth.name=灵壤法杖
items.wands.wandoflivingearth.staff_name=灵壤魔杖
items.wands.wandoflivingearth.desc=这根法杖由一种奇妙的石头组成，你能从几道微微发光的黄色条纹中感受到能量波动。握住法杖时石头好像会稍稍转动，仿佛在迎合你的手。
items.wands.wandoflivingearth.stats_desc=这根法杖能向敌人发射魔法泥石，造成_ %1$d~%2$d 点伤害。_泥石随后会回归使用者身边，根据造成的伤害重组成灵壤护甲。灵壤护甲积累到一定程度后，下次使用法杖时会成型为一尊灵壤守护者。
items.wands.wandoflivingearth.upgrade_stat_name_2=守护者最大生命
items.wands.wandoflivingearth.upgrade_stat_name_3=守护者格挡
items.wands.wandoflivingearth.bmage_desc=当_ %s_以灵壤之杖近战攻击目标时，能将部分近战伤害转化为灵壤护甲。
items.wands.wandoflivingearth.eleblast_desc=灵壤之杖的元素风暴造成50%伤害，每击中一个目标，治疗一个灵壤守护者一次。
items.wands.wandoflivingearth$rockarmor.name=灵壤护甲
items.wands.wandoflivingearth$rockarmor.desc=魔法泥石环绕在你身边，当你被攻击时它们会努力帮你格挡，格挡成功能抵消 50%% 所受伤害。抵消伤害会消除一定量的泥石。\n\n剩余护甲量：%1$d。\n\n当积攒的泥石达到一定程度时，下一次发动灵壤法杖会使泥石成型为一尊灵壤守护者为你而战。\n\n守护者成型所需护甲量：%2$d
items.wands.wandoflivingearth$rockarmor.desc_many=此岩甲守护者正享受众力加成。剩余回合：%d
items.wands.wandoflivingearth$earthguardian.name=灵壤守护者
items.wands.wandoflivingearth$earthguardian.desc=灵壤法杖发射的魔法泥石组成了一尊灵壤守护者！这个有棱有角的大块头会攻击附近的敌人，迫使他们去攻击守护者。当附近没有危险时，守护者会重组为你身边的灵壤护甲，等待你下次使用法杖召唤它。\n\n守护者的防御力与你的法杖等级相关。守护者当前能抵挡_ %1$d~%2$d 点伤害。_
items.wands.wandoflivingearth$earthguardian.wand_info=守护者防御力与法杖等级挂钩，当前格挡_%1$d-%2$d伤害_
items.wands.wandofmagicmissile.name=魔弹法杖
items.wands.wandofmagicmissile.staff_name=魔弹之杖
items.wands.wandofmagicmissile.desc=这根十分普通的法杖能发射由纯魔法能量构成的飞弹。尽管法杖本身没有什么花哨的特效，它有更多的充能数，而且在被升级后能暂时强化其他法杖。
items.wands.wandofmagicmissile.stats_desc=从法杖中发出的魔法飞弹会对单个目标造成_%1$d~%2$d点伤害_，如果被升级则会暂时强化其他法杖。
items.wands.wandofmagicmissile.bmage_desc=当_ %s_以魔弹之杖近战攻击目标时，所有的法杖与魔杖都会恢复一定的充能。
items.wands.wandofmagicmissile.eleblast_desc=魔弹之杖的元素风暴造成50%伤害，并使法师获得15回合的充能效果。
items.wands.wandofmagicmissile$magiccharge.name=魔力强化
items.wands.wandofmagicmissile$magiccharge.desc=你的魔弹法杖向其他法杖回馈了一股能量，提升着下一次施法的有效等级。\n\n其他法杖被强化至：+ %d\n\n剩余的魔力强化时长：%s 回合
items.wands.wandofprismaticlight.name=棱光法杖
items.wands.wandofprismaticlight.staff_name=棱光之杖
items.wands.wandofprismaticlight.desc=这根法杖由一块实心半透明水晶构成，就像一块厚长光滑的玻璃。一粒粒彩色的光点在法杖顶端跳跃，随时准备迸射而出。
items.wands.wandofprismaticlight.stats_desc=该法杖射出的光线能刺破地牢的黑暗，揭露隐藏的区域和陷阱。光线能致盲敌人并造成_%1$d~%2$d点伤害_。恶魔与亡灵生物会在法杖的强光下燃烧，受到额外伤害。
items.wands.wandofprismaticlight.upgrade_stat_name_2=致盲概率
items.wands.wandofprismaticlight.upgrade_stat_name_3=光辉时长
items.wands.wandofprismaticlight.bmage_desc=当_ %s_以棱光之杖近战攻击目标时，能使目标陷入随魔杖等级提升而延长的残废效果。
items.wands.wandofprismaticlight.eleblast_desc=棱光之杖的元素风暴造成67%伤害，揭示区域内所有地形，致盲所有目标5回合。
items.wands.wandofregrowth.name=再生法杖
items.wands.wandofregrowth.staff_name=再生之杖
items.wands.wandofregrowth.desc=这柄法杖由一根细长木枝巧琢而成。不知为何，它还活着而且生机盎然，像一株树苗的嫩芽般艳绿。“春兰兮秋菊，长无绝兮终古！”
items.wands.wandofregrowth.stats_desc=在施放时，这把法杖将向一个扇形区域倾洒出再生的能量。这种魔法会让草、根系甚至稀有的植物重获生命，破土而出。下一次使用它将消耗_%1$d点充能_。法杖消耗的充能越多，再生魔法的范围与效力就越大、越强。\n译者已加入黄金莲神教，教义节选：再生法杖7充能质变，+10质变，+15质变。
items.wands.wandofregrowth.degradation=法杖的再生魔力将在释放_%d 点充能_后开始消退，那时它将难以再次使植物或高草复生。获取经验或是升级法杖能延后这种限制。
items.wands.wandofregrowth.upgrade_stat_name_1=单充能产草
items.wands.wandofregrowth.upgrade_stat_name_2=总产草上限
items.wands.wandofregrowth.bmage_desc=当_ %s_以再生法杖近战攻击目标时，如果一方站在草地上，则战斗法师能获取伤害的一定比例的草药疗养。
items.wands.wandofregrowth.eleblast_desc=再生之杖的元素风暴使所有目标被缠绕，并令范围内随机长出高草。
items.wands.wandofregrowth$dewcatcher.name=结露草
items.wands.wandofregrowth$dewcatcher.desc=露珠草是一种蓄满了魔法露水的奇妙植物。它们想将自己伪装成杂草来避开注意，但其鼓胀的集露苞却出卖了它们。
items.wands.wandofregrowth$seedpod.name=种子荚
items.wands.wandofregrowth$seedpod.desc=种子荚是一种会结出其他各类植物种子的魔法植物。它们没有自己的种子，却还是以某种方式传播扩散开了。
items.wands.wandofregrowth$lotus.name=黄金莲
items.wands.wandofregrowth$lotus.desc=黄金莲是一种只能被强大的再生法杖创造的神秘植物。它的光环会增强所有植物相关效果，但它不一会就会耗尽能量枯萎。
items.wands.wandofregrowth$lotus.wand_info=这株黄金莲由一根_ +%1$d _的再生法杖产出。在它的作用范围内，播种到对象身上的任何种子都会_瞬间发动_。植物还会有_ %2$d%% 机率掉落自身的种子_，涂药飞镖每次使用_ 消耗的耐久度也会减少%3$d%% _。
items.wands.wandoftransfusion.name=注魂法杖
items.wands.wandoftransfusion.staff_name=注魂之杖
items.wands.wandoftransfusion.ondeath=你用注魂法杖耗尽了自己的生命…
items.wands.wandoftransfusion.charged=敌人的生命能量流进了你的魔杖！
items.wands.wandoftransfusion.desc=这根法杖形状很普通，是那暗红的色泽和镶在顶端的漆黑宝石让它显眼起来。
items.wands.wandoftransfusion.stats_desc=这支法杖对盟友或被魅惑的敌人释放时会消耗你_%1$d点生命_并赋予目标_%2$d点生命或护盾_；对敌人释放时会短暂魅惑敌人并回馈给你_%3$d点护盾_。敌对亡灵生物会受到_%4$d~%5$d点伤害_而不是被魅惑。
items.wands.wandoftransfusion.upgrade_stat_name_1=盟友治疗
items.wands.wandoftransfusion.upgrade_stat_name_2=自身护盾
items.wands.wandoftransfusion.upgrade_stat_name_3=亡灵伤害
items.wands.wandoftransfusion.bmage_desc=当_ %s_以注魂之杖近战攻击目标时，能获取一定的护盾且下次释放不消耗生命。
items.wands.wandoftransfusion.eleblast_desc=注魂之杖的元素风暴魅惑所有敌人、治疗所有友军，对敌对亡灵生物造成100%伤害。
items.wands.wandofwarding.name=哨卫法杖
items.wands.wandofwarding.staff_name=哨卫魔杖
items.wands.wandofwarding.no_more_wards=你的法杖无法维持更多的哨卫。
items.wands.wandofwarding.bad_location=你不能在那里设置一个哨卫。
items.wands.wandofwarding.desc=这个短小的金属法杖尖端上有一颗亮紫色宝石悬空浮动。
items.wands.wandofwarding.stats_desc=这根法杖并不能直接攻击敌人，但可以召唤出哨卫元素与哨卫结晶。你可以在视野中的任何地方召唤哨卫，即使是隔着一堵墙。这根法杖最多能提供_ %d 点能量_以维持哨卫。
items.wands.wandofwarding.upgrade_stat_name_1=守卫伤害
items.wands.wandofwarding.upgrade_stat_name_2=守卫能量
items.wands.wandofwarding.bmage_desc=当_ %s_以哨卫之杖近战攻击目标时，有概率为所有哨卫结晶恢复一定生命值。
items.wands.wandofwarding.eleblast_desc=哨卫之杖的元素风暴会治疗范围内的所有哨卫结晶。
items.wands.wandofwarding$ward.desc_generic_ward=守卫会自动攻击视野内敌人\n\n用法杖充能可升级守卫\n\n守卫有使用次数限制
items.wands.wandofwarding$ward.desc_generic_sentry=哨兵威力同守卫但具生命值而非充能数，形态似法杖尖端宝石\n\n使用哨位法杖对其施法可升级治疗哨兵\n\n每次攻击消耗生命值，但可被哨卫法杖治疗
items.wands.wandofwarding$ward.name_1=小哨卫元素
items.wands.wandofwarding$ward.desc_1=这个最基本的哨卫元素会自动攻击进入视野的目标，造成_ %1$d~%2$d 点伤害。_\n\n使用哨卫法杖向该哨卫施法能使其升级。\n\n这个哨卫在仅发动 1 次攻击之后就会消散。\n\n你的哨卫法杖在使用_ %3$d 点能量_维持这个哨卫。
items.wands.wandofwarding$ward.name_2=哨卫元素
items.wands.wandofwarding$ward.desc_2=这个升级过的哨卫元素结构更精致，而且在攻击数次后才会消散。它每次发动攻击能造成 _%1$d~%2$d 点伤害。_\n\n使用哨卫法杖向该哨卫施法能使其升级。\n\n这个哨卫在发动 3 次攻击之后才会消散。\n\n你的哨卫法杖在使用_ %3$d 点能量_维持这个哨卫。
items.wands.wandofwarding$ward.name_3=大哨卫元素
items.wands.wandofwarding$ward.desc_3=这个满级的哨卫元素能发动更多次攻击。它每次发动攻击能造成_ %1$d~%2$d 点伤害。_\n\n使用哨卫法杖向该哨卫施法能使其进化。\n\n这个哨卫在发动 5 次攻击之后才会消散。\n\n你的哨卫法杖在使用_ %3$d 点能量_维持这个哨卫。
items.wands.wandofwarding$ward.name_4=小哨卫结晶
items.wands.wandofwarding$ward.desc_4=这个小小的哨卫结晶攻击力与大哨卫元素相同，但以生命值取缔了有限的发动次数。它的样子有点像哨卫法杖顶端的宝石。它每次发动攻击能造成_ %1$d~%2$d 点伤害。_\n\n使用哨卫法杖向该哨卫施法能使其升级并治疗它。\n\n这个哨卫每次发动攻击时会消耗一定的生命值，但你可以用哨卫法杖治疗它。\n\n你的哨卫法杖在使用_ %3$d 点能量_维持这个哨卫。
items.wands.wandofwarding$ward.name_5=哨卫结晶
items.wands.wandofwarding$ward.desc_5=这个升级过的哨卫结晶比小哨卫结晶体积更大，形体也更结实。它每次发动攻击能造成_ %1$d~%2$d 点伤害。_\n\n使用哨卫法杖向该哨卫施法能使其升级并治疗它。\n\n这个哨卫每次发动攻击时会消耗一定的生命值，但你可以用哨卫法杖治疗它。\n\n你的哨卫法杖在使用_ %3$d 点能量_维持这个哨卫。
items.wands.wandofwarding$ward.name_6=大哨卫结晶
items.wands.wandofwarding$ward.desc_6=这个满级的哨卫结晶比之前的坚固了不少。它每次发动攻击能造成_ %1$d~%2$d 点伤害。_\n\n使用哨卫法杖向该哨卫施法能治疗它。\n\n这个哨卫每次发动攻击时会消耗一定的生命值，但你可以用哨卫法杖治疗它。\n\n你的哨卫法杖在使用_ %3$d 点能量_维持这个哨卫。
items.wands.wandofwarding$ward.dismiss_title=要驱散这个哨卫吗？
items.wands.wandofwarding$ward.dismiss_body=不想让法杖继续维持这个哨卫元素的话，你可以选择驱散它以立即破坏移除之。\n\n要驱散这个哨卫元素吗？
items.wands.wandofwarding$ward.dismiss_confirm=是
items.wands.wandofwarding$ward.dismiss_cancel=否
items.weapon.curses.annoying.name=喧闹%s
items.weapon.curses.annoying.msg_1=嘿，头儿！我们要去打谁！
items.weapon.curses.annoying.msg_2=太爽了，击溃他们！
items.weapon.curses.annoying.msg_3=听着伙计！
items.weapon.curses.annoying.msg_4=现在是打BOSS的时间吗！？
items.weapon.curses.annoying.msg_5=我去，别这么用力！
items.weapon.curses.annoying.msg_6=死吧，虫子！
items.weapon.curses.annoying.msg_7=嗷呜呜呜呜呜呜呜呜！
items.weapon.curses.annoying.msg_8=我们能休息一下吗！？
items.weapon.curses.annoying.msg_9=嘭，哈哈！
items.weapon.curses.annoying.msg_10=打得好！
items.weapon.curses.annoying.msg_11=我不想成为一把武器，我想成为伐木工的斧头。
items.weapon.curses.annoying.msg_12=记住，过于自信是一个缓慢而阴险的杀手。
items.weapon.curses.annoying.msg_13=所有你的基地都属于我们！
items.weapon.curses.annoying.desc=喧闹诅咒的武器真的是想帮你，只不过它的吵闹无比的“帮助”总是会吸引大量敌人。
items.weapon.curses.annoying.elestrike_desc=带有喧闹诅咒的元素打击有20%的机会让每个范围内的敌人在6回合内陷入狂暴状态。
items.weapon.curses.chaotic.name=混沌%s
items.weapon.curses.chaotic.desc=混沌武器持续向外辐射着恶毒的能量，使其每次攻击都会造成不同的诅咒效果。尽管大部分诅咒都比较常见，但不完全都是……
items.weapon.curses.dazzling.name=炫目%s
items.weapon.curses.dazzling.desc=炫目武器会不时释放刺目的强光，致盲所有视野范围内的单位。
items.weapon.curses.dazzling.elestrike_desc=带有眩目诅咒的元素打击有50%的机会让每个范围内的敌人在6回合内陷入致盲状态。
items.weapon.curses.displacing.name=转移%s
items.weapon.curses.displacing.desc=转移诅咒的武器被灌注了混乱的传送魔法，会将敌人传送到当前层的随机位置。
items.weapon.curses.displacing.elestrike_desc=带有转移诅咒的元素打击有50%的机会传送每个范围内的敌人。
items.weapon.curses.explosive.name=易爆%s
items.weapon.curses.explosive.warm=暖和起来了......
items.weapon.curses.explosive.hot=好烫！
items.weapon.curses.explosive.desc=易爆诅咒的武器会缓缓积累能量并最终爆炸，同时对佩戴者与敌人造成伤害。
items.weapon.curses.explosive.desc_cool=你的武器目前触感冰凉，尚属正常。
items.weapon.curses.explosive.desc_warm=你的武器正在积累能量，变得温热了起来……
items.weapon.curses.explosive.desc_hot=_你的武器已灼热烫手！要爆炸了！_
items.weapon.curses.explosive.elestrike_desc=带有爆炸诅咒的元素打击有50%的机会在范围内的随机敌人身上引发爆炸。
items.weapon.curses.friendly.name=友善%s
items.weapon.curses.friendly.desc=友善诅咒的武器会偶尔触发让战斗无法进行的魔法，非常适合和平主义者。
items.weapon.curses.friendly.elestrike_desc=带有友善诅咒的元素打击有50%的机会让每个范围内的敌人在6回合内陷入魅惑状态。
items.weapon.curses.polarized.name=极化%s
items.weapon.curses.polarized.desc=极化武器受到诅咒魔力的影响，在攻击时只会出现1.5倍伤害或完全没有伤害的情况。
items.weapon.curses.polarized.elestrike_desc=带有极化诅咒的元素打击有50%的机会对范围内的每个敌人造成24-36点伤害。
items.weapon.curses.sacrificial.name=血祭%s
items.weapon.curses.sacrificial.desc=血祭诅咒会向使用者索求血液作为攻击的回报，你的状态越健康，诅咒索取的也就越多。
items.weapon.curses.sacrificial.elestrike_desc=带有血祭诅咒的元素打击会让英雄和范围内的每个敌人流血12点生命值。
items.weapon.curses.wayward.name=妄为%s
items.weapon.curses.wayward.desc=妄为诅咒的武器很难找到它的目标，除非你能够做出一些必中攻击行为，其攻击将很难命中敌人。
items.weapon.curses.wayward.elestrike_desc=带有妄为诅咒的元素打击有50%的机会让每个范围内的敌人在6回合内陷入咒术状态。
items.weapon.curses.wayward$waywardbuff.name=妄为乱行
items.weapon.curses.wayward$waywardbuff.desc=你的妄为武器上的魔法已被触发，现在它已变得极度不精准。这个魔法无法影响如伏击等必定命中的攻击行为，且成功使用妄为武器造成伤害会立刻驱散此效果。\n\n效果剩余回合：%s
items.quest.nerfenchants.infernal.name=烈焰%s
items.quest.nerfenchants.infernal.desc=这个附魔会使火焰从武器中喷薄而出，能够点燃敌人并对正在燃烧的敌人造成额外伤害。
items.quest.nerfenchants.galvanizing.name=电击%s
items.quest.nerfenchants.galvanizing.desc=该武器射出的子弹会产生电弧，小概率短暂的麻痹敌人并造成些许额外伤害。
items.quest.nerfenchants.rejuvenating.name=繁茂%s
items.quest.nerfenchants.rejuvenating.desc=这个附魔会在子弹射中敌人时，小概率催生一片繁茂草地，缠绕住当中的敌人，治疗其中的盟友，并给予持枪者相当的治疗。
items.quest.nerfenchants.timetwisting.name=时停%s
items.quest.nerfenchants.timetwisting.desc=该武器射出的子弹有时会让敌人卡在时间裂缝中，使它们跳过几个回合而无法行动。
items.quest.nerfenchants.cryogenic.name=寒霜%s
items.quest.nerfenchants.cryogenic.desc=这个附魔会使射出的子弹小概率冻结敌人。
items.quest.nerfenchants.venomous.name=剧毒%s
items.quest.nerfenchants.venomous.desc=该武器射出的子弹有机会散播高腐蚀性的酸雾，呆的时间越长伤害越高。
items.quest.nerfenchants.dreamful.name=梦眠%s
items.quest.nerfenchants.dreamful.desc=此附魔吹箭有时使敌人遗忘你并快乐入眠。也可能触发"作弊"使敌人瞬间败北（生命越低概率越高）=)
items.quest.nerfenchants.avalanche.name=岩崩%s
items.quest.nerfenchants.avalanche.desc=这个附魔有中等概率召唤落石砸向你的敌人。
items.quest.nerfenchants.necromancy.name=腐化%s
items.quest.nerfenchants.necromancy.desc=该武器射出的子弹小概率把敌人腐化成为你作战的怨灵。
items.quest.nerfenchants.forceful.name=高穿%s
items.quest.nerfenchants.forceful.desc=这个附魔允许枪的子弹穿墙而过，并且有概率击退敌人一小段距离。但由于子弹缥缈的特性，其伤害将有所降低。
items.quest.nerfenchants.shining.name=炫目%s
items.quest.nerfenchants.shining.desc=这把武器闪动着千万手电筒的残光，有概率闪瞎敌人的眼睛。
items.weapon.enchantments.blazing.name=烈焰%s
items.weapon.enchantments.blazing.desc=这个附魔会使火焰从武器中喷薄而出，能够点燃敌人并对正在燃烧的敌人造成额外伤害。
items.weapon.enchantments.blazing.elestrike_desc=带有烈焰附魔的元素打击会将火焰传播到范围内的每个格子，持续8回合。
items.weapon.enchantments.blocking.name=招架%s
items.weapon.enchantments.blocking.desc=这个附魔能够增强你在攻击后的防御能力。
items.weapon.enchantments.blocking.elestrike_desc=带有招架附魔的元素打击会让决斗家每个范围内的敌人额外获得6点护盾。
items.weapon.enchantments.blocking$blockbuff.name=招架
items.weapon.enchantments.blocking$blockbuff.desc=你的武器的格挡附魔在短时间内增强了你的防御能力！\n\n护盾：%d点\n\n剩余时间：%s回合。
items.weapon.enchantments.blooming.name=繁茂%s
items.weapon.enchantments.blooming.desc=繁茂武器具有催生植物的魔力，在攻击目标时能使目标或周围的植被发芽生长。
items.weapon.enchantments.blooming.elestrike_desc=带有繁茂附魔的元素打击会在范围内最多8个格子传播草地，并让范围内的所有敌人根须6回合。
items.weapon.enchantments.chilling.name=寒霜%s
items.weapon.enchantments.chilling.desc=受该附魔成功影响的敌人会被冻伤，导致移动和攻击速度降低。
items.weapon.enchantments.chilling.elestrike_desc=带有寒霜附魔的元素打击会将寒冷气息传播到范围内的每个格子，持续8回合。
items.weapon.enchantments.kinetic.name=恒动%s
items.weapon.enchantments.kinetic.desc=使用恒动附魔的武器击杀敌人时，武器会储存溢出的威力并在下一次成功攻击时释放。
items.weapon.enchantments.kinetic.elestrike_desc=带有恒动附魔的元素打击会将存储的伤害的40%应用于范围内的每个敌人，除了主要目标。
items.weapon.enchantments.kinetic$conserveddamage.name=伤害储存
items.weapon.enchantments.kinetic$conserveddamage.desc=你的武器储存了上个杀敌一击的过剩能量，用来加强你的下次攻击以造成额外伤害。这份能量会慢慢随时间减弱。\n\n储存伤害：%d。
items.weapon.enchantments.corrupting.name=腐化%s
items.weapon.enchantments.corrupting.desc=这种强大的附魔拥有将敌人扭曲为你的奴仆的能力。使用腐化附魔的武器击杀敌人时有概率将其腐化。
items.weapon.enchantments.corrupting.elestrike_desc=带有腐化附魔的元素打击有5-25%的机会（根据失去的生命值）腐化范围内的每个敌人，除了主要目标。
items.weapon.enchantments.elastic.name=弹性%s
items.weapon.enchantments.elastic.desc=弹性武器在攻击时有几率把敌人击退较短的距离。
items.weapon.enchantments.elastic.elestrike_desc=带有弹性附魔的元素打击会将范围内所有的敌人击退5格。
items.weapon.enchantments.explosive.name=爆炸%s
items.weapon.enchantments.explosive.desc=此灵弓专属附魔使灵箭在命中后爆炸。当老鼠王的一个皇家法师看到一个家伙把炸弹绑在一支箭上并试图射中它时，他不得不完善它。这有很大的破坏潜力，但在近距离使用是非常危险的。正如最初的创造者所说：“如果你有无限的箭，为什么不把它们炸掉呢？”
items.weapon.enchantments.explosive.desc_no_rk=灵弓专属附魔使灵箭概率爆炸。覆灭鼠王国法师见人箭绑炸弹尝试射击后，决心完善此技。威力巨大但近战危险。正如创始者言："箭矢无限，何不炸之？"
items.weapon.enchantments.grim.name=死神%s
items.weapon.enchantments.grim.desc=这个强大的附魔拥有瞬间斩杀敌人的力量。敌人越弱，附魔的触发几率越大。
items.weapon.enchantments.grim.elestrike_desc=带有死神附魔的元素打击有6-30%的机会（根据失去的生命值）击杀范围内的每个敌人，除了主要目标。
items.weapon.enchantments.lucky.name=幸运%s
items.weapon.enchantments.lucky.desc=被幸运附魔武器击杀的敌人有几率掉落额外的宝物。
items.weapon.enchantments.lucky.elestrike_desc=带有幸运附魔的元素打击有12.5%的几率在范围内每个敌人下生成战利品。这种效果每个敌人只能触发一次。
items.weapon.enchantments.projecting.name=索敌%s
items.weapon.enchantments.projecting.desc=这个附魔会使肉搏武器获得额外的攻击距离。远程武器的攻击则能够穿透邻近墙壁。
items.weapon.enchantments.projecting.elestrike_desc=带有索敌附魔的元素打击对范围内的每个敌人造成30%的伤害，除了主要目标。
items.weapon.enchantments.shocking.name=电击%s
items.weapon.enchantments.shocking.desc=电弧在这个武器上不断地闪烁震荡，能够对邻近所有敌人造成额外伤害。
items.weapon.enchantments.shocking.elestrike_desc=带有电击附魔的元素打击将电击传播到范围内的每个格子，持续8回合。
items.weapon.enchantments.unstable.name=紊乱%s
items.weapon.enchantments.unstable.desc=紊乱附魔的武器周身散布着混乱的能量，每一击的都会造成另一种附魔的效果。
items.weapon.enchantments.unstable.elestrike_desc=带有紊乱附魔的元素打击会将随机附魔效果应用于范围内的每个敌人，除了主要目标。
items.weapon.enchantments.vampiric.name=血饮%s
items.weapon.enchantments.vampiric.desc=这个强大的附魔能在攻击敌人时吸取其生命能量并恢复使用者的生命。当使用者生命较少时效果更强。
items.weapon.enchantments.vampiric.elestrike_desc=带有吸血附魔的元素打击会为决斗家治愈每个范围内的敌人2.5点生命值。
items.weapon.melee.aluminumsword.name=铝剑
items.weapon.melee.aluminumsword.stats_desc=这是一把非常快的武器。
items.weapon.melee.aluminumsword.desc=这把剑需要很大的力量才能拿起，但意外地感觉很轻。
items.weapon.melee.aluminumsword.ability_name=旋风斩投影
items.weapon.melee.aluminumsword.ability_desc=决斗家可用铝剑创造_旋风斩投影_，持续15回合在5x5范围内旋转斩敌。每次斩击造成_%1$d-%2$d伤害_并触发附魔，同时恢复1/4武器充能。消耗10充能
items.weapon.melee.aluminumsword.typical_ability_desc=决斗家可用铝剑创造_旋风斩投影_，持续15回合在5x5范围内旋转斩敌。通常造成_%1$d-%2$d伤害_并触发附魔，恢复1/4武器充能。消耗10充能
items.weapon.melee.aluminumsword.warrior_spec=免疫接下来的两次攻击伤害。
items.weapon.melee.aluminumsword$combo.name=连击
items.weapon.melee.aluminumsword$combo.action_name=连击
items.weapon.melee.aluminumsword$combo.combo=%d连击！
items.weapon.melee.aluminumsword$combo.desc=%s在连续打击对手的过程中渐入佳境，每次攻击命中都会提高一层连击数并增加造成的伤害，但长时间不进行攻击会将连击数归零。\n\n当前连击数：%d，\n连击将在%s回合后丢失。\n下一击的伤害倍率：%d%%。
items.weapon.melee.aluminumsword$floatingsword.name=铝剑投影
items.weapon.melee.aluminumsword$floatingsword.desc=%s的巨大透明投影。高速旋转斩击5x5范围内一切目标，攻击必中且每次命中恢复1/4武器充能\n\n投影剩余%d回合
items.weapon.melee.assassinsblade.name=暗杀之刃
items.weapon.melee.assassinsblade.stats_desc=这件武器在对付未察觉你的敌人时更为有效。
items.weapon.melee.assassinsblade.ability_name=潜行
items.weapon.melee.assassinsblade.typical_ability_desc=持刺客之刃时，决斗家可_潜行_。此能力瞬移3格内并通常获得_%d回合隐身_
items.weapon.melee.assassinsblade.ability_desc=决斗家在持有刺客之刃时可以进行 _潜行_。这项能力使决斗家可以立即闪现到距离3格以内的地方，并使她_隐形%d回合_。
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=技能时长
items.weapon.melee.assassinsblade.desc=黑曜石制的波浪形短刃，虽轻便但不易用，如果能击中要害足以致命。
items.weapon.melee.assassinsblade.warrior_spec=使敌人短暂地致盲并残废。
items.weapon.melee.elementaldirk.name=元素长匕
items.weapon.melee.elementaldirk.stats_desc=这件武器在对付未察觉你的敌人时更为有效。\n这件武器可以造成燃烧，冻伤，淤泥或中毒效果。
items.weapon.melee.elementaldirk.desc=一种由元素能量制成的小巧波浪形锐器。它散发着各种各样的能量。
items.weapon.melee.elementaldirk.ability_name=元素箭
items.weapon.melee.elementaldirk.ability_desc=持元素匕首时，决斗家可施放_元素箭_。对敌造成_%1$d-%2$d伤害_，箭有四种类型，分别有不同的箭色，且会施加不同的三种10回合减益
items.weapon.melee.elementaldirk.typical_ability_desc=持元素匕首时，决斗家可施放_元素箭_。通常造成_%1$d-%2$d伤害_，箭有四种类型，分别有不同的箭色，且会施加不同的三种10回合减益
items.weapon.melee.elementaldirk.warrior_spec=给敌人套上一大堆负面状态。
items.weapon.melee.battleaxe.name=战斧
items.weapon.melee.battleaxe.stats_desc=这是一把比较精准的武器。
items.weapon.melee.battleaxe.ability_name=重击
items.weapon.melee.battleaxe.typical_ability_desc=持战斧时，决斗家可发动_重击_。若突袭敌人通常造成_%1$d-%2$d伤害_并使目标恍惚5回合（降低50%%命中/闪避）。重击必中但非偷袭时只造成常规伤害
items.weapon.melee.battleaxe.ability_desc=决斗家可以用战斧进行一次 _重击_。这次专注攻击如果是偷袭则造成_%1$d-%2$d伤害_，并使目标恍惚5回合，减少50%的命中和闪避。虽然必中，但是如果不是偷袭，这项武技将只造成正常伤害。
items.weapon.melee.battleaxe.desc=这把有着硕大钢制头部的战斧能将庞大的力量倾注在每次挥舞之中。
items.weapon.melee.battleaxe.warrior_spec=将25%伤害转化为流血层数。
items.weapon.melee.crossbow.name=十字弩
items.weapon.melee.crossbow.stats_desc=这件武器在装备后会大幅提升飞镖的伤害。它甚至还能把自身的附魔赋予射出去的飞镖。
items.weapon.melee.crossbow.ability_name=充能射击
items.weapon.melee.crossbow.typical_ability_desc=决斗家可使用弩进行_充能射击_，使下次普攻必中并附加效果：近战击退敌人，未涂药飞镖通常造成_+%1$d伤害_，涂药飞镖效果扩散至7x7范围且通常增加_%2$d次使用_
items.weapon.melee.crossbow.ability_desc=决斗家可以使用弩准备一次 _充能射击_。使下一次常规攻击必定命中，并产生以下三个效果之一：近战攻击可以击退敌人，未涂药飞镖会造成_+%1$d 伤害_，涂药飞镖对7x7格区域内的敌人施加触发效果，并可以多使用 _%2$d 次 _。
items.weapon.melee.crossbow.desc=这是一件看起来相当精密复杂的装置，能够将飞镖一样的小型箭矢以极高的速度射出。这把十字弩弩掂在手里沉甸甸的，比想象中结实很多，虽然完全违背了设计初衷，不过也能够在肉搏战中起到作用。
items.weapon.melee.crossbow.upgrade_ability_stat_name=技能强化
items.weapon.melee.crossbow$chargedshot.name=充能射击
items.weapon.melee.crossbow$chargedshot.desc=决斗家正在将力量集中到她的弩上。她下一次攻击必定命中，并产生以下三个效果之一：近战攻击可以击退敌人，未涂药飞镖会造成额外伤害，涂药飞镖对7x7格区域内的敌人施加触发效果并可以使用更多次。正面的飞镖效果只会影响盟友，有害效果只会影响敌人。决斗家不能使用这项能力将正面的飞镖效果施加给自己。
items.weapon.melee.crossbow.warrior_spec=20回合内的下一个飞镖不会被消耗。
items.weapon.melee.crossbow$dartspent.name=免费飞镖
items.weapon.melee.crossbow$dartspent.desc=当这个效果激活时，你不会消耗下一个扔出的飞镖。\n\n效果剩余时间： %s.
items.weapon.melee.cudgel.name=短棍
items.weapon.melee.cudgel.stats_desc=这是一把比较精准的武器。
items.weapon.melee.cudgel.ability_name=重击
items.weapon.melee.cudgel.typical_ability_desc=持短棍时，决斗家可发动_重击_。若偷袭敌人通常造成_%1$d-%2$d伤害_并使目标恍惚5回合（降低50%%命中/闪避）。重击必中但非偷袭时只造成常规伤害
items.weapon.melee.cudgel.ability_desc=持短棍时，决斗家可发动_重击_。若偷袭敌人造成_%1$d-%2$d伤害_并使目标恍惚5回合（降低50%%命中/闪避）。重击必中但非偷袭时只造成常规伤害
items.weapon.melee.cudgel.desc=黄铜短棍，贵族防身用具而非冒险武器
items.weapon.melee.dagger.name=匕首
items.weapon.melee.dagger.stats_desc=这件武器在对付未察觉你的敌人时更为有效。
items.weapon.melee.dagger.ability_name=潜行
items.weapon.melee.dagger.typical_ability_desc=持匕首时，决斗家可_潜行_。此能力瞬移5格内并通常获得_%d回合隐身_。
items.weapon.melee.dagger.ability_desc=决斗家在持有匕首时可以进行 _潜行_。这项能力使决斗家可以立即闪现到距离5格以内的地方，并使她获得_%d回合隐身_。
items.weapon.melee.dagger.upgrade_ability_stat_name=技能时长
items.weapon.melee.dagger.desc=木柄被磨损的简易铁质匕首。
items.weapon.melee.dagger.warrior_spec=对付未察觉你的敌人时造成显著增加的伤害。
items.weapon.melee.dirk.name=长匕首
items.weapon.melee.dirk.stats_desc=这件武器在对付未察觉你的敌人时更为有效。
items.weapon.melee.dirk.ability_name=潜行
items.weapon.melee.dirk.typical_ability_desc=持短剑时，决斗家可_潜行_。此能力瞬移4格内并通常获得_%d回合隐身_。
items.weapon.melee.dirk.ability_desc=决斗家在持有匕首时可以进行 _潜行_。这项能力使决斗家可以立即闪现到距离4格以内的地方，并使她获得_%d回合隐身_。
items.weapon.melee.dirk.upgrade_ability_stat_name=技能时长
items.weapon.melee.dirk.desc=一个长一些的刺击型匕首，可以往敌人身体里捅得更深一点。
items.weapon.melee.dirk.warrior_spec=造成的伤害转化为流血层数。
items.weapon.melee.dreadslicer.name=惧斩刃
items.weapon.melee.dreadslicer.stats_desc=50%%概率施加恐惧且连击不减时长\n可无视距离攻击恐惧目标（伤害减半）
items.weapon.melee.dreadslicer.ability_name=凶暴斩
items.weapon.melee.dreadslicer.ability_desc=持惧斩刃时，决斗家可发动_凶暴斩_。造成_%1$d-%2$d伤害_，幸存敌人将惊恐逃窜永不再现。消耗2充能
items.weapon.melee.dreadslicer.typical_ability_desc=持惧斩刃时，决斗家可发动_凶暴斩_。造成_%1$d-%2$d伤害_，幸存敌人将惊恐逃窜永不再现。消耗2充能
items.weapon.melee.dreadslicer.desc=黑曜石精铸的巨大弯刃，绯红握柄令人顿生威压感与施虐欲
items.weapon.melee.dreadslicer.warrior_spec=造成双倍伤害，幸存敌人将惊恐逃窜永不再现
items.weapon.melee.exoknife.name=外刃
items.weapon.melee.exoknife.stats_desc=尽管它本身很弱，但具有12格射程并且有5x5范围伤害。
items.weapon.melee.exoknife.desc=一把炫金匕首，闪耀着淡淡的虹色光辉。
items.weapon.melee.exoknife.ability_name=麻痹封锁
items.weapon.melee.exoknife.ability_desc=持外刃时，决斗家可发动_麻痹封锁_。此解离攻击影响5x5范围，施加无法挣脱的麻痹效果并缓慢造成总计_%1$d-%2$d伤害_。消耗5充能
items.weapon.melee.exoknife.typical_ability_desc=持外刃时，决斗家可发动_麻痹封锁_。此瓦解攻击影响5x5范围，施加无法挣脱的麻痹效果并缓慢造成总计_%1$d-%2$d伤害_。消耗5充能
items.weapon.melee.exoknife.warrior_spec=释放恐怖的奥术风暴。
items.weapon.melee.flail.name=链枷
items.weapon.melee.flail.stats_desc=这件武器精确性不高。\n这件武器不能用来偷袭。
items.weapon.melee.flail.ability_name=甩动
items.weapon.melee.flail.spin_warn=你不能再甩动链枷了。
items.weapon.melee.flail.typical_ability_desc=持链枷时，决斗家可_甩动_蓄力。每回合甩动使下次普攻通常造成_+%d伤害_（上限3层）。甩动攻击必中。仅开始甩动消耗充能
items.weapon.melee.flail.ability_desc=决斗家可以 _甩动_ 链枷积累力量一段时间。每甩动一次链枷，它的伤害将增加_+%d_，最多可增加3次。甩动中的链枷也必定命中。仅开始甩动需要充能。
items.weapon.melee.flail.desc=铁链上附着的一个带刺的钢球。笨重难用，能命中的话威力极强。
items.weapon.melee.flail.warrior_spec=伤害显著增加，攻击间隔变为4回合。
items.weapon.melee.flail$spinabilitytracker.name=甩动中
items.weapon.melee.flail$spinabilitytracker.desc=决斗家正在甩动她的链枷，为下一次攻击积累伤害。每次甩动花费一个回合，但增加伤害，上限三次。甩动中的链枷也必定命中。\n\n当前额外伤害: %1$d%%。\n剩余回合: %2$s。
items.weapon.melee.gauntlet.name=魔岩拳套
items.weapon.melee.gauntlet.stats_desc=这是一套非常快的武器。
items.weapon.melee.gauntlet.ability_name=连击
items.weapon.melee.gauntlet.typical_ability_desc=持石拳套时，决斗家可发动_连击_。此攻击必中，且基于最近5回合普攻/投武命中次数通常附加_+%d伤害_
items.weapon.melee.gauntlet.ability_desc=决斗家可以用魔岩拳套进行 _连击_。这次攻击保证命中，并且每次决斗家在过去5回合内成功攻击近战或投掷武器时，伤害增加+35%。
items.weapon.melee.gauntlet.desc=这个巨大的拳套由一匹红布和层层覆盖在布上的魔法岩石交织而成。戴上后，布料紧紧裹住你的整个前臂，让厚重的岩板变得像一层坚硬的皮肤。要有足够的力量才能将如此沉重的武器自如挥舞，但正是这种力量和重量的结合让这件武器发挥出可怕的威力。
items.weapon.melee.gauntlet.warrior_spec=在目标身后制造伤害性的冲击波。
items.weapon.melee.glaive.name=关刀
items.weapon.melee.glaive.stats_desc=这是一件相当缓慢的武器。\n这把武器有额外的攻击距离。
items.weapon.melee.glaive.ability_name=刺
items.weapon.melee.glaive.typical_ability_desc=持长柄刀时，决斗家可用刀尖_刺_非相邻目标。通常造成_%1$d-%2$d伤害_，击退敌人且必中
items.weapon.melee.glaive.ability_desc=决斗家可以用长戟的尖端对范围内但不相邻的敌人进行 _刺_。这造成_%1$d-%2$d伤害，击退敌人，并必定命中。
items.weapon.melee.glaive.desc=一支在末端装有剑刃的重型长柄武器。
items.weapon.melee.glaive.warrior_spec=吸引周围的敌人一起攻击被此刀伤害的目标。
items.weapon.melee.gloves.name=镶钉手套
items.weapon.melee.gloves.stats_desc=这是一套非常快的武器。
items.weapon.melee.gloves.ability_name=连击
items.weapon.melee.gloves.typical_ability_desc=持钉手套时，决斗家可发动_连击_。此攻击必中，且基于最近5回合普攻/投武命中次数通常附加_+%d伤害_
items.weapon.melee.gloves.ability_desc=决斗家可以用镶钉手套进行 _连击_。这次攻击保证命中，并且每次决斗家在过去5回合内成功攻击近战或投掷武器时，伤害增加+45%。
items.weapon.melee.gloves.desc=这双镶钉手套没有多少防护作用，但能在勉强当作武器使用的同时腾出双手。
items.weapon.melee.gloves.warrior_spec=一次性打出许多拳，但攻击间隔变为2.25回合。
items.weapon.melee.greataxe.name=巨斧
items.weapon.melee.greataxe.stats_desc=这件武器非常沉重。
items.weapon.melee.greataxe.ability_name=报复
items.weapon.melee.greataxe.typical_ability_desc=生命低于50%%时，持巨斧的决斗家可发动_报复_。此毁灭攻击通常造成_%1$d-%2$d伤害_，必中，若击杀敌人则无时间消耗
items.weapon.melee.greataxe.ability_desc=如果决斗家生命值低于50%，她可以用巨斧进行一次 _报复_ 攻击。这次毁灭性的攻击必中，造成_%1$d-%2$d伤害_，且若击杀敌人则不消耗回合。
items.weapon.melee.greataxe.desc=这个巨型的战斧无坚不摧，重如泰山，举过肩才有空间挥舞。
items.weapon.melee.greataxe.warrior_spec=取决于英雄力量超出武器力量需求的点数，有概率打出暴击。
items.weapon.melee.greatshield.name=巨型方盾
items.weapon.melee.greatshield.typical_stats_desc=这件武器通常能格挡0~%d点伤害。通过升级可以使格挡量增长。
items.weapon.melee.greatshield.stats_desc=这件武器能格挡0~%d点伤害。通过升级可以使格挡量增长。
items.weapon.melee.greatshield.ability_name=护卫
items.weapon.melee.greatshield.typical_ability_desc=持巨盾时，决斗家可_格挡_，通常完全抵挡_%d回合_内所受物理/魔法攻击。成功格挡后反击或施法将结束格挡
items.weapon.melee.greatshield.ability_desc=决斗家可以用巨盾 _护卫_ 自己，完全抵消接下来6回合内对她发动的下一次物理或魔法攻击。
items.weapon.melee.greatshield.upgrade_ability_stat_name=技能时长
items.weapon.melee.greatshield.desc=与其说它是一面盾，不如说它是一堵能移动的墙。这一大块金属对于防御十分有效，但没有在攻击方面留下多少余地。
items.weapon.melee.greatshield.warrior_spec=提供与伤害值成正比的魔抗，攻击间隔变为3倍。
items.weapon.melee.greatsword.name=巨剑
items.weapon.melee.greatsword.ability_name=顺劈
items.weapon.melee.greatsword.typical_ability_desc=持巨剑时，决斗家可发动_顺劈_。通常造成_%1$d-%2$d伤害_且必中。若击杀敌人则无时间消耗，且5回合内可免费再次顺劈
items.weapon.melee.greatsword.ability_desc=决斗家可以用大剑 _顺劈_ 敌人。造成_%1$d-%2$d伤害_且必中。如果顺劈杀死了一个敌人，决斗家可以在接下来5回合内无消耗再次使用顺劈。
items.weapon.melee.greatsword.desc=这把大剑进行的每次沉重挥舞都能造成大量伤害。
items.weapon.melee.greatsword.warrior_spec=击杀敌人的一击会储存大量伤害。
items.weapon.melee.handaxe.name=手斧
items.weapon.melee.handaxe.stats_desc=这是一把比较精准的武器。
items.weapon.melee.handaxe.ability_name=重击
items.weapon.melee.handaxe.typical_ability_desc=持手斧时，决斗家可发动_重击_。若偷袭敌人通常造成_%1$d-%2$d伤害_并使目标恍惚5回合（降低50%%命中/闪避）。重击必中但非偷袭时只造成常规伤害
items.weapon.melee.handaxe.ability_desc=决斗家可以用手斧进行一次 _重击_。若偷袭敌人通常造成_%1$d-%2$d伤害_并使目标恍惚5回合（降低50%%命中/闪避）。重击必中但非偷袭时只造成常规伤害
items.weapon.melee.handaxe.desc=一把轻斧头，通常用来砍树。当然，它的宽刃对敌人来说同样有效。
items.weapon.melee.handaxe.warrior_spec=受伤越重，造成伤害越高。
items.weapon.melee.bloomingpick.name=繁茂巨镐
items.weapon.melee.bloomingpick.ac_mine=挖掘
items.weapon.melee.bloomingpick.no_vein=附近没有障碍。
items.weapon.melee.bloomingpick.no_boss=所有障碍物都受到更高存在的保护。
items.weapon.melee.bloomingpick.desc=这是由某种活性金属制成的又大又结实的工具。作为武器不是很高效，但可以治愈使用者。
items.weapon.melee.bloomingpick.stats_desc=这把武器可以用来摧毁英雄附近的墙和门，这个行动花费5回合。
items.weapon.melee.bloomingpick.ability_name=藤蔓缠绕
items.weapon.melee.bloomingpick.ability_desc=持繁茂巨镐时，决斗家可发动_藤蔓缠绕_。不造成伤害，但用藤蔓包裹敌人使其无法行动，成为耐久自然屏障。强力生物仅麻痹5回合。消耗3充能
items.weapon.melee.bloomingpick$vinecovered.name=藤蔓缠绕
items.weapon.melee.bloomingpick$vinecovered.desc=目标被绿色韧藤完全缠绕\n\n藤蔓缠绕时无法行动，成为可破坏屏障阻隔其他敌人
items.weapon.melee.bloomingpick.warrior_spec=向目标发射锥形大范围高草。
items.weapon.melee.katana.name=武士刀
items.weapon.melee.katana.stats_desc=这把武器可以挡住0-3点伤害。
items.weapon.melee.katana.ability_name=弓步刺
items.weapon.melee.katana.typical_ability_desc=持武士刀时，决斗家可对1格外敌人发动_突进_。冲向目标，通常造成_%1$d-%2$d伤害_且必中
items.weapon.melee.katana.ability_desc=决斗家可以用武士刀对距离1格的敌人进行 _弓步刺_。这会朝向敌人移动，造成额外+35%的伤害，并保证命中。
items.weapon.melee.katana.desc=一把修长的剑，刀柄上方有一个大金属护手。
items.weapon.melee.katana.warrior_spec=召唤暗影分身追加攻击
items.weapon.melee.moltenstrife.name=熔火之刃
items.weapon.melee.moltenstrife.stats_desc=这把武器有%s%%概率在敌人的位置制造爆炸。这个爆炸不会伤害使用者。
items.weapon.melee.moltenstrife.desc=一把精致的黑曜石刀刃，里面装满了爆炸性液体。摸起来感觉很暖和。
items.weapon.melee.moltenstrife.ability_name=熔岩喷发
items.weapon.melee.moltenstrife.ability_desc=持熔火之刃时，决斗家可发动_熔岩喷发_。剑刃灌注爆能，对17x17范围内除使用者外一切目标造成_%1$d-%2$d爆炸伤害_。消耗4充能
items.weapon.melee.moltenstrife.typical_ability_desc=持熔火之刃时，决斗家可发动_熔岩喷发_。剑刃灌注爆能，对17x17范围内除使用者外一切目标通常造成_%1$d-%2$d爆炸伤害_。消耗4充能
items.weapon.melee.moltenstrife.warrior_spec=在巨大的爆炸范围内造成巨大的伤害。
items.weapon.melee.luminouscutlass.name=荧光弯刀
items.weapon.melee.luminouscutlass.stats_desc=这把武器会制造连锁闪电，闪电会触发附魔。
items.weapon.melee.luminouscutlass.desc=一把由某种发光矿石制造的弯刀。它闪烁着星界的能量。
items.weapon.melee.luminouscutlass.ability_name=短路
items.weapon.melee.luminouscutlass.ability_desc=持荧光弯刀时，决斗家可发动_短路_。除闪电链攻击外，此电击将短暂麻痹敌人并生成电场
items.weapon.melee.luminouscutlass.warrior_spec=造成2倍的伤害，并在无限的距离内形成电弧。
items.weapon.melee.constructwand.name=水晶之杖
items.weapon.melee.constructwand.desc=这根水晶魔杖可以让你召唤无数的傀儡。
items.weapon.melee.constructwand.stats_desc=这根法杖可以召唤水晶骑士助你战斗。它们的最大生命值：%d.
items.weapon.melee.constructwand.ability_name=骑士召唤
items.weapon.melee.constructwand.ability_desc=持构造魔杖时，决斗家可发动_骑士召唤_。消耗5充能召唤最多8名强化水晶骑士扫荡地牢，自身进入10回合静滞
items.weapon.melee.constructwand.warrior_spec=召唤水晶骑士团。
items.weapon.melee.constructwand$guardianknight.name=水晶骑士
items.weapon.melee.constructwand$guardianknight.desc=这个淡蓝色的幽灵似乎是地牢中某个石像守卫被召唤出的复制品。\n\n虽然雕像本身几乎是无形的，耐久有限，但它手中挥舞的_%s_看起来像是真的。
items.weapon.melee.longsword.name=长剑
items.weapon.melee.longsword.ability_name=顺劈
items.weapon.melee.longsword.typical_ability_desc=持长剑时，决斗家可发动_顺劈_。通常造成_%1$d-%2$d伤害_且必中。若击杀敌人则无时间消耗，且5回合内可免费再次顺劈
items.weapon.melee.longsword.ability_desc=决斗家可以用长剑 _顺劈_ 敌人。通常造成_%1$d-%2$d伤害_且必中。若击杀敌人则无时间消耗，且5回合内可免费再次顺劈
items.weapon.melee.longsword.desc=这柄剑的厚长利刃闪烁着令人宽心的寒光，不过这长度也确实让它非常沉重。
items.weapon.melee.longsword.warrior_spec=在一次虚弱攻击后进行跳跃。
items.weapon.melee.mace.name=硬头锤
items.weapon.melee.mace.stats_desc=这是一个比较精准的武器。
items.weapon.melee.mace.ability_name=重击
items.weapon.melee.mace.typical_ability_desc=持钉头锤时，决斗家可发动_重击_。若偷袭敌人通常造成_%1$d-%2$d伤害_并使其恍惚5回合（降低50%%命中/闪避）。重击必中但非偷袭时只造成常规伤害
items.weapon.melee.mace.ability_desc=决斗家可以用硬头锤进行一次 _重击_。若偷袭敌人通常造成_%1$d-%2$d伤害_并使其恍惚5回合（降低50%%命中/闪避）。重击必中但非偷袭时只造成常规伤害
items.weapon.melee.mace.desc=这把武器前端的大型铁头能够造成可观的伤害。
items.weapon.melee.mace.warrior_spec=重击敌人，干扰迷惑他们。
items.weapon.melee.kromerstaff.name=克罗默魔杖
items.weapon.melee.kromerstaff.desc=一种注入了克罗默的异界能量的魔法武器，据说是法师们的终极装备。有点不稳定，可能会欺骗并伤害你。
items.weapon.melee.magesstaff.name=法师魔杖
items.weapon.melee.magesstaff.ac_imbue=灌注
items.weapon.melee.magesstaff.ac_zap=释放
items.weapon.melee.magesstaff.prompt=选择一根要吸收的法杖
items.weapon.melee.magesstaff.imbue=你将%s注入魔杖。
items.weapon.melee.magesstaff.preserved=你保留了之前灌注的法杖！
items.weapon.melee.magesstaff.conflict=相互冲突的魔法抹去了你魔杖上的附魔。
items.weapon.melee.magesstaff.id_first=你需要先鉴定这根法杖。
items.weapon.melee.magesstaff.cursed=你不能注入一根受诅咒的法杖。
items.weapon.melee.magesstaff.imbue_desc=你确定要将这根法杖注入你的魔杖？\n\n如果被吸收法杖的等级大于等于魔杖的等级，魔杖会在继承这根法杖的等级后再加上自身的一级。\n\n在这次灌注后，魔杖会变为%d级。
items.weapon.melee.magesstaff.imbue_lost=魔杖之前吸收的魔力都会消散。
items.weapon.melee.magesstaff.imbue_talent=之前灌注的法杖会回收为0级法杖。
items.weapon.melee.magesstaff.yes=是的，我确定
items.weapon.melee.magesstaff.no=不，我改主意了
items.weapon.melee.magesstaff.desc=这支老魔杖是件独一无二的魔法武器，由法师亲自雕琢而成，能注入其它法杖的魔力以获取新的力量。
items.weapon.melee.magesstaff.no_wand=这支法杖并没有任何魔力， 它必须先被_注入进另一支法杖的魔力_才能用于施放法术。
items.weapon.melee.magesstaff.has_wand=魔杖目前被灌注了_%s_的力量。
items.weapon.melee.magesstaff.cursed_wand=这根魔杖受到了诅咒，导致它的魔法混乱而随机。
items.weapon.melee.meleeweapon.ac_ability=能力
items.weapon.melee.meleeweapon.stats_known=这件_%1$d阶_近战武器可以造成_%2$d~%3$d点伤害_，并且需要_%4$d点力量_来正常使用。
items.weapon.melee.meleeweapon.stats_unknown=一般情况下这件_%1$d阶_近战武器可以造成_%2$d~%3$d点伤害_，并且需要_%4$d点力量_来正常使用。
items.weapon.melee.meleeweapon.cursed_kromer=你能感觉到武器中的混乱之力。
items.weapon.melee.meleeweapon.probably_too_heavy=这件武器对你来说或许太重了。
items.weapon.melee.meleeweapon.warrior=街霸的特殊攻击: 
items.weapon.melee.meleeweapon.grass_desc=这件武器被赋予了 _%d 草能量_。每次攻击消耗一个草能量，但造成增加的伤害。使用武技将消耗 %d 草能量，而不是使用武技充能。
items.weapon.melee.nuclearhatchet.name=贫铀手斧
items.weapon.melee.nuclearhatchet.desc=这把合金斧内部的放射性元素使它颤动。
items.weapon.melee.nuclearhatchet.stats_desc=装备后，该武器会在英雄周围产生毒气，并在近战攻击时产生更多毒气。
items.weapon.melee.nuclearhatchet.ability_name=辐射污染
items.weapon.melee.nuclearhatchet.ability_desc=持核能手斧时，决斗家可_辐射污染_敌人。此攻击必中并在目标周围释放放射性冲击，使范围内目标遭受持续易伤效果。消耗3充能
items.weapon.melee.nuclearhatchet$exposed.name=持续易伤
items.weapon.melee.nuclearhatchet$exposed.desc=皮骨突感剧痛敏感\n\n持续易伤状态下受粘液/持续伤害效果承受2.5倍伤害\n\n剩余回合：%s
items.weapon.melee.nuclearhatchet.warrior_spec=生成一团酸雾。
items.weapon.melee.meleeweapon.ability_need_equip=你必须装备该武器才能使用它的能力。
items.weapon.melee.meleeweapon.ability_low_str=你的力量不足以使用这件武器的能力。
items.weapon.melee.meleeweapon.ability_no_charge=你没有足够的能量来使用该能力。
items.weapon.melee.meleeweapon.ability_cant_use=你现在无法使用该能力。
items.weapon.melee.meleeweapon.ability_no_target=那里没有目标。
items.weapon.melee.meleeweapon.ability_target_range=目标超出范围
items.weapon.melee.meleeweapon.ability_occupied=该位置已被占据
items.weapon.melee.meleeweapon.upgrade_ability_stat_name=技能伤害
items.weapon.melee.meleeweapon.prompt=选择一个目标
items.weapon.melee.meleeweapon.swap=交换武器
items.weapon.melee.meleeweapon.swap_full=你的背包已满，无法进行交换。
items.weapon.melee.shortsword.name=短剑
items.weapon.melee.shortsword.ability_name=顺劈
items.weapon.melee.shortsword.typical_ability_desc=持短剑时，决斗家可发动_顺劈_。通常造成_%1$d-%2$d伤害_且必中。若击杀敌人则无时间消耗，且5回合内可免费再次顺劈
items.weapon.melee.shortsword.ability_desc=决斗家可以用短剑 _顺劈_ 敌人。通常造成_%1$d-%2$d伤害_且必中。若击杀敌人则无时间消耗，且5回合内可免费再次顺劈
items.weapon.melee.shortsword.desc=它确实相当短，只比一把匕首长出几厘米。
items.weapon.melee.shortsword.warrior_spec=这次攻击不花费回合。
items.weapon.melee.quarterstaff.name=铁头棍
items.weapon.melee.quarterstaff.stats_desc=这件武器可以格挡0~2点伤害。
items.weapon.melee.quarterstaff.ability_name=防御架势
items.weapon.melee.quarterstaff.typical_ability_desc=持长棍时，决斗家可进入_守势_。瞬间激活，提升3倍闪避,通常持续_%d回合_
items.weapon.melee.quarterstaff.ability_desc=决斗家可以用一根长棍采取 _防御架势_。这种姿态会让她在_%d回合_内闪避率翻三倍，且激活无需时间。
items.weapon.melee.quarterstaff.upgrade_ability_stat_name=技能时长
items.weapon.melee.quarterstaff.desc=这是两端以铁包覆的硬木棍。
items.weapon.melee.quarterstaff.warrior_spec=依据你的伤害和护甲生成一个护盾。
items.weapon.melee.quarterstaff$defensivestance.name=防御架势
items.weapon.melee.quarterstaff$defensivestance.desc=决斗家正在利用她的长棍来避开来袭的攻击和远程攻击。只要她保持这种姿态，她对所有攻击的闪避率都会翻三倍。\n\n剩余回合数：%s。
items.weapon.melee.rapier.name=刺剑
items.weapon.melee.rapier.stats_desc=这件武器可以挡住0-1点伤害。
items.weapon.melee.rapier.ability_name=弓步刺
items.weapon.melee.rapier.typical_ability_desc=持刺剑时，决斗家可对1格外敌人发动_弓步刺_。冲向目标，通常造成_%1$d-%2$d伤害_且必中
items.weapon.melee.rapier.ability_desc=决斗家可以用刺剑对距离1格的敌人进行 _弓步刺_。这会朝向敌人移动，造成_%1$d-%2$d伤害_，并必定命中。
items.weapon.melee.rapier.desc=一把修长的直剑，提供一定的防护，但牺牲了一些劈砍的力量。
items.weapon.melee.rapier.warrior_desc=精准刺击无时间消耗，50%概率不消耗临时力量
items.weapon.melee.thereaper.name=死神镰
items.weapon.melee.thereaper.desc=笨重战具灌注了受诅者的尖叫与灵魂，或许可借此统御怨灵？
items.weapon.melee.thereaper.stats_desc=低命中率武器\n每次成功命中生成数只腐化幽灵
items.weapon.melee.thereaper.ability_name=墓地召唤
items.weapon.melee.thereaper.ability_desc=持死神镰时，决斗家可创造_墓地_。5x5黑暗区域用腐化魔法侵蚀亡灵，伤害生者并将其转化为无战利品幽灵。消耗10充能
items.weapon.melee.thereaper.warrior_spec=不造成伤害，但施加强力灵魂印记；此动作无时间消耗
items.weapon.melee.roundshield.name=圆盾
items.weapon.melee.roundshield.typical_stats_desc=这件武器通常能格挡0~%d点伤害。格挡量会随着武器的升级而提升。
items.weapon.melee.roundshield.stats_desc=这件武器能格挡0~%d点伤害。通过升级可以使格挡量增长。
items.weapon.melee.roundshield.ability_name=护卫
items.weapon.melee.roundshield.typical_ability_desc=持圆盾时，决斗家可_格挡_，通常完全抵挡_%d回合_内所受物理/魔法攻击。成功格挡后反击或施法将结束格挡
items.weapon.melee.roundshield.ability_desc=决斗家可以用圆盾 _护卫_ 自己，完全抵挡_%d回合_内所受物理/魔法攻击。成功格挡后反击或施法将结束格挡
items.weapon.melee.roundshield.upgrade_ability_stat_name=技能时长
items.weapon.melee.roundshield.desc=这个大盾可以有效格挡攻击，在危机时刻也可以作为不错的武器使用。
items.weapon.melee.roundshield$guardtracker.name=守卫中
items.weapon.melee.roundshield$guardtracker.guarded=已守卫
items.weapon.melee.roundshield$guardtracker.desc=决斗家已经准备好盾牌，准备迎接即将到来的攻击。对她发动的物理或魔法攻击将完全被抵消。\n\n剩余回合数：%s。
items.weapon.melee.roundshield.warrior_spec=如果英雄向敌人移动，将其击退并提供临时的格挡。
items.weapon.melee.roundshield$block.name=临时格挡
items.weapon.melee.roundshield$block.desc=拥有格挡时，这个生物会吸收任何即将到来的伤害，但只有一次。\n\n剩余回合数：%s.
items.weapon.melee.royalbrand.name=尚方宝剑
items.weapon.melee.royalbrand.typical_stats_desc=通常这种武器可以阻挡0-%d点伤害，这种格挡随着升级而强化。\n这是一种相当精确的武器。\n这是一种相当快速的武器。\n这种武器具有夸张的射程。\n这种武器从升级中受益更多。\n这种武器非常重。\n这种武器对未察觉的敌人更为强力。\n这种武器装备后会增强投掷飞镖的伤害，甚至会给他们附魔。
items.weapon.melee.royalbrand.stats_desc=通常这种武器可以阻挡0-%d点伤害，这种格挡随着升级而强化。\n这是一种相当精确的武器。\n这是一种相当快速的武器。\n这种武器具有夸张的射程。\n这种武器从升级中受益更多。\n这种武器非常重。\n这种武器对未察觉的敌人更为强力。\n这种武器装备后会增强投掷飞镖的伤害，甚至会给他们附魔。
items.weapon.melee.royalbrand.desc=一件载入兵器史的杰作。它几乎全能。
items.weapon.melee.royalbrand.warrior_spec=恒动。血量越低伤害越高。可以暴击，几率取决于超出武器需求的力量值。突然袭击使敌人失明和残废。伤害转化为流血层数。在敌人的方向上产生破坏性冲击波。吸引附近的敌人攻击目标敌人。提供与伤害值成正比的奥术护甲。减少敌人的伤害减免。击退敌人并使其困惑。根据伤害提供防护。如果英雄接近敌人，造成1.5倍伤害，再次击退并麻痹敌人且进行临时格挡，造成持续的延迟伤害。使英雄在10回合内无消耗使用飞镖。
items.weapon.melee.royalbrand.ability_name=帝王敕令
items.weapon.melee.royalbrand.ability_desc=持尚方宝剑时，决斗家可发动_帝王敕令_。这一武技消耗所有充能，并且需要两倍正常攻击时间，但是威力随着消耗的充能数增加。当前使用效果为：\n -获得充能射击效果。\n -赋予_%%1$s 回合_剑舞和防御架势效果\n -增加_%2$s守卫中状态_，分别持续6回合\n如果没有对敌人使用，则可以闪现最多_%3$d_格。\n如果对敌人使用，则会攻击敌人，必定命中，并有以下效果：\n - _+%4$s%% 伤害_, 如果敌人正好在尚方宝剑攻击范围边缘；这也会把敌人略微推开。\n - _+%5$s%% 伤害_, 如果决斗家血量低于50%。\n - _+%6$s%% 伤害_, 如果偷袭敌人。\n - _+%7$s%% 伤害_, 如果敌人是非生物或者有坚硬表皮\n - _+%8$s%% 伤害_, 决斗家每在过去五回合内用投掷或者近战武器命中敌人一次则触发一次。\n - 敌人会恍惚_%9$s 回合_\n -这次攻击有+300%%附魔效力。\n在攻击结束之后，对范围内所有敌人造成_%10$s%% 伤害_的流血。
items.weapon.melee.runicblade.name=符文之刃
items.weapon.melee.runicblade.stats_desc=这把武器从升级中获得更多伤害。
items.weapon.melee.runicblade.ability_name=符文挥砍
items.weapon.melee.runicblade.typical_ability_desc=持符文剑时，决斗家可发动_符文挥砍_。此攻击必中，通常附加_+%d%%附魔强度_
items.weapon.melee.runicblade.ability_desc=决斗家可以用符文之刃进行一次 _符文挥砍_。这次攻击保证命中，并具有_+%d%%附魔强度_。
items.weapon.melee.runicblade.upgrade_ability_stat_name=技能强度
items.weapon.melee.runicblade.desc=来自失落之地的神秘武器，有着明亮的蓝色刀刃。
items.weapon.melee.runicblademkii.name=符文圣剑
items.weapon.melee.runicblademkii.stats_desc=这种武器能够射出造成魔法伤害的玄奥剑气，能对付魔法敌人。然而，剑气斩击必须在使用后重新充能。
items.weapon.melee.runicblademkii.cooldown=符文圣剑正在充能。在充能时，它的近战攻击造成额外伤害并加快充能速度。符文圣剑在%s回合后充能完毕。
items.weapon.melee.runicblademkii.ac_zap=剑气斩击
items.weapon.melee.runicblademkii.fizzles=你的剑刃嘶嘶作响，它还没有充能完毕。
items.weapon.melee.runicblademkii.no_magic=你的剑刃嘶嘶作响，你不能在魔法免疫时使用它。
items.weapon.melee.runicblademkii.prompt=选择施放目标地点
items.weapon.melee.runicblademkii.no_equip=你需要装备符文圣剑来施展这个剑技。
items.weapon.melee.runicblademkii.desc=来自失落之地的神秘武器，有着明亮的紫色刀刃。
items.weapon.melee.runicblademkii.ability_name=符文挥砍
items.weapon.melee.runicblademkii.ability_desc=持符文圣剑时，决斗家可发动_符文斩_。此攻击必中，完全恢复魔法能力并附加300%%附魔强度（此增益持续5回合）
items.weapon.melee.runicblademkii.warrior_spec=立即恢复充能。
items.weapon.melee.sai.name=双钗
items.weapon.melee.sai.stats_desc=这是一套非常快的武器。
items.weapon.melee.sai.ability_name=连击
items.weapon.melee.sai.typical_ability_desc=持双钗时，决斗家可发动_连击_。此攻击必中，且基于最近5回合普攻/投武命中次数通常附加_+%d伤害_
items.weapon.melee.sai.ability_desc=决斗家可以用双钗进行一次 _连击_。这次攻击必中，并且基于最近5回合普攻/投武命中次数通常附加_+%d伤害
items.weapon.melee.sai.desc=一对轻薄的铁刃，刚好一手一把。在快速斩击方面十分出色。
items.weapon.melee.sai.warrior_spec=在短时间内削减敌人的伤害抗性。
items.weapon.melee.sai$combostriketracker.name=连击
items.weapon.melee.sai$combostriketracker.desc=决斗家正在积累连击，用于增加连击打击能力的伤害。使用近战或投掷武器攻击的次数将计入其中。五回合内没有命中则重置。\n\n最近的命中次数：%d。
items.weapon.melee.scimitar.name=弯刀
items.weapon.melee.scimitar.stats_desc=这是一把比较快的武器。
items.weapon.melee.scimitar.ability_name=剑舞
items.weapon.melee.scimitar.typical_ability_desc=持弯刀时，决斗家可进入_剑舞_。瞬间激活，通常提升60%%攻速与50%%命中，持续_%d回合_
items.weapon.melee.scimitar.ability_desc=决斗家可以用弯刀进行一次 _剑舞_。瞬间激活，通常提升60%%攻速与50%%命中，持续_%d回合
items.weapon.melee.scimitar.upgrade_ability_stat_name=技能时长
items.weapon.melee.scimitar.desc=一把厚重的弯刀。它的形状能让它进行更快但不甚强力的攻击。
items.weapon.melee.scimitar.warrior_spec=同时攻击相邻的所有目标。
items.weapon.melee.scimitar$sworddance.name=剑舞
items.weapon.melee.scimitar$sworddance.desc=决斗家以一种快速的节奏进行打击，就像在跳舞一样。在这种姿态下，她的攻击速度提高60%（足以用弯刀每回合攻击两次），命中率提高506%。\n\n剩余回合数：%s。
items.weapon.melee.sickle.name=短柄镰
items.weapon.melee.sickle.stats_desc=这是一种相当不准确的武器。
items.weapon.melee.sickle.ability_name=收割
items.weapon.melee.sickle.typical_ability_desc=持镰刀时，决斗家可对敌人发动_收割_。此毁灭攻击必中，通常造成_%d伤害_（若目标不免疫则转化为流血）
items.weapon.melee.sickle.ability_desc=决斗家可以用镰刀对敌人进行 _收割_。这次毁灭性的攻击造成等于伤害110%的流血效果，并保证命中，但消耗2点充能。
items.weapon.melee.sickle.desc=一种手持的农具，可以作为一种强大但笨重的武器使用。
items.weapon.melee.sickle.warrior_desc=弱效攻击，从敌人体内提取草种包
items.weapon.melee.sharkstooth.name=鲨齿钩
items.weapon.melee.sharkstooth.stats_desc=低速武器\n对远处敌人造成额外伤害\n钩回远处敌人并施加残废/虚弱/易伤
items.weapon.melee.sharkstooth.ability_name=旋舞
items.weapon.melee.sharkstooth.ability_desc=持鲨齿钩时，决斗家可_旋舞_蓄力。每回合旋舞附加_+%d伤害_（无上限）。旋舞中攻击必中。启动旋舞消耗3充能
items.weapon.melee.sharkstooth.typical_ability_desc=持鲨齿钩时，决斗家可_旋舞_蓄力。每回合旋舞附加_+%d伤害_（无上限）。旋舞中攻击必中。启动旋舞消耗3充能
items.weapon.melee.sharkstooth.desc=尖端为掠食者利齿的诅咒金属钓钩，非常规设计使此武器能钩回任何目标至舒适距离
items.weapon.melee.sharkstooth.warrior_spec=根据伤害量为持有者附加饱食
items.weapon.melee.starsmasher.name=碎星锤
items.weapon.melee.starsmasher.charging=充能完毕！
items.weapon.melee.starsmasher.ability_name=星界闪光
items.weapon.melee.starsmasher.ability_desc=持碎星锤时，决斗家可施放_星界闪光_。创造7x7能量场致盲致残所有敌对生物；若锤充有星界能量，场内敌人额外承受_%d-%d伤害_。消耗2充能（若有星界能量则消耗）
items.weapon.melee.starsmasher.typical_ability_desc=持碎星锤时，决斗家可施放_星界闪光_。创造7x7能量场致盲致残所有敌对生物；若锤充有星界能量，场内敌人额外承受_%d-%d伤害_。消耗2充能（若有星界能量则消耗）
items.weapon.melee.starsmasher.stats_desc=这是一件非常精确的武器\n这件武器造成天文级粉碎伤害，但使攻防双方麻痹\n命中敌人可为武器灌注星界能量。充能状态下投掷将召唤魔法箭轰击3x3区域（85%%伤害，短暂致盲）
items.weapon.melee.starsmasher.desc=星界水晶与恒星合金铸就的庞然巨锤，其粉碎颅骨的重击可为其充能，充能完毕后可如流星般投出，以星界魔法歼敌
items.weapon.melee.starsmasher.warrior_spec=创造伤害星阵，大范围连锁电击敌人并附加麻痹致盲
items.weapon.melee.spear.name=长矛
items.weapon.melee.spear.stats_desc=这是一件相当缓慢的武器。\n这把武器有额外的攻击距离。
items.weapon.melee.spear.ability_name=刺退
items.weapon.melee.spear.typical_ability_desc=持矛时，决斗家可用矛尖_刺退_非相邻目标。通常造成_%1$d-%2$d伤害_，击退敌人且必中
items.weapon.melee.spear.ability_desc=决斗家可以用矛尖对距离内但不相邻的敌人进行 _刺退_。造成_%1$d-%2$d伤害_，击退敌人且必中
items.weapon.melee.spear.desc=这是一根装着锋锐铁刺的细长木杆。
items.weapon.melee.spear.warrior_spec=向任何敌人接近时获得伤害增益。
items.weapon.melee.sword.name=单手剑
items.weapon.melee.sword.ability_name=顺劈
items.weapon.melee.sword.typical_ability_desc=持剑时，决斗家可发动_顺劈_。通常造成_%1$d-%2$d伤害_且必中。若击杀敌人则无时间消耗，且5回合内可免费再次顺劈
items.weapon.melee.sword.ability_desc=决斗家可以用剑对敌人进行 _顺劈_。这造成_%1$d-%2$d伤害_且必中。若击杀敌人则无时间消耗，且5回合内可免费再次顺劈
items.weapon.melee.sword.desc=平衡性良好的剑。不算太大，但是依然比短剑长上不少。
items.weapon.melee.sword.warrior_spec=附魔触发两次。
items.weapon.melee.terminusblade.name=终结之刃
items.weapon.melee.terminusblade.desc=异界机械生物的神器，由资本主义的力量和混沌石的混乱能量重新创造出来的，这种武器杰作能够消灭任何类型的敌人，同时使其屈服于深红的火焰和能力驱散。每次使用都为该武器充能2%，如果充能已满，它将索取其使用者当前生命值的一半来_秒杀_它接触到的实体。
items.weapon.melee.terminusblade.stats_desc=这是一件非常缓慢的武器。
items.weapon.melee.terminusblade.ability_name=灾厄充能
items.weapon.melee.terminusblade.ability_desc=持终结之刃时，决斗家可发动_灾厄充能_以完全充能，同时承受巨量短暂扭曲。需消耗全部武器充能
items.weapon.melee.terminusblade.warrior_spec=为刀刃充能20%。
items.weapon.melee.sword$cleavetracker.name=顺劈
items.weapon.melee.sword$cleavetracker.desc=决斗家已经准备好跟进她之前的顺劈。下一次使用顺劈不会消耗任何武器能力点。\n\n剩余回合数：%s。
items.weapon.melee.warhammer.name=战锤
items.weapon.melee.warhammer.stats_desc=这是一把比较精准的武器。
items.weapon.melee.warhammer.ability_name=重击
items.weapon.melee.warhammer.typical_ability_desc=持战锤时，决斗家可发动_重击_。若突袭敌人通常造成_%1$d-%2$d伤害_并使目标恍惚5回合（降低50%%命中/闪避）。重击必中但非偷袭时只造成常规伤害
items.weapon.melee.warhammer.ability_desc=决斗家可以用战锤进行一次 _重击_。这次专注的攻击造成_%1$d-%2$d伤害_，并使目标恍惚5回合，减少50%的命中率和闪避率。重击必中但非偷袭时只造成常规伤害
items.weapon.melee.warhammer.desc=很少有生物能抵挡这铅铁巨块的辗压，但也只有最强壮的冒险者才能有效使用它。
items.weapon.melee.warhammer.warrior_spec=麻痹敌人并造成持续伤害。
items.weapon.melee.warscythe.name=战镰
items.weapon.melee.warscythe.stats_desc=这是一种相当不准确的武器。
items.weapon.melee.warscythe.ability_name=收割
items.weapon.melee.warscythe.typical_ability_desc=持战镰时，决斗家可对敌人发动_收割_。此毁灭攻击必中，通常造成_%d伤害_（若目标不免疫则转化为流血）
items.weapon.melee.warscythe.ability_desc=决斗家可以用战镰对敌人进行 _收割_。此毁灭攻击必中，造成_%d伤害_（若目标不免疫则转化为流血）
items.weapon.melee.warscythe.desc=这个又大又笨重的工具经过强化，使其更擅长斩杀敌人而非庄稼。
items.weapon.melee.warscythe.warrior_desc=强力但耗时的攻击，可能未命中
items.weapon.melee.whip.name=长鞭
items.weapon.melee.whip.stats_desc=这把武器拥有惊人的攻击距离。
items.weapon.melee.whip.ability_name=鞭笞
items.weapon.melee.whip.typical_ability_desc=持鞭时，决斗家可_鞭笞_周围所有敌人。此能力通常造成_%1$d-%2$d伤害_，攻击范围内全部敌人且必中
items.weapon.melee.whip.ability_desc=决斗家可以用鞭子对她周围的所有敌人进行 _狠抽_。此能力造成_%1$d-%2$d伤害_，攻击范围内全部敌人且必中。
items.weapon.melee.whip.desc=虽然这把武器另一端带倒刺的绳子伤害不高，但它的攻击范围是数一数二的。
items.weapon.melee.whip.warrior_spec=连续击打敌人多次。
items.weapon.melee.wornshortsword.name=破损的短剑
items.weapon.melee.wornshortsword.ability_name=顺劈
items.weapon.melee.wornshortsword.typical_ability_desc=持磨损短剑时，决斗家可发动_顺劈_。通常造成_%1$d-%2$d伤害_且必中。若击杀敌人则无时间消耗，且5回合内可免费再次顺劈
items.weapon.melee.wornshortsword.ability_desc=决斗家可以用破旧的短剑对敌人进行 _顺劈_。造成_%1$d-%2$d伤害_且必中。如果顺劈杀死了一个敌人，决斗家可以在接下来5回合内无消耗再次使用顺劈。
items.weapon.melee.wornshortsword.desc=一把十分短的剑，在大量使用后有一定的磨损。它比正常情况的短剑更轻，也更弱。
items.weapon.melee.trueterminusblade.name=真·终末之刃
items.weapon.melee.trueterminusblade.stats_desc=伤害随持有者力量成长\n造成"真实"伤害，无视减伤/护甲/无敌（多数持有者伤害增益同样无视）\n可发射秘法飞刃（需2回合）
items.weapon.melee.trueterminusblade.ac_zap=发射
items.weapon.melee.trueterminusblade.prompt=选择发射位置
items.weapon.melee.trueterminusblade.no_equip=需装备此刃方可施法
items.weapon.melee.trueterminusblade.desc=来自变形智能体国度的完全复刻真品。虽非一击毙命，但其挥砍能穿透敌人任何防护抗性，随力量成长且可远程攻击（效率略减）
items.weapon.melee.trueterminusblade.ability_desc=此武器无法被决斗家精通，故无技能
items.weapon.missiles.darts.adrenalinedart.name=激素飞镖
items.weapon.missiles.darts.adrenalinedart.desc=这些飞镖上涂着一种由速行蓟制成的药物，会加快目标的行动速度。目标的移动速度和攻击速度都会有所提升，不过移动速度的提升幅度更大些。这只飞镖仍能对敌人造成伤害，但不会伤及盟友 。
items.weapon.missiles.darts.blindingdart.name=致盲飞镖
items.weapon.missiles.darts.blindingdart.desc=这些飞镖上涂着一种由致盲草制成的药物，能让目标失明一小段时间。药效比新鲜的致盲草弱，不会让目标迷失方向，所以目标会记住你之前在的位置。
items.weapon.missiles.darts.chillingdart.name=寒霜飞镖
items.weapon.missiles.darts.chillingdart.desc=这些飞镖上涂着一种由冰冠花制成的药物，能显著地冻伤目标。
items.weapon.missiles.darts.dreamdart.name=梦眠飞镖
items.weapon.missiles.darts.dreamdart.desc=这些飞镖上涂着一种由梦夜花制成的药物，能让友军暂时免疫所有负面效果。飞镖本身会对敌人造成伤害，但不会伤及友军。\n\n噢，这飞镖也能让敌人入梦，陷入婴儿般舒适的睡眠;)。
items.weapon.missiles.darts.dart.name=飞镖
items.weapon.missiles.darts.dart.ac_tip=涂药
items.weapon.missiles.darts.dart.prompt=选择一颗种子
items.weapon.missiles.darts.dart.tip_title=为飞镖涂药
items.weapon.missiles.darts.dart.tip_desc=一个种子可以为 1~2 枚飞镖涂药。每类种子都能产生对应的，具有独特效果的一次性涂药飞镖。\n\n将这些种子涂抹在飞镖上能得到  _%s。_
items.weapon.missiles.darts.dart.tip_all=用 %2$d 颗种子为 %1$d 枚飞镖涂药
items.weapon.missiles.darts.dart.tip_two=用 1 颗种子为 2 枚飞镖涂药
items.weapon.missiles.darts.dart.tip_one=用 1 颗种子为 1 枚飞镖涂药
items.weapon.missiles.darts.dart.tip_cancel=取消
items.weapon.missiles.darts.dart.desc=由短木杆和金属尖头简易制成，手腕轻抖就会精准地飞向目标。使用种子可以为飞镖涂药，使其对目标造成额外效果。
items.weapon.missiles.darts.dart.unlimited_uses=然而，由于飞镖及其简易的构造，飞镖本身可以永久使用而不损坏。
items.weapon.missiles.darts.displacingdart.name=传送飞镖
items.weapon.missiles.darts.displacingdart.desc=这些飞镖上涂着一种由消逝草制成的药物，能把目标传送走一小段距离。
items.weapon.missiles.darts.healingdart.name=治疗飞镖
items.weapon.missiles.darts.healingdart.desc=这些飞镖上涂着一种由阳春草制成的药物，能强效治疗目标的伤势。这只飞镖仍能对敌人造成伤害，但不会伤及盟友 。
items.weapon.missiles.darts.holydart.name=神圣飞镖
items.weapon.missiles.darts.holydart.desc=这些飞镖上涂着一种由星陨花制成的药物，能以神圣之力影响目标。常规敌人和盟友会被祝福，但是亡灵和恶魔敌人会受到严重伤害。这只飞镖仍能对敌人造成伤害，但不会伤及盟友 。
items.weapon.missiles.darts.incendiarydart.name=燃烧飞镖
items.weapon.missiles.darts.incendiarydart.desc=这些飞镖上涂着一种由烈焰花制成的药物，命中后会燃起烈焰。
items.weapon.missiles.darts.paralyticdart.name=麻痹飞镖
items.weapon.missiles.darts.paralyticdart.desc=这些飞镖上涂着一种由地缚根制成的药物，能让目标无助地麻痹一小段时间。
items.weapon.missiles.darts.poisondart.name=毒液飞镖
items.weapon.missiles.darts.poisondart.desc=这些飞镖上涂着一种由断肠草制成的药物，能使目标中毒。
items.weapon.missiles.darts.rotdart.name=腐莓飞镖
items.weapon.missiles.darts.rotdart.desc=这些恐怖的飞镖上涂着一种由腐莓制成的酸性化合物，能够溶解飞镖命中的任何东西。强力的敌人能抵御大部分的效果，但大部分目标都会因腐蚀而死。这些飞镖比其他涂药飞镖更耐久，但是耐久度无法提高。
items.weapon.missiles.darts.shockingdart.name=电击飞镖
items.weapon.missiles.darts.shockingdart.desc=这些飞镖上涂着一种由风暴藤制成的药物，能让目标受到强烈的电击。
items.weapon.missiles.darts.tippeddart.ac_clean= 清洗
items.weapon.missiles.darts.tippeddart.clean_title=清洗飞镖
items.weapon.missiles.darts.tippeddart.clean_desc=这项操作会去除飞镖上的涂药，将其变回普通飞镖。
items.weapon.missiles.darts.tippeddart.clean_all=清洗全部
items.weapon.missiles.darts.tippeddart.clean_one=清洗一枚
items.weapon.missiles.darts.tippeddart.cancel=取消
items.weapon.missiles.darts.tippeddart.durability=涂药飞镖在使用一定次数后会失去药效变为普通飞镖。
items.weapon.missiles.darts.tippeddart.uses_left=这些涂药飞镖再使用_%d/%d_次就会有一个失去药效。
items.weapon.missiles.darts.tippeddart.unlimited_uses=_但是因为它们极高的品质，可以永久使用而不损坏。_
items.weapon.missiles.darts.tippeddart.about_to_break=你飞镖上的涂药快要失效了。
items.weapon.missiles.darts.tippeddart.has_broken=飞镖涂药已失效
items.weapon.missiles.bolas.name=流星锤
items.weapon.missiles.bolas.desc=这种奇怪的远程武器造成的伤害并不高，但是能用来绊倒目标使其减速，效果很好。
items.weapon.missiles.boomerang.name=回旋镖
items.weapon.missiles.boomerang.desc=被投向敌人后，这具扁平的曲状木制投掷物能够自动回到投掷者手中。
items.weapon.missiles.boomerang.durability=这个回旋镖造得非常结实，使用后不会产生损耗。
items.weapon.missiles.fishingspear.name=捕鱼矛
items.weapon.missiles.fishingspear.desc=小巧的投掷用短矛，本来是用来捕鱼的，不过也能当个武器用。
items.weapon.missiles.forcecube.name=震爆方石
items.weapon.missiles.forcecube.ondeath=你被自己的震爆方石震成了碎片...
items.weapon.missiles.forcecube.desc=这种奇形怪状的武器小到可以握在掌心，但极其沉重。命中目的地后，这种武器会把冲击力发散到一个小范围内，对波及区域内的所有单位造成伤害。
items.weapon.missiles.heavyboomerang.name=重型回旋镖
items.weapon.missiles.heavyboomerang.desc=这把大块头回旋镖笨重难用，但能造成可观的伤害。扔出后，它会在几回合内飞回到扔出的地点。
items.weapon.missiles.homingboomerang.name=导航回旋镖
items.weapon.missiles.homingboomerang.desc=这个特殊的回旋镖会自动寻找轨迹以一次性击中尽可能多的敌人，并飞回到你手上。
items.weapon.missiles.phantomspear.name=幽灵矛
items.weapon.missiles.phantomspear.desc=这种独特的投掷武器在向敌人投掷时不会被消耗，并且会向路径上的其他敌人发射额外的幽灵矛。
items.weapon.missiles.javelin.name=标枪
items.weapon.missiles.javelin.desc=这些大号投掷用长枪上的配重保证它们会以尖端为首飞向目标。
items.weapon.missiles.kunai.name=苦无
items.weapon.missiles.kunai.desc=技巧高深者能用这种小刀造成可观的伤害。这种武器在对付未察觉你的敌人时更为有效。
items.weapon.missiles.redkunai.name=赤火苦无
items.weapon.missiles.redkunai.desc=这些东西充满了硫磺的香气。它们对未察觉的敌人更有效，并会用赤火照亮该区域。
items.weapon.missiles.missileweapon.stats=这件_%1$d阶_投掷武器能造成_%2$d~%3$d点伤害_并需要_%4$d点力量_来正常使用。
items.weapon.missiles.missileweapon.distance=这种武器被专门设计用于远程攻击，在远程攻击目标时获得额外的命中加成，当然近战范围使用它时精准会大幅降低。
items.weapon.missiles.missileweapon.durability=投掷武器在使用过程中会磨损并最终损坏。
items.weapon.missiles.missileweapon.uses_left=这一组武器再用_%d/%d_次就会有一件被损耗掉。
items.weapon.missiles.missileweapon.unlimited_uses=_但是因为它们极高的品质，可以永久使用而不损坏。_
items.weapon.missiles.missileweapon.about_to_break=你的投掷武器快要损坏了。
items.weapon.missiles.missileweapon.has_broken=投掷武器已损坏
items.weapon.missiles.missileweapon$placeholder.name=投掷物
items.weapon.missiles.shuriken.name=手里剑
items.weapon.missiles.shuriken.desc=锋利的星形金属刃片，非常轻便。在移动后即可瞬间投出。
items.weapon.missiles.steelaxe.name=钢斧
items.weapon.missiles.steelaxe.desc=这种武器结合了所有投掷武器的优点。
items.weapon.missiles.steelaxe.durability=这种武器非常耐用。\n这种武器对未察觉的敌人更强大。\n这种武器会造成流血和残废。\n几回合后，这种武器会飞回投掷它的位置。\n这种武器会将其冲击力分散到一个小区域，破坏爆炸范围中的所有东西。\n此武器专为捕鱼而设计。\n此武器在移动后可立即投掷。\n此武器受益于弩。\n此武器无法升级。\n此武器非常重。\n\n使用时会消耗和损坏。
items.weapon.missiles.throwingclub.name=飞槌
items.weapon.missiles.throwingclub.desc=简单粗暴的投掷武器，说白了就是一块绑着根木棍的大石头。伤害稍低，但结实的石槌头让它们非常耐用，而且不会留在敌人身上。
items.weapon.missiles.throwinghammer.name=投掷锤
items.weapon.missiles.throwinghammer.desc=这些沉甸甸的锤子是用来扔向敌人的。伤害稍低，但平滑的纯金属的制作工艺让它们非常结实，而且不会留在敌人身上。
items.weapon.missiles.throwingknife.name=飞刀
items.weapon.missiles.throwingknife.desc=这些轻便的小刀不同于普通的匕首，平衡的配重使其能在飞行后准确地刺穿目标。这种武器对未察觉你的敌人更加有效。
items.weapon.missiles.throwingspear.name=投矛
items.weapon.missiles.throwingspear.desc=这些轻便短矛的木杆非常纤细，很明显是一种投掷型武器，不适合用来近战。
items.weapon.missiles.throwingspike.name=飞刺
items.weapon.missiles.throwingspike.desc=这些金属箭用来投向遥远的敌人。虽然它们并不是很强大，但它们简单的全金属结构使它们相当耐用。
items.weapon.missiles.throwingstone.name=石子
items.weapon.missiles.throwingstone.desc=这些石头被人用砂纸打磨成趁手的形状，比普通石子更适合大力投向目标。尽管工艺精湛，作为武器还是不太可靠。
items.weapon.missiles.tomahawk.name=飞斧
items.weapon.missiles.tomahawk.desc=这种有锯齿形斧刃的投掷斧用起来有点困难，但是正中目标造成的伤口会让敌人流血。
items.weapon.missiles.trident.name=三叉戟
items.weapon.missiles.trident.desc=一把尖端有着三根致命尖叉的特大号投掷用长枪。威力极大，但也很重。
items.weapon.missiles.starpieces.name=星之碎片
items.weapon.missiles.starpieces.durability=这件武器会随持有者力量成长\n这件武器造成"真实"伤害，无视减伤/护甲/无敌（多数持有者伤害增益同样无视）\n发射5枚飞刃（随强化增加）攻击全部可见敌人（可多刃命中单目标）\n这件武器的耐久不可提升
items.weapon.missiles.starpieces.desc=来自变形智能体国度的星刃完全复刻品改制手里剑。虽威力不及原版，但投掷特性卓越：使用时召唤飞刃风暴，穿墙锁定可见目标造成本源伤害
items.weapon.slingshot.name=克罗默弹弓
items.weapon.slingshot.ac_shoot=射击
items.weapon.slingshot.stats=这把弹弓不能直接升级，但是会随着你力量提升而逐渐增强。以你现在的状态，这把弹弓的射击会造成_%1d点伤害_并且需要_%2d力量_来正常使用。
items.weapon.slingshot.desc=一把由精心锻造的克罗默制成的弹弓。拉开弓弦时，你可以向敌人发射能穿透敌人部分防御的小石子。
items.weapon.slingshot.no_charge=你没有石子以供射击。
items.weapon.slingshot$stone.name=投掷石
items.weapon.slingshot$stone.desc=这块小石头看起来毫无亮点，但是它经过了细心打磨，具有一定的穿透防御的能力。
items.weapon.slingshot$stone.already_full=你不能装更多的投掷石。
items.weapon.slingshot$stone.cant_pickup=你在没有弹弓时无法捡起投掷石。
items.weapon.spiritbow.name=灵能短弓
items.weapon.spiritbow.ac_shoot=射击
items.weapon.spiritbow.prompt=选择一个目标
items.weapon.spiritbow.stats=这把弓不能直接升级，但是会随着你等级提升而逐渐增强。以你目前的等级，这把弓射出的每只箭可以造成_%1$d-%2$d点伤害_并且需要_%3$d点力量_来正常使用。
items.weapon.spiritbow.desc=一把由远古灵木制成的弓，弓弦和弓身的刻纹散发着苍蓝色的幽光。拉开弓弦时，一发魔法箭矢会生成在弓身一侧向目标飞去。
items.weapon.kromerbow.name=克罗默短弓
items.weapon.kromerbow.ac_shoot=射击
items.weapon.kromerbow.prompt=选择一个目标
items.weapon.kromerbow.desc=注入克罗默混乱之力的灵弓。它的箭感觉更强，但可以随机地使弓箭手受益或受伤。
items.weapon.weapon.identify=你对手中的武器已经足够熟悉并将其完全鉴定。
items.weapon.weapon.too_heavy=因为你的力量不足，该武器会降低你的攻速和精准，并让你无法偷袭。
items.weapon.weapon.excess_str=你的额外力量让你在使用这件武器时最多能够造成_%d点额外伤害_。
items.weapon.weapon.hardening_gone=这把武器上的硬化层已经磨损！
items.weapon.weapon.incompatible=不同属性的魔法相冲突，消除了武器上的附魔！
items.weapon.weapon.cursed_worn=由于这件武器被诅咒，你无法将其放下。
items.weapon.weapon.cursed=你能感觉到这件武器里潜伏着一股充满恶意的魔力。
items.weapon.weapon.weak_cursed=尽管受到诅咒，你仍然可以卸下这把武器。
items.weapon.weapon.not_cursed=这件武器没有被诅咒。
items.weapon.weapon.faster=这件武器强化了_攻速_。
items.weapon.weapon.stronger=这件武器强化了_伤害_。
items.weapon.weapon.enchanted=这件武器拥有_%s._
items.weapon.weapon.enchant_hardened=它已经被 _硬化_。
items.weapon.weapon.hardened_no_enchant=这把武器已经被 _硬化_，但目前没有被附魔。
items.weapon.weapon$enchantment.enchant=附魔
items.weapon.weapon$enchantment.rankings_desc=死于附魔效果
items.amulet.name=Yendor护身符
items.amulet.ac_end=结束游戏
items.amulet.desc=Yendor护身符是人类与矮人所知的最强大的神器。其上镶嵌的闪闪发光的水晶蕴含着不可思议的神奇力量。
items.amulet.desc_origins=护身符的起源与种种过去无人知晓。据历史记载，矮人国王曾夸口说他在矮人文明与外界切断一切联系之前不久就发现了这件神器。那么，他是如何找到的？古神又是怎样从他那里夺走了护身符？也许这些问题不需要现在解答，真正重要的是：护身符正属于你！
items.amulet.desc_ascent=护身符的起源与种种过去无人知晓，但显然它已在古神的力量下受到了极大的侵蚀。你在地牢中踏经的每一寸土地似乎都已在古神意志的掌控之下，面前的敌人也变得众多强势、更甚以往！你也无力使用或抛下护身符了——此时它与被诅咒已几无差别。
items.amulet.ascent_title=踏返登临
items.amulet.ascent_desc=你开始感受到古神强大可怖的力量自护身符中泛溢而出。凭凡人的区区肉身自这地牢之底向上登攀至地面将远比你想象中的更难！\n\n如果你继续在持有护身符的情况下向上返回，地牢将会变得更加险恶重重。层与层之间的传送将会被抑制，而一路杀敌返回地面则将成为你赢得这局游戏的唯一方式！\n\n如果你无意接受这样的挑战，你可以把护身符留在这里只身返回，也可以选择直接使用护身符以正常结束游戏。
items.amulet.ascent_yes=还没有结束！
items.amulet.ascent_no=大可于此止步
items.ankh.name=重生十字架
items.ankh.ac_bless=祝福
items.ankh.bless=你用散发着治愈魔力的清水祝福了这枚重生十字架。
items.ankh.desc=这枚象征不朽的古老饰品能使人起死回生。不过大部分物品将会被遗落在死亡的地点，等待你去拾回。装满的水袋可用于对重生十字架进行赐福，赋予它更强的力量。
items.ankh.desc_blessed=这枚象征不朽的古老饰品能够让人起死回生。这枚十字架已被祝福而变得更加强大。它会在危急关头牺牲自己来救你一命。
items.arcaneresin.name=奥术聚酯
items.arcaneresin.prompt=选择一根法杖
items.arcaneresin.ac_apply=改造
items.arcaneresin.not_enough=你的聚酯不够了！
items.arcaneresin.apply=你将聚酯包被于法杖的表面。法杖的能量愈发凝练了！
items.arcaneresin.desc=这是一种呼吸般发出白色与紫色微光的细腻粉末。可用于增幅法杖的魔力，提升法杖的等级！\n\n基于法杖的等级，升级一只法杖根据法杖等级需要消耗（1+等级）个聚酯。\n\n源于聚酯的升级会被升级卷轴及类似的道具覆盖，并且这种升级不会经由老魔杖的灌注而转移过去。
items.brokenseal.name=破损纹章
items.brokenseal.ac_affix=贴附
items.brokenseal.prompt=选择一件护甲。
items.brokenseal.unknown_armor=你需要先鉴定那件护甲。
items.brokenseal.cursed_armor=该印章不适用于受诅咒的护甲。
items.brokenseal.affix=你将纹章佩挂在了护甲上！
items.brokenseal.desc=一枚蜡制纹章，被贴在护甲上作为勇气的象征。纹章上的印记已被岁月磨损殆尽，还从中裂成两瓣。\n\n这是一件来自家乡的纪念物，在纹章的支持下%2$s会变得不屈不挠。佩戴纹章时%2$s能缓慢获得基于护甲品质的额外生命护盾。\n\n纹章可以被_贴附在护甲上_并能在护甲间转移。它能够携带一次升级。
items.brokenseal.inscribed=纹章刻有_%s_
items.brokenseal.choose_title=选择一个刻印
items.brokenseal.choose_desc=这件护甲与破损纹章都携带着一个刻印。请选择一个想保留的刻印。
items.brokenseal.lose_warning=注意：如果选择保留护甲的刻印，纹章将无法转移此刻印。
items.dewdrop.name=露珠
items.dewdrop.already_full=你的生命值已满。
items.dewdrop.desc=一颗晶莹剔透的露珠。\n\n受这片区域的魔力影响，净水有着少量的治疗效果。
items.equipableitem.curse_detected=装备前感知到诅咒！
items.equipableitem.unequip_cursed=你无法移除一件受诅咒的物品！
items.equipableitem.ac_equip=装备
items.equipableitem.ac_unequip=取下
items.energycrystal.name=能量水晶
items.energycrystal.desc=一些小巧玲珑的能量水晶，充盈着炼金能量。\n\n这些水晶是炼金配方中最常见的原料，可借助炼金釜从消耗品中提炼获得。
items.gold.name=金币
items.gold.desc=一堆金币。收集金币以在随后的商店中消费。
items.heap.for_sale=%2$s：%1$d金币
items.heap.chest=宝箱
items.heap.chest_desc=打开前你是看不见里面有什么的！
items.heap.locked_chest=上锁的宝箱
items.heap.locked_chest_desc=打开前你是看不见里面有什么的！你需要一枚金钥匙才能打开它。
items.heap.crystal_chest=水晶宝箱
items.heap.crystal_chest_desc=你看得见里面的%s，但你需要一枚水晶钥匙才能打开它。
items.heap.artifact=一件神器
items.heap.wand=一根法杖
items.heap.ring=一枚戒指
items.heap.nerf=一把NERF枪
items.heap.tomb=坟墓
items.heap.tomb_desc=这个坟墓里或许埋葬着一些有用的东西，但墓主肯定是不会让你拿走的。
items.heap.skeleton=遗骸
items.heap.skeleton_desc=某个不幸的冒险者存在过的唯一证明。或许可以找找里面有什么值钱的东西。
items.heap.remains=英雄遗骸
items.heap.remains_desc=你的某个先辈存在过的唯一证明。或许能找到点什么值钱的东西。
items.honeypot.name=蜂蜜罐
items.honeypot.ac_shatter=击碎
items.honeypot.desc=这个巨型蜜罐只是薄薄地涂了一圈蜂蜜，作为替代里头住着一只巨型蜜蜂！这种大型蜜蜂一般只待在蜂巢里，也许罐子本身就是某种特殊陷阱屋？蜜蜂看起来对罐子很满意，当你看向它时它非常警惕地对你回以嗡鸣。
items.honeypot$shatteredpot.name=破碎的蜂蜜罐
items.honeypot$shatteredpot.desc=这个罐子已经被打碎，仅靠罐沿的粘稠蜂蜜勉强维持形状，而且正在缓缓解体。\n\n尽管蜜罐碎了，看来蜜蜂依然想捍卫它的住所。
items.item.prompt=选择丢出的方位
items.item.ac_drop=放下
items.item.ac_throw=扔出
items.item.rankings_desc=死于：%s
items.item.curse=诅咒
items.item.custom_note=物品附有注释："_%s_"
items.kindofmisc.unequip_title=卸下一件装备
items.kindofmisc.unequip_message=你必须先取下一件装备。请选择要替换的物品。
items.kindofweapon.swift_equip=你迅速装备上武器。
items.kindofweapon.equip_cursed=你的手不受控制地握紧了这件武器。
items.kindofweapon.which_equip_msg=您想把这件物品装备到哪个武器槽？\n\n勇士直接用主要武器攻击，但可以使用任一武器的能力。两种武器共用同一个能量槽。\n\n勇士还可以立即交换她的主手和副手武器。
items.kindofweapon.which_equip_primary=主手（%s）
items.kindofweapon.which_equip_secondary=副手（%s）
items.kindofweapon.which_equip_tertiary=第三（%s）
items.kindofweapon.empty=空
items.kingscrown.name=矮人国王的皇冠
items.kingscrown.ac_wear=加 冕
items.kingscrown.naked=非常遗憾，皇冠的魔力无法强化你的内衣。
items.kingscrown.upgraded=皇冠熔为曜日般的金光，而你的护甲在照耀下开始逐渐变形！
items.kingscrown.ratgraded=鼠王挥爪便召出了万丈光芒，而你的护甲在照耀下开始逐渐变形！
items.kingscrown.desc=末代矮人国王的皇冠，至强的魔法能量以光芒的形式从中辐射而出。\n\n如果你有决心将其戴上，皇冠的魔力会涌入你正在装备的护甲，将其改造为_拥有特殊技能的独特英雄护甲。_新的护甲会保留原护甲的所有属性与刻印。
items.liquidmetal.name=液金
items.liquidmetal.ac_apply=改造
items.liquidmetal.prompt=选择一个投掷物
items.liquidmetal.already_fixed=这件投掷物不能再完好了！
items.liquidmetal.apply=你为了修复该投掷物消耗了%d份液金。
items.liquidmetal.desc=当倾泻到一件投掷物的上方，这如同带有魔力般神奇的液体会渗入其磨损之处，覆盖每一处刮擦，填平每一处沟壑，使之焕然一新！\n\n完全修复一个投掷物需要消耗10个液金，修复一组5个的投掷物则消耗30个液金。被修复的投掷物每有一层升级都会消耗多一倍的液金。\n\n液金无法用于修复涂药飞镖上药液的耐久。
items.lostbackpack.name=遗物
items.lostbackpack.desc=你的遗物，包含你遗留在此的所有物品。快快重新拥有它们吧！\n\n“我又回来了！再来战啊！”
items.merchantsbeacon.name=商人信标
items.merchantsbeacon.ac_use=使用
items.merchantsbeacon.desc=这件矮人科技的奇特产物能够让你和遥远的地方通讯。\n\n激活时，这枚信标可以让你从地牢的任意角落向像素商店出售物品。\n\n不过信标内的魔法只够支撑一次会话，请酌情使用。
items.stylus.name=奥术刻笔
items.stylus.ac_inscribe=蚀刻
items.stylus.prompt=选择一件护甲
items.stylus.identify=你需要先鉴定那件护甲。
items.stylus.cursed=奥术刻笔的力量无法作用在被诅咒的护甲上。
items.stylus.inscribed=你用刻笔雕刻了盔甲。
items.stylus.desc=这支奥术蚀笔由一种暗黑色的坚硬石料制成。你能用它在护甲上刻下魔法刻印，不过你无法自主选择，刻笔会替你做出决定。
items.tengusmask.name=天狗的面具
items.tengusmask.ac_wear=佩 戴
items.tengusmask.used=面具瓦解了，奇妙的能量涌入你的身体。
items.tengusmask.desc=天狗死时，这幅面具像褪皮般从他的脸上失落地滑下。你能感受它在波动着一股神妙的魔力，仿佛在极力劝你成为它的新主人。难道天狗戴上它时也是被其力量吸引？\n\n如果你有勇气将其戴上，面具的庞大力量会转嫁到你体内，供你为英雄_选择一种职业专精。_\n\n你会选择哪条道路？
items.tengusmask.message=随着面具贴附到你的脸上，眼前的景象极速消逝，新的技巧和能力涌入你的脑海。您想要如何引导面具的魔力？
items.tengusmask.used_rk=面具在被你难以置信的意志支配时会颤抖，你完全吸收了面具的力量，然后面具瓦解了！
items.kromermask.name=克罗默面具
items.kromermask.ac_connect=佩戴
items.kromermask.desc=克罗默的混乱倾向和面具的魔法力量创造了以前从未有过的东西。拿着它，你将从根本上改变你的战斗风格......
items.kromermask.message=面具遮住你的脸，让你的头脑充满奇怪的知识，但你只能选择一种职业......它会是什么呢？
items.kromermask.used=第二初始职业已经获得！
items.kromermask.used_rk=你的获得了额外的初始能力！
items.kromercrown.name=克罗默王冠
items.kromercrown.no_subclass=你手里拿着王冠，绝望地沉思，突然意识到自己应该先拿到某些球形物体……
items.kromercrown.ac_connect=尝试联系
items.kromercrown.desc=在将无与伦比的力量集中到矮人王冠上之后，王冠本身变得翠绿而异常美丽，但又有点怪异。\n\n随着克罗默的力量慢慢稳定下来，你可以学到的东西远强于护甲技能……你会触碰那个具有无尽潜力的克罗默经济，让自己成为神祇吗？
items.kromercrown.message=当你握着王冠的时候，某人的形象浮现在你的脑海当中——看起来像是那个教你第一部分知识的刺客天狗和那个声称拥有所有克罗默的家伙，两者的合体——他的胡言乱语中，只有一个词你听的非常清楚：专精……\n\n你想要如何选择？
items.kromercrown.used=第二专精已经获得！
items.kromercrown.used_rk=第二专精在您的坚定意志之下已经获得！
items.torch.name=火把
items.torch.ac_light=点燃
items.torch.desc=冒险必备物品，每当地牢陷入黑暗之时，火把能让你走上正确的道路。
items.waterskin.name=水袋
items.waterskin.ac_drink=饮用
items.waterskin.collected=你将一滴露珠收集到了水袋里。
items.waterskin.full=你的水袋装满了！
items.waterskin.empty=你的水袋一滴也不剩了！
items.waterskin.desc=牛皮缝制的液体容器，被软木塞牢牢密封着。再激烈的搏斗中也不会漏出一滴内容。
items.waterskin.desc_water=你的水袋里只有普普通通的饮用水，地牢中肯定会有更值得装的东西。
items.waterskin.desc_heal=水袋里现在装着有治愈魔力的露水。水袋越满，你在饮用时瞬间恢复的生命也会越多。你每次使用都只会喝掉你需要的量。
items.waterskin.desc_full=装满了的水袋散发着一股能量，也许能够用来祝福其他的生存道具？
items.duelistgrass.name=草
items.duelistgrass.desc=草是一种植物，它们的狭窄叶片从基部生长。一种常见的草被用来覆盖像草坪和公园这样的地方。草通常是绿色的。这是因为它们是被风传粉而不是被昆虫传粉，所以它们不必吸引昆虫。绿色是光合作用的最佳颜色。\n\n您可以将草投掷到任何瓦片上种植它。
items.duelistgrass.ac_imbue=灌输
items.duelistgrass.ac_eat=食用
items.duelistgrass.imbue_prompt=选择要灌输的武器
items.duelistgrass.identify=您无法用草灌输您未鉴定的武器。
items.duelistgrass.not_enough=草量不足
items.duelistgrass.cursed=您无法用草灌输受诅咒的武器。
items.duelistgrass.imbued=你已经用 %d 点草灌输了这把武器！
items.duelistgrass.eat_msg=这草尝起来够带劲！
items.journal.specialseedpage.desc=一本高阶元探索书籍的残页。\n\n多数文字距离太远难以辨认，但你可以看清页面的标题：\n\n_"%s"_
items.journal.specialseedpage.name=金色指引书页