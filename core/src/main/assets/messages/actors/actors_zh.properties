actors.hero.talent$swiftequipcooldown.desc=您最近使用过这个天赋，必须等待一段时间才能再次使用。\n\n剩余回合数：%s.
actors.hero.talent$preciseassaulttracker.name=精准打击
actors.hero.talent$preciseassaulttracker.desc=决斗家的下一个普通近战攻击将获得额外的命中率。\n\n剩余回合数：%s.
actors.hero.talent$deadlyfollowuptracker.name=夺命追击
actors.hero.talent$deadlyfollowuptracker.desc=决斗家最近用投掷武器攻击了一个敌人，她对同一目标的近战攻击将造成额外伤害。\n\n剩余回合数：%s.
actors.hero.talent$combinedlethalityabilitytracker.executed=处决
actors.hero.talent$satiatedspellstracker.name=护盾法术
actors.hero.talent$satiatedspellstracker.desc=牧师下一次施放的法术将赋予他们少量护盾。
actors.hero.talent$searinglightcooldown.name=灼热之光
actors.hero.talent$searinglightcooldown.desc=你最近使用了此天赋，必须等待才能再次使用。\n\n剩余回合数：%s。
actors.hero.talent$helpertoherorevivecooldown.name=幻影复苏
actors.hero.talent$helpertoherorevivecooldown.desc=虹卫幻影形象从死亡中复活，但在完全恢复之前不会参与战斗。\n\n剩余回合数：%s.
actors.hero.talent$sixthsensecooldown.name=第六感冷却
actors.hero.talent$sixthsensecooldown.desc=你最近使用了此天赋，必须等待才能再次使用。\n\n剩余回合数：%s。
actors.hero.talent.hearty_meal.title=丰盛一餐
actors.hero.talent.hearty_meal.desc=_+0:_ 当生命值≤30%时，进食为战士恢复_3点生命值_。\n\n_+1:_ 当生命值≤30%时，进食为战士恢复_6点生命值_。\n\n_+2:_ 当生命值≤30%时，进食为战士恢复_9点生命值_。
actors.hero.talent.hearty_meal.comment="任何优秀英雄的必备技能：通过停下来吃点东西来快速治愈致命伤。"
actors.hero.talent.veterans_intuition.title=老兵直觉
actors.hero.talent.veterans_intuition.desc=_+0:_ 战士鉴定武器速度提高 _1.75 倍_，盔甲速度提高 _2.5 倍_。\n\n_+1:_ 战士鉴定武器速度提高 _2.5 倍_，当他装备盔甲时_立刻_鉴定。首次拾取时，他还有 _30% 的几率_ 鉴定盔甲。\n\n_+2:_ 战士 装备武器时_立刻_鉴定。首次拾取时，战士有 _60% 的几率_ 鉴定盔甲和 _30% 的几率_ 鉴定武器。\n\n“谁说你不能通过简单拿在手里就知道东西好不好？嘿，真正的盔甲鉴赏家只需看一眼就能知道。”
actors.hero.talent.veterans_intuition.comment="谁说光拿着东西就不能直接判断它好不好？嘿，真正的护甲鉴赏家光是看看就能知道！"
actors.hero.talent.provoked_anger.title=受衅怒火
actors.hero.talent.provoked_anger.desc=_+0:_ 护盾破裂时，战士的_下一次物理攻击_额外造成_2点伤害_。\n\n_+1:_ 护盾破裂时，战士的_下两次物理攻击_额外造成_3点伤害_。\n\n_+2:_ 护盾破裂时，战士的_下两次物理攻击_额外造成_5点伤害_。
actors.hero.talent.provoked_anger.comment="你打破了我的护盾。准备受死吧。"
actors.hero.talent.iron_will.title=钢铁意志
actors.hero.talent.iron_will.desc=_+0:_ 战士破损纹章提供的最大护盾值_+1_，护盾完全充能所需时间_减少30回合_。\n\n_+1:_ 战士破损纹章提供的最大护盾值_+3_，护盾完全充能所需时间_减少60回合_。\n\n_+2:_ 战士破损纹章提供的最大护盾值_+5_，护盾完全充能所需时间_减少90回合_。\n\n“小伤不怕，反正能治”
actors.hero.talent.weapon_mastery.title=武器专精
actors.hero.talent.weapon_mastery.desc=_+1:_ 近战武器最小伤害_+3_，投掷武器最小伤害_+1_。\n\n_+2:_ 近战武器最小伤害_+4_，投掷武器最小伤害_+2_。
actors.hero.talent.weapon_mastery.comment="重铸短剑荣光，吾辈义不容辞！"
actors.hero.talent.weapon_mastery.comment_mage="我的一生起起落落，5.5伤始终如一。"
actors.hero.talent.iron_stomach.title=钢铁之胃
actors.hero.talent.iron_stomach.desc=_+0:_ 进食时战士获得_75%伤害抗性_。\n\n_+1:_ 进食耗时1回合，并获得_100%伤害抗性_，持续_1回合_。\n\n_+2:_ 进食耗时1回合，并获得_无敌效果_，持续_2回合_。
actors.hero.talent.iron_stomach.comment="任何优秀英雄的必备技能：战斗中能停下来吃饭。别问我是什么原理，但是反正你面对着狂暴的豺狼暴徒，或者即将发射的死亡射线的时候，打开野餐蓝美美吃一顿就避免掉全部伤害。"
actors.hero.talent.liquid_willpower.title=液蕴意志
actors.hero.talent.liquid_willpower.desc=_+0:_ 战士在饮用或投掷药水时，立即获得其破损印章的 _50% 护盾_。\n\n_+1:_ 战士在饮用或投掷药水时，立即获得其破损印章的 _100% 护盾_。\n\n_+2:_ 战士在饮用或投掷药水时，立即获得其破损印章的 _150% 护盾_。\n\n在使用力量、经验药剂及需要以它们炼金得到的物品时，护盾再生效果加倍。\n\n对产量较高的炼金物品（如水爆魔药），该天赋将根据物品的产量有概率触发。\n在从水袋喝水时，该效果也会触发，其强度取决于露水的消耗方式；10 滴为 100% 效力。
actors.hero.talent.liquid_willpower.comment="在饮用治疗药水后直接死亡是令人沮丧的。幸好我们有这个天赋。”
actors.hero.talent.liquid_willpower.meta_desc=_如果其他英雄获得此天赋_，+1 时将提供相当于最大生命值的 8% 护盾，+2 时将提供相当于最大生命值的 12% 护盾。
actors.hero.talent.runic_transference.title=刻印转移
actors.hero.talent.runic_transference.desc=_+1:_ _战士的破损纹章可以像携带一层升级一样携带_任何刻印_。\n\n_+2：_战士的破损纹章可以从护甲上_吸收刻印_并像携带一层升级一样携带它。\n\n破损纹章只能携带护甲贴附有纹章时刻在上面的刻印。
actors.hero.talent.runic_transference.comment_warrior="当地牢给你柠檬（荆棘皮甲），就制作柠檬水（荆棘板甲）。”
actors.hero.talent.runic_transference.meta_desc=_如果不同英雄获得此天赋_，+1 时将帮助你的盔甲上的附魔防止被升级卷轴消除。+1 时，当从 8 级（从 4 级升级）升级时，附魔将开始消除，+2 时为 10 级（从 4 级升级）。
actors.hero.talent.lethal_momentum.title=手起刀落
actors.hero.talent.lethal_momentum.desc=_+1:_ 战士用物理武器击杀敌人时，有_67%概率_不消耗回合。\n\n_+2:_ 战士用物理武器击杀敌人时，有_100%概率_不消耗回合。\n\n对蛮兵、食尸鬼及死亡标记目标同样生效。\n\n触发时战士该回合获得2倍命中率。
actors.hero.talent.lethal_momentum.comment="在与多个敌人作战时，这可能是有史以来最超模的天赋，现在它甚至可以对抗尸群和暴徒！我加入了双倍的精准度，这样磨重长剑的伤害就不会被闪避了。"
actors.hero.talent.lethal_momentum.comment_rogue="刺客：但我们已经有了手起刀落！\n刺客：对吗？\n这个天赋：*存在*\n刺客：对吗？"
actors.hero.talent.lethal_momentum.comment_huntress="手起刀落狙击射击非常棒。更不用说你可以用这种天赋来利用多重射击的各种方法..."
actors.hero.talent.improvised_projectiles.title=即兴投掷
actors.hero.talent.improvised_projectiles.desc=_+0:_ 战士投掷非武器物品可致盲敌人_2回合_（50回合冷却）。\n\n_+1:_ 战士投掷非武器物品可致盲敌人_3回合_（25回合冷却）。\n\n_+2:_ 战士投掷非武器物品可致盲敌人_4回合_（25回合冷却）。
actors.hero.talent.improvised_projectiles.comment="我猜这个天赋是Evan看了成龙历险记之后想出来的。"
actors.hero.talent.improvised_projectiles.comment_huntress="黑暗逃生的玩家们，站出来吧！"
actors.hero.talent.big_rush.title=野蛮冲撞
actors.hero.talent.big_rush.desc=_+1:_ 路径上有敌人时，战士攻击附带破碎破损纹章_75%_最大护盾值的额外伤害。\n\n_+2:_ 路径上有敌人时，战士攻击附带破碎破损纹章_150%_最大护盾值的额外伤害。\n\n"休想挡我的路！"
actors.hero.talent.big_rush.meta_desc=_如果不同英雄获得此天赋_，额外伤害将来自最大生命值的 7.5%（+1），和最大生命值的 11%（+2）。
actors.hero.talent.hold_fast.title=不动如山
actors.hero.talent.hold_fast.desc=_+0:_ 等待时战士获得_1-2点护甲_（移动后消失）。\n\n_+1:_ 等待时战士获得_2-4点护甲_（移动后消失）。\n\n_+2:_ 等待时战士获得_3-6点护甲_（移动后消失）。\n\n_+3:_ 等待时战士获得_4-8点护甲_（移动后消失）。
actors.hero.talent.hold_fast.comment="点击等待，变成坦克！"
actors.hero.talent.strongman.title=力大无穷
actors.hero.talent.strongman.desc=  _+0:_ 战士力量提升_8%_（向下取整）。\n\n  _+1:_ 战士力量提升_13%_（向下取整）。\n\n  _+2:_ 战士力量提升_21%_（向下取整）。\n\n  _+3:_ 战士力量提升_29%_（向下取整）。
actors.hero.talent.strongman.comment="这个天赋给了足够用到下一把的力量，当然，是在你已经度过了最需要它们的阶段之后。"
actors.hero.talent.strongman.comment_rogue=希望你选择了疾行者，这样你就可以用闪避盔甲彻底打破游戏。
actors.hero.talent.monastic_might.title=修道之力
actors.hero.talent.monastic_might.desc=  _+0:_ 武僧力量提升_8%_（向下取整）。\n\n  _+1:_ 武僧力量提升_13%_（向下取整）。\n\n  _+2:_ 武僧力量提升_21%_（向下取整）。\n\n  _+3:_ 武僧力量提升_29%_（向下取整）。
actors.hero.talent.monastic_might.comment="强大的力量带来强大的实力。"
actors.hero.talent.bear_paw.title=难忍利爪
actors.hero.talent.bear_paw.desc=_+1:_ 生命值在_25%及以下_时，战士会使敌人流血。\n\n_+2:_ 生命值在_25%及以下_时，战士会使敌人流血并获得+1攻击距离。\n\n_ +3:_ 生命值在_25%及以下_时，战士将33%的伤害转化为治疗，使敌人流血并获得+1攻击距离。
actors.hero.talent.bear_paw.comment="走投无路的困兽最为危险。"
actors.hero.talent.bear_paw.comment_mage="这世上最锋利的东西显然是木棍。"
actors.hero.talent.endless_rage.title=洪荒之怒
actors.hero.talent.endless_rage.desc=_+1:_ 狂战士怒气值上限提升至_125%_。\n\n_+2:_ 狂战士怒气值上限提升至_150%_。\n\n_+3:_ 狂战士怒气值上限提升至_175%_。\n\n超过100%的部分：每1%怒气值增加1%狂暴护盾，减少1%冷却时间（伤害加成上限仍为50%）。
actors.hero.talent.endless_rage.comment="想象一下最强烈的纯粹、未掺杂的愤怒感。这就是我们要处理的东西。”
actors.hero.talent.deathless_fury.title=不死之怒
actors.hero.talent.deathless_fury.desc=_+1:_ 如果狂战士即将死亡且愤怒值达到或超过100%，狂暴状态将自动触发，但在此情况下会有 _3 级英雄_ 的冷却时间。\n\n_+2:_ 如果狂战士即将死亡且愤怒值达到或超过100%，狂暴状态将自动触发，但在此情况下会有 _2 级英雄_ 的冷却时间。\n\n_+3:_ 如果狂战士即将死亡且愤怒值达到或超过100%，狂暴状态将自动触发，但在此情况下会有 _1 级英雄_ 的冷却时间。\n\n请注意，如果狂战士在狂暴状态结束时生命值为0，他仍然会死亡。\n\n无论等级如何，狂战士在恢复时仍能按比例获得愤怒。\n\n此天赋具有追溯效应。
actors.hero.talent.deathless_fury.comment="你以为杀了我就足以让我死吗？"
actors.hero.talent.berserking_stamina.title=狂暴耐力
actors.hero.talent.berserking_stamina.desc=_+0_: 低生命值时狂怒获取速度加快至_17%_。\n\n_+1:_ 低生命值时狂怒获取速度加快至_33%_。\n\n_+2:_ 低生命值时狂怒获取速度加快至_67%_。\n\n_+3:_ 低生命值时狂怒获取速度加快至_100%_。
actors.hero.talent.berserking_stamina.comment="当我需要愤怒时，它在哪里？"\n"就在这里！！！"
actors.hero.talent.enraged_catalyst.title=怒气导魔
actors.hero.talent.enraged_catalyst.desc=_+1:_ 附魔/符文/诅咒触发概率随怒气值提升（100%狂怒时最高+20%）。\n\n_+2:_ 附魔/符文/诅咒触发概率随怒气值提升（100%狂怒时最高+40%）。\n\n_+3:_ 附魔/符文/诅咒触发概率随怒气值提升（100%狂怒时最高+60%）。
actors.hero.talent.enraged_catalyst.comment="现在支持刻印！"
actors.hero.talent.one_man_army.title=一人成军
actors.hero.talent.one_man_army.desc=_+1_: 每多1名敌人，狂战士攻速提升_11%_（首名敌人不计）。\n\n_+2_: 每多1名敌人，狂战士攻速提升_22%_（首名敌人不计）。\n\n_+3_: 每多1名敌人，狂战士攻速提升_33%_（首名敌人不计）。
actors.hero.talent.one_man_army.comment="你知道，Watabou 的狂战士想法是正确的。更快的攻击速度很好，现在你可以将这个天赋与手起刀落结合起来，简单地在瞬间清除周围所有的敌人。"
actors.hero.talent.bravery.title=勇往直前
actors.hero.talent.bravery.desc=_+1:_ 狂战士可以从护甲值无法阻挡的伤害中收集最多_+125%_怒气。\n\n_+2:_ 狂战士可以从护甲值无法阻挡的伤害中收集最多_+175%_怒气。\n\n_+3:_ 狂战士可以从护甲值无法阻挡的伤害中收集最多_+225%_怒气。\n\n"有人一直在表达他们的观点，即破碎的狂战士的游戏风格与其他奇幻小说中的狂战士的游戏风格有着根本的不同：他们是全副武装，而不是毫无保护地向前冲刺。这个天赋旨在改变这一点。"
actors.hero.talent.cleave.title=战斗态势
actors.hero.talent.cleave.desc=_+1:_ 角斗士5回合未命中敌人时，连击点数以_2点/回合_衰减（而非清零）。\n\n_+2:_ 角斗士5回合未命中敌人时，连击点数以_1点/回合_衰减（而非清零）。\n\n_+3:_ 角斗士5回合未命中敌人时，连击点数以_0.5点/回合_衰减（而非清零）。\n\n"够你找到下个敌人了。"
actors.hero.talent.lethal_defense.title=以战养战
actors.hero.talent.lethal_defense.desc=_+1：_当角斗士使用连击战技击杀一名敌人时，他会回复破损纹章护盾的_33%_。\n\n_+2：_当角斗士使用连击战技击杀一名敌人时，他会回复破损纹章护盾的_67%_。\n\n_+3：_当角斗士使用连击战技击杀一名敌人时，他会回复破损纹章护盾的_100%_。\n\n"虽v0.9.2前的撞击效果不再，此天赋助你重拾威能。"
actors.hero.talent.efficient_training.title=组合套餐
actors.hero.talent.efficient_training.desc=_+1:_ 战士进食只花费一个回合，并给予_1额外连击_和_7回合额外连击时间_。\n\n_+2:_ 战士进食只花费一个回合，并给予_2额外连击_和_7回合额外连击时间_。\n\n_+3:_ 战士进食只花费一个回合，并给予_3额外连击_和_7回合额外连击时间_。\n\n"在多人竞技游戏中要确保你不会被逮到。"
actors.hero.talent.enhanced_combo.title=战技强化
actors.hero.talent.enhanced_combo.desc=  _+0:_ 连击≥8时：猛击击退距离+3，附加眩晕，可击落陷阱；使用震击/粉碎/狂怒时可_跳跃连击值/5格_。\n\n  _+1:_ 连击≥12时：招架可抵挡多次攻击；猛击强化需求降至_6连击_；使用震击/粉碎/狂怒时可_跳跃连击值/4格_。\n\n  _+2:_ 猛击与招架可使用_两次_；招架强化需求降至_9连击_，猛击强化需求降至_4连击_；使用震击/粉碎/狂怒时可_跳跃连击值/3格_。\n\n  _+3:_ 猛击与招架可使用_三次_且_始终强化_；使用震击/粉碎/狂怒时可_跳跃连击值/2格_。
actors.hero.talent.enhanced_combo.comment="功能膨胀？不存在的。"
actors.hero.talent.skill.title=技艺精湛
actors.hero.talent.skill.desc=_+1:_ 角斗士连招伤害取两次掷骰最高值，命中后连击时间重置为6回合（原5回合）。\n\n_+2_: 攻击未命中时仍有33%概率获得连击，连击时间延长至7回合。\n\n_+3_: 攻击命中时有33%概率额外获得连击，连击时间延长至8回合。\n\n"技术碾压概率。"
actors.hero.talent.everything_is_a_weapon.title=万物皆武器
actors.hero.talent.everything_is_a_weapon.desc= _+1_: 投掷非武器物品或使用魔杖时，有_33%概率_获得连击。\n\n  _+2_: 投掷非武器物品或使用魔杖时，有_67%概率_获得连击。\n\n  _+3_: 投掷非武器物品或使用魔杖时，有_100%概率_获得连击。\n\n  未触发时仍重置连击时间。
actors.hero.talent.everything_is_a_weapon.comment="心意最重要。"
actors.hero.talent.power_stabilizer.title=力量稳定器
actors.hero.talent.power_stabilizer.desc=_+1:_ 临时力量最大充能值提升至_20_。\n\n_+2:_ 临时力量最大充能值提升至_25_。\n\n_+3:_ 临时力量最大充能值提升至_30_。\n\n"正好能给你来三记重击，朋友。"
actors.hero.talent.arcanity_ensues.title=奥能涌现
actors.hero.talent.arcanity_ensues.desc=_+1:_ 魔杖伤害享受街霸_20%_伤害加成。\n\n_+2:_ 魔杖伤害享受街霸_40%_伤害加成。\n\n_+3:_ 魔杖伤害享受街霸_60%_伤害加成。\n\n"魔杖强度人尽皆知，给战士也加点联动性。"
actors.hero.talent.in_my_memories.title=铭刻于忆
actors.hero.talent.in_my_memories.desc=_+1:_ 特殊攻击附加破损纹章护盾值_40%_的固定伤害；破损纹章满盾时充能速度加快_25%_。\n\n_+2:_ 特殊攻击附加破损纹章护盾值_80%_的固定伤害；破损纹章满盾时充能速度加快_35%_。\n\n_+3:_ 特殊攻击附加破损纹章护盾值_120%_的固定伤害；破损纹章满盾时充能速度加快_45%_。\n\n"谁说被动破损纹章不能用于战斗？"
actors.hero.talent.holeric_burst.title=狂怒爆发
actors.hero.talent.holeric_burst.desc=_+1:_ 特殊攻击击杀恢复_5点生命值_。\n\n_+2:_ 特殊攻击击杀恢复_10点生命值_。\n\n_+3:_ 特殊攻击击杀恢复_15点生命值_。\n\n"什么？战士本来就不能打挑战？无所谓了。"
actors.hero.talent.pride_of_steel.title=钢铁尊严
actors.hero.talent.pride_of_steel.desc=_+1:_ 街霸的特殊攻击无视敌人的护甲值。\n\n_+2:_ 街霸的特殊攻击无视敌人的护甲值，并在杀死敌人后掉落财富之戒物品。\n\n_+3:_ 街霸的特殊攻击无视敌人的护甲值，使敌人成为目标_4回合_，并在杀死敌人后掉落财富之戒物品。\n\n"打击你路径上任何挑战者心中的恐惧！"
actors.hero.talent.body_slam.title=肉弹冲击
actors.hero.talent.body_slam.desc=_+0:_ 战士落地时对周围敌人造成_1-4+伤害格挡值25%_的伤害。\n\n_+1:_ 战士落地时对周围敌人造成_2-8+伤害格挡值50%_的伤害。\n\n_+2:_ 战士落地时对周围敌人造成_3-12+伤害格挡值75%_的伤害。\n\n_+3:_ 战士落地时对周围敌人造成_4-16+伤害格挡值100%_的伤害。\n\n_+4:_ 战士落地时对周围敌人造成_5-20+伤害格挡值125%_的伤害。\n\n若激活"英勇附魔"，此伤害可触发武器附魔。
actors.hero.talent.body_slam.comment="那是一只鸟？那是一架飞机？不，那是从天而降的死亡！"
actors.hero.talent.impact_wave.title=堕天一击
actors.hero.talent.impact_wave.desc=_+1:_ 战士落地时击退周围敌人_3格_，并有_40%概率_使其脆弱5回合。\n\n_+2:_ 战士落地时击退周围敌人_4格_，并有_60%概率_使其脆弱5回合。\n\n_+3:_ 战士落地时击退周围敌人_4格_，并有_80%概率_使其脆弱5回合。\n\n_+4:_ 战士落地时击退周围敌人_6格_，并有_100%概率_使其脆弱5回合。\n\n"像打台球似的...要是能弹墙就更好了。以后再说..."
actors.hero.talent.double_jump.title=二段跳跃
actors.hero.talent.double_jump.desc=_+1:_ 5回合内二次跳跃消耗降低_50%_。\n\n_+2:_ 5回合内二次跳跃_免费_。\n\n_+3:_ 5回合内二次跳跃_免费_，三次跳跃消耗降低_24%_。\n\n_+4:_ 5回合内二次跳跃_免费_，三次跳跃消耗降低_42%_。\n\n"蹦跶~蹦跶~"
actors.hero.talent.alice_gambit.title=爱丽丝奇招
actors.hero.talent.alice_gambit.desc=_+1:_ 战士落地时缩小周围敌人_2.5回合_。\n\n_+2:_ 战士落地时缩小周围敌人_5回合_。\n\n_+3:_ 战士落地时缩小周围敌人_7.5回合_。\n\n_+4:_ 战士落地时缩小周围敌人_10回合_。\n\n"这叫呼噜，不是咆哮。"
actors.hero.talent.expanding_wave.title=广域冲击
actors.hero.talent.expanding_wave.desc=_+0:_ 震荡波范围_6格_，角度_75度_。\n\n_+1:_ 震荡波范围_7格_，角度_90度_。\n\n_+2:_ 震荡波范围_8格_，角度_105度_。\n\n_+3:_ 震荡波范围_9格_，角度_120度_。\n\n_+4:_ 震荡波范围_10格_，角度_135度_。
actors.hero.talent.striking_wave.title=复合震波
actors.hero.talent.striking_wave.desc=_+1:_ 震荡波有_30%概率_触发命中效果（附魔/连击）。\n\n_+2:_ 震荡波有_60%概率_触发命中效果（附魔/连击）。\n\n_+3:_ 震荡波有_90%概率_触发命中效果（附魔/连击）。\n\n_+4:_ 震荡波_100%触发_命中效果且附魔效果_+20%_。
actors.hero.talent.shock_force.title=强力冲击
actors.hero.talent.shock_force.desc=_+1:_ 震荡波伤害_+25%_，_25%概率_将残废替换为眩晕。\n\n_+2:_ 震荡波伤害_+50%_，_50%概率_将残废替换为眩晕。\n\n_+3:_ 震荡波伤害_+75%_，_75%概率_将残废替换为眩晕。\n\n_+4:_ 震荡波伤害_+100%_，_100%概率_将残废替换为眩晕。
actors.hero.talent.cockatriocious.title=鸡蛇化
actors.hero.talent.cockatriocious.desc=_+1:_ 震荡波_石化_敌人_3回合_。\n\n_+2:_ 震荡波_石化_敌人_5回合_。\n\n_+3:_ 震荡波_石化_敌人_7回合_。\n\n_+4:_ 震荡波_石化_敌人_9回合_。\n\n"别惹坦克。"
actors.hero.talent.sustained_retribution.title=持续反击
actors.hero.talent.sustained_retribution.desc=_+1:_ 耐力结束时的反击伤害提升至_120%_，分_2次_打击（原100%单次）。\n\n_+2:_ 耐力结束时的反击伤害提升至_140%_，分_3次_打击。\n\n_+3:_ 耐力结束时的反击伤害提升至_160%_，分_4次_打击。\n\n_+4:_ 耐力结束时的反击伤害提升至_180%_，分_5次_打击。
actors.hero.talent.shrug_it_off.title=痛觉阈值
actors.hero.talent.shrug_it_off.desc=_+1:_ 坚守状态减伤提升至_74%_（原67%）。\n\n_+2:_ 坚守状态减伤提升至_79%_（原67%）。\n\n_+3:_ 坚守状态减伤提升至_83%_（原67%）。\n\n_+4:_ 坚守状态减伤提升至_86%_（原67%）。
actors.hero.talent.even_the_odds.title=情势反转
actors.hero.talent.even_the_odds.desc=_+1:_ 耐力结束时，2格内每多1名敌人，反击伤害额外_+10%_。\n\n_+2:_ 耐力结束时，2格内每多1名敌人，反击伤害额外_+20%_。\n\n_+3:_ 耐力结束时，2格内每多1名敌人，反击伤害额外_+30%_。\n\n_+4:_ 耐力结束时，2格内每多1名敌人，反击伤害额外_+40%_。
actors.hero.talent.demonshader.title=魔影
actors.hero.talent.demonshader.desc=_+1:_ 耐力结束时追加_1-8_燃烧伤害；耐力强化攻击延长连击时间_2回合_，并将伤害值25%转化为狂怒。\n\n_+2:_ 耐力结束时追加_3-13_燃烧伤害；耐力强化攻击延长连击时间_4回合_，并将伤害值50%转化为狂怒。\n\n_+3:_ 耐力结束时追加_5-18_燃烧伤害；耐力强化攻击延长连击时间_6回合_，并将伤害值75%转化为狂怒。\n\n_+4:_ 耐力结束时追加_7-23_燃烧伤害；耐力强化攻击延长连击时间_8回合_，并将伤害值100%转化为狂怒。\n\n狂怒转化按加成前伤害计算。\n\n"又是超模的火焰伤害..."
actors.hero.talent.energizing_meal_i.title=充能一餐
actors.hero.talent.energizing_meal_i.desc=_+1：_法师进食获得 _5 回合法杖充能_。\n\n_+2：_法师进食获得 _8 回合法杖充能_。
actors.hero.talent.energizing_meal_i.comment="曾几何时，这实际上是破碎地牢中的第1层天赋。给你的魔杖+3伤害比8回合的充能更好吗？ 你告诉我。"
actors.hero.talent.energizing_meal_i.comment_rogue="为你准备的大礼，游击法师。"
actors.hero.talent.scholars_intuition.title=学者直觉
actors.hero.talent.scholars_intuition.desc=_+1：_法师鉴定魔杖的速度变为_3倍_，当他_使用魔杖时_鉴定它们的等级，并且有_1/3的几率_在初次捡起卷轴和药剂时识别它们。\n\n_+2：_法师在_使用魔杖时_鉴定魔杖，并且有_1/2的几率_在初次捡起卷轴和药水时识别它们。
actors.hero.talent.scholars_intuition.comment="他可是学者！如果他连消耗品都认不出来也太菜了。"
actors.hero.talent.scholars_intuition.comment_rat_king="嘿，看看这个！朕未曾做到的事！"
actors.hero.talent.lingering_magic.title=残留魔法
actors.hero.talent.lingering_magic.desc=_+0_: 当法师用魔杖或法杖施法时，他的_下一次物理攻击_造成_1-2_点额外伤害。\n\n_+1:_ 当法师用魔杖或法杖施法时，他的_下2次物理攻击_造成_2点额外伤害_。\n\n_+2:_ 当法师用魔杖或法杖施法时，他的_下两次物理攻击_造成_3点额外伤害_。
actors.hero.talent.lingering_magic.comment="永远别说法师是个把鸡蛋都放在一个篮子里的人"
actors.hero.talent.backup_barrier.title=备用屏障
actors.hero.talent.backup_barrier.desc=_+1：_每当法师释放老魔杖最后1点充能,他获得 _5 点护盾_.\n\n_+2：_每当法师释放老魔杖最后1点充能,他获得 _8 点护盾_。
actors.hero.talent.backup_barrier.comment="这个天赋是用来填补你拿法杖乱杀的真空期的。"
actors.hero.talent.backup_barrier.meta_desc=_倘若这个天赋由其他英雄获得_，将会由英雄身上等级最高的法杖触发。
actors.hero.talent.arcane_boost.title=奥术充能
actors.hero.talent.arcane_boost.desc=_+1:_ 法师的法杖充能加快_9_回合。\n\n_+2:_ 法师的法杖充能加快_14_回合。\n\n这个天赋对老魔杖无效！\n\n"后宫佳丽三千，其他法杖也需要你的临幸！"
actors.hero.talent.energizing_meal_ii.title=充能一餐 II
actors.hero.talent.energizing_meal_ii.desc=_+1: _法师进食只消耗一回合，并立即为所有魔杖恢复_1点充能_。\n\n_+2：_法师进食只消耗一回合，并立即为所有魔杖恢复_1.5点充能_。\n\n"这是给那些没有耐心的家伙准备的。还有，享受法杖过充吧。"
actors.hero.talent.inscribed_power.title=卷藏秘能
actors.hero.talent.inscribed_power.desc=_+1:_ 当法师阅读卷轴时，他的接下来三次魔杖释放将获得 _+4 级_。\n\n_+2:_ 当法师阅读卷轴时，他的接下来三次法杖释放将获得 _+6 级_。\n\n阅读升级、嬗变、附魔或其秘卷时，增强法杖释放次数加倍。\n\n“处女 SHPD 法师：+0 法杖为 +0。通过卷藏秘能可以提升到 +2。\nChad 卷藏秘能 RKPD2 法师：阅读卷轴，+0 魔杖 -> +6 魔杖！”
actors.hero.talent.wand_preservation.title=法杖回收
actors.hero.talent.wand_preservation.desc=_+0：_当法师将新的法杖注入魔杖时,先前灌注的法杖有100% 的概率以+0等级被保留_只能触发一次_\n\n_+1_：法师将新的法杖注入魔杖时,先前灌注的法杖有100% 的概率以+0等级被保留_有一英雄等级的冷却_.\n\n_+2：_法师将新魔杖注入他的魔杖时,旧魔杖有100%的概率以+0等级被保留。_次数无限_。\n\n
actors.hero.talent.wand_preservation.meta_desc=_如果不同英雄获得此天赋_，在 +0/+1/+2 时，将增加将法杖放入炼金壶时获得的奥术树脂数量，分别为 1/2/4。
actors.hero.talent.arcane_vision.title=奥术感知
actors.hero.talent.arcane_vision.desc=_+1：_当法师使用法杖施法命中敌人时，获取目标视野，持续 _20 回合_。\n\n_+2：_当法师使用法杖施法命中敌人时，获取目标视野，持续 _30 回合_。
actors.hero.talent.arcane_vision.comment="有了焰浪法杖，谁还要火把？"
actors.hero.talent.arcane_vision.comment_rogue="配合解离？听上去更像是千里眼。"
actors.hero.talent.pyromaniac.title=纵火狂热
actors.hero.talent.pyromaniac.desc=_+1:_ 造成的火焰伤害增加_13%_ (火矢法杖增加_9%_).\n\n_+2:_ 造成的火焰伤害增加_25%_ (火矢法杖增加_17%_).\n\n火焰伤害包括附魔、法杖和战斗法师效果。\n\n火焰燃烧的环境也获得了这个伤害增益。
actors.hero.talent.pyromaniac.comment="烧烧烧烧烧烧烧！！！"
actors.hero.talent.pyromaniac.comment_rogue="有一说一，我从没有认为焰浪很弱，但火拳的火球应当加些"
actors.hero.talent.empowering_scrolls.title=卷轴回流
actors.hero.talent.empowering_scrolls.desc=_+1：_法师阅读一张卷轴后，下2次法杖效果_提升2级_。\n\n_+2：_法师阅读一张卷轴后，下2次法杖效果_提升4级_。\n\n_+3：_法师阅读一张卷轴后，下2次法杖效果_提升6级_。
actors.hero.talent.empowering_scrolls.comment="原版破碎法师：三张升级卷轴=+3法杖\n鼠王冒险法师：阅读一张卷轴=+8法杖！"
actors.hero.talent.empowering_scrolls.comment_rogue="+8酸蚀法杖……行了，毁灭吧我累了。"
actors.hero.talent.shield_battery.title=储能护盾
actors.hero.talent.shield_battery.desc=_+1：_法师能以自身为目标施法，将法杖的每点充能转化为_ 6% 最大生命值_的护盾。\n\n_+2：_法师能以自身为目标施法，将法杖的每点充能转化为_ 9% 最大生命值_的护盾。\n\n"我不想再看到法师拿着老魔杖就能头顶两倍长的灰血横行地牢了。"
actors.hero.talent.desperate_power.title=绝境迫能
actors.hero.talent.desperate_power.desc=_+1:_ 当法师的魔杖和法杖只剩最后一次释放时，它们将获得 _+2 级_。\n\n_+2:_ 当法师的魔杖和法杖只剩最后一次释放时，它们将获得 _+4 级_。\n\n_+3:_ 当法师的魔杖和法杖只剩最后一次释放时，它们将获得 _+6 级_。
actors.hero.talent.desperate_power.comment=你觉得 +0->+6 很弱吗？那 +0->+12 呢？
actors.hero.talent.ally_warp.title=移形换位
actors.hero.talent.cryonic_spell.title=冰冻法术
actors.hero.talent.cryonic_spell.desc=_+1:_ 焰浪法杖可以使用霜火代替普通的火焰。\n\n_+2:_ 焰浪法杖和火矢法杖可以使用霜火代替普通的火焰。冰霜法杖有50%的几率会冻结敌人而不是使敌人感到寒冷。\n\n_+3:_ 焰浪法杖和火矢法杖及其战斗法师效果可以使用霜火而不是普通的火焰。冰霜法杖以 3x3 的方式影响敌人和地形，并且有50%的几率会冻结敌人而不是使敌人感到寒冷。\n\n"通过降低温度来进一步提高火力？听起来不错，遗憾的是 Evan 只会考虑添加它。"
actors.hero.talent.ally_warp.desc=_+1: _法师可以通过点击与一名_4格范围内_的友方单位瞬间交换位置。\n\n_+2: _法师可以通过点击与一名_8格范围内_的友方单位瞬间交换位置。\n\n_+3: _法师可以通过点击与一名_12格范围内_的友方单位瞬间交换位置。\n\n法师不能与无法移动的友方单位交换位置。
actors.hero.talent.ally_warp.comment="现在你跟幽灵换位置的时候不用防着边上的怪了。"
actors.hero.talent.ally_warp.comment_huntress="想知道这是如何与灵能飞鹰互动的..."
actors.hero.talent.empowered_strike.title=蓄能打击
actors.hero.talent.empowered_strike.desc=_+1：_战斗法师使用老魔杖施法后，下一次用其造成的近战攻击将产生_20%额外魔法伤害_且战法特殊效果提升_+67%_。\n\n_+2：_战斗法师使用老魔杖施法后，下一次用其造成的近战攻击将产生_40%额外魔法伤害_且战法特殊效果提升_+133%_。\n\n_+3：_战斗法师使用老魔杖施法后，下一次用其造成的近战攻击将产生_60%额外魔法伤害_且战法特殊效果提升_+200%_。\n\n"那些整天说老魔杖伤害拉胯的菜逼纯属扯淡，他们根本不会操作。"
actors.hero.talent.mystical_charge.title=充能秘术
actors.hero.talent.mystical_charge.desc=_+0：_当战斗法师用老魔杖近战击中敌人时，会获得_0.5回合_的神器充能效果。\n\n_+1：_当战斗法师用老魔杖近战击中敌人时，会获得_1回合_的神器充能效果。\n\n_+2：_当战斗法师用老魔杖近战击中敌人时，会获得_1.5回合_的神器充能效果。\n\n_+3：_当战斗法师用老魔杖近战击中敌人时，会获得_2回合_的神器充能效果。\n\n"神器是好东西，这个能使它们变得更好。"
actors.hero.talent.excess_charge.title=盈能屏障
actors.hero.talent.excess_charge.desc=_+1：_战斗法师在使用满充能的老魔杖施法时，获得1倍于魔杖等级的护盾值。\n\n_+2：_战斗法师在使用满充能的老魔杖施法时，获得2倍于魔杖等级的护盾值。\n\n_+3：_战斗法师在使用满充能的老魔杖施法时，获得3倍于魔杖等级的护盾值。
actors.hero.talent.excess_charge.comment="有什么比一根始终充满能量的法杖更好的吗？一根充满能量的法杖加上大量护盾！"
actors.hero.talent.sorcery.title=巫术
actors.hero.talent.sorcery.desc=_+1：_当战斗法师法杖施法时，有_17%的几率_触发当前法杖的灌注效果，还有_10%的几率_触发其他法杖效果。\n\n_+2：_当战斗法师法杖施法时，有_33%的几率_触发当前法杖的灌注效果，还有_20%的几率_触发其他法杖效果。\n\n_+3：_当战斗法师法杖施法时，有_50%的几率_触发当前法杖的灌注效果，还有_30%的几率_触发其他法杖效果。\n\n_-_ 只有近战和投掷武器可以触发蓄能打击。\n_-_ 近战和投掷武器从这个天赋中获得双倍收益。\n_-_ 老魔杖只有一半的概率触发这个天赋效果。\n\n"战斗法师很好，但他们不该局限于老魔杖。"
actors.hero.talent.spectre_allies.title=幽灵盟友
actors.hero.talent.spectre_allies.desc=_+1:_ 镜像和虹卫不会被投射物击中，造成_更多20%的伤害_并具有_1格额外射程。_\n\n_+2:_ 镜像和虹卫不会被投射物击中，造成_更多40%的伤害_ ，有_2个额外射程_并触发战斗法师的魔杖效果。\n\n_+3:_ 镜像和虹卫不会被射弹击中，造成_更多60%伤害_，有_3格额外射程_并触发战斗法师的法杖效果和巫术效果。镜像也会随着深度增加他们的生命值。\n\n"哦，看，一些鬼魂来帮助你！"
actors.hero.talent.soul_siphon.title=灵魂分食
actors.hero.talent.soul_siphon.desc=_+1：_魔法伤害和非术士造成的伤害也能以_20%_效率触发灵魂标记。其他单位的物理伤害也能以_20%_效率触发灵魂标记。\n\n_+2：_魔法伤害和非术士造成的伤害也能以_30%_效率触发灵魂标记。其他单位的物理伤害也能以_40%_效率触发灵魂标记。\n\n_+3：_魔法伤害和非术士造成的伤害也能以_40%_效率触发灵魂标记。其他单位的物理伤害也能以_60%_效率触发灵魂标记。\n\n"在破碎里只有近战攻击能触发，这他妈也太蠢了！"
actors.hero.talent.soul_eater.title=噬魂秘法
actors.hero.talent.soul_eater.desc=_+1：_灵魂标记单位受到的每点物理伤害都会提供相当于_0.5回合_的饥饿值。当有灵魂标记的单位死亡时，术士有_15%几率_触发一次进食效果。\n\n_+2：_灵魂标记单位受到的每点物理伤害都会提供相当于_1回合_的饥饿值。当有灵魂标记的单位死亡时，术士有_30%几率_触发一次进食效果。\n\n_+3：_灵魂标记单位受到的每点物理伤害都会提供相当于_1.5回合_的饥饿值。当有灵魂标记的单位死亡时，术士有_45%几率_触发一次进食效果。
actors.hero.talent.soul_eater.comment_mage="这种邪恶的东西才符合正统术士的形象。"
actors.hero.talent.soul_eater.comment_huntress="这里没有充能，但有足够多的激素。（如果你点了活力一餐）"
actors.hero.talent.necromancers_minions.title=怨灵爪牙
actors.hero.talent.necromancers_minions.desc=_+0：_有灵魂标记的敌人死亡时，有_13%几率_成为一只被术士腐化的怨灵。\n\n_+1：_有灵魂标记的敌人死亡时，有_27%几率_成为一只被术士腐化的怨灵。\n\n_+2：_有灵魂标记的敌人死亡时，有_53%几率_成为一只被术士腐化的怨灵。\n\n_+3：_有灵魂标记的敌人死亡时，有_80%几率_成为一只被术士腐化的怨灵。
actors.hero.talent.necromancers_minions.comment_mage="没有腐化+尸尘的时候，你只能指望这个了。"
actors.hero.talent.necromancers_minions.comment_huntress="腐化法杖（×）腐化怨灵（√）"
actors.hero.talent.warlocks_touch.title=灵魂武器
actors.hero.talent.warlocks_touch.desc=  _+1_: 术士及其友军有_15%的几率_在近战攻击中施加6回合灵魂印记，术士的投掷武器则有_20%的几率_。\n\n _+2_: 术士及其友军有_25%的几率_在近战攻击中施加6回合灵魂印记，术士的投掷武器则有_35%的几率_。\n\n  _+3_: 术士及其友军有_35%的几率_在近战攻击中施加6回合灵魂印记，术士的投掷武器则有_50%的几率_。
actors.hero.talent.warlocks_touch.comment="为啥灵魂印记要限制在法杖上？纯偷懒。"
actors.hero.talent.warlocks_touch.comment_huntress=这个天赋将灵能弓的攻击视为近战攻击。\n\n"如果你没有靠谱的法杖，没关系，术士用弓也不是不行。"
actors.hero.talent.banished.title=暗影放逐
actors.hero.talent.banished.desc=_+1:_ 对带有灵魂标记的实体施法会将其驱逐到暗影领域，_秒杀它没有战利品。_这有_250回合_冷却。\n\n_+2:_ 对带有灵魂标记的实体施法会将其驱逐到暗影领域，_秒杀它没有战利品。_这有_225回合_冷却。\n\n_+3:_ 对带有灵魂标记的实体施法会将其驱逐到暗影领域，_秒杀它没有战利品。_ 这有_200回合_冷却。\n\n被驱逐的敌人将生命值的50%恢复给术士。\n如果敌人死于魔法攻击，该天赋不会触发。
actors.hero.talent.banished.comment="他们的灵魂好吃到我把他们整个吞下去了！"
actors.hero.talent.banished.comment_huntress="即使是最弱的法杖也会用黑魔法摧毁你的对手。"
actors.hero.talent.ectotoughness.title=辅助能量
actors.hero.talent.ectotoughness.desc=_+1:_ 使用魔杖可以获得_2点灵魂能量_。\n\n_+2:_ 使用魔杖可以获得_3点灵魂能量_。\n\n_+3:_使用魔杖可以获得_4点灵魂能量_。\n\n“快给我一点新的灵魂...我要不行了……”
actors.hero.talent.i_hate_all_elements.title=元素之敌
actors.hero.talent.i_hate_all_elements.desc=_+1:_ 幽灵对_燃烧、中毒_免疫。\n\n_+2:_ 幽灵对_燃烧、中毒、电击、毒气_免疫。\n\n_+3:_ 幽灵对_燃烧、中毒、电击、毒气、麻痹、酸蚀_免疫。\n\n"我不是讨厌火，我是讨厌一切。"
actors.hero.talent.stab_from_nowhere.title=无处不在
actors.hero.talent.stab_from_nowhere.desc=_+1:_ 幽灵可以传送至_3格_内的敌人身边。\n\n_+2:_ 幽灵可以传送至_6格_内的敌人身边。\n\n_+3:_ 幽灵可以传送至_6格_内的敌人身边，并施加一次打击。\n\n"为什么我们不杀死魅魔并吸收她们的力量！"
actors.hero.talent.power_in_numbers.title=鬼多势众
actors.hero.talent.power_in_numbers.desc=_+1:_ 对一个怪物施法时，你所有的幽灵会将其作为攻击目标。\n\n_+2:_ 在+1的基础上，幽灵在视野内有其他幽灵时造成4点额外伤害。\n\n_+3:_ 在+2的基础上，幽灵具有爆炸成几个更小更弱的幽灵的能力。\n\n"虚空来袭，宝贝！"
actors.hero.talent.mind_breaker.title=头脑风暴
actors.hero.talent.mind_breaker.desc=_+1:_ 盟军幽灵有_5%的几率_会附身其目标敌人，使其腐化。\n\n_+2:_ 盟军幽灵有_11%几率_会附身其目标敌人，使其腐化。\n\n_+3:_ 盟军幽灵有_17%的几率_会附身其目标敌人，使其腐化。\n\n"幽灵在能力方面非常可悲，让我们带更多人来！"
actors.hero.talent.blast_radius.title=广域打击
actors.hero.talent.blast_radius.desc=_+0：_元素风暴的打击半径从4格扩大到 _5格_。\n\n_+1：_元素风暴的打击半径从4格扩大到 _6格_。\n\n_+2：_元素风暴的打击半径从4格扩大到 _7格_。\n\n_+3：_元素风暴的打击半径从4格扩大到 _8格_。\n\n_+4：_元素风暴的打击半径从4格扩大到 _9格_。\n\n"大伙都喜欢看正统元素法师放烟花。"
actors.hero.talent.elemental_power.title=元素之力
actors.hero.talent.elemental_power.desc=_+1：_元素风暴的威力提升_25%_。\n\n_+2：_元素风暴的威力提升_50%_。\n\n_+3：_元素风暴的威力提升_75%_。\n\n_+4：_元素风暴的威力提升_100%_。\n\n"元素风暴？元素核弹！"
actors.hero.talent.reactive_barrier.title=反应屏障
actors.hero.talent.reactive_barrier.desc=_+1：_元素风暴每击中一个目标,法师获得_3点护盾_，最多计算5个目标。\n\n_+2：_元素风暴每击中一个目标,法师获得_6点护盾_，最多计算6个目标。\n\n_+3：_元素风暴每击中一个目标,法师获得_9点护盾_，最多计算7个目标。\n\n_+4：_元素风暴每击中一个目标,法师获得_12点护盾_，最多计算8个目标。
actors.hero.talent.reactive_barrier.comment="元素风暴不能仅仅在进攻方面突出，对吧？不妨给它一点小小的、额外的加强，比如……亿些护盾"
actors.hero.talent.empowered_strike_ii.title=能量爆裂
actors.hero.talent.empowered_strike_ii.desc=_+1:_ 元素风暴的范围和效果翻倍，但是基础耗能从35提高到_80_点充能。\n\n_+2:_ 元素风暴的范围和效果翻倍，但是基础耗能从35提高到_75_点充能。\n\n_+3:_ 元素风暴的范围和效果翻倍，但是基础耗能从35提高到_70_点充能。\n\n_+4:_ 元素风暴的范围和效果翻倍，但是基础耗能从35提高到_65_点充能。\n\n"如果你还是顽固地认为老魔杖没伤害……"
actors.hero.talent.wild_power.title=奥能风暴
actors.hero.talent.wild_power.desc=_+1：_释放狂野魔法时,法杖会被视为原等级_+2或+3，最高+4_。\n\n_+2：_释放狂野魔法时,法杖会被视为原等级_+3，最高+5_。\n\n_+3：_释放狂野魔法时,法杖会被视为原等级_+3或+4，最高+6_。\n\n_+4：_释放狂野魔法时,法杖会被视为原等级_+4，最高+7_。
actors.hero.talent.fire_everything.title=法力倾泻
actors.hero.talent.fire_everything.desc=_+0：_狂野魔法最多释放_4次_。\n\n_+1：_狂野魔法最多释放_5次_，每根法杖有25%概率释放3次。\n\n_+2：_狂野魔法最多释放_6次_，每根法杖有50%概率释放3次。\n\n_+3：_狂野魔法最多释放_7次_，每根法杖有75%概率释放3次。\n\n_+4：_狂野魔法最多释放_8次_，每根法杖有100%概率释放3次。\n\n"碰到路障的最好处理方式就是无情地捅烂他。"
actors.hero.talent.conserved_magic.title=节能施法
actors.hero.talent.conserved_magic.desc=_+1：_狂野魔法每次释放法杖消耗充能从0.5点下降至_0.33_点，狂野魔法有_25%概率_不花回合。\n\n_+2：_狂野魔法每次释放法杖消耗充能从0.5点下降至_0.225_点，狂野魔法有_50%概率_不花回合。\n\n_+3：_狂野魔法每次释放法杖消耗充能从0.5点下降至_0.15_点，狂野魔法有_75%概率_不花回合。\n\n_+4：_狂野魔法每次释放法杖消耗充能从0.5点下降至_0.1_点，狂野魔法有_100%概率_不花回合。
actors.hero.talent.eldritch_blessing.title=惊骇祝福
actors.hero.talent.eldritch_blessing.desc=_+1:_ 狂野魔法最多额外释放_2次_，但所有魔杖效果都_被诅咒_。\n\n_+2:_ 狂野魔法最多额外释放_3次_，但所有魔杖效果都_被诅咒_。诅咒效果对使用者造成更小的危害。\n\n_+3:_ 狂野魔法最多额外释放_3次_，但所有魔杖效果都_被诅咒_。诅咒效果更强，对使用者造成更小的危害。稀有效果出现频率增加_10%_。\n\n_+4:_ 狂野魔法最多额外释放_4次_，但所有魔杖效果都_被诅咒_。诅咒效果更强，对使用者造成更小的危害。稀有效果出现频率增加_10%_。\n\n"诅咒魔法多好玩，别嫌弃。"
actors.hero.talent.telefrag.title=传送挤压
actors.hero.talent.telefrag.desc=_+0：_当法师传送回信标与另一角色发生碰撞时，法师对其造成_10-15点_伤害，但自己会受到_5点伤害_。\n\n_+1：_当法师传送回信标与另一角色发生碰撞时，法师对其造成_20-30点_伤害，但自己会受到_10点伤害_。\n\n_+2：_当法师传送回信标与另一角色发生碰撞时，法师对其造成_30-45点_伤害，但自己会受到_15点伤害_。\n\n_+3：_当法师传送回信标与另一角色发生碰撞时，法师对其造成_40-60点_伤害，但自己会受到_15点伤害_。\n\n_+4：_当法师传送回信标与另一角色发生碰撞时，法师对其造成_50-75点_伤害，但自己会受到_20点伤害_。\n\n玩家不会死于这个天赋的伤害，且该伤害可由魔抗效果减免。
actors.hero.talent.remote_beacon.title=彼方信标
actors.hero.talent.remote_beacon.desc=_+1:_法师可以在_4格_内的任意一处放置一个信标。\n\n_+2:_法师可以在_8格_内的任意一处放置一个信标。\n\n_+3:_法师可以在_12格_内的任意一处放置一个信标。\n\n_+4:_法师可以在_16格_内的任意一处放置一个信标。\n\n法师不能在其无法抵达的位置放置信标。\n\n“没有比在敌人周围传送绕圈更好玩的了…”
actors.hero.talent.longrange_warp.title=长途传送
actors.hero.talent.longrange_warp.desc=_+0：_法师能够消耗_150%的充能_以跨层传送。\n\n_+1：_法师能够消耗_125%的充能_以跨层传送。\n\n_+2：_法师能够消耗_100%的充能_以跨层传送。\n\n_+3：_法师能够消耗_75%的充能_以跨层传送。\n\n_+4：_法师能够消耗_50%的充能_以跨层传送。\n\n法师不能借助此天赋离开封锁的楼层。
actors.hero.talent.chrono_screw.title=时间螺钉
actors.hero.talent.chrono_screw.desc=_+1:_ 法师在传送后获得_1.0回合_时间气泡。\n\n_+2:_ 法师在传送后获得_2.5回合_时间气泡。\n\n_+3:_ 法师在传送后获得_4.0回合_时间气泡。\n\n_+4:_ 法师在传送后获得_5.5回合_时间气泡。\n\n"砸瓦鲁多！"
actors.hero.talent.cached_rations.title=备用口粮
actors.hero.talent.cached_rations.desc=_+1：_盗贼在探索地牢的前期可以从宝箱中找到 _4块补给口粮_。\n\n_+2：_盗贼在探索地牢的前期可以从宝箱中找到 _6块补给口粮_。\n\n补给口粮可以快速吃下，提供中等饱食度，恢复5血量，并恢复1暗影斗篷充能。
actors.hero.talent.cached_rations.comment="挨饿？那是什么？我食物多的是！"
actors.hero.talent.thiefs_intuition.title=窃贼直觉
actors.hero.talent.thiefs_intuition.desc=_+0：_ _装备戒指时_盗贼立即鉴定其种类，并以_2倍_的速度鉴定之。\n\n_+1：_ _装备戒指和神器_时，盗贼将立刻鉴定之。在_拾取戒指时_鉴定其种类。在初次拾取戒指和神器时，有33%概率检测诅咒。\n\n_+2：_盗贼在_捡起戒指和神器_时鉴定它们。\n\n"如果你嫌2倍速还不够快……"
actors.hero.talent.sucker_punch.title=阴险打击
actors.hero.talent.sucker_punch.desc=_+1：_初次伏击一名敌人时盗贼将造成_ 2 点额外伤害_。\n\n_+2：_初次伏击一名敌人时盗贼将造成_ 3 点额外伤害_。
actors.hero.talent.mending_shadows.title=暗影庇护
actors.hero.talent.mending_shadows.desc=_+1：_盗贼在斗篷激活时，_每2回合_获得1点护盾，_最多 3 点_。如果不处于极度饥饿，_每4回合_还会恢复1点生命。\n\n_+2：_盗贼在斗篷激活时，_每1回合_获得1点护盾，_最多 5 点_。如果不处于极度饥饿，_每2回合_还会恢复1点生命。\n\n"-叠甲有啥用？怎么不让我回血呢？-行吧，如果你确实是这样想的。"
actors.hero.talent.faraday_cage.title=法拉第笼
actors.hero.talent.faraday_cage.desc=_+1:_ 盗贼免疫电场。电场增加_10%_持续时间。\n\n_+2_: 盗贼免疫电场，且只受到50%雷电伤害和来自电元素的伤害。电场增加_20%_持续时间。
actors.hero.talent.faraday_cage.comment="这陷阱放的烟花挺好玩的。"
actors.hero.talent.faraday_cage.comment_rk="朕的法杖本不应有真空期！"
actors.hero.talent.mystical_meal.title=秘术祭食
actors.hero.talent.mystical_meal.desc=_+1：_盗贼进食仅消耗1回合（补给口粮不消耗回合），并提供_5回合神器充能_.\n\n_+1：_盗贼进食仅消耗1回合（补给口粮不消耗回合），并提供_8回合神器充能_。\n\n这个天赋的效果可叠加。\n\n“一口回斗篷三分之二充能多好……”
actors.hero.talent.inscribed_stealth.title=卷藏匿影
actors.hero.talent.inscribed_stealth.desc=_+1:_ 盗贼在阅读卷轴后获得 _6 回合_ 的隐身。\n\n_+2:_ 盗贼在阅读卷轴后获得 _9 回合_ 的隐身。\n\n阅读升级、嬗变、附魔或其炼金物品时，隐身持续时间加倍。\n\n对产量很大的炼金物品，这一天赋根据产生物品数量有概率触发。
actors.hero.talent.inscribed_stealth.comment="谁需要像斗篷充能或药水这样愚蠢的东西，当你可以阅读卷轴并从任何情况中脱身？"
actors.hero.talent.mystical_upgrade.title=双持之舞
actors.hero.talent.mystical_upgrade.desc=_+1:_ 在使用法杖后使用投掷武器不消耗回合。\n\n_+1:_ 在使用法杖后使用投掷武器不消耗回合，在使用投掷武器后使用法杖也不消耗回合。\n\n这个能力不能套娃。
actors.hero.talent.mystical_upgrade.comment="有人觉得他们用手里剑和焰浪能在眨眼间干掉敌人。但他们没意识到，这是最后一块拼图。"\n-双持之舞盗贼
actors.hero.talent.mystical_upgrade.comment_huntress="挡我者死。"\n-双持之舞女猎手
actors.hero.talent.wide_search.title=广域搜索
actors.hero.talent.wide_search.desc=_+1：_盗贼的搜索范围由方形 5x5 增幅至 _7x7_。\n\n_+2：_盗贼的搜索范围由方形 5x5 增幅至 _9x9_。
actors.hero.talent.wide_search.comment="每一块砖都看得清清楚楚。"\n- 广域搜索盗贼
actors.hero.talent.wide_search.meta_desc=_倘若这个天赋由其他英雄获得_，英雄的搜索范围将变为+1/+2天赋的5x5/7x7。
actors.hero.talent.silent_steps.title=无声步伐
actors.hero.talent.silent_steps.desc=_+1：_盗贼不会惊醒距其_3格或更远_的敌人。\n\n_+2：_盗贼不会惊醒_未与其相邻_的敌人。
actors.hero.talent.silent_steps.comment="现在你可以对着身旁的敌人尽情发病而不用担心被暴揍了。"
actors.hero.talent.silent_steps.comment_huntress="我想知道它们为啥不打先手。"
actors.hero.talent.rogues_foresight.title=盗贼直觉
actors.hero.talent.rogues_foresight.desc=_+1:_ 当盗贼进入有隐藏房间的新楼层时，有75%概率觉察该层有隐藏房间。不搜索时注意到秘密概率提升50%。\n\n_+2:_ 当盗贼进入有隐藏房间的楼层时，有100%概率觉察该层有隐藏房间。不搜索时注意到秘密概率提升500%
actors.hero.talent.rogues_foresight.comment="找秘密房间还行。这样更稳定些。"
actors.hero.talent.efficient_shadows.title=高效暗影
actors.hero.talent.efficient_shadows.desc=_+1:_ 暗影斗篷失去50%额外充能速度，但是每点充能可以隐身_6回合_。\n\n_+2:_ 暗影斗篷失去50%额外充能速度，但是每点充能可以隐身_7回合_。\n\n"隐身才是盗贼职业的核心。"
actors.hero.talent.efficient_shadows.meta_desc=_如果不同英雄获得此天赋_，当他们的隐身被解除时，会额外获得一回合的隐身；在+2时，当这个额外的隐身结束时，英雄的神器会略微充能。
actors.hero.talent.light_cloak.title=轻便斗篷
actors.hero.talent.light_cloak.desc=_+1：_盗贼不装备暗影斗篷也能使用其隐身技能，但未装备时斗篷的充能速率会降至_33%_。\n\n_+2：_盗贼不装备暗影斗篷也能使用其隐身技能，但未装备时斗篷的充能速率会降至_67%_。\n\n_+3：_盗贼不装备暗影斗篷也能使用其隐身技能，未装备时斗篷的充能速率_不降低_。\n\n"神器太多时可以用这个来缓解一下选择困难症。"
actors.hero.talent.light_cloak.comment_rogue="因为实际装备斗篷太麻烦了。"
actors.hero.talent.light_cloak.meta_desc=_倘若这个天赋由其他英雄获得_，所有神器的充能速度将会在+1/+2/+3天赋时提升10/20/30%。
actors.hero.talent.enhanced_rings.title=戒指强化
actors.hero.talent.enhanced_rings.desc=_+1：_使用神器后的_3回合_内，盗贼装备的所有戒指都会提升2级。\n\n_+2：_使用神器后的_6回合_内，盗贼装备的所有戒指都会提升2级。\n\n_+3：_使用神器后的_9回合_内，盗贼装备的所有戒指都会提升2级。\n\n"拿不到+4戒指的话，就用这个天赋爽爽好了。"
actors.hero.talent.trapper_mastery.title=陷阱大师
actors.hero.talent.trapper_mastery.desc=_+1:_ 如果盗贼踩到陷阱，它会被_回收_而不是被触发。该效果有_180回合_冷却时间。\n\n_+2:_如果盗贼踩到陷阱，它将被_回收_而不是被触发。此效果有_160回合_冷却时间。\n\n_+3:_ 如果盗贼踩到陷阱，它将被_回收_而不是被触发。此效果有_140回合_冷却时间。\n\n"如果雷暴陷阱不是你旅途中的障碍，那么此天赋适合你。"
actors.hero.talent.enhanced_lethality.title=直击要害
actors.hero.talent.enhanced_lethality.desc=_+1：_刺客每级准备可以直接斩杀敌人的生命阈值由3/10/20/50%提升至_4/13/27/67%_。\n\n_+2：_刺客每级准备可以直接斩杀敌人的生命阈值由3/10/20/50%提升至_5/17/33/83%_。\n\n_+3：_刺客每级准备可以直接斩杀敌人的生命阈值由3/10/20/50%提升至_6/20/40/100%_。
actors.hero.talent.assassins_reach.title=空间思维
actors.hero.talent.assassins_reach.desc=_+1：_盗贼可以使用他的斗篷充能立即传送到所需位置，每格距离花费_1.33充能_。\n\n_+2：_盗贼可以使用他的斗篷充能立即传送到所需位置，每格距离花费_1.15充能_。\n\n_+3：_盗贼可以使用他的斗篷充能立即传送到所需位置，每格距离花费_1充能_。\n\n使用这个天赋可以提高50%的准备效率。\n\n"有时你只需要稍后返回一个点。这个天赋是给你准备的。"
actors.hero.talent.bounty_hunter.title=适应克服
actors.hero.talent.bounty_hunter.desc=_+1：_刺杀有额外的概率造成更高的伤害。\n\n_+2：_刺杀有额外的概率造成更高的伤害。如果敌人受到足够的伤害，伤害法杖可以触发_刺杀_。\n\n_+3：_刺杀有额外的概率造成更高的伤害。如果敌人受到足够的伤害，伤害法杖可以触发_刺杀_。在做了任何会驱散隐身效果的动作后，刺客会有_额外的隐身回合_。\n这不能通过连锁获得，如果刺客驱散隐身效果前有准备阶段，它将减少_1_。\n\n每次只能用法杖刺杀一个敌人。\n\n"如果你不能在真正的武器上使用你的武器技能，你还算是一个杀手吗?"
actors.hero.talent.bounty_hunter.comment="准备了那么多却得不到报酬有什么用？时间就是金钱！"
actors.hero.talent.lethal_momentum_2.title=手起刀落
actors.hero.talent.lethal_momentum_2.desc=_+1：_当刺客用刺杀技能进行致命一击时，有_50%概率_不消耗回合，后续的致命一击也不消耗回合。\n\n_+2：_当刺客用刺杀技能进行致命一击时，有_75%概率_不消耗回合，后续的致命一击也不消耗回合。\n\n_+3：_当刺客用刺杀技能进行致命一击时，有_100%概率_不消耗回合，后续的致命一击也不消耗回合。\n\n这种机制甚至对暴徒、尸群和受到死亡印记影响的敌人也很有效。
actors.hero.talent.lethal_momentum_2.comment="完全独特的天赋，源于非常新颖的想法，然后变得愚蠢。"
actors.hero.talent.darkening_steps.title=活力步伐
actors.hero.talent.darkening_steps.desc=_+1:_ 当刺客成功刺杀时，将获得_2回合_神器充能。\n\n_+2:_ 当刺客成功刺杀时，将获得_4回合_神器充能。\n\n_+3:_ 当刺客成功刺杀时，将获得_6回合_神器充能。\n\n这个天赋也可以通过刚刚准备好的击杀触发，但只有_67%_几率。\n\n"连锁刺杀很难，因为它使用了斗篷充能。让我们尝试提升一点我们斗篷的可持续性。"
actors.hero.talent.evasive_armor.title=灵猴之护
actors.hero.talent.evasive_armor.desc=_+1：_处于逸动状态时，疾行者的力量每超过护甲需求1点便获得_6.7%_闪避提升。\n\n_+2：_处于逸动状态时，疾行者的力量每超过护甲需求1点便获得_13.3%_闪避提升。\n\n_+3：_处于逸动状态时，疾行者的力量每超过护甲需求1点便获得_20%_闪避提升。
actors.hero.talent.projectile_momentum.title=飞速投掷
actors.hero.talent.projectile_momentum.desc=_+0：_处于逸动状态时，疾行者的魔杖提升_ 1_级。\n\n_+1：_处于逸动状态时，疾行者使用投掷武器时获得额外的_ 20% 命中与 15% 伤害_，魔杖提升_ 2_级。\n\n_+2：_处于逸动状态时，疾行者使用投掷武器时获得额外的_ 40% 命中与 30% 伤害_，魔杖提升_ 3_级。\n\n_+3：_处于逸动状态时，疾行者使用投掷武器时获得额外的_ 60% 命中与 45% 伤害_，魔杖提升_ 4_级。\n\n"这不比法师好玩？"
actors.hero.talent.speedy_stealth.title=无人之境
actors.hero.talent.speedy_stealth.desc=_+1：_疾行者在隐身时，每回合获得3层动量。\n\n_+2：_除获得+1的增益外，当疾行者隐身时，逸动效果持续的回合数不会下降，并且每1回合隐身将会减少1点产生逸动能量所需的恢复时间.\n\n_+3：_除获得+1和+2的增益外，当疾行者隐身时，他视为处于逸动状态。
actors.hero.talent.fast_recovery.title=长跑选手
actors.hero.talent.fast_recovery.desc=_+1：_逸动状态持续时间增加_16%_。\n\n_+2：_逸动状态持续时间增加_33%_。\n\n_+3：_逸动状态持续时间增加_50%_。\n\n"有些人抱怨作者不能持久，不知道他们从哪听来的。"
actors.hero.talent.olympic_stats.title=奥运属性
actors.hero.talent.olympic_stats.desc=_+1:_ 疾行者可以从2x以3x速度奔跑，但力竭持续时间增加_50%_。\n\n_+2:_ 疾行者可以从2x以3x速度奔跑，但力竭持续时间增加_40%_.\n\n_+3:_ 疾行者可以从2x速度以3x速度奔跑，但力竭持续时间增加_30%_。最大动量增加到_15_。\n\n"有什么比逸动更超模？更快！甚至更多逸动！"
actors.hero.talent.energon_fusion.title=聚变能源
actors.hero.talent.energon_fusion.desc=_+1:_ 在备用模式下，攻击将使暗影之熠获得 _0.17回合 _的神器和法杖充能。\n\n_+2:_ 在备用模式下，攻击将使暗影之熠获得 _0.34回合 _的神器和法杖充能。\n\n_+3:_ 在备用模式下，攻击将使暗影之熠获得 _0.50回合 _的神器和法杖充能。\n\n"射完了继续射。"
actors.hero.talent.laser_precision.title=瘟疫之源
actors.hero.talent.laser_precision.desc=_+1:_ 带有负面状态的敌人在移动时会传播他们身上的状态。\n\n_+2:_ 带有负面状态的敌人在移动时会传播他们身上的状态，且受到来自负面状态的伤害减半。\n\n_+3:_ 带有负面状态的敌人在移动时会传播他们身上的状态，且受到来自负面状态的伤害减半。传染的负面状态有额外的50%持续时间。\n\n负面状态在5x5的范围内传播。\n\n"只要把全城人都弄死，暗杀目标自然就完成了。"
actors.hero.talent.eradicating_charge.title=毁灭充能
actors.hero.talent.eradicating_charge.desc=_+1:_ 在备用模式下射击提供_1点护盾_，且有_10%_概率造成3回合缓慢。\n\n_+2:_ 在备用模式下射击提供_2点护盾_，且有_20%_概率造成3回合缓慢。\n\n_+3:_ 在备用模式下射击提供_3点护盾_，且有_30%_概率造成3回合缓慢。\n\n"这么暴力的能量怎么还没把你熔了。"
actors.hero.talent.void_wrath.title=虚空之怒
actors.hero.talent.void_wrath.desc=_+1:_ 暗影之熠在变形时获得_75%_伤害减免。\n\n_+2:_ 在+1的基础上，点燃变形期间对他发起攻击的敌人。\n\n_+3:_ 在+2的基础上，击杀带有负面状态的敌人会治愈他9点生命值。\n\n"这点伤害不算什么。"
actors.hero.talent.mechanical_power.title=机械动力
actors.hero.talent.mechanical_power.desc=_+1:_ 暗影之熠对物理攻击有25%的伤害减免。\n\n_+2:_ 暗影之熠对物理攻击有25%的伤害减免，当他杀死任何敌人时，他会获得等同于他等级的树肤效果，该效果每4回合衰减\n\n_+3:_暗影之熠对物理攻击有25%的伤害减免，他杀死任何敌人，他会获得等同于他等级的树肤效果，该效果每4回合衰减。攻击会在_3回合_内禁用敌人的魔法能力。\n\n一些有神力的实体对+3效果免疫。\n\n"看到这个术士？去打他的脸。这样做。只是为了表明他的诡计不会对你不起作用。"
actors.hero.talent.hasty_retreat.title=猜我在哪
actors.hero.talent.hasty_retreat.desc=_+1：_盗贼在闪现后获得_2回合_的极速和隐身。\n\n_+2：_盗贼在闪现后获得_3回合_的极速和隐身。\n\n_+3：_盗贼在闪现后获得_4回合_的极速和隐身。\n\n_+4：_盗贼在闪现后获得_5回合_的极速和隐身。
actors.hero.talent.body_replacement.title=替身掩护
actors.hero.talent.body_replacement.desc=_+1：_闪现后，盗贼会留下一个有_ 20 点生命，1-5 点护甲_的替身木桩。\n\n_+2：_闪现后，盗贼会留下一个有_ 40 点生命， 2-10 点护甲_的替身木桩。\n\n_+3：_闪现后，盗贼会留下一个有_ 60 点生命，3-15 点护甲_的替身木桩。\n\n_+4：_闪现后，盗贼会留下一个有_ 80 点生命， 4~20 点护甲_的替身木桩。\n\n同一时间只可存在一个替身木桩。
actors.hero.talent.shadow_step.title=烟幕潜行
actors.hero.talent.shadow_step.desc=_+1：_盗贼隐身时，烟幕爆炸可以瞬间发动，并且充能花费_降低 20%_。隐身时的烟幕爆炸不会致盲敌人，也不会触发其他天赋。\n\n_+2：_盗贼隐身时，烟幕爆炸可以瞬间发动，并且充能花费会_降低 36%_。隐身时的烟幕爆炸不会致盲敌人，也不会触发其他天赋。\n\n_+3：_盗贼隐身时，烟幕爆炸可以瞬间发动，并且充能花费会_降低 50%_。隐身时的烟幕爆炸不会致盲敌人，也不会触发其他天赋。\n\n_+4：_盗贼隐身时，烟幕爆炸可以瞬间发动，并且充能花费会_降低 60%_。隐身时的烟幕爆炸不会致盲敌人，也不会触发其他天赋。
actors.hero.talent.frigid_touch.title=极寒之触
actors.hero.talent.frigid_touch.desc=_+1:_ 在闪现后，盗贼使他视野内充满霜火，持续_1回合_。\n\n_+2:_ 在闪现后，盗贼使他视野内充满霜火，持续_3回合_。\n\n_+3:_ 在闪现后，盗贼使他视野内充满霜火，持续_5回合_。\n\n_+4:_ 在闪现后，盗贼使他视野内充满霜火，持续_7回合_。\n\n当这个效果持续时，盗贼被灌注霜冻之力的强化。\n替身木桩免疫霜火。\n\n“像我一样的大人应该被冻上天堂”
actors.hero.talent.fear_the_reaper.title=恐惧蔓延
actors.hero.talent.fear_the_reaper.desc=_+1：_拥有夺命印记的敌人在生命值降为 0 时会获得_眩晕_状态。\n\n_+2：_拥有夺命印记的敌人在生命值降为 0 时会获得_眩晕和恐惧_状态。\n\n_+3：_拥有夺命印记的敌人在生命值降为 0 时会获得_眩晕和恐惧_状态，且3格内的其他敌人也会获得_眩晕_状态。\n\n_+4：_拥有夺命印记的敌人在生命值降为 0 时，他和3格内的其他敌人获得_眩晕和恐惧_状态。\n\n“有这天赋你就能看着敌人抱头鼠窜了。”
actors.hero.talent.deathly_durability.title=死神外衣
actors.hero.talent.deathly_durability.desc=_+0：_死于夺命印记的敌人会赋予盗贼其被施加印记时生命值 _13%_ 的护盾值。\n\n_+1：_死于夺命印记的敌人会赋予盗贼其被施加印记时生命值 _25%_ 的护盾值。\n\n_+2：_死于夺命印记的敌人会赋予盗贼其被施加印记时生命值 _38%_ 的护盾值。\n\n_+3：_死于夺命印记的敌人会赋予盗贼其被施加印记时生命值 _50%_ 的护盾值。\n\n_+4：_死于夺命印记的敌人会赋予盗贼其被施加印记时生命值 _63%_ 的护盾值。
actors.hero.talent.double_mark.title=双重印记
actors.hero.talent.double_mark.desc=_+1:_ 在第一个标记存在时标记第二个目标，充能消耗_降低50%_。\n\n_+2:_ 在第一个标记存在时标记第二个目标_不消耗充能_。\n\n_+3:_ 在第一个标记存在时标记第二个目标_不消耗充能_。在两个标记存在时标记第三个目标，充能消耗_降低33%_。\n\n_+4:_ 在第一个标记存在时标记第二个目标_不消耗充能_。在两个标记存在时标记第三个目标，充能消耗_降低55%_。\n\n"搞快点，你是来传播死亡的。"
actors.hero.talent.cataclysmic_energy.title=灾变威能
actors.hero.talent.cataclysmic_energy.desc=_+1:_ 夺命印记持续时间延长至_7回合_，不再提供伤害增益，但印记目标的生命值归零时会爆炸。\n\n_+2:_ 夺命印记持续时间延长至_8回合_，不再提供伤害增益，但印记目标的生命值归零时会爆炸。\n\n_+3:_ 夺命印记持续时间延长至_9回合_，不再提供伤害增益，但印记目标的生命值归零时会爆炸。\n\n_+4:_ 夺命印记持续时间延长至_10回合_，不再提供伤害增益，但印记目标的生命值归零时会爆炸。\n印记目标会持续爆炸，直到印记消失。\n\n“盗贼也要群攻！”
actors.hero.talent.shadow_blade.title=影铸之刃
actors.hero.talent.shadow_blade.desc=_+1：_暗影映像获得其主人武器的_10%_的每回合伤害能力，有_25%_概率使用武器的附魔。\n\n_+2：_暗影映像获得其主人武器的_20%_的每回合伤害能力，有_50%_概率使用武器的附魔。\n\n_+3：_暗影映像获得其主人武器的_30%_的每回合伤害能力，有_75%_概率使用武器的附魔。\n\n_+4：_暗影映像获得其主人武器的_40%_的每回合伤害能力，有_100%_概率使用武器的附魔。
actors.hero.talent.cloned_armor.title=影塑之甲
actors.hero.talent.cloned_armor.desc=_+1：_暗影映像获得其主人护甲_20%_的防御力，有_25%_概率使用护甲的刻印。\n\n_+2：_暗影映像获得其主人护甲_40%_的防御力，有_50%_概率使用护甲的刻印。\n\n_+3：_暗影映像获得其主人护甲_60%_的防御力，有_75%_概率使用护甲的刻印。\n\n_+4：_暗影映像获得其主人护甲_80%_的防御力，有_100%_概率使用护甲的刻印。
actors.hero.talent.perfect_copy.title=完美克隆
actors.hero.talent.perfect_copy.desc=_+0：_盗贼可以瞬间与_1格_距离以内的映像交换位置。\n\n_+1：_暗影映像额外获得其主人_13%_的最大生命值。盗贼可以瞬间与_2格_距离以内的映像交换位置。\n\n_+2：_暗影映像额外获得其主人_25%_的最大生命值。盗贼可以瞬间与_4格_距离以内的映像交换位置。\n\n_+3：_暗影映像额外获得其主人_38%_的最大生命值。盗贼可以瞬间与_6格_距离以内的映像交换位置。\n\n_+4：_暗影映像额外获得其主人_50%_的最大生命值。盗贼可以瞬间与_8格_距离以内的映像交换位置。\n\n"你以为你只是在解决一个影子，但实际上你在对抗一个实体……"
actors.hero.talent.dar_magic.title=忍者之道
actors.hero.talent.dar_magic.desc=_+1:_ 暗影映像可以射出_25%伤害_的苦无以远程攻击。\n\n_+2:_ 暗影映像可以射出_50%伤害_的苦无以远程攻击。\n\n_+3:_ 暗影映像可以闪现到他的目标身边进行打击，这次攻击造成_75%伤害_。\n\n_+4:_ 暗影映像可以闪现到他的目标身边进行打击，随后立即闪回到本体的位置。\n\n"这个影分身完全可以取代弓箭和回旋镖。"
actors.hero.talent.natures_bounty.title=自然馈赠
actors.hero.talent.natures_bounty.desc=_+1：_女猎手在探索地牢的前期可以从高草中找到 _6 个浆果_。\n\n_+2：_女猎手在探索地牢的前期可以从高草中找到 _9 个浆果_。\n\n浆果可以快速吃下，恢复少量饥饿，并有可能含有一个有用的种子。
actors.hero.talent.survivalists_intuition.title=生存直觉
actors.hero.talent.survivalists_intuition.desc=_+1：_女猎手鉴定任何装备的速度提升为原来的_ 2.5 倍_，并有_20%_概率确定捡起的物品是否被诅咒.\n\n_+2：_女猎手鉴定任何装备的速度提升为原来的_ 3.75 倍_，并有_40%_概率确定捡起的物品是否被诅咒。
actors.hero.talent.survivalists_intuition.comment_rk="朕无需烦恼诅咒。"
actors.hero.talent.followup_strike.title=追加打击
actors.hero.talent.followup_strike.desc=_+1：_当女猎手用她的弓或其它投掷武器击中敌人时，她对该敌人的下一次近战攻击将造成_ 3点额外伤害_。\n\n_+2：_当女猎手用她的弓或其他投掷武器击中敌人时，她对该敌人的下一次近战攻击将造成_ 4-5点额外伤害_。
actors.hero.talent.natures_aid.title=斥候屏障
actors.hero.talent.natures_aid.desc=_+1:_ 在一次成功的_超级射击_后，女猎手获得_4点护盾_。\n\n_+2:_ 在一次成功的_超级射击_后，女猎手获得_6点护盾_。
actors.hero.talent.nature_aid_2.title=绿茵主场
actors.hero.talent.nature_aid_2.desc=_+1:_ 当女猎手处于践踏过的草地上时，她恢复生命值的速度增加_35%_。\n\n_+2:_ 当女猎手处于践踏过的草地上时，她恢复生命值的速度增加_70%_。\n\n"缩餐节食好像没那么恐怖了。"
actors.hero.talent.invigorating_meal.title=活力一餐
actors.hero.talent.invigorating_meal.desc=_+1：_女猎手进食只耗费1回合（食用浆果不耗费回合）并获得_3回合_的激素涌动.\n\n_+2：_女猎手进食只耗费1回合（食用浆果不耗费回合）并获得_5回合_的激素涌动。
actors.hero.talent.liquid_nature.title=液蕴自然
actors.hero.talent.liquid_nature.desc=_+1:_ 当女猎手喝下或投掷药水时，周围区域会长出 _最多 5 块高草丛_，并使相邻敌人被定身 _2 回合_。\n\n_+2:_ 当女猎手喝下或投掷药水时，周围区域会长出 _最多 8 块高草丛_，并使相邻敌人被定身 _3 回合_。\n\n使用力量、经验及其炼金物品时，草地数量和定身持续时间会加倍。\n这个效果也可以通过饮用水袋触发，其效果取决于露水的消耗量；10滴露水为100%效果。
actors.hero.talent.rejuvenating_steps.title=复春步伐
actors.hero.talent.rejuvenating_steps.desc=_+1：_当女猎手踏上矮草或灰烬时，它们会复生为高草，并立即被女猎手踩踏。这个天赋有_5回合冷却时间_。\n\n_+2：_当女猎手踏上矮草或灰烬时，它们会复生为高草，并立即被女猎手踩踏。这个天赋有_2.5 回合冷却时间_。\n\n若被动恢复效果被禁用或英雄长时间内没有获得经验，此天赋只会生出枯草。\n\n“有些人认为复春步伐是破碎地牢里面最强的二阶天赋，这就是为他们准备的。”
actors.hero.talent.heightened_senses.title=敏锐感知
actors.hero.talent.heightened_senses.desc=_+1：_女猎手能感知到_3格以内_的敌人。\n\n_+2：_女猎手能感知到_4格以内_的敌人。
actors.hero.talent.heightened_senses.comment="索敌弓快乐局必备。"
actors.hero.talent.heightened_senses.comment_rogue="哟，试试解离？"
actors.hero.talent.durable_projectiles.title=矢石保养
actors.hero.talent.durable_projectiles.desc=_+1：_女猎手的投掷武器额外获得_ 125%耐久度_。\n\n_+2：_女猎手的投掷武器额外获得_ 188%耐久度_。
actors.hero.talent.durable_projectiles.comment="我相信没有人会喜欢耐久度设定。"
actors.hero.talent.scourging_the_universe.title=斥候身法
actors.hero.talent.scourging_the_universe.desc=_+1:_ 女猎手对魔法攻击有和对物理攻击相同的闪避概率。\n\n_+2:_ 女猎手对魔法攻击有和对物理攻击相同的闪避概率。对远程攻击，女猎手获得_50%_额外闪避值。
actors.hero.talent.scourging_the_universe.comment="子弹时间！"
actors.hero.talent.scourging_the_universe.comment_rogue="若我有幸碰到另一个法师，我绝对不会输。"
actors.hero.talent.point_blank.title=抵近射击
actors.hero.talent.point_blank.desc=_基础_：投掷武器和灵能弓近战-50%命中，远程+50%命中。\n\n_+1：_当女猎手近身使用投武或其短弓时，命中率将_仅降低30%_，远程攻击命中提高+70%。\n\n_+2：_当女猎手近身使用投武或其短弓时，命中率将_仅降低10%_，远程攻击命中提高+90%。\n\n_+3：_当女猎手近身使用投武或其短弓时，命中率将_提升10%_，远程攻击命中提高+110%。
actors.hero.talent.point_blank.comment="投掷武器很酷。你知道什么更好吗？那就是不会打空的投掷武器！"
actors.hero.talent.seer_shot.title=射击预备
actors.hero.talent.seer_shot.desc=_+1:_ 超级射击的初始能量从+32%提升至_+45%_，距离因子从+13%提升至_+18%_。\n\n_+2:_ 超级射击的初始能量从+32%提升至_+58%_，距离因子从+13%提升至_+23%_。\n\n_+3:_ 超级射击的初始能量从+32%提升至_+71%_，距离因子从+13%提升至_+28%_。
actors.hero.talent.seer_shot.meta_desc=_倘若这个天赋由其他英雄获得_，那么所有投掷武器将会生效这个天赋。
actors.hero.talent.auto_reload.title=自动重载
actors.hero.talent.auto_reload.desc=_+1:_ 女猎手可以用液金自动修复她投掷的武器以防止它们损坏。\n\n_+2:_ 女猎手可以用液金自动修复她的投掷武器以防止它们损坏。自动修复使投掷武器的等级+1，持续3回合。\n\n_+3:_ 女猎手可以用液金自动修复她的投掷武器以防止它们损坏。自动修理使投掷武器的等级+1，持续3回合。从炼金术中获得的液金的数量增加了60%。\n\n"一旦添加了修复，那么添加自动只是时间问题。这就是 Minecraft 中的一切工作方式。"
actors.hero.talent.farsight.title=鹰眼远视
actors.hero.talent.farsight.desc=_+0：_狙击手的视野范围_扩大25%_。\n\n_+1：_狙击手的视野范围_扩大50%_。\n\n_+2：_狙击手的视野范围_扩大75%_。\n\n_+3：_狙击手的视野范围_扩大100%_。\n\n"没人能逃出我的视线…还有我的+10弓。"
actors.hero.talent.shared_enchantment.title=联动附魔
actors.hero.talent.shared_enchantment.desc=_+1：_ 投掷武器 _有50%几率_ 共享狙击手的灵能弓上的附魔。\n\n_+2：_ 投掷武器 _有100%几率_ 共享狙击手的灵能弓上的附魔。\n\n_+3：_ 投掷武器以 _150%效率_ 共享狙击手的灵能弓上的附魔。\n\n“爆炸手里剑是不是很棒？现在附魔十字弩也行了！”
actors.hero.talent.shared_upgrades.title=联动升级
actors.hero.talent.shared_upgrades.desc=_+0：_当狙击手使用一件升级过的投掷武器攻击时，对投掷武器的每一阶，其上的每级升级都会使狙击手的特殊攻击伤害_提升2.5%_。\n\n_+1：_当狙击手使用一件升级过的投掷武器攻击时，对投掷武器的每一阶，其上的每级升级都会使狙击手的特殊攻击伤害_提升5%_。\n\n_+2：_当狙击手使用一件升级过的投掷武器攻击时，对投掷武器的每一阶，其上的每级升级都会使狙击手的特殊攻击伤害_提升10%_。\n\n_+3：_当狙击手使用一件升级过的投掷武器攻击时，对投掷武器的每一阶，其上的每级升级都会使狙击手的特殊攻击伤害_提升15%_。\n\n_-_使用此天赋后，投掷武器每升1级增加狙击手标记持续时间1回合。\n\n"狙击手的一发爆头本身就是对敌人的强力嘲讽。"
actors.hero.talent.multishot.title=多重射击
actors.hero.talent.multishot.desc=_+1:_ 如果狙击印记的目标被击杀，狙击印记的持续时间将被刷新，并且可以自由瞄准新的目标。当自由射击激活时，刷新的印记可以和正常的印记叠加。\n\n_+2：_ 除了+1效果，狙击手可以同时标记_1个_额外的敌人。此外自由标记时间提升至_2_倍。\n\n_+3：_ 除了+1效果，狙击手可以同时标记_2个_额外的敌人。此外自由标记时间提升至_3_倍。  \n自由瞄准可以和狙击标记堆叠\n\n使用狙击印记标记多个目标时，狙击手的技能同时作用于所有目标。\n瞄准可以穿过被标记的目标。  \n\n"你从不知道自己想要什么，但知道自己不想失去什么。"
actors.hero.talent.multishot.comment="你从未想过自己会需要的天赋，但现在没了它你就不想玩了。"
actors.hero.talent.archery_mark.title=射箭标志
actors.hero.talent.archery_mark.desc=_+1:_ 灵能短弓的箭会反弹到最近的敌人，并造成_20%_伤害。\n\n_+2:_ 灵能短弓的箭会反弹到最近的敌人，并造成_40%_伤害。\n\n_+3:_ 灵能短弓的箭会反弹到最近的敌人，并造成_60%_伤害。\n\n"轻松攻击两个敌人！"
actors.hero.talent.durable_tips.title=持久药液
actors.hero.talent.durable_tips.desc=_+0：_守望者的涂药飞镖拥有_2倍耐久值_。\n\n_+1：_守望者的涂药飞镖拥有_3倍耐久值_。\n\n_+2：_守望者的涂药飞镖拥有_4倍耐久值_。\n\n_+3：_守望者的涂药飞镖拥有_5倍耐久值_。\n\n"给飞镖重新上药是世界上最恶心的事情之一。"
actors.hero.talent.barkskin.title=树肤韧甲
actors.hero.talent.barkskin.desc=_+0：_在踏入草丛时，守望者获得等同于她的等级_0-40%_的树肤效果，该效果每回合衰减。\n\n_+1：_在草丛上时，守望者获得等同于她的等级_0-80%_的树肤效果，该效果每回合衰减。\n\n_+2：_在踏入草丛时，守望者获得等同于她的等级_0-160%_的树肤效果，该效果每回合衰减。\n\n_+3：_在踏入草丛时，守望者获得等同于她的等级_0-240%_的树肤效果，该效果每回合衰减。
actors.hero.talent.barkskin.comment="‘信念护体’？嗯？最好开始说‘草丛护体’，因为你从中得到了护甲..."
actors.hero.talent.shielding_dew.title=露水护体
actors.hero.talent.shielding_dew.desc=_+1：_ 每滴露珠可以为守望者提供最大生命值_1.25%_的护盾，上限为守望者_20% 的最大生命值_。\n\n_+2：_ 每滴露珠可以为守望者提供最大生命值_2.5%_的护盾，上限为守望者_40% 的最大生命值_。\n\n_+3：_每滴露珠可以为守望者提供最大生命值_3.75%_的护盾，上限为守望者_60% 的最大生命值_。\n\n如果守望者的血量未满，护盾将在基础的5%最大生命值每滴的治疗之外产生护盾，如果已满则会把治疗转化为护盾。\n\n"为露珠爱好者而设。"
actors.hero.talent.natures_better_aid.title=自然而然
actors.hero.talent.natures_better_aid.desc=_+1_: 高草_多17%几率_产出种子，_多9%几率_产出露珠。\n\n_+2_: 高草_多33%几率_产出种子，_多17%几率_产出露珠。\n\n_+3_: 高草_多50%几率_产出种子，_多25%几率_产出露珠。\n\n_-_ 如果守望者尚未拥有天赋“复苏步伐”，拥有此天赋会使守望者在余烬上踩踏短草时立即产生犁过的高草，并有10回合冷却时间。\n\n"常言道：'种子越多=乐趣越多！'"
actors.hero.talent.indirect_benefits.title=间接利益
actors.hero.talent.indirect_benefits.desc=_+1:_ 如果怪物踩到植物，它也会以_17%_的几率为守望者激活。\n\n_+2:_ 如果怪物踩到植物，它也会以_33%_的几率为守望者激活。\n\n_+3:_ 如果怪物踩到植物，它也会以_50%_的几率为守望者激活。\n\n"这到底是怎么回事？联合自然、间接互动、生物Wi-Fi？"
actors.hero.talent.fan_of_blades.title=千叶刀扇
actors.hero.talent.fan_of_blades.desc=_+0：_灵魂飞刃最多能命中_1个额外目标_，造成50%的伤害。目标须在视野内且与原目标同处于_30度_扇形内。\n\n_+1：_灵魂飞刃最多能命中_2-3个额外目标_，造成50%的伤害。目标须在视野内且与原目标同处于_45度_扇形内。\n\n_+2：_灵魂飞刃最多能命中_4个额外目标_，造成50%的伤害。目标须在视野内且与原目标同处于_90度_扇形内。\n\n_+3：_灵魂飞刃最多能命中_5-6个额外目标_，造成50%的伤害。目标须在视野内且与原目标同处于_135度_扇形内。\n\n_+3：_灵魂飞刃最多能命中_7个额外目标_，造成50%的伤害。目标须在视野内且与原目标同处于_180度_扇形内。\n\n"不是说随便三个刀片绑一起就叫风扇……"
actors.hero.talent.projecting_blades.title=索敌飞刃
actors.hero.talent.projecting_blades.desc=_+0：_灵魂飞刃最多能穿透_1格固体地形_。\n\n_+1：_灵魂飞刃精准度提升_33%_，最多能穿透_3格固体地形_。\n\n_+2：_灵魂飞刃精准度提升_67%_，最多能穿透_5格固体地形_。\n\n_+3：_灵魂飞刃精准度提升_100%_，最多能穿透_7格固体地形_。\n\n_+4：_灵魂飞刃精准度提升_133%_，最多能穿透_9格固体地形_。\n\n"墙？不存在。闪避？也不存在。"
actors.hero.talent.spirit_blades.title=灵能飞刃
actors.hero.talent.spirit_blades.desc=_+1：_灵魂飞刃有_30%_的概率额外使用灵能短弓的附魔。\n\n_+2：_灵魂飞刃有_60%_的概率额外使用灵能短弓的附魔。\n\n_+3：_灵魂飞刃有_90%_的概率额外使用灵能短弓的附魔。\n\n_+4：_灵魂飞刃有_100%_的概率额外使用灵能短弓的附魔，并且它触发每个附魔的概率增加10%。
actors.hero.talent.spectral_shot.title=幽灵射击
actors.hero.talent.spectral_shot.desc=_+1:_ 灵魂飞刃可以触发狙击印记和多重射击。\n\n_+2:_ 灵魂飞刃可以触发狙击印记和多重射击，并附带一次灵能弓射击。\n\n_+3:_ 灵魂飞刃可以触发狙击印记和多重射击，并附带一次灵能弓射击。灵魂飞刃可以被神射之戒加成。\n\n_+4:_ 灵魂飞刃可以触发狙击印记和多重射击，并附带一次超级射击。灵魂飞刃可以被神射之戒加成。\n\n"别局限于附魔！"
actors.hero.talent.growing_power.title=茁壮之力
actors.hero.talent.growing_power.desc=_+0：_自然之力对射击速度与移动速度的加成提升为_33%_和_100%_。\n\n_+1：_自然之力对射击速度与移动速度的加成提升为_39%_和_133%_。\n\n_+2：_自然之力对射击速度与移动速度的加成提升为_44%_和_167%_。\n\n_+3：_自然之力对射击速度与移动速度的加成提升为_50%_和_200%_。\n\n_+4：_自然之力对射击速度与移动速度的加成提升为_56%_和_233%_。\n\n"恶魔撕裂者都追不上。"
actors.hero.talent.natures_wrath.title=自然之怒
actors.hero.talent.natures_wrath.desc=_+1：_在自然之力激活时，使用灵能弓的攻击有 _10% 机率_触发一个随机的负面植物效果。\n\n_+2：_在自然之力激活时，使用灵能弓的攻击有 _20% 机率_触发一个随机的负面植物效果。\n\n_+3：_在自然之力激活时，使用灵能弓的攻击有 _30% 机率_触发一个随机的负面植物效果。\n\n_+4：_在自然之力激活时，使用灵能弓的攻击有 _40% 机率_触发一个随机的负面植物效果。\n\n可能触发的植物：致盲草、烈焰花、冰冠花、断肠苔、风暴藤。\n\n"毁灭…彻底的毁灭…这就是胆敢触怒使用最强能力的最强职业的下场…"
actors.hero.talent.wild_momentum.title=自然飞矢
actors.hero.talent.wild_momentum.desc=_+0：_使用灵能短弓射杀一名敌人时，延长_1回合_自然之力，最多延长_2回合_。\n\n_+1：_使用灵能短弓射杀一名敌人时，延长_2回合_自然之力，最多延长_4回合_。\n\n_+2：_使用灵能短弓射杀一名敌人时，延长_3回合_自然之力，最多延长_6回合_。\n\n_+3：_使用灵能短弓射杀一名敌人时，延长_4回合_自然之力，最多延长_8回合_。\n\n_+4：_使用灵能短弓射杀一名敌人时,延长_5回合_自然之力，最多延长_10_回合。\n\n"当孤身一人的女性碰上兽潮…等等，谁是猎物？"
actors.hero.talent.primal_awakening.title=原初觉醒
actors.hero.talent.primal_awakening.desc=_+1:_ 当自然之力激活时，击杀怪物将有_7%_概率将其转化为豺狼诡术师。\n\n_+2:_ 当自然之力激活时，击杀怪物将有_13%_概率将其转化为豺狼诡术师。\n\n_+3:_ 当自然之力激活时，击杀怪物将有_20%_概率将其转化为豺狼诡术师。\n\n_+4:_ 当自然之力激活时，击杀怪物将有_27%_概率将其转化为豺狼诡术师。\n\n豺狼诡术师会得到加强以匹配恶魔大厅和深渊的怪物强度。\n\n"我不是furry控！"
actors.hero.talent.eagle_eye.title=鹰之瞭望
actors.hero.talent.eagle_eye.desc=_+1:_ 飞鹰的视野范围从6格增加到_7格_。\n\n_+2:_ 飞鹰的视野范围从6格增加到_8格_。\n\n_+3:_ 飞鹰的视野范围从6格增加到_7格_，并获得_2格_的灵视。\n\n_+4:_ 飞鹰的视野范围从6格增加到_7格_，并获得_3格_的灵视。
actors.hero.talent.go_for_the_eyes.title=夺目利爪
actors.hero.talent.go_for_the_eyes.desc=_+1：_飞鹰在攻击时会扑抓敌人的眼睛并令其致盲_2回合_。\n\n_+2：_飞鹰在攻击时会扑抓敌人的眼睛并令其致盲_5回合_。\n\n_+3：_飞鹰在攻击时会扑抓敌人的眼睛并令其致盲_5回合_，残废_2回合_。\n\n_+4：_飞鹰在攻击时会扑抓敌人的眼睛并令其致盲_5回合_，残废_5回合_。
actors.hero.talent.swift_spirit.title=疾风之魄
actors.hero.talent.swift_spirit.desc=_+1：_飞鹰的移动速度由每回合2格提升至_2.5格_，必定闪避其遭到的前_2次攻击_。\n\n_+2：_飞鹰的移动速度由每回合2格提升至_3格_，必定闪避其遭到的前_4次攻击_。\n\n_+3：_飞鹰的移动速度由每回合2格提升至_3.5格_，必定闪避其遭到的前_6次攻击_。\n\n_+4：_飞鹰的移动速度由每回合2格提升至_4格_，必定闪避其遭到的前_8次攻击_。
actors.hero.talent.beak_of_power.title=征服之喙
actors.hero.talent.beak_of_power.desc=_+1:_ 飞鹰击杀敌人的一击有_50%_概率不耗费回合，标记敌人将提供_5回合_奥术视野，不会弄醒_3格外_的敌人，攻击有_25%_概率触发灵能弓的附魔。\n\n_+2:_ 飞鹰击杀敌人的一击_必定_不耗费回合，标记敌人将提供_10回合_奥术视野，不会弄醒_不相邻_的敌人，攻击有_50%_概率触发灵能弓的附魔。\n\n_+3:_ 飞鹰击杀敌人的一击_必定_不耗费回合，标记敌人将提供_15回合_奥术视野，不会弄醒_任何_敌人，攻击有_75%_概率触发灵能弓的附魔。\n\n_+4:_ 飞鹰击杀敌人的一击_必定_不耗费回合，标记敌人将提供_20回合_奥术视野，不会弄醒_任何_敌人，攻击_必定_触发灵能弓的附魔。在近战攻击外，还能射出灵能箭。\n\n"不会还有人觉得鹰没用吧？"
actors.hero.talent.auric_tesla.title=御驾巡礼
actors.hero.talent.auric_tesla.desc=朕的护甲技能能够增强这种不可思议的力量！\n\n_+1:_ 鼠王对他着陆地点周围的所有敌人施加_25%护甲的伤害_和_3回合残废_，然后对每个视野内的敌人有25%概率施加灵能弓的附魔或老魔杖的战斗法师效果，最后鼠王获得_1.5回合_激素涌动效果。\n\n_+2:_ 鼠王对他着陆地点周围的所有敌人施加_50%护甲的伤害_和_4回合残废_，然后对每个视野内的敌人有50%概率施加灵能弓的附魔或老魔杖的战斗法师效果，最后鼠王获得_3.0回合_激素涌动效果。\n\n_+3:_ 鼠王对他着陆地点周围的所有敌人施加_75%护甲的伤害_和_5回合残废_，然后对每个视野内的敌人有75%概率施加灵能弓的附魔或老魔杖的战斗法师效果，最后鼠王获得_4.5回合_激素涌动效果。\n\n_+4:_ 鼠王对他着陆地点周围的所有敌人施加_100%护甲的伤害_和_6回合残废_，然后对每个视野内的敌人有100%概率施加灵能弓的附魔或老魔杖的战斗法师效果，最后鼠王获得_6.0回合_激素涌动效果。
actors.hero.talent.quantum_position.title=量子定位
actors.hero.talent.quantum_position.desc=朕有足够的力量绕过视野的微小限制！\n\n_+1:_ 鼠王之怒的作用范围从6格扩大到_9格_。与着陆的鼠王相邻的敌人将受到_3回合_的恐惧和眩晕。\n\n_+2:_ 鼠王之怒的作用范围从6格扩大到_12格_。与着陆的鼠王相邻的敌人将受到_6回合_的恐惧和眩晕。\n\n_+3:_ 鼠王之怒的作用范围从6格扩大到_15格_。与着陆的鼠王相邻的敌人将受到_9回合_的恐惧和眩晕。 \n\n_+4:_ 鼠王之怒的作用范围从6格扩大到_18格_。与着陆的鼠王相邻的敌人将受到_12回合_的恐惧和眩晕。
actors.hero.talent.rat_age.title=鼠朝开元
actors.hero.talent.rat_age.desc=即使强大的巨龙也不敢与朕对视！\n\n_+1:_ 鼠王的敌人陷入_烈焰_，同时鼠王获得9回合的_火焰_灌注。着陆时，鼠王会使相邻的敌人缩小_2_回合，且鼠王的力量每超过10一点，就对它们造成一次_1-3_点的伤害。\n\n_+2:_ 鼠王的敌人陷入_烈焰、暴风雪_，同时鼠王获得9回合的_火焰、冰霜_灌注。着陆时，鼠王会使相邻的敌人缩小_3_回合，且鼠王的力量每超过10一点，就对它们造成一次_2-4_点的伤害。\n\n_+3:_ 鼠王的敌人陷入_烈焰、暴风雪、眩晕_，鼠王同时获得9回合的_火焰、冰霜、纯净_灌注。着陆时，鼠王会使相邻的敌人缩小_4_回合，且鼠王的力量每超过10一点，就对它们造成一次_3-5_点的伤害。\n\n_+4:_ 鼠王的敌人陷入_烈焰、暴风雪、眩晕、植被_，鼠王同时获得9回合的_火焰、冰霜、纯净_灌注。着陆时，鼠王会使相邻的敌人缩小_5_回合，且鼠王的力量每超过10一点，就对它们造成一次_4-6_点的伤害。
actors.hero.talent.avalon_power_up.title=君权神授
actors.hero.talent.avalon_power_up.desc=神性的存在给了朕战胜任何可能之敌的机会！\n\n _+1:_ 在熔壤魔咒阶段，鼠王将在_6格_半径内释放元素风暴。着陆后，鼠王将以_大力_打击相邻的敌人。扔出灵魂飞刃时，有_17%_概率同时使用灵能弓射击一次。\n\n _+2:_ 在熔壤魔咒阶段，鼠王将在_7格_半径内释放元素风暴。着陆后，鼠王将以_巨力_打击相邻的敌人。扔出灵魂飞刃时，有_33%_概率同时使用灵能弓射击一次。\n\n _+3:_ 在熔壤魔咒阶段，鼠王将在_8格_半径内释放元素风暴。着陆后，鼠王将以_伟力_打击相邻的敌人。扔出灵魂飞刃时，有_50%_概率同时使用灵能弓射击一次。\n\n _+4:_ 在熔壤魔咒阶段，鼠王将在_9格_半径内释放元素风暴。着陆后，鼠王将以_神力_打击相邻的敌人。扔出灵魂飞刃时，有_67%_概率同时使用灵能弓射击一次。  \n\n在这之后，鼠王会召唤一只_皇族老鼠_，它有_10%_概率是白化的。
actors.hero.talent.bloodflare_skin.title=燃血之肤
actors.hero.talent.bloodflare_skin.desc=鼠之王国以其坚强和忠诚的子民而闻名！\n\n_+1:_ 痛苦坚韧的伤害加成提高到_120%_，并作用于接下来的_2次_攻击。鼠王不会承受超过其_71%_最大生命值的伤害。痛苦坚韧结束时，每有1个相邻敌人，鼠王伤害增加_10%_。鼠王的暗影映像获得其_10%_最大生命值，皇家夜枭获得_25%_额外移动速度且能闪避接下来的_1_次攻击。\n\n_+2:_ 痛苦坚韧的伤害加成提高到_140%_，并作用于接下来的_3次_攻击。鼠王不会承受超过其_50%_最大生命值的伤害。痛苦坚韧结束时，每有1个相邻敌人，鼠王伤害增加_20%_。鼠王的暗影映像获得其_20%_最大生命值，皇家夜枭获得_50%_额外移动速度且能闪避接下来的_2_次攻击。\n\n_+3:_ 痛苦坚韧的伤害加成提高到_160%_，并作用于接下来的_4次_攻击。鼠王不会承受超过其_35%_最大生命值的伤害。痛苦坚韧结束时，每有1个相邻敌人，鼠王伤害增加_30%_。鼠王的暗影映像获得其_30%_最大生命值，皇家夜枭获得_75%_额外移动速度且能闪避接下来的_3_次攻击。\n\n_+4:_ 痛苦坚韧的伤害加成提高到_180%_，并作用于接下来的_5次_攻击。鼠王不会承受超过其_25%_最大生命值的伤害。痛苦坚韧结束时，每有1个相邻敌人，鼠王伤害增加_20%_。鼠王的暗影映像获得其_40%_最大生命值，皇家夜枭获得_100%_额外移动速度且能闪避接下来的_4_次攻击。
actors.hero.talent.astral_charge.title=星际穿越
actors.hero.talent.astral_charge.desc=远程传送是运输的未来！\n\n_+1:_ 鼠王放置信标的范围增大_3_格。从其他层传送至信标处需要_150%_充能并对信标处的角色造成_10-15_点伤害，自身受到_5_点伤害。鼠王可以与_1_格内的暗影映像瞬间换位。鼠王的狂野魔法减少_44%_法杖充能消耗，并赋予法杖_+1-+2_等级强化，法杖释放_5次_。\n\n_+2:_ 鼠王放置信标的范围增大_6_格。从其他层传送至信标处需要_117%_充能并对信标处的角色造成_20-30_点伤害，自身受到_8_点伤害。鼠王可以与_2_格内的暗影映像瞬间换位。鼠王的狂野魔法减少_69%_法杖充能消耗，并赋予法杖_+2_等级强化，法杖释放_6次_。\n\n_+3:_ 鼠王放置信标的范围增大_9_格。从其他层传送至信标处需要_83%_充能并对信标处的角色造成_30-45_点伤害，自身受到_12_点伤害。鼠王可以与_3_格内的暗影映像瞬间换位。鼠王的狂野魔法减少_82%_法杖充能消耗，并赋予法杖_+2-+3_等级强化，法杖释放_7次_。\n\n_+4:_ 鼠王放置信标的范围增大_12_格。从其他层传送至信标处需要_50%_充能并对信标处的角色造成_45-60_点伤害，自身受到_15_点伤害。鼠王可以与_4_格内的暗影映像瞬间换位。鼠王的狂野魔法减少_90%_法杖充能消耗，并赋予法杖_+3_等级强化，法杖释放_8次_。
actors.hero.talent.shadowspec_slice.title=暗影军团
actors.hero.talent.shadowspec_slice.desc=朕的盟军就是此处的真正力量之源！\n\n_+1:_ 鼠王的暗影映像每回合增加相当于本体_6%的攻击力_和_13%的防御力_，且每次攻击或防御都有_25%_概率触发本体装备的附魔或刻印。此外，鼠王在传送至信标处时，在原地设置具有_20生命值_和_1-5护甲_的替身木桩，皇家夜枭会致盲敌人_2回合_，并获得_1格_额外视野。\n\n_+2:_  鼠王的暗影映像每回合增加相当于本体_13%的攻击力_和_25%的防御力_，且每次攻击或防御都有_50%_概率触发本体装备的附魔或刻印。此外，鼠王在传送至信标处时，在原地设置具有_40生命值_和_2-10护甲_的替身木桩，皇家夜枭会致盲敌人_3回合_，并获得_2格_额外视野。\n\n_+3:_  鼠王的暗影映像每回合增加相当于本体_18%的攻击力_和_38%的防御力_，且每次攻击或防御都有_75%_概率触发本体装备的附魔或刻印。此外，鼠王在传送至信标处时，在原地设置具有_60生命值_和_3-15护甲_的替身木桩，皇家夜枭会致盲敌人_4回合_，并获得_3格_额外视野。\n\n_+4:_  鼠王的暗影映像每回合增加相当于本体_25%的攻击力_和_50%的防御力_，且每次攻击或防御都有_100%_概率触发本体装备的附魔或刻印。此外，鼠王在传送至信标处时，在原地设置具有_80生命值_和_4-20护甲_的替身木桩，皇家夜枭会致盲敌人_5回合_，并获得_4格_额外视野。
actors.hero.talent.silva_range.title=率土之滨
actors.hero.talent.silva_range.desc=_+1:_ 当自然之力激活时，鼠王增加_38%攻速_，增加_125%移速_，鼠王的射击有_8%_概率触发一种随机的有害植物效果，击杀敌人将会延长持续时间_1回合_，最多延长2次。鼠王的暗影映像将会射出相当于本体_13%攻击力_的苦无作为远程攻击手段。\n\n_+2:_ 当自然之力激活时，鼠王增加_42%_攻速，增加_150%_移速，鼠王的射击有_17%_概率触发一种随机的有害植物效果，击杀敌人将会延长持续时间_2回合_，最多延长2次。鼠王的暗影映像将会射出相当于本体_25%攻击力_的苦无作为远程攻击手段。\n\n_+3:_ 当自然之力激活时，鼠王增加_46%_攻速，增加_175%_移速，鼠王的射击有_25%_概率触发一种随机的有害植物效果，击杀敌人将会延长持续时间_3回合_，最多延长2次。鼠王的暗影映像将会射出相当于本体_38%攻击力_的苦无作为远程攻击手段。\n\n_+4:_ 当自然之力激活时，鼠王增加_50%_攻速，增加_200%_移速，鼠王的射击有_33%_概率触发一种随机的有害植物效果，击杀敌人将会延长持续时间_4回合_，最多延长2次。鼠王的暗影映像将会射出相当于本体_50%攻击力_的苦无作为远程攻击手段。
actors.hero.talent.silva_range.comment=率土之滨，莫非王臣。这句话现在对自然的精灵也生效。\n\n
actors.hero.talent.strengthening_meal.title=强化一餐
actors.hero.talent.strengthening_meal.desc=_+1:_ 进食后，决斗家的下 _4 次物理攻击_ 将获得额外 3 点伤害。\n\n_+2:_ 进食后，决斗家的下 _6 次物理攻击_ 将获得额外 3 点伤害。
actors.hero.talent.adventurers_intuition.title=探险直觉
actors.hero.talent.adventurers_intuition.desc=_+0:_ 决斗家鉴定武器的速度提高 _2.5 倍_，鉴定护甲的速度提高 _1.75 倍_。\n\n_+1:_ 决斗家在装备武器时鉴定武器的速度提高，并且鉴定护甲的速度提高 _2.5 倍_。首次拾取时，她还有 _30% 的几率_ 鉴定武器。\n\n_+2:_ 决斗家在装备武器时鉴定武器。首次拾取时，决斗家有 _60% 的几率_ 鉴定武器和 _30% 的几率_ 鉴定护甲。
actors.hero.talent.adventurers_intuition.comment="谁说爱情不能一见钟情？"
actors.hero.talent.adventurers_intuition.comment_warrior="嗯，看起来很熟悉..."
actors.hero.talent.patient_strike.title=沉稳一击
actors.hero.talent.patient_strike.desc=_+1:_ 如果决斗家在进行近战攻击前等待，她将造成额外 _3 点伤害_。\n\n_+2:_ 如果决斗家在进行近战攻击前等待，她将造成额外 _4-5 点伤害_。
actors.hero.talent.aggressive_barrier.title=烈气护盾
actors.hero.talent.aggressive_barrier.desc=_+1:_ 当决斗家使用武器技能并生命值低于 _40%_ 时，她将获得 5 点护盾。\n\n_+2:_ 当决斗家使用武器技能并生命值低于 _60%_ 时，她将获得 5 点护盾。
actors.hero.talent.aggressive_barrier.meta_desc=_如果不同英雄获得此天赋_，在生命值低于20/40/60%时进行近战攻击时，将获得8护盾，冷却时间为 50 回合。
actors.hero.talent.focused_meal.title=专注一餐
actors.hero.talent.focused_meal.desc=_+1:_ 进食需要决斗家 1 回合，并为她的主武器提供 _2 次充能_。\n\n_+2:_ 进食需要决斗家 1 回合，并为她的主武器提供 _3 次充能_。
actors.hero.talent.focused_meal.meta_desc=_如果不同英雄获得此天赋_，则在会使其下次攻击额外造成伤害，+0时为等级/4，+1时为等级/3，+2时为等级/2。
actors.hero.talent.focused_meal.comment="少等待，多冲刺！"
actors.hero.talent.liquid_agility.title=液蕴机敏
actors.hero.talent.liquid_agility.desc=_+1:_ 决斗家在喝下或投掷药水时和之后一回合内获得 _3 倍回避_并在10回合内下两次近战攻击获得3倍命中。\n\n_+2:_ 决斗家在喝下或投掷药水时和之后一回合内获得 _无限回避_并在10回合内下两次近战攻击获得无限命中。\n\n当使用力量、经验及其炼金物品时，此回避加成将持续双倍时间，命中加成持续双倍攻击次数。\n这个效果也可以通过饮用水袋触发，其效力取决于露水的消耗量；10滴露水为100%效果。
actors.hero.talent.liquid_agility.comment="这是要加速被奥运会禁赛吗？"
actors.hero.talent.weapon_recharging.title=武器充能
actors.hero.talent.weapon_recharging.desc=_+1:_ 决斗家处于法杖或神器充能状态时，每 _5 回合_ 获得一次主武器充能并增加 _+10% 近战伤害_。\n\n_+2:_ 决斗家处于法杖或神器充能状态时，每 _3 回合_ 获得一次主武器充能，并增加 _+15% 近战伤害_。
actors.hero.talent.weapon_recharging.comment_duelist="为什么其他英雄能玩得开心？这就是你作为其他任何职业都能获得的伤害加成！"
actors.hero.talent.weapon_recharging.meta_desc=_如果不同英雄获得此天赋_，则在 +1 时会使他们在充能时造成 +20% 近战伤害，而在 +2 时会使他们在充能时造成 +30% 近战伤害。
actors.hero.talent.lethal_haste.title=夺命余势
actors.hero.talent.lethal_haste.desc=_+0:_ 当决斗家用武器技能击杀敌人时，她将获得 _3回合_ 的瞬间移动。\n\n_+1:_ 当决斗家攻击并击杀敌人时，她将获得 _3回合_ 的激素涌动，如果是武器技能则额外获得 _3回合_ 的瞬间移动。\n\n_+2:_ 当决斗家攻击并击杀敌人时，她将获得 _5 回合_ 的激素涌动，如果是武器技能则额外获得五回合瞬间移动。
actors.hero.talent.lethal_haste.meta_desc=_如果此天赋被其他英雄获得_，瞬间移动效果将在常规武器攻击时有50回合冷却时间时触发。
actors.hero.talent.lethal_haste.comment="哎呀，我又来了..."
actors.hero.talent.swift_equip.title=迅疾配装
actors.hero.talent.swift_equip.desc=_+1:_ 决斗家可以即时切换她的装备武器 _一次_，冷却时间为 20 回合。\n\n_+2:_ 决斗家可以在 5 回合内 _两次_ 即时切换她的装备武器，冷却时间为 20 回合。\n\n如果决斗家拥有这个天赋且未处于冷却状态，快速使用未装备的武器将使其装备。
actors.hero.talent.precise_assault.title=精准打击
actors.hero.talent.precise_assault.desc=_+1:_ 当决斗家使用武器技能时，在接下来的 5 回合内，她的下两次近战攻击获得 _2 倍精准度_。\n\n_+2:_ 当决斗家使用武器技能时，在接下来的 5 回合内，她的下两次近战攻击获得 _5 倍精准度_。\n\n_+3:_ 当决斗家使用武器技能时，在接下来的 5 回合内，她的下两次近战攻击获得 _无穷精准度_。
actors.hero.talent.precise_assault.meta_desc=_如果不同英雄获得此天赋_，则在 +1 时会使整体精准度提高 10%，在 +2 时提高 20%，在 +3 时提高 30%。
actors.hero.talent.precise_assault.comment="打空很无聊"
actors.hero.talent.deadly_followup.title=夺命追击
actors.hero.talent.deadly_followup.desc=_+1:_ 当决斗家用投掷武器或法杖击中敌人时，她将在接下来的 5 回合内对其造成 _额外 16% 近战伤害_。\n\n_+2:_ 当决斗家用投掷武器或法杖击中敌人时，她将在接下来的 5 回合内对其造成 _额外 32% 近战伤害_。\n\n_+3:_ 当决斗家用投掷武器或法杖击中敌人时，她将在接下来的 5 回合内对其造成 _额外 48% 近战伤害_。
actors.hero.talent.deadly_followup.comment="看我的剑...自求多福！"
actors.hero.talent.varied_charge.title=多变充能
actors.hero.talent.varied_charge.desc=_+1:_ 斗士在使用两种不同的武器能力时瞬间恢复_0.17武器充能_，无时间限制。\n\n_+2:_ 斗士在使用两种不同的武器能力时瞬间恢复_0.33武器充能_，无时间限制。\n\n_+3:_ 斗士在使用两种不同的武器能力时瞬间恢复_0.5武器充能_，无时间限制。
actors.hero.talent.twin_upgrades.title=伴生强化
actors.hero.talent.twin_upgrades.desc=_+1:_ 如果勇士的两把装备武器中有一把等级较低且比另一把武器 _低至少2 阶_，则它将被提升至另一把武器的等级。\n\n_+2:_ 如果勇士的两把装备武器中有一把等级较低且比另一把武器_低至少1 阶_，则它将被提升至另一把武器的等级。\n\n_+3:_ 如果勇士的两把装备武器中有一把等级较低且与另一把武器 _相同阶数或更低_，则它将被提升至另一把武器的等级。
actors.hero.talent.combined_lethality.title=复合损伤
actors.hero.talent.combined_lethality.desc=_+1:_ 如果勇士连续使用两种不同的武技，第二个技能将对生命值 _低于 13%_ 的任何非boss敌人造成致命伤害。\n\n_+2:_ 如果勇士连续使用两种不同的武技，第二个技能将对生命值 _低于 27%_ 的任何非boss敌人造成致命伤害。\n\n_+3:_ 如果勇士连续使用两种不同的武技，第二个技能将对生命值 _低于 40%_ 的任何非boss敌人造成致命伤害。\n\n如果第二个技能不包含攻击，此天赋将在接下来的 5 回合内触发勇士的下一个攻击。
actors.hero.talent.elite_dexterity.title=精英敏捷
actors.hero.talent.elite_dexterity.desc=_+1:_ 勇士可以将投掷武器装备到副手栏。投掷武器受益于天赋和武器的附魔，并可用于以消耗双倍充能的代价延长大多数武技的射程。\n\n_+2:_ 勇士可以同时在副手栏装备投掷武器和副手武器。\n\n_+3:_ 勇士可以在副手栏装备两把武器，不只是投掷武器。
actors.hero.talent.elite_dexterity.comment="某些东西 '近战' 职业。呸。"（该天赋实测第二把副手武器与主手武器共享充能）
actors.hero.talent.unencumbered_spirit.title=无羁之魂
actors.hero.talent.unencumbered_spirit.desc=_+1:_ 武僧每使用一件 _不高于3阶_ 装备，获取内力将 _+40% _。\n\n_+2:_ 武僧每使用一件 _不高于2阶_ 装备，获取内力将 _+75% _。\n\n_+3:_ 武僧每使用一件 _1阶_ 装备，获取内力将 _+100% _。她还将获得一套免费的布甲和镶钉手套。\n\n请注意，此天赋在徒手或使用武力之戒的攻击下无效。
actors.hero.talent.monastic_vigor.title=道心盎然
actors.hero.talent.monastic_vigor.desc=_+1:_ 如果武僧的内力达到 _100%_，她的武功将得到突破。\n\n_+2:_ 如果武僧的内力达到 _80% 或更多_，她的武功将得到突破。\n\n_+3:_ 如果武僧的内力达到 _60% 或更多_，她的技能武功将得到突破。\n\n强化时：\n- 空振会施加武器附魔效果\n- 凝神不消耗回合\n- 登云有效距离+4\n- 盘龙造成 +50% 伤害，并对所有相邻敌人施加其击退和麻痹效果\n- 冥思缓慢治愈已损失生命值的 20%，并提供 80% 伤害减免。
actors.hero.talent.combined_energy.title=阴阳调和
actors.hero.talent.combined_energy.desc=_+1:_ 如果武僧连续使用武器技能和 _4 点内力消耗以上_ 武功，她将恢复1点已消耗内力。\n\n_+2:_ 如果武僧连续使用武器技能和 _3 点内力消耗以上_ 武功，她将恢复1点已消耗内力。\n\n_+3:_ 如果武僧连续使用武器技能和 _2 点内力消耗以上_ 武功，她将恢复1点已消耗内力。
actors.hero.talent.close_the_gap.title=跨域彼端
actors.hero.talent.close_the_gap.desc=_+1:_ 决斗家在开始决斗时向目标方向闪现 _最多两个格_距离。\n\n_+2:_ 决斗家在开始决斗时向目标方向闪现 _最多三个格_距离。\n\n_+3:_ 决斗家在开始决斗时向目标方向闪现 _最多四个格_距离。\n\n_+4:_ 决斗家在开始决斗时向目标方向闪现 _最多五个格_距离。\n\n这个闪现可以穿过危险和敌人，但不能穿过实体墙壁。闪现距离会纳入决斗发起的距离判定。
actors.hero.talent.invigorating_victory.title=凯旋复苏
actors.hero.talent.invigorating_victory.desc=_+1:_ 如果决斗家在决斗结束前击败了目标，她将恢复 _5 +30%决斗中承伤_的生命值。\n\n_+2:_ 如果决斗家在决斗结束前击败了目标，她将恢复 _10 +50%决斗中承伤_的生命值。\n\n_+3:_ 如果决斗家在决斗结束前击败了目标，她将恢复 _15+65%决斗中承伤65%_的生命值。\n\n_+4:_ 如果决斗家在决斗结束前击败了目标，她将恢复 _20 +75%决斗中承伤_的生命值。
actors.hero.talent.elimination_match.title=连续淘汰
actors.hero.talent.elimination_match.desc=_+1:_ 如果决斗家在一场决斗结束后的 3 回合内再次发起挑战，该挑战的充能消耗将减少 _16%_。\n\n_+2:_ 如果决斗家在一场决斗结束后的 3 回合内再次发起挑战，该挑战的充能消耗将减少 _30%_。\n\n_+3:_ 如果决斗家在一场决斗结束后的 3 回合内再次发起挑战，该挑战的充能消耗将减少 _40%_。\n\n_+4:_ 如果决斗家在一场决斗结束后的 3 回合内再次发起挑战，该挑战的充能消耗将减少 _50%_。
actors.hero.talent.elemental_reach.title=元素延展
actors.hero.talent.elemental_reach.desc=_+1:_ 元素打击的范围从 4 格增加到 _5 格_，扩散角度从 65 度增加到 _75 度_。\n\n_+2:_ 元素打击的范围从 4 格增加到 _6 格_，扩散角度从 65 度增加到 _85 度_。\n\n_+3:_ 元素打击的范围从 4 格增加到 _7 格_，扩散角度从 65 度增加到 _95 度_。\n\n_+4:_ 元素打击的范围从 4 格增加到 _8 格_，扩散角度从 65 度增加到 _105 度_。
actors.hero.talent.striking_force.title=强力打击
actors.hero.talent.striking_force.desc=_+1:_ 元素打击效果的威力增加 _30%_。\n\n_+2:_ 元素打击效果的威力增加 _60%_。\n\n_+3:_ 元素打击效果的威力增加 _90%_。\n\n_+4:_ 元素打击效果的威力增加 _120%_。
actors.hero.talent.directed_power.title=能量导引
actors.hero.talent.directed_power.desc=_+1:_ 元素打击效果内每有一个敌人，获得 _+30% 的附魔强度_。\n\n_+2:_ 元素打击效果内每有一个敌人，获得 _+60% 的附魔强度_。\n\n_+3:_ 元素打击效果内每有一个敌人，获得 _+90% 的附魔强度_。\n\n_+4:_ 元素打击效果内每有一个敌人，获得 _+120% 的附魔强度_。
actors.hero.talent.feigned_retreat.title=佯装撤退
actors.hero.talent.feigned_retreat.desc=_+1:_ 如果敌人攻击决斗家的残影，她将获得 _2 回合_ 的加速效果。\n\n_+2:_ 如果敌人攻击决斗家的残影，她将获得 _4 回合_ 的加速效果。\n\n_+3:_ 如果敌人攻击决斗家的残影，她将获得 _6 回合_ 的加速效果。\n\n_+4:_ 如果敌人攻击决斗家的残影，她将获得 _8 回合_ 的加速效果。
actors.hero.talent.expose_weakness.title=弱点看破
actors.hero.talent.expose_weakness.desc=_+1:_ 攻击决斗家的残影的敌人将获得 _2 回合_ 虚弱和脆弱效果。\n\n_+2:_ 攻击决斗家的残影的敌人将获得 _4 回合_ 虚弱和脆弱效果。\n\n_+3:_ 攻击决斗家的残影的敌人将获得 _6 回合_ 虚弱和脆弱效果。\n\n_+4:_ 攻击决斗家的残影的敌人将获得 _8 回合_ 虚弱和脆弱效果。
actors.hero.talent.counter_ability.title=武技反击
actors.hero.talent.counter_ability.desc=_+1:_ 如果决斗家在她的残影被攻击后的 3 回合内使用武技，它将立即回复 _0.38点武技充能_。\n\n_+2:_ 如果决斗家在她的残影被攻击后的 3 回合内使用武器技能，它将立即回复 _0.77点武技充能_。\n\n_+3:_ 如果决斗家在她的残影被攻击后的 3 回合内使用武器技能，它将立即回复 _1.13点武技充能_。\n\n_+4:_ 如果决斗家在她的残影被攻击后的 3 回合内使用武器技能，它将立即回复 _1.5点武技充能_。
actors.hero.talent.satiated_spells.title=圣餐礼文
actors.hero.talent.satiated_spells.desc=_+0:_ 进食食物使牧师下一次施放法术时获得_2点护盾_。\n\n_+1:_ 进食食物使牧师下一次施放法术时获得_5点护盾_。\n\n_+2_: 进食食物使牧师下一次施放法术时获得_8点护盾_。
actors.hero.talent.satiated_spells.comment="这里可没有'趁他们忙着施法时攻击他们'这种鬼话..."
actors.hero.talent.satiated_spells.meta_desc=_如果此天赋被其他英雄获得_，它将立即赋予护盾，并在10回合后开始自然衰减。
actors.hero.talent.holy_intuition.title=神圣预知
actors.hero.talent.holy_intuition.desc=_+1:_ 牧师可以施放_神圣预知_，一个以_3点充能_为代价揭示物品是否被诅咒的法术。\n\n_+2:_ 牧师可以施放_神圣预知_，一个以_2点充能_为代价揭示物品是否被诅咒的法术。\n\n此法术还有25%的几率鉴定未被诅咒的物品或解除未被诅咒物品的诅咒。对已知被诅咒或未被诅咒的物品使用此法术时，此几率提升至33%。
actors.hero.talent.holy_intuition.meta_desc=_如果此天赋被其他英雄获得_，它将在装备被诅咒物品前有10%几率（+0时）、30%几率（+1时）或50%几率（+2时）让英雄识别并移除其诅咒状态。
actors.hero.talent.holy_intuition.comment="相信我，这次你会成功的。再试一次。"
actors.hero.talent.searing_light.title=炽热之光
actors.hero.talent.searing_light.desc=_+0:_ 牧师对被_神导之光_照亮的敌人进行物理攻击时造成_+2伤害_。\n\n_+1:_ 牧师对被_神导之光_照亮的敌人进行物理攻击时造成_+5伤害_。\n\n_+2:_ 牧师对被_神导之光_照亮的敌人进行物理攻击时造成_+8伤害_。
actors.hero.talent.searing_light.meta_desc=_如果此天赋被其他英雄获得_，它将在使用魔杖或神器攻击敌人后赋予额外伤害，并有20回合冷却时间。
actors.hero.talent.searing_light.comment="那光芒....它在燃烧....."
actors.hero.talent.shield_of_light.title=神圣护盾
actors.hero.talent.shield_of_light.desc=_+0：_牧师可以施放法术_神圣护盾_，消耗1点充能以立即获得仅对单个目标生效的持续4回合的_2~4点护甲_。\n\n_+1：_牧师可以施放法术_神圣护盾_，消耗1点充能以立即获得仅对单个目标生效的持续4回合的_4~8点护甲_。\n\n_+2：_牧师可以施放法术_神圣护盾_，消耗1点充能以立即获得仅对单个目标生效的持续4回合的_6~12点护甲_。
actors.hero.talent.shield_of_light.meta_desc=_如果此天赋被其他英雄获得_，它将改为减少来自你锁定目标的物理伤害1点，在+0时25%几率，+1时50%几率，或+2时100%几率。
actors.hero.talent.shield_of_light.comment="事实证明护甲对于防御来说其实不是必须的。你不爱魔法吗？"
actors.hero.talent.metaexpression.title=唤饰祷言
actors.hero.talent.metaexpression.desc=_+1:_ 牧师可以施放_唤饰祷言_，为其随机饰品等级提升至_+1_，持续_250回合_，消耗_3点充能_。\n\n_+2:_ 牧师可以施放_唤饰祷言_，为其随机饰品等级提升至_+2_，持续_250回合_，消耗_4点充能_。\n\n通过重复施法可以同时获得多个饰品效果。
actors.hero.talent.metaexpression.meta_desc=_如果此天赋被其他英雄获得_，它将在英雄每次进入新层级时，赋予随机饰品的+1/+2级力量持续200回合。
actors.hero.talent.metaexpression.comment="小心你的愿望...当你无法选择愿望时，也许这并不合适..."
actors.hero.talent.enlightening_meal.title=启蒙圣餐
actors.hero.talent.enlightening_meal.desc=_+0:_ 进食食物为牧师的圣典充能_0.5点_，并赋予2回合魔杖和神器充能_。\n\n_+1:_ 进食食物消耗牧师1回合_，并为其圣典充能_1点_，并赋予2回合魔杖和神器充能。\n\n_+2_: 进食食物消耗牧师1回合，并为其圣典充能_1.5点_，并赋予2回合魔杖和神器充能。
actors.hero.talent.enlightening_meal.meta_desc=_如果此天赋被其他英雄获得_，它将在+0/+1/+2时分别赋予2/3/5回合魔杖和神器充能。
actors.hero.talent.enlightening_meal.comment_rat_king="更差的王室大餐...还是说？？？"
actors.hero.talent.enlightening_meal.comment="现在附赠更多充能！！！"
actors.hero.talent.recall_inscription.title=符文复制
actors.hero.talent.recall_inscription.refunded=你的物品被返还了！
actors.hero.talent.recall_inscription.desc=_+1:_ 牧师可以施放_符文复制_，一个让其重复最近10回合内使用的符文石或卷轴效果的法术。\n\n_+2:_ 牧师可以施放_符文复制_，一个让其重复最近300回合内使用的符石或卷轴效果的法术。\n\n符文复制不能用于升级卷轴。此法术的充能消耗根据最近使用的物品而不同：符石为2，卷轴为3，秘卷为4。当用于嬗变卷轴，或必须使用嬗变卷轴或升级制作的炼金物品时，此充能消耗也会加倍。\n\n此法术可以多次施放，但每次施放消耗增加50%，除非该法术当前被界限突破或神圣降临强化。
actors.hero.talent.recall_inscription.meta_desc=_如果此天赋被其他英雄获得_，它将在+1时有20%几率、+2时有30%几率返还任何卷轴或符石。升级卷轴不受此效果影响。
actors.hero.talent.recall_inscription.comment="你知道比一个爆破符文石更好的是什么吗？两个爆破符文石。你知道比两个爆破符文石更好的是什么吗？三个！！"
actors.hero.talent.sunray.title=阳炎射线
actors.hero.talent.sunray.desc=_+1:_ 牧师可以施放_阳炎射线_，一个造成_6-10伤害_并使目标_失明6回合_的法术，消耗1点充能。\n\n_+2:_ 牧师可以施放_阳炎射线_，一个造成_9-15伤害_并使目标_失明9回合_的法术，消耗1点充能。\n\n阳炎射线只能使每个目标失明一次，但如果目标已被阳炎射线致盲，则改为麻痹。阳炎射线对恶魔和亡灵敌人总是造成最大伤害。
actors.hero.talent.sunray.meta_desc=_如果此天赋被其他英雄获得_，它会使魔杖和神器有15%几率（+1时）或25%几率（+2时）使敌人失明4回合。
actors.hero.talent.divine_sense.title=神圣感知
actors.hero.talent.divine_sense.desc=_+1:_ 牧师可以施放_神圣感知_，一个以2点充能为代价，赋予他们_8格_精神视野持续60回合的法术。\n\n_+2:_ 牧师可以施放_神圣感知_，一个以2点充能为代价，赋予他们_12格_精神视野持续60回合的法术。
actors.hero.talent.divine_sense.meta_desc=_如果此天赋被其他英雄获得_，它将在使用魔杖或神器后短暂赋予他们精神视野，射程在+0/+1/+2时为3/5/7格。
actors.hero.talent.divine_sense.comment="我看见你了"
actors.hero.talent.bless.title=神圣祝福
actors.hero.talent.bless.desc=_+1:_ 牧师可以施放_神圣祝福_，一个对自己施放时赋予_10回合祝福和15点护盾_，或对其他角色施放时赋予_15回合祝福和15点治疗_的法术，消耗1点充能。\n\n_+2:_ 牧师可以施放_神圣祝福_，一个对自己施放时赋予_15回合祝福和25点护盾_，或对其他角色施放时赋予_25回合祝福和25点治疗_的法术，消耗1点充能。\n\n此法术的过量治疗转化为护盾值。\n\n对已被祝福的目标施放此法术将在+1/+2时赋予他们_1/2回合_肾上腺素。
actors.hero.talent.bless.comment="祝福给你！祝福给*你*，祝福也给*你*！"
actors.hero.talent.bless.meta_desc=_如果此天赋被其他英雄获得_，它将在+1/+2时提升英雄和所有盟友3%/5%的精准和闪避。
actors.hero.talent.radiant_grappler.title=圣光勾爪
actors.hero.talent.radiant_grappler.desc=_+1:_ 牧师可以施放_圣光勾爪_，一个以1点充能为代价，施放抓钩从远处收集物品和激活陷阱的法术。\n\n_+2:_ 牧师可以施放_圣光勾爪_，一个以1点充能为代价，施放抓钩一次性移动数格、收集物品、激活物品并从远处钩入敌人的法术。\n\n此法术无法穿墙。
actors.hero.talent.radiant_grappler.meta_desc=_如果此天赋被其他英雄获得_，它将在商店中和地面上不定期生成该法术的消耗品版本。
actors.hero.talent.radiant_grappler.comment="现在那个守卫或DM机也能过来了！"
actors.hero.talent.cleanse.title=神圣净化
actors.hero.talent.cleanse.desc=_+1:_ 牧师可以施放_神圣净化_，一个瞬间施放的法术，_赋予牧师和任何附近盟友3回合负面状态免疫_，并赋予他们_15点护盾_，消耗2点充能。\n\n_+2:_ 牧师可以施放_神圣净化_，一个瞬间施放的法术，_赋予牧师和任何附近盟友5回合负面状态免疫_，并赋予他们_30点护盾_，消耗2点充能。\n\n_+2:_ 牧师可以施放_神圣净化_，一个瞬间施放的法术，_赋予牧师和任何附近盟友7回合负面状态免疫_，并赋予他们_45点护盾_，消耗2点充能。
actors.hero.talent.cleanse.meta_desc=_如果此天赋被其他英雄获得_，它将在使用魔杖或神器后，在+1/+2/+3时有15/30/45%的几率清除英雄身上的负面状态效果。
actors.hero.talent.light_reading.title=轻量阅读
actors.hero.talent.light_reading.desc=_+0:_ 牧师可以在未装备时使用圣典，但未装备时其充能速度为_25%_。\n\n_+1:_ 牧师可以在未装备时使用圣典，但未装备时其充能速度为_50%_。\n\n_+2:_ 牧师可以在未装备时使用圣典，但未装备时其充能速度为_75%_。\n\n_+3:_ 牧师可以在未装备时使用圣典，_无惩罚_。
actors.hero.talent.light_reading.meta_desc=_如果此天赋被其他英雄获得_，它将在+1/+2/+3时提升所有魔杖13/25/40%的充能速度。
actors.hero.talent.exorcism.title=驱魔
actors.hero.talent.exorcism.desc=_+1:_ 对敌人使用牧师法术会使其受到圣焰效果影响_4回合_。\n\n_+2:_ 对敌人使用牧师法术会使其受到圣焰效果影响_6回合_。\n\n_+3:_ 对敌人使用牧师法术会使其受到圣焰效果影响_8回合_。\n\n圣焰造成类似火焰的伤害，但每回合伤害递增，无法被熄灭，并对亡灵和恶魔造成额外伤害。
actors.hero.talent.exorcism.meta_desc=_如果此天赋被其他英雄获得_，它将由使用伤害性魔杖触发相同效果。
actors.hero.talent.exorcism.comment="有些人可能会称这是天意赐予无知怪物的礼物。"
actors.hero.talent.holy_lance.title=神圣之枪
actors.hero.talent.holy_lance.desc=_+1:_ 祭司可以施放_神圣之枪_，一个造成_30-55伤害_的毁灭性法术，消耗4点充能。\n\n_+2:_ 祭司可以施放_神圣之枪_，一个造成_45-83伤害_的毁灭性法术，消耗4点充能。\n\n_+3:_ 祭司可以施放_神圣之枪_，一个造成_60-110伤害_的毁灭性法术，消耗4点充能。\n\n神圣长枪对恶魔和亡灵敌人总是造成最大伤害。神圣长枪再次施放前有15回合冷却时间。
actors.hero.talent.holy_lance.comment="看！一个敌人！"\n*砰*\n"什么敌人？"
actors.hero.talent.hallowed_ground.title=神圣领域
actors.hero.talent.hallowed_ground.desc=_+1:_ 祭司可以施放_神圣领域_，一个以2点充能为代价，在_3x3区域_内神圣化地形持续20回合的法术。\n\n_+2:_ 祭司可以施放_神圣领域_，一个以2点充能为代价，在_5x5区域_内神圣化地形持续20回合的法术。\n\n_+3:_ 祭司可以施放_神圣领域_，一个以2点充能为代价，在_7x7区域_内神圣化地形持续20回合的法术。\n\n施放时，神圣之地治疗盟友10生命值，短暂定身敌人，并蔓延短草。之后，它缓慢治疗盟友，削弱敌人，并导致高草随机生长。神圣之地会被火焰摧毁。
actors.hero.talent.hallowed_ground.comment="在找一个无所不能的法术？不用再找了。"
actors.hero.talent.mnemonic_prayer.title=祈祷诗篇
actors.hero.talent.mnemonic_prayer.desc=_+1:_ 祭司可以施放_祈祷诗篇_，一个以1点充能为代价，延长盟友/敌人身上的增益/减益效果_4回合_的法术。\n\n_+2:_ 祭司可以施放_祈祷诗篇_，一个以1点充能为代价，延长盟友/敌人身上的增益/减益效果_6回合_的法术。\n\n_+3:_ 祭司可以施放_祈祷诗篇_，一个以1点充能为代价，延长盟友/敌人身上的增益/减益效果_8回合_的法术。\n\n记忆祷言还会在目标之前被发光效果影响时重新施加发光效果。记忆祷言只能延长特定增益/减益效果实例一次，并且无法延长护甲能力赋予的增益。
actors.hero.talent.divine_advent.title=神圣降临
actors.hero.talent.divine_advent.desc=_+1_: 牧师可以施放_神圣降临_，该技能使牧师获得4回合的充能时间，并赋予3次充能值的法术以增益效果，但会消耗7次充能值\n\n_+2_: 牧师可以施放_神圣降临_，该技能赋予牧师6回合的充能时间，并强化4次充能值的法术，但需消耗6次充能\n\n  _+3_: 牧师可以施放_神圣降临_，该法术会为牧师提供8回合的充能，并赋予5次充能值的法术增益，但会消耗5次充能\n\n  _-_ 在神圣降临期间，施法者可以施放法术，无需考虑法典的充能情况，甚至无需考虑牧师是否升级相关天赋\n\n  _-_ 无论法典当前充能状态如何，都可以施放神圣降临，但充能状态为负时无法施放\n\n  _-_ “神圣降临”的冷却时间为增益效果失效后的100回合。\n\n
actors.hero.talent.divine_advent.comment="忏悔吧，罪人，审判已至。"
actors.hero.talent.enduring_light.title=持久之光
actors.hero.talent.enduring_light.desc=_+1_: 照亮效果有_33%_的概率在触发后保留。\n\n_+2_: 照亮效果有_67%_的概率在触发后保留。\n\n_+1_: 照亮效果有_100%_的概率在触发后保留。
actors.hero.talent.enduring_light.comment="花了这么多功夫却失去它们似乎有点浪费..."
actors.hero.talent.lay_on_hands.title=圣疗之触
actors.hero.talent.lay_on_hands.desc=_+1:_ 圣骑士可以施放_圣疗之触_，一个以1点充能为代价，瞬间治疗附近角色_10生命值_，或赋予圣骑士_10点护盾_的法术。它还赋予目标_1回合_肾上腺素。\n\n_+2:_ 圣骑士可以施放_圣疗之触_，一个以1点充能为代价，瞬间治疗附近角色_15生命值_，或赋予圣骑士_15点护盾_的法术。它还赋予目标_2回合_肾上腺素。\n\n_+3:_ 圣骑士可以施放_圣疗之触_，一个以1点充能为代价，瞬间治疗附近角色_20生命值_，或赋予圣骑士_20点护盾_的法术。它还赋予目标_3回合_肾上腺素。\n\n此法术的过量治疗转化为护盾值。圣手抚慰可重复施放，但一次最多只能给予三次施放量的护盾值。
actors.hero.talent.lay_on_hands.comment="当某物不动了，而你想让它动的时候使用。添加了一点额外的'鞭策'来真正加快速度。"
actors.hero.talent.aura_of_protection.title=守御灵光
actors.hero.talent.aura_of_protection.desc=_+1:_ 圣骑士可以施放_守御灵光_，一个以2点充能为代价，赋予圣骑士和2格内所有盟友_10%伤害抗性_和圣骑士护甲刻印效果_+50%效力_持续20回合的法术。\n\n_+2:_ 圣骑士可以施放_守御灵光_，一个以2点充能为代价，赋予圣骑士和2格内所有盟友_20%伤害抗性_和圣骑士护甲刻印效果_+75%效力_持续20回合的法术。\n\n_+3:_ 圣骑士可以施放_守御灵光_，一个以2点充能为代价，赋予圣骑士和2格内所有盟友_30%伤害抗性_和圣骑士护甲刻印效果_+100%效力_持续20回合的法术。\n\n守护光环可以通过施放法术延长，每消耗1点充能延长4回合。
actors.hero.talent.wall_of_light.title=神圣屏障
actors.hero.talent.wall_of_light.desc=_+1:_ 圣骑士可以施放_神圣屏障_，一个以3点充能为代价，在圣骑士面前创造一堵_3格宽_的实心墙的法术，此墙能推开敌人并持续20回合。\n\n_+2:_ 圣骑士可以施放_神圣屏障_，一个以3点充能为代价，在圣骑士面前创造一堵_5格宽_的实心墙的法术，此墙能推开敌人并持续20回合。\n\n_+3:_ 圣骑士可以施放_神圣屏障_，一个以3点充能为代价，在圣骑士面前创造一堵_7格宽_的实心墙的法术，此墙能推开敌人并持续20回合。\n\n此墙可以沿基本方向或对角线放置，一次只能存在一堵墙。
actors.hero.talent.wall_of_light.comment="当你真的想让东西动起来的时候用"
actors.hero.talent.limit_break.title=界限突破
actors.hero.talent.limit_break.desc=_+1_: 圣骑士可以施放_界限突破_，该技能以消耗4点充能为代价，为2点充能值的法术提供增益\n\n  _+2_:圣骑士可以施放_界限突破_， 该技能以消耗4点充能为代价，为4点充能值的法术提供增益\n\n _+3_: :圣骑士可以施放_界限突破_， 该技能以消耗4点充能为代价，为8点充能值的法术提供增益\n\n _-_ 界限突破使用后需要300回合的冷却时间\n_-_ 在界限突破状态下施放的法术，即使充能不足，甚至没有所需天赋，也能施放\n当生命值低于30%时，界限突破的充能成本为2，即使充能不足也能施放，冷却时间为150秒。
actors.hero.talent.limit_break.comment="限制的存在，不就是为了被打破..."
actors.hero.talent.triage.title=圣别
actors.hero.talent.triage.desc=_+1_: 圣骑士在施放至圣斩击、圣疗之触和神圣屏障时，可以越过最多_1格_。\n\n_+2_: 圣骑士在施放至圣斩击、圣疗之触和神圣屏障时，可以越过最多_2格_。\n\n_+3_: 圣骑士在施放至圣斩击、圣疗之触和神圣屏障时，可以越过最多_3格_。
actors.hero.talent.triage.comment="决心 > 射程"
actors.hero.talent.heroic_infusion.title=英勇灌注
actors.hero.talent.heroic_infusion.desc=_+1:_ 牧师在受到伤害时瞬间获得_0.5点魔杖和神器充能_。\n\n_+2:_ 牧师在受到伤害时瞬间获得_0.75点魔杖和神器充能_。\n\n_+3:_ 牧师在受到伤害时瞬间获得_1点魔杖和神器充能_。\n\n_+1:_ 牧师在受到伤害时瞬间获得_1.25点魔杖和神器充能_。\n\n如果英雄受到0或更少伤害，此天赋不会触发。
actors.hero.talent.heroic_infusion.comment="好像它们的获取还不够疯狂似的。"
actors.hero.talent.divine_intervention.title=神圣干预
actors.hero.talent.divine_intervention.desc=_+1:_ 在超凡升天下，牧师可以施放_神圣干预_，将牧师和所有盟友提升至_150点护盾值_并将超凡升天延长_1回合_。\n\n_+2:_ 在超凡升天下，牧师可以施放_神圣干预_，将牧师和所有盟友提升至_200点护盾值_并将超凡升天延长_2回合_。\n\n_+3:_ 在超凡升天下，牧师可以施放_神圣干预_，将牧师和所有盟友提升至_250点护盾值_并将超凡升天延长_3回合_。\n\n_+4:_ 在超凡升天下，牧师可以施放_神圣干预_，将牧师和所有盟友提升至_300点护盾值_并将超凡升天延长_4回合_。\n\n神圣干预消耗高达5点圣典充能，并且在同一超凡升天中只能施放一次。
actors.hero.talent.judgement.title=终末天启
actors.hero.talent.judgement.desc=_+1:_ 在超凡升天下，牧师可以施放_终末天启_，对所有可见敌人造成_10-20伤害_。\n\n_+2:_ 在超凡升天下，牧师可以施放_终末天启_，对所有可见敌人造成_15-30伤害_。\n\n_+3:_ 在超凡升天下，牧师可以施放_终末天启_，对所有可见敌人造成_20-40伤害_。\n\n_+4:_ 在超凡升天下，牧师可以施放_终末天启_，对所有可见敌人造成_25-50伤害_。\n\n审判消耗3点圣典充能。且牧师进入超凡升天后或自上次施放审判以来每一次释放法术都会使得审判额外造成5-10伤害。
actors.hero.talent.flash.title=天堂阶梯
actors.hero.talent.flash.desc=_+1：_开启超凡升天时，牧师可以施放法术_天堂阶梯_，以传送至最多_3格_外。\n\n_+2：_开启超凡升天时，牧师可以施放法术_天堂阶梯_，以传送至最多_4格_外。\n\n_+3：_开启超凡升天时，牧师可以施放法术_天堂阶梯_，以传送至最多_5格_外。\n\n_+4：_开启超凡升天时，牧师可以施放法术_天堂阶梯_，以传送至最多_6格_外。\n\n天堂阶梯初始消耗1点圣典充能，并且在同次开启超凡升天时每次施放都会+1充能消耗。
actors.hero.talent.divine_proficiency.title=神圣精通
actors.hero.talent.divine_proficiency.desc=_+1:_ 每次超凡升天结束时，其持续时间将永久增加_1回合_，最多增加_+5回合_。\n\n_+2:_ 每次超凡升天结束时，其持续时间将永久增加_1回合_，最多增加_+10回合_。\n\n_+3:_ 每次超凡升天结束时，其持续时间将永久增加_2回合_，最多增加_+15回合_。\n\n_+4:_ 每次超凡升天结束时，其持续时间将永久增加_2回合_，最多增加_+20回合_。
actors.hero.talent.divine_proficiency.comment="毅力...每次你使用此能力都会进步一点点。"
actors.hero.talent.body_form.title=体之位格
actors.hero.talent.body_form.desc=牧师可以施放_体之位格_，以2点充能为代价，为三位一体注入一个牧师在此次游戏中鉴定过的附魔或刻印的力量。\n\n_+1:_ 当使用三位一体时，牧师获得所选效果_20回合_。\n\n_+2:_ 当使用三位一体时，牧师获得所选效果_27回合_。\n\n_+3:_ 当使用三位一体时，牧师获得所选效果_33回合_。\n\n_+4:_ 当使用三位一体时，牧师获得所选效果_40回合_。\n\n三位一体一次只能注入一种体之位格效果。如果所选符印稀有且强大，三位一体的护甲充能消耗会更高。
actors.hero.talent.mind_form.title=智之位格
actors.hero.talent.mind_form.desc=牧师可以施放_智之位格_，以3点充能为代价，为三位一体注入一个牧师在此次游戏中使用过的魔杖或投掷武器的力量。\n\n_+1:_ 当使用三位一体时，牧师使用所选物品的施法或投掷效果，如同物品为_+3_。\n\n_+2:_ 当使用三位一体时，牧师使用所选物品的施法或投掷效果，如同物品为_+4_。\n\n_+3:_ 当使用三位一体时，牧师使用所选物品的施法或投掷效果，如同物品为_+5_。\n\n_+4:_ 当使用三位一体时，牧师使用所选物品的施法或投掷效果，如同物品为_+6_。\n\n三位一体一次只能注入一种智之位格效果。
actors.hero.talent.spirit_form.title=魂之位格
actors.hero.talent.spirit_form.desc=牧师可以施放_魂之位格_，以4点充能为代价，将三位一体注入一个牧师在此次游戏中鉴定过的戒指或神器（圣典除外）的力量。\n\n_+1:_ 当使用三位一体时，牧师以_+1等级_获得戒指效果持续20回合，或以_+4等级_触发神器效果。\n\n_+2:_ 当使用三位一体时，牧师以_+2等级_获得戒指效果持续20回合，或以_+6等级_触发神器效果。\n\n_+3:_ 当使用三位一体时，牧师以_+3等级_获得戒指效果持续20回合，或以_+8等级触发神器效果。\n\n_+4:_ 当使用三位一体时，牧师以_+4等级_获得戒指效果持续20回合，或以_+10等级_触发神器效果。\n\n三位一体一次只能注入一种魂之位格效果。神器通过三位一体触发时具有不同的效果和护甲充能消耗。
actors.hero.talent.meta_form.title=蜕变位格
actors.hero.talent.meta_form.desc=牧师可以施放_蜕变位格_，以5点充能为代价，将三位一体注入一个牧师可从10个可能选项中选出的天赋的最大效力。\n\n_+1:_ 当使用三位一体时，牧师获得所选天赋_100回合_。\n\n_+2:_ 当使用三位一体时，牧师获得所选天赋_125回合_。\n\n_+3:_ 当使用三位一体时，牧师获得所选天赋_150回合_。\n\n_+4:_ 当使用三位一体时，牧师获得所选天赋_175回合_。\n\n三位一体一次只能注入一种蜕变效果。\n\n与其他形态不同，蜕变位格在选择效果前消耗圣典充能。
actors.hero.talent.beaming_ray.title=呼神护卫
actors.hero.talent.beaming_ray.desc=牧师可以施放法术_呼神护卫_，消耗1点充能以使强化盟友释放传送光束。传送光束可穿透墙壁并传送盟友至指定位置。如果该位置有敌人，盟友会出现在敌人附近并将其作为攻击目标。该法术还可以传送通常情况下无法移动的盟友，但若如此则传送光束范围减半。\n\n_+1：_传送光束的最大范围为4格，并使诸圣神力对最近敌人的伤害加成提升至_35%_，持续10回合。\n\n_+2：_传送光束的最大范围为8格，并使诸圣神力对最近敌人的伤害加成提升至_40%_，持续10回合。\n\n_+3：_传送光束的最大范围为12格，并使诸圣神力对最近敌人的伤害加成提升至_45%_，持续10回合。\n\n_+4：_传送光束的最大范围为16格，并使诸圣神力对最近敌人的伤害加成提升至_50%_，持续10回合。
actors.hero.talent.life_link.title=血色羁绊
actors.hero.talent.life_link.desc=牧师可以施放法术_血色羁绊_，消耗2点充能以使牧师自身与强化盟友之间建立生命联结。该法术会使牧师与其盟友共享所受伤害，并使3阶及以下的增益型牧师法术对任何一方施放时对双方均生效。\n\n_+1：_生命联结持续_6回合_并使诸圣神力的伤害减免提升至_35%_。\n\n_+2：_生命联结持续_8回合_并使诸圣神力的伤害减免提升至_40%_。\n\n_+3：_生命联结持续_10回合_并使诸圣神力的伤害减免提升至_45%_。\n\n_+4：_生命联结持续_12回合_并使诸圣神力的伤害减免提升至_50%_。
actors.hero.talent.stasis.title=星界投射
actors.hero.talent.stasis.desc=牧师可以施放法术_星界投射_，消耗1点充能以凝滞强化盟友。该法术会将盟友临时移出地牢，并保留其包括诸圣神力在内的所有增益效果的剩余时间。当法术效果结束时盟友会在你附近再次出现。该法术可被无消耗地立即再次施放，以提前结束法术效果。该法术对无法移动的盟友也会生效，但无法将其跨层移动。\n\n_+1：_凝滞状态最多持续_40回合_。\n\n_+2：_凝滞状态最多持续_60回合_。\n\n_+3：_凝滞状态最多持续_80回合_。\n\n_+4：_凝滞状态最多持续_100回合_。\n\n当有盟友处于凝滞状态时，牧师还可施放呼神护卫以再次召唤盟友，或施放血色羁绊以提前获得法术效果。然而，凝滞状态下的盟友无法受益于血色羁绊的法术效果。
actors.hero.talent.enrage.title=激怒
actors.hero.talent.enrage.desc=牧师可以对强化盟友施放_激怒_，消耗3点充能。此法术使盟友暂时造成1.5倍物理伤害，但也承受1.5倍伤害。\n\n_+1:_ 激怒持续_4回合_。\n\n_+2:_ 激怒持续_8回合_。\n\n_+3:_ 激怒持续_16回合_。\n\n_+4:_ 激怒持续_12回合_。
actors.hero.talent.royal_privilege.title=皇家特权
actors.hero.talent.royal_privilege.desc=忍饥挨饿对国王来说是不存在的！\n\n_+1：_当鼠王的生命值低于30%时，进食可以治疗_3点生命_。在接下来的3次魔杖打击中，它也会提供_2点额外伤害_。在地牢的前期阶段，能找到放在箱子里的_2份小口粮_和藏在高草里的_4份浆果_。\n\n_+2：_当鼠王的生命值低于30%时，可以治疗_5点生命_。在接下来的3次魔杖打击中，它也会提供_3点额外伤害_。在地牢的前期阶段，能找到放在箱子里的_3份小口粮_和藏在高草里的_6份浆果_。
actors.hero.talent.royal_privilege.comment_mage="充——能——"
actors.hero.talent.royal_intuition.title=皇家直觉
actors.hero.talent.royal_intuition.desc=朕日理万机，明察秋毫！\n\n_+1:_鼠王鉴定武器、盔甲和戒指为_2.75倍_速度，鉴定法杖为_3.75倍_速度！会在装备戒指后，马上鉴定它的类型！\n\n_+2:_鼠王在装备所有装备时_鉴定_它们，并且可以在拿起戒指时_立即确定_戒指的类型！
actors.hero.talent.kings_wisdom.title=王者智慧
actors.hero.talent.kings_wisdom.desc=上兵伐谋，兵法之道！\n\n_+1:_鼠王对每个敌人的首次伏击造成_1-2点额外伤害_，当鼠王用弓或投掷武器击中一个敌人时，下一次近战攻击对该敌人造成_2点额外伤害_。此外，鼠王使用法杖或者魔杖攻击敌人之后下一次攻击还会造成1-2点额外伤害，而且鼠王的护盾破碎后，也会使得下一次物理攻击造成2额外伤害。\n\n_+2:_鼠王对每个敌人的首次伏击造成_2点额外伤害_，当鼠王用弓或投掷武器击中一个敌人时，下一次近战攻击该敌人造成_3点额外伤害_。此外，鼠王使用法杖或者魔杖攻击敌人之后下一次攻击还会造成2点额外伤害，而且朕的护盾破碎后，也会使得下一次物理攻击造成3额外伤害。
actors.hero.talent.noble_cause.title=高贵血统
actors.hero.talent.noble_cause.desc=古之立大事者，不惟有超世之才，亦必有坚忍不拔之志！\n\n_+1:_鼠王的纹章提供的最大护盾增加_1点_。每当老魔杖耗尽充能，获得_3点护盾_。斗篷被激活时，每_2回合_获得1点护盾，最多_3点_。每当一个植物在视野中被践踏，获得2点树肤护甲，每_3个回合_减少1点！\n\n_+2:_鼠王的纹章提供的最大护盾增加_2点_。每当老魔杖耗尽充能，获得_5点护盾_。斗篷被激活时，每_1回合_获得1点护盾，最多_5点_。每当一个植物在视野中被践踏，获得2点树肤护甲，每_5个回合_减少1点！
actors.hero.talent.noble_cause.meta_desc=_-倘若这个天赋由没纹章的英雄获得_，那么所有护盾类效果都会享受这个加成。\n_-倘若这个天赋由没有老魔杖的英雄获得_，那么等级最高的法杖耗尽充能时可以享受这个天赋。
actors.hero.talent.royal_meal.title=皇家宴席
actors.hero.talent.royal_meal.desc=食不厌精，脍不厌细！\n\n_+1:_鼠王进食只需要_1回合_（吃浆果不耗时），并提供_5回合_法杖充能，_3回合_神器充能，和_1回合_极速。进食的时候，鼠王获得_75%免伤_。\n\n_+2:_鼠王进食只需要_1回合_（吃浆果不耗时），并提供_8回合_法杖充能，_5回合_神器充能，和_2回合_极速。进食的时候，鼠王_无敌_！
actors.hero.talent.royal_meal.comment_mage="好吧，你看看这个。所有的进食效果都包装得很好，只是等待使用..."
actors.hero.talent.kings_vision.title=王者视野
actors.hero.talent.kings_vision.desc=御座之下，跳梁小丑无处遁形！\n\n_+1：_鼠王能感知到_2格以内_的敌人。搜索范围变成一个_7x7的圆_。使用法杖命中敌人时，获取目标视野，持续 _10回合_。向敌人扔出任何非投掷武器的物品时可以致盲他们 _2 回合_，这个效果有_50回合_的冷却时间。\n\n_+2：_鼠王能感知到_3格以内_的敌人。搜索范围变成一个_7x7的方_。使用法杖命中敌人时，获取目标视野，持续 _15回合_。向敌人扔出任何非投掷武器的物品时可以致盲他们 _3 回合_，这个效果有_50回合_的冷却时间。
actors.hero.talent.kings_vision.meta_desc=_倘若这个天赋由其他英雄获得_，搜索范围将会在+1/+2天赋时变成5x5的圆/方。
actors.hero.talent.restoration.title=等价交换
actors.hero.talent.restoration.desc=一切行动都有等价行动和相反行动。反正别人是这么说的。\n\n_+1：_鼠王使用卷轴会立即获得_3回合_隐身并使得_下2次法杖施法_+2等级。使用药剂会立即获得破碎纹章_50%的护盾_，并在周围产生_4个草丛_，扎根相邻的敌人_1回合_。鼠王可以用法杖瞄准自己，立即将其充能转化为护盾，每点充能转化最大生命值的_4%_。\n\n_+2：_鼠王使用卷轴会立即获得_3回合隐身_并使得_下2次法杖施法_+2等级。使用药剂会立即获得破碎纹章_75%的护盾_，并在周围产生_6个草丛_，扎根相邻的敌人_2回合_。鼠王可以用法杖瞄准自己，立即将其充能转化为护盾，每点充能转化最大生命值的_6%_。\n\n阅读升级和嬗变卷轴以及对应秘卷获得的隐身时长和法杖强化施法次数翻倍，使用力量和经验药水以及对应秘药时获得的护盾，高草，扎根时长也翻倍。喝水壶中的水也能触发，效果根据喝水量决定，10滴水拥有100%效果。
actors.hero.talent.restoration.meta_desc=如果这一天赋由没有破损纹章的英雄获取，则给予的护盾量在+1时为5%最大血量，+2时为7.5%最大血量。
actors.hero.talent.power_within.title=超凡本能
actors.hero.talent.power_within.desc=一鸟在手，十鸟在林！\n\n_+1：_破损纹章可以像携带1层升级一样携带_普通或稀有刻印_。当鼠王将新的法杖注入老魔杖时，先前灌注的法杖以0级状态回收，只能触发一次。进入有隐藏房间的新楼层时，有 _75% 的概率察觉_该层有隐藏房间。踏上矮草或灰烬时，它们会复生为高草，并立即被踩踏，这个效果有 _10 回合_的冷却时间。\n\n_+2：_破损纹章可以像携带1层升级一样携带_任何刻印_。当鼠王将新的法杖注入老魔杖时，先前灌注的法杖以0级状态回收，英雄每一级触发一次。进入有隐藏房间的新楼层时，有 _75% 的概率察觉_该层有隐藏房间。踏上矮草或灰烬时，它们会复生为高草，并立即被踩踏，这个效果有 _5 回合_的冷却时间。
actors.hero.talent.power_within.meta_desc=_- 如果英雄获得这个天赋而没有魔杖_，当将法杖放入炼金炉中时，将在 +1/+2 时增加获得的奥术树脂数量。\n\n_- 如果英雄获得这个天赋而没有纹章_，在将护甲升级到 6 级时，将增加保留护甲附魔的等级，+1 时从 4 级增加到 6 级，+2 时从 4 级增加到 7 级。在 +8 时，保留附魔的等级不变。
actors.hero.talent.pursuit.title=皇家狩猎
actors.hero.talent.pursuit.desc=敌人？更像是"猎物！"\n\n_+1：_鼠王手中的投掷武器获得_ 50% 额外耐久度_。不会惊醒_距其3格或更远的敌人_。斩杀敌人的一击有_ 67% 的概率_不消耗回合数.\n\n_+2：_鼠王手中的投掷武器获得_ 75% 额外耐久度_。不会惊醒_未与其相邻的敌人_。斩杀敌人的一击有_ 100% 的概率_不消耗回合数。
actors.hero.talent.pursuit.comment_rogue="无声步伐2.0，以致命动力作为奖励！"
actors.hero.talent.pursuit.comment_huntress="这些都是好东西..."
actors.hero.talent.rk_berserker.title=王的愤怒
actors.hero.talent.rk_berserker.desc=天子一怒，伏尸百万，流血千里!\n\n  _+1：_鼠王的怒气上限提升至_116%_，力量增加_8%_(向下取整)。拥有越多怒气，他武器上的附魔或诅咒触发的几率越高，在100%怒气达到最大效果，触发几率_提升至1.15倍_。怒气满时可以抗拒死亡进入狂暴状态（冷却4英雄等级）。进行等待时，他在下次移动前获得_+2点护甲_。\n\n  _+2：_鼠王的怒气上限提升至_133%_，力量增加_12%_(向下取整)。拥有越多怒气，他武器上的附魔或诅咒触发的几率越高，在100%怒气达到最大效果，触发几率_提升至1.3倍_。怒气满时可以抗拒死亡进入狂暴状态（冷却3英雄等级）。进行等待时，他在下次移动前获得_+4点护甲_。\n\n  _+3：_鼠王的怒气上限提升至_150%_，力量增加_18%_(向下取整)。拥有越多怒气，他武器上的附魔或诅咒触发的几率越高，在100%怒气达到最大效果，触发几率_提升至1.45倍_。怒气满时可以抗拒死亡进入狂暴状态（冷却2英雄等级），进行等待时，他在下次移动前获得_+6点护甲_。\n\n怒气值超过100%时,伤害提升仍然为50%，但是会额外增加1%狂暴护盾并减少1%狂暴冷却。
actors.hero.talent.rk_gladiator.title=王的连击
actors.hero.talent.rk_gladiator.desc=知己知彼，百战不殆！ \n这一天赋允许鼠王通过近战和投掷武器积攒连击，当鼠王积攒了足够连击之后，鼠王将可以使用强大的连击技！\n\n  _+1：_当鼠王击杀一名敌人时，_15回合_内再次攻击仍继承连击数。使用连击技能击杀一名敌人时，获得破损纹章护盾值的_33%_。连击数达到7或以上时，冲击的击退距离提升至3且附带眩晕，并可将敌人击落深渊。\n\n  _+2：_当鼠王击杀一名敌人时，_30回合_内再次攻击仍继承连击数。使用连击技能击杀一名敌人时，获得破损纹章护盾值的_67%_。在+1的基础上，连击数达到9或以上时，格挡反击对一回合内的多次攻击有效。\n\n  _+3：_当鼠王击杀一名敌人时，_45回合_内再次攻击仍继承连击数。使用连击技能击杀一名敌人时，获得破损纹章护盾值的_100%_。在+2的基础上，使用撞击、横扫和暴雨时可跃过_连击数/3_格来接近敌人。
actors.hero.talent.rk_battlemage.title=王的魔法
actors.hero.talent.rk_battlemage.desc=这一天赋使得鼠王的老魔杖近战攻击可以充能鼠王的全部法杖。此外，鼠王还根据灌注的法杖获得特殊的命中效果！\n\n  _+1：_法杖只有1充能时，法杖效果_提升1级_。使用法杖施法后，下一次近战攻击造成额外_16%伤害_且特殊效果提升50%。老魔杖近战击中敌人时，获得_0.5回合_神器充能效果。在使用满充能的老魔杖施法时，获得0.67倍于魔杖等级的护盾值。\n\n  _+2：_法杖只有1充能时，法杖效果_提升2级_。使用法杖施法后，下一次近战攻击造成额外_33%伤害_且特殊效果提升100%。老魔杖近战击中敌人时，获得_1回合_神器充能效果。在使用满充能的老魔杖施法时，获得1.33倍于魔杖等级的护盾值。\n\n  _+3：_法杖只有1充能时，法杖效果_提升3级_。使用法杖施法后，下一次近战攻击造成额外_50%伤害_且特殊效果提升150%。老魔杖近战击中敌人时，获得_1.5回合_神器充能效果。在使用满充能的老魔杖施法时，获得2倍于魔杖等级的护盾值。
actors.hero.talent.rk_warlock.title=皇家存在
actors.hero.talent.rk_warlock.desc=不是只有矮人王能让子民效忠！\n这一天赋使得鼠王的魔法可以用黑暗邪咒标记敌人，让鼠王能从他们身上偷取生命！\n\n  _+1：_鼠王可以与一名_2格内_的友方单位瞬间交换位置。其他单位的近战攻击同样会触发灵魂标记，但只有_13%效率_。每对被灵魂标记的单位造成1点伤害，都会回复相当于_0.33回合_的饥饿值。被灵魂标记的单位死亡时，有_10%概率_触发一次进食效果，并有_13%概率_成为一只被腐化的怨灵。\n\n  _+2：_鼠王可以与一名_4格内_的友方单位瞬间交换位置。其他单位的近战攻击同样会触发灵魂标记，但只有_27%效率_。每对被灵魂标记的单位造成1点伤害，都会回复相当于_0.67回合_的饥饿值。被灵魂标记的单位死亡时，有_20%概率_触发一次进食效果，并有_27%概率_成为一只被腐化的怨灵。\n\n  _+3：_鼠王可以与一名_6格内_的友方单位瞬间交换位置。其他单位的近战攻击同样会触发灵魂标记，但只有_40%效率_。每对被灵魂标记的单位造成1点伤害，都会回复相当于_1回合_的饥饿值。被灵魂标记的单位死亡时，有_30%概率_触发一次进食效果，并有_40%概率_成为一只被腐化的怨灵。\n\n鼠王不能与无法移动的友方单位交换位置。
actors.hero.talent.rk_assassin.title=闪光的王
actors.hero.talent.rk_assassin.desc=不得直视朕的御驾！\n这一天赋使得鼠王隐身时可以准备刺杀，并且足够努力时可以秒杀敌人！\n\n  _+1：_使用神器后的_3回合_内，装备的所有戒指都会提升1级。根据潜伏时长的不同，刺杀时的闪现距离由1/2/3/4格提升至_1/3/4/6格_，现在生命值低于_4/13/27/67%_的目标都有几率被处决。被技能刺杀的敌人掉落率提升2/4/8/16%。\n\n  _+2：_使用神器后的_6回合_内，装备的所有戒指都会提升1级。根据潜伏时长的不同，刺杀时的闪现距离由1/2/3/4格提升至_2/4/6/8格_，现在生命值低于_5/17/30/83%_的目标都有几率被处决。被技能刺杀的敌人掉落率提升4/8/16/32%。\n\n  _+3：_使用神器后的_9回合_内，装备的所有戒指都会提升1级。根据潜伏时长的不同，刺杀时的闪现距离由1/2/3/4格提升至_2/5/7/10格_，现在生命值低于_6/20/40/100%_的目标都有几率被处决。被技能刺杀的敌人掉落率提升6/12/24/48%。
actors.hero.talent.rk_freerunner.title=王的步伐
actors.hero.talent.rk_freerunner.desc=这一天赋使得鼠王奔跑时可以积攒动量。然后鼠王可以一键进入逸动状态，大幅提升移动速度！可惜使用完这一项能力之后需要恢复。\n\n  _+1：_处于逸动状态时，鼠王的力量每超过护甲需求1点便获得_1点闪避_，使用投掷武器和弓时获得额外的_20%命中与15%伤害_。在隐身时每回合获得2层动量。不装备暗影披风也能使用披风的隐身技能，但未装备时披风的充能速率会降至_25%_。\n\n  _+2：_处于逸动状态时，鼠王的力量每超过护甲需求1点便获得_2点闪避_，使用投掷武器和弓时获得额外的_40%命中与30%伤害_。在+1的基础上，隐身时逸动效果持续的回合数不会下降。不装备暗影披风也能使用披风的隐身技能，但未装备时披风的充能速率会降至_50%_。\n\n  _+3：_处于逸动状态时，鼠王的力量每超过护甲需求1点便获得_3点闪避_，使用投掷武器和弓时获得额外的_60%命中与45%伤害_。在+2的基础上，隐身时不论是否处于逸动状态，移动速度都会翻倍。不装备暗影披风也能使用披风的隐身技能，但未装备时披风的充能速率会降至_75%_。
actors.hero.talent.rk_sniper.title=虽远必诛
actors.hero.talent.rk_sniper.desc=这一天赋使得鼠王的弓可以忽略护甲，并可以在投掷攻击后进行特殊的追击！\n\n  _+1：_视野范围_扩大25%_。投掷武器 _有33%几率_ 共享灵能弓上的附魔。使用一件升级过的投掷武器攻击时，其上的每级升级都会提升1回合狙击标记的持续时间，并使特殊攻击伤害_提升2.5%_乘以武器阶数。此外，贴身使用投掷武器_只减少30%命中率_。\n\n  _+2：_视野范围_扩大50%_。投掷武器 _有67%几率_ 共享灵能弓上的附魔。使用一件升级过的投掷武器攻击时，其上的每级升级都会使狙击手的特殊攻击伤害_提升5%_乘以投掷武器阶数。此外，贴身使用投掷武器_只减少10%命中率_。\n\n  _+3：_视野范围_扩大75%_。投掷武器 _必定能够_ 共享灵能弓上的附魔。使用一件升级过的投掷武器攻击时，其上的每级升级都会使狙击手的特殊攻击伤害_提升7.5%_乘以投掷武器阶数。此外，贴身使用投掷武器_增加10%命中率_。\n\n注：远程使用投掷武器时，命中为100%。\n\n若装备了已附魔的十字弩，使用飞镖时这项天赋不会生效，因为飞镖已经触发了十字弩本身的附魔。
actors.hero.talent.rk_warden.title=自然之王
actors.hero.talent.rk_warden.desc=这一天赋使得鼠王视野能穿过高草且踩踏每种植物效果都被替换为独特特效！\n\n  _+1：_在踏入草丛时，获得等同于_50%_等级的树肤效果，该效果每1回合衰减。生命值满时,拾取露珠可以提供为鼠王提供护盾,上限为鼠王_20% 的最大生命值_.当鼠王向地面射击时，获得3x3区域的视野_5回合_，冷却时间20回合。涂药飞镖拥有_2倍耐久值_.\n\n  _+2：_在踏入草丛时，获得等同于_100%_等级的树肤效果，该效果每1回合衰减。生命值满时，拾取露珠可以提供护盾，上限为_40% 最大生命值_。向地面射击时，获得3x3区域的视野_10回合_。涂药飞镖拥有_3倍耐久值_。\n\n  _+3：_在踏入草丛时，获得等同于_150%_等级的树肤效果，该效果每1回合衰减。生命值满时，拾取露珠可以提供护盾，上限为_60% 最大生命值_。向地面射击时，获得3x3区域的视野_15回合_。涂药飞镖拥有_4倍耐久值_。
actors.hero.talent.rk_fire.title=极暗余烬
actors.hero.talent.rk_fire.desc=_+1：_来自鼠王的火焰攻击_提高13%伤害_（火矢法杖伤害提高9%）\n\n_+2：_来自鼠王的火焰攻击_提高25%伤害_（火矢法杖伤害提高17%）\n\n_+3：_来自鼠王的火焰攻击_提高38%伤害_（火矢法杖伤害提高27%）\n\n_当鼠王处于烈焰精英状态下：_\n_+1:_ 鼠王在造成燃烧时，有_14%_概率变为_剧烈燃烧_，且受到伤害时有_25%_概率点燃周围。\n\n_+2:_ 鼠王在造成燃烧时，有_29%_概率变为_剧烈燃烧_，且受到伤害时有_50%_概率点燃周围。\n\n_+3:_ 鼠王在造成燃烧时，有_43%_概率变为_剧烈燃烧_，且受到伤害时有_75%_概率点燃周围。鼠王攻击造成150%燃烧伤害。\n\n"当你发现火光的时候，再去注意它的伤害已经太迟了。"
actors.hero.talent.rk_project.title=幽灵之触
actors.hero.talent.rk_project.desc=_+1：_鼠王的远程武器每有一格距离造成_4%额外伤害_，上限25%。\n\n_+2：_鼠王的远程武器每有一格距离造成_6%额外伤害_，上限50%。\n\n_+3：_鼠王的远程武器每有一格距离造成_8%额外伤害_，上限75%。\n\n_当鼠王处于索敌精英状态下_:\n\n_+1:_ 近战攻击增加_9%伤害_，远程武器无视墙壁距离_提升25%_。\n\n_+2:_ 近战攻击增加_18%伤害_，远程武器无视墙壁距离_提升50%_。\n\n_+3:_ 贴身攻击增加_27%伤害_，远程武器无视墙壁距离_提升75%_。法杖的穿墙判定变得更宽松。\n\n"障碍对鼠王来说是助力而非困难。"
actors.hero.talent.rk_antimagic.title=神秘力场
actors.hero.talent.rk_antimagic.desc=_+1_：当鼠王处于法杖或神器充能状态下，鼠王每回合获得_1护盾_，上限8点。\n\n_+2_：当鼠王处于法杖或神器充能状态下，鼠王每回合获得_1.5护盾并回复1血量_，护盾上限16点。\n\n_+3_：当鼠王处于法杖或神器充能状态下，鼠王每回合获得_1.5护盾并回复1血量_，护盾上限16点。若同时处于这两种状态下则翻倍。\n\n_当鼠王处于敌法精英形态下：_\n\n_+1:_ 受到魔法攻击时，回敬_4点伤害_，并恢复_2点生命值_。\n\n_+2:_ 受到魔法攻击时，回敬_8点伤害_，并恢复_4点生命值_。\n\n_+3:_ 受到魔法攻击时，回敬_12点伤害_，并恢复_6点生命值_，且法杖获得少量充能。\n\n"专治魔法恐惧症。"
actors.hero.talent.rk_giant.title=法天象地
actors.hero.talent.rk_giant.desc=_+1_：鼠王的血量越低，护甲额外提升越多，当鼠王0%血量时达到上限_提升33%_\n\n_+2_：鼠王的血量越低，护甲额外提升越多，当鼠王0%血量时达到上限_提升67%_\n\n_+3_：鼠王的血量越低，护甲额外提升越多，当鼠王0%血量时达到上限_提升100%_\n\n_当鼠王处于巨型精英状态时：_\n\n_+1:_ 抵消前伤害_25%_转化为伤害储存。攻击敌人时，有_8%_概率将其击晕。\n\n_+2:_ 抵消前伤害_50%_转化为伤害储存。攻击敌人时，有_15%_概率将其击晕。\n\n_+3:_ 抵消前伤害_75%_转化为伤害储存。攻击敌人时，有_23%_概率将其击晕。护甲刻印的效果翻倍。\n\n"堵墙手撕DM的绝佳时机。"
actors.hero.talent.rk_blessed.title=上帝之手
actors.hero.talent.rk_blessed.desc=_+1：_鼠王的每一点护盾提升_0.75%_命中和_0.5%_闪避\n\n_+2：_鼠王的每一点护盾提升_1.5%_命中和_1%_闪避\n\n_+3：_鼠王的每一点护盾提升_2.25%_命中和_1.5%_闪避_\n\n当鼠王处于天佑精英状态时：_\n\n_+1:_ 近战攻击在_3x3_范围内造成_25%_原始伤害的AOE。\n\n_+2:_ 近战攻击在_5x5_范围内造成_30%_原始伤害的AOE。\n\n_+3:_ 近战攻击在_7x7_范围内造成_35%_原始伤害的AOE。\n\n"虽然不能像宙斯一样驱雷策电…但这也差不多了。"
actors.hero.talent.rk_cursed.title=掌控疯狂
actors.hero.talent.rk_cursed.desc=_+1：_鼠王的扭曲值上限增加_15_且当前每30点扭曲会使得鼠王的法杖获得+1等级。\n\n_+2：_鼠王的扭曲值上限增加_30_且当前每25点扭曲会使得鼠王的法杖获得+1等级。\n\n_+3：_鼠王的扭曲值上限增加_45_且当前每20点扭曲会使得鼠王的法杖获得+1等级。\n\n_当鼠王处于诅咒精英状态下时：_\n\n_+1:_ 攻击产生的诅咒效果对自身造成更少的有害影响。\n\n_+2:_ 攻击产生的诅咒效果对自身造成更少的有害影响。稀有效果出现频率增加_10%_。\n\n_+3:_ 攻击产生的诅咒效果更强，对自身造成更少的有害影响。稀有效果出现频率增加_10%_。\n\n"掌控诅咒，掌控黑暗，掌控心中原始的混沌。"
actors.hero.talent.rk_splint.title=镜像军团
actors.hero.talent.rk_splint.desc=_+1：_鼠王的盟友获得鼠王33%的护甲。\n\n_+2：_鼠王的盟友获得鼠王67%的护甲。\n\n_+3：_鼠王的盟友获得鼠王100%的护甲。\n\n_当鼠王处于分裂精英状态下：_\n\n_+1:_ 分裂出的镜像会在生成后立刻行动。\n\n_+2:_ 分裂出的镜像会在生成后立刻行动，且在低于50%生命值时获得愤怒，增强75%的力量。\n\n_+3:_ 分裂出的镜像会在生成后立刻行动，且在低于50%生命值时获得愤怒，增强75%的力量。镜像获得25%额外生命值。\n\n“我们有过动物战争，克隆战争，内战……现在还能再来打一场吗，我亲爱的鼠民？”
actors.hero.talent.rk_paladin.title=皇家禁卫
actors.hero.talent.rk_paladin.desc=_+1：_视野内每有一种盟友，鼠王获得_2额外血量_且增加_7.5%_血量恢复速度。\n\n_+2：_视野内每有一种盟友，鼠王获得_5额外血量_且增加_15%_血量恢复速度。\n\n_+3：_视野内每有一种盟友，鼠王获得_8额外血量_且增加_22.5%_血量恢复速度。\n\n盟友类型包括蜜蜂，召唤元素，天赋的召唤物，我忠诚的鼠民，羊，黄金莲，镜像，腐化与魅惑的敌人，诸如此类……\n\n_当鼠王处于圣骑精英形态下：_\n\n_+1:_ 当友军受到攻击时，有_3%_概率获得进食效果。\n\n_+2:_ 当友军受到攻击时，有_7%_概率获得进食效果。\n\n_+3:_ 当友军受到攻击时，有_10%_概率获得进食效果。可以与_3格内_的友军交换位置。\n\n"且观小儿辈破贼。"
actors.hero.talent.aftershock.title=余震
actors.hero.talent.aftershock.desc=_+1:_ 冲击波影响_1-2格_内的所有人，并且有_20%_的几率触发诸如附魔和连击之类的命中效果。此外，它会造成_15%_的额外伤害，并且有_20%_的几率击晕而不是致残。\n\n_+2:_ 冲击波会影响_2格_内的所有人，并且有_40%_的几率触发诸如附魔和连击之类的命中效果。此外,它会造成_30%_的额外伤害，并且有_40%_的几率击晕而不是致残。\n\n_+3:_ 冲击波影响_2-3格_内的所有人，并且有_60%_的几率触发诸如附魔和连击之类的命中效果。此外,它会造成_45%_的额外伤害，并且有_60%_的几率击晕而不是致残。\n\n_+4:_ 冲击波会影响_3格_内的所有人，并且有_80%_的几率触发诸如附魔和连击之类的命中效果。此外,它会造成_60%_的额外伤害，并且有_80%_的几率击晕而不是致残。
actors.hero.talent.rat_blast.title=老鼠爆炸
actors.hero.talent.rat_blast.desc=_+1:_ 元素风暴半径增加到_5格_，增加_20%_的威力，每个受爆炸影响的角色为鼠王提供_2点_护盾，上限5个角色。\n\n_+2:_ 元素风暴半径增加到_6格_，增加_40%_的威力，每个受爆炸影响的角色为鼠王提供_4点_护盾，上限6个角色。\n\n_+3:_ 元素风暴半径增加到_7格_，增加_60%_威力，并且每一个受爆炸影响的角色为鼠王提供_8点_护盾，上限7个角色。\n\n_+4:_ 元素风暴半径增加到_8格_，增加_80%_威力，并且每一个受爆炸影响的角色为鼠王提供_10点_护盾，上限8个角色。
actors.hero.talent.smoke_and_mirrors.title=烟雾镜像
actors.hero.talent.smoke_and_mirrors.desc=_+1:_ 闪现后，留下一个有_ 20 点生命与 1-3 点护甲_的替身木桩。此外，在完成鼠王之怒后，获得_1回合的加速和隐身_效果。如果在隐形状态下使用鼠王之怒，将立即闪现到一个新的有效位置，而不是释放怒火，并减少20%消耗。\n\n_+2:_ 闪现后，留下一个有_ 40 点生命与 2-6 点护甲_的替身木桩。此外，在完成鼠王之怒后，获得_2回合的加速和隐身_效果。如果在隐形状态下使用鼠王之怒，将立即闪现到一个新的有效位置，而不是释放怒火，并减少36%消耗。\n\n_+3:_ 闪现后，留下一个有_ 60 点生命与 3-9 点护甲_的替身木桩。此外，在完成鼠王之怒后，获得_3回合的加速和隐身_效果。如果在隐形状态下使用鼠王之怒，将立即闪现到一个新的有效位置，而不是释放怒火，并减少50%消耗。\n\n_+4:_ 闪现后，留下一个有_ 80 点生命与 4-12 点护甲_的替身木桩。此外，在完成鼠王之怒后，获得_4回合的加速和隐身_效果。如果在隐形状态下使用鼠王之怒，将立即闪现到一个新的有效位置，而不是释放怒火，并减少60%消耗。
actors.hero.talent.sea_of_blades.title=灵刃之海
actors.hero.talent.sea_of_blades.desc=_+0:_ 灵魂飞刃的伤害和命中效果的总效果是_100%_，平均分配给所有目标。\n\n_+1:_ 灵魂飞刃的总效果增加到_150%_，并且有_30%概率_使用灵能弓上的附魔。灵魂飞刃的精准_增加25%_，并且可以穿透_2格固体_。\n\n_+2:_ 灵魂飞刃的总效果增加到_200%_，并且有_60%概率_使用灵能弓上的附魔。灵魂飞刃的精准_增加50%_，并且可以穿透_4格固体_。\n\n_+3:_ 灵魂飞刃的总效果增加到_250%_，并且有_90%概率_使用灵能弓上的附魔。灵魂飞刃的精准_增加75%_，并且可以穿透_6格固体_。\n\n_+4:_ 灵魂飞刃的总效果增加到_300%_，并且有_100%概率_使用灵能弓上的附魔。并且_增加10%_的触发几率。灵魂飞刃的精准_增加100%_，并且可以穿透_8格固体_。\n\n单个目标不会分配到超过100%的灵刃效果。
actors.hero.talent.fun.title=至高娱乐
actors.hero.talent.fun.desc=   _+1:_ 灵魂飞刃变成造成_3回合_易伤的_鸟_，它们可以使用2次。\n\n  _+2:_ 灵魂飞刃变成造成_6回合_易伤的_鸟_，它们可以使用2次。对被元素风暴命中的敌人追加1次随机法杖打击。\n\n  _+3:_ 灵魂飞刃变成造成_9回合_易伤的_鸟_，它们可以使用2次。对被元素风暴命中的敌人追加1次随机法杖打击。 替身获得4个不会移动的暗影护卫。在烟雾弹的烟幕中可以潜行，并获得_3回合_魔法视野。\n\n  _+4:_ 灵魂飞刃变成造成_12回合_易伤的_鸟_，它们可以使用2次。对被元素风暴命中的敌人追加1次随机法杖打击。 替身获得4个不会移动的暗影护卫。在烟雾弹的烟幕中可以潜行，并获得_6回合_魔法视野。过载使用技能时，消耗的生命值减少25%。\n\n  这个天赋每投入1点数，充能消耗增加6点。
actors.hero.talent.heroic_energy.title=英勇能量
actors.hero.talent.heroic_energy.rat_title=阴勇能量
actors.hero.talent.heroic_energy.desc=_+0：_发动英雄护甲能力的充能消耗_减少20%_。\n\n_+1：_发动英雄护甲能力的充能消耗_减少35%_。\n\n_+2：_发动英雄护甲能力的充能消耗_减少48%_。\n\n_+3：_发动英雄护甲能力的充能消耗_减少58%_。\n\n_+4：_发动英雄护甲能力的充能消耗_减少66%_。
actors.hero.talent.heroic_energy.comment="你当然还可以超负荷使用护甲能力，但是现在它便宜到不会给你机会。"
actors.hero.talent.heroic_endurance.title=英雄附魔
actors.hero.talent.heroic_endurance.desc=_+1:_ 战士使用武器附魔作为额外刻印且附魔力量_提升15%_。\n\n_+2:_ 战士使用武器附魔作为额外刻印且附魔力量_提升30%_。\n\n_+3:_ 战士使用武器附魔作为额外刻印且附魔力量_提升45%_。\n\n_+4:_战士使用武器附魔作为额外刻印且附魔力量_提升60%_。\n\n不是所有附魔都能起效。\n这一天赋的提升与其他附魔效果提升叠加
actors.hero.talent.heroic_endurance.comment="被诅咒的盔甲终于有了用处！"
actors.hero.talent.heroic_wizardry.title=英雄巫术
actors.hero.talent.heroic_wizardry.desc=_+1:_ 法杖可以透支使用至_-1_充能。\n\n_+2:_ 法杖可以透支使用至_-2_充能。\n\n_+3:_ 法杖可以透支使用至_-3_充能。\n\n_+4:_ 法杖可以透支使用至_-4_充能。
actors.hero.talent.heroic_wizardry.comment="这也能赊账？"
actors.hero.talent.heroic_wizardry.comment_rogue="我觉得雷霆还是一样的用不完。"
actors.hero.talent.heroic_stamina.title=英雄耐力
actors.hero.talent.heroic_stamina.desc=_+1:_ 使用神器时，获得_1.25回合_体力充沛。\n\n_+2:_ 使用神器时，获得_2.50回合_体力充沛。\n\n_+3:_ 使用神器时，获得_4.75回合_体力充沛。\n\n_+4:_ 使用神器时，获得_6.00回合_体力充沛。\n\n这个天赋的效果可以叠加。
actors.hero.talent.heroic_stamina.comment="什么是正常的行走速度？"
actors.hero.talent.heroic_archery.title=英雄弓术
actors.hero.talent.heroic_archery.desc=_+1:_ 女猎手有_14%的几率_不消耗投掷武器的耐久度。\n将超级射击的最大伤害从350%增加到_375%_。\n\n_+2:_ 女猎手有_29%的几率_不消耗投掷武器的耐久度。\n将超级射击的最大伤害从350%增加到_400%_。\n\n_+3:_ 女猎手有_43%的几率_不消耗投掷武器的耐久度武器。\n将超级射击的最大伤害从350%增加到_425%_。\n\n_+4:_ 女猎手有_57%的几率_不消耗投掷武器的耐久度。\n将超级射击的最大伤害从350%增加到_450%_。
actors.hero.talent.heroic_archery.comment="发射战斧！"
actors.hero.talent.heroic_ratiness.title=高等教育
actors.hero.talent.heroic_ratiness.desc=_+1:_ 可以在1阶天赋上分配1点额外点数。\n\n_+2:_ 在+1的基础上，可以在2阶天赋上分配1点额外点数。\n\n_+3:_ 在+2的基础上，可以在3阶天赋上分配1点额外点数。（尽管需要到25级才能用到）
actors.hero.talent.heroic_adaptability.title=勇之适应
actors.hero.talent.heroic_adaptability.desc=_+1:_ 决斗家周围每有一个可移动格就会增加 _5%_闪避率，每有一个不可移动格就会增加 _6.5%命中率。\n\n_+2:_ 决斗家周围每有一个可移动格就会增加 _8%_闪避率，每有一个不可移动格就会增加 _10%命中率。\n\n_+3:_ 决斗家周围每有一个可移动格就会增加 _11%_闪避率，每有一个不可移动格就会增加 _13.5%命中率。。\n\n_+4:_ 决斗家周围每有一个可移动格就会增加 _14%_闪避率，每有一个不可移动格就会增加 _17%命中率。。
actors.hero.talent.heroic_adaptability.comment="就像很久以前我和朋友们玩的另一个躲猫猫游戏一样。"
actors.hero.talent.drratedon.title=基因改造
actors.hero.talent.drratedon.desc=_+1:_ 友军小鼠无视敌人护甲，且能从狙击手天赋中受益。\n\n_+2:_ 在+1的基础上，增加33%攻速，且能疾行者天赋中受益。\n\n_+3:_ 在+2的基础上，增加33%移速，能进入狂暴状态，且能从狂战士天赋中受益。\n\n_+4:_ 在+3的基础上，有22.5%概率施加灵魂印记，且能从术士天赋中受益。
actors.hero.talent.drratedon.comment="没人问，但这就是，老鼠阶级。"
actors.hero.talent.drratedon.desc_rat_king=_+0:_ 友军小鼠无视敌人护甲，且能从狙击手天赋中受益。\n\n_+1:_ 在+0的基础上，增加33%攻速，且能疾行者天赋中受益。\n\n_+2:_ 在+1的基础上，增加33%移速，能进入狂暴状态，且能从狂战士天赋中受益。\n\n_+3:_ 在+2的基础上，有22.5%概率施加灵魂印记，且能从术士天赋中受益。\n\n_+4:_ 在+3的基础上，小鼠生成时获得精英词条。
actors.hero.talent.drratedon.comment_rat_king="只有我的最强老鼠配得上德雷顿技术！"
actors.hero.talent.ratsistance.title=鼠手鼠脚
actors.hero.talent.ratsistance.desc=_+1：_被鼠化的敌人造成的伤害会降低_13%_。\n\n_+2：_被鼠化的敌人造成的伤害会降低_25%_。\n\n_+3：_被鼠化的敌人造成的伤害会降低_38%_。\n\n_+4：_被鼠化的敌人造成的伤害会降低_50%_。\n\n"几乎没有比剥夺能力更好的羞辱方式了。"
actors.hero.talent.ratsistance.desc_rat_king=_+0：_被鼠化的敌人造成的伤害会降低_15%_。\n\n_+1：_被鼠化的敌人造成的伤害会降低_30%_。\n\n_+2：_被鼠化的敌人造成的伤害会降低_45%_。\n\n_+3：_被鼠化的敌人造成的伤害会降低_60%_。\n\n_+4：_被鼠化的敌人造成的伤害会降低_75%_。\n\n"尔等胆敢犯上作乱？！"
actors.hero.talent.ratlomacy.title=外交鼠段
actors.hero.talent.ratlomacy.desc=_+1：_对被鼠化的敌人再次使用鼠化术会固化老鼠形态并将其永久转化为友军。\n\n_+2：_对被鼠化的敌人再次使用鼠化术会固化老鼠形态并将其永久转化为友军，并赋予其_4回合_的激素涌动。\n\n_+3：_对被鼠化的敌人再次使用鼠化术会固化老鼠形态并将其永久转化为友军，并赋予其_8回合_的激素涌动。\n\n_+4：_对被鼠化的敌人再次使用鼠化术会固化老鼠形态并将其永久转化为友军，并赋予其_12回合_的激素涌动。\n\n"既然追不上那只蝎子，就试试让他成为你的盟友。"
actors.hero.talent.ratlomacy.desc_rat_king=_+0：_对被鼠化的敌人再次使用鼠化术会固化老鼠形态并将其永久转化为友军。\n\n_+1：_对被鼠化的敌人再次使用鼠化术会固化老鼠形态并将其永久转化为友军，并赋予其_4回合_激素涌动。\n\n_+2：_对被鼠化的敌人再次使用鼠化术会固化老鼠形态并将其永久转化为友军，并赋予其_8回合_激素涌动。\n\n_+3：_对被鼠化的敌人再次使用鼠化术会固化老鼠形态并将其永久转化为友军，并赋予其_12回合_激素涌动。\n\n_+4：_对被鼠化的敌人再次使用鼠化术会固化老鼠形态并将其永久转化为友军，并赋予其_16回合_激素涌动。\n\n"没有人能抗拒朕的号召！"
actors.hero.talent.ratforcements.title=吱援部队
actors.hero.talent.ratforcements.desc=_+1：_以自身为目标使用鼠化术会在身边_召唤 1 只_友军啮齿小鼠.\n\n_+2：_以自身为目标使用鼠化术会在身边_召唤 2 只_友军啮齿小鼠.\n\n_+3：_以自身为目标使用鼠化术会在身边_召唤 3 只_友军啮齿小鼠.\n\n_+4：_以自身为目标使用鼠化术会在身边_召唤 4 只_友军啮齿小鼠.\n\n小鼠的属性将依据当前楼层得到加强。召唤时有小概率召唤白化小鼠。\n\n"谁会讨厌可爱的小鼠呢。"
actors.hero.talent.ratforcements.desc_rat_king=_+0:_ 以自身为目标使用鼠化术会在身边_召唤1只_友军皇家小鼠。\n\n_+1:_ 以自身为目标使用鼠化术会在身边_召唤2只_友军皇家小鼠。\n\n_+2:_ 以自身为目标使用鼠化术会在身边_召唤3只_友军皇家小鼠。\n\n_+3:_ 以自身为目标使用鼠化术会在身边_召唤4只_友军皇家小鼠。\n\n_+4:_ 以自身为目标使用鼠化术会在身边_召唤 5 只_友军皇家小鼠。\n\n小鼠的属性将依据当前楼层得到加强。召唤时有小概率召唤白化小鼠。\n\n"朕身后即是鼠国！"
actors.hero.talent.willpower_of_injured.title=不败意志
actors.hero.talent.willpower_of_injured.desc=_+1:_ 战士失去生命值时，破损纹章的护盾重新充能速度更快，最大提升为剩余生命值低于 _10%_ 时 _+50%_。\n\n_+2:_ 战士失去生命值时，破损纹章的护盾重新充能速度更快，最大提升为剩余生命值低于 _10%_ 时 _+100%_。\n\n这与钢铁意志叠加。
actors.hero.talent.willpower_of_injured.comment="唯一缺少的是决心。等等-"
actors.hero.talent.willpower_of_injured.meta_desc=_如果这个天赋被另一个英雄获得_，它将提升血量恢复速度，最多在英雄剩余生命值低于 _10%_ 时可提升 _+50%_/_+100%_。
actors.hero.talent.energizing_upgrade.title=充能强化
actors.hero.talent.energizing_upgrade.desc=_+1:_ 耗尽任何老魔杖以外法杖的充能会立刻在_5回合_内将其充满。这个效果有_50回合_的冷却时间。\n\n_+2:_ 耗尽任何老魔杖以外法杖的充能会立刻在_5回合_内将其充满。这个效果有_35回合_的冷却时间。\n\n"灵台清净，气沉丹田……"
actors.hero.talent.energizing_upgrade.comment="首先清除你的思绪，然后在丹田中形成一团白色气流，让它穿过你的身体，在你周围形成光芒，然后将你的手肩膀之间分开，然后向下，就像你在撞击某人一样，想象气流在你的法杖周围爆炸。"
actors.hero.talent.dual_wielding.title=双持
actors.hero.talent.dual_wielding.desc=_+1:_ 在使用法杖后使用投掷武器不需要花费时间。\n\n_+1:_ 在使用法杖后使用投掷武器不需要花费时间。在使用投掷武器后使用法杖也不需要花费时间。\n\n这不能连锁。
actors.hero.talent.dual_wielding.comment="他们认为他们可以使用手里剑然后在一瞬间将敌人烧成灰。他们没有意识到他们错过了完整的拼图。\n-双持盗贼"
actors.hero.talent.dual_wielding.comment_huntress="你为什么不走开。\n-双持猎手"
actors.hero.talent.ivylash.title=藤蔓鞭笞
actors.hero.talent.ivylash.desc=_+1:_ 猎手的 _超级射击_ 会使目标定身 _2 回合_。\n\n_+2:_ 猎手的 _超级射击_ 会使目标定身 _3 回合_。
actors.hero.talent.ivylash.meta_desc=_如果其他英雄获得这个天赋_，效果将从任何投掷武器触发，但触发冷却时间为超级射击冷却时间的 1.33 倍。
actors.hero.talent.ivylash.comment="别问我是否喜欢这种怪癖..."
actors.hero.talent.scouts_barrier.title=猎手护盾
actors.hero.talent.scouts_barrier.desc=_+1:_ 在成功的超级射击后，女猎手获得 _4 点护盾_。\n\n_+2:_ 在成功的超级射击后，女猎手获得 _6 点护盾_。
actors.hero.talent.scouts_barrier.comment="现在就说你开玩笑，挑战太空龙。"
actors.hero.talent.scouts_barrier.meta_desc=_如果其他英雄获得这个天赋_，效果将从任何投掷武器触发，但触发冷却时间为超级射击冷却时间的 1.33 倍。
actors.hero.talent.protein_infusion.title=蛋白摄入
actors.hero.talent.protein_infusion.desc=_+1:_ 当盗贼不处于饥饿状态时，他的移动速度和闪避能力会得到提升，最高可达到满腹时的 _+25%_。\n\n_+2:_ 当盗贼不处于饥饿状态时，他的移动速度和闪避能力会得到提升，最高可达到满腹时的 _+50%_。
actors.hero.talent.protein_infusion.comment="也许这会让你吃掉你剩下的口粮。"
actors.hero.talent.protein_infusion.comment_huntress="令人振奋的一餐，但很棒"
actors.hero.talent.protein_infusion.comment_rk="也许自由奔跑并不像我最初想的那么必要..."
actors.hero.talent.like_a_bullet.title=矢贯坚石
actors.hero.talent.like_a_bullet.desc=_+1:_ 将超级射击的起始威力从 +32%提高至 _+45%_，距离倍增器从 +13%提高至 _+18%_。\n\n_+2:_ 将超级射击的起始威力从 +32%提高至 _+58%_，距离倍增器从 +13%提高至 _+23%_。\n\n_+3:_ 将超级射击的起始威力从 +32%提高至 _+71%_，距离倍增器从 +13%提高至 _+28%_。
actors.hero.talent.like_a_bullet.meta_desc=_如果其他英雄获得这个天赋_，它将使投掷武器受益于弓箭手特殊伤害的伤害缩放，效果为 100%/150%/200% 的强度；此效果的冷却时间为超级射击冷却时间的 1.33 倍。
actors.hero.talent.bloodbath.title=杀戮盛宴
actors.hero.talent.bloodbath.desc=_+1:_ 成功刺杀时，刺客将造成血爆伤害 _5x5_ 范围内的敌人，血液爆炸伤害相当于其造成伤害的 60%。\n\n_+2:_ 成功刺杀时，刺客将造成血爆伤害 _7x7_ 范围内的敌人，血液爆炸伤害相当于其造成伤害的 60%。\n\n_+3:_ 成功刺杀时，刺客将造成血爆伤害 _9x9_ 范围内的敌人，血液爆炸伤害相当于其造成伤害的 60%。\n\n这个天赋也可以由正好准备好的刺杀时触发，但只有 _67%_ 的几率。\n\n"当飞溅鲜血而非饮血不是一种浪费时。"
actors.hero.talent.thinking_with_portals.title=意念跃迁
actors.hero.talent.thinking_with_portals.desc=_+1:_ 盗贼可以使用他的披风充能瞬间传送到所需位置，每移动一个格消耗 _1 点充能_。\n\n_+2:_ 盗贼可以使用他的披风充能瞬间传送到所需位置，每移动一个格消耗 _0.75 点充能_。\n\n_+3:_ 盗贼可以使用他的披风能充能瞬间传送到所需位置，每移动一个格消耗 _0.6 点充能_。\n\n使用这个天赋会以 _67%_ 的效率充能刺杀准备。\n\n"有时候你只需要稍后返回一个点。这个天赋适合你。"
actors.hero.talent.adapt_and_overcome.title=影之适应
actors.hero.talent.adapt_and_overcome.desc=_+1:_ 刺杀攻击有额外机会造成更高的伤害。\n\n_+2:_ 刺杀攻击有额外机会造成更高的伤害。伤害类法杖可以在敌人受到足够伤害时触发 _刺杀_。\n\n_+3:_ 刺杀攻击有额外机会造成更高的伤害。伤害类法杖可以在敌人受到足够伤害时触发 _刺杀_。在执行任何会解除隐形效果的动作后，刺客将获得额外 _一回合的隐形_。\n这不能被连续发动，如果刺客处于任意等级的刺杀阶段，将减少 _1_级。\n\n一次只能用法杖刺杀一个敌人。\n\n"如果你不能用真正的武器技能，你还算是个杀手吗？"
actors.hero.talent.indiscriminate_rage.title=失控暴怒
actors.hero.talent.indiscriminate_rage.desc=_+1:_ 非物理伤害将以 _20%_ 的效率产生愤怒。\n\n_+2:_ 非物理伤害将以 _40%_ 的效率产生愤怒 。\n\n_+3:_ 非物理伤害将以 _60%_ 的效率产生愤怒 。\n\n请注意，您仍然需要魔法抗性来减少来自敌人法术的伤害，并且愤怒速度增加与怒气导魔和一人成军的增加速度叠加。\n\n"为什么着火不会激怒战士？这太不真实了。"
actors.hero.talent.battle_tendency.title=战斗狂热
actors.hero.talent.battle_tendency.desc=_+1:_ 如果角斗士在 5 回合内未击中敌人，他的连击数将以每回合 _2 点_ 的速度衰减，而不是重置。\n\n_+2:_ 如果角斗士在 5 回合内未击中敌人，他的连击数将以每回合 _1 点_ 的速度衰减，而不是重置。\n\n_+3:_ 如果角斗士在 5 回合内未击中敌人，他的连击数将以每回合 _0.5 点_ 的速度衰减，而不是重置。\n\n"希望这足够的时间让你找到下一个敌人。"
actors.hero.talent.pointy_black.title=抵近射击
actors.hero.talent.pointy_black.desc=_+1:_ 当女猎手在近距离使用弓箭或投掷武器时，其命中率降低 _-30%_，而不是 -50%，并具有 _13%_ 的击退敌人几率。\n\n_+2:_ 当女猎手在近距离使用弓箭或投掷武器时，其命中率降低 _-10%_，而不是 -50%，并具有 _25% 的击退敌人几率。\n\n_+3:_ 当女猎手在近距离使用弓箭或投掷武器时，其命中率提高 _+10%_，而不是 -50%，并具有 _38% 的击退敌人几率。\n\n请注意，当投掷武器或灵弓在远距离使用时，始终具有 +50% 的命中率。
actors.hero.talent.pointy_black.comment="拥有弓箭是件好事，但这家伙站在我旁边太嚣张了。"
actors.hero.talent.adventurous_snoozing.title=冒险小憩
actors.hero.talent.adventurous_snoozing.desc=_+1:_ 当决斗家睡觉时，武器充能完全恢复所需时间减少 _80 回合_。\n\n_+2:_ 当决斗家睡觉时，武器充能完全恢复所需时间减少 _160 回合_。
actors.hero.talent.adventurous_snoozing.meta_desc=_如果其他英雄获得了这个天赋，则_，如果英雄的睡眠被强制打断，+1 时会治疗 3 点生命值，+2 时会治疗 5 点生命值。
actors.hero.talent.adventurous_snoozing.comment="睡眠是每个人生活中重要的一部分，可以帮助恢复能量。"
actors.hero.talent.spellblade_forgery.title=武士光剑
actors.hero.talent.spellblade_forgery.desc=_+1:_ 剑系武器将额外打击主要目标相邻的敌人，造成 _40% 伤害_。\n\n_+2:_ 剑系武器将额外打击主要目标相邻的敌人，造成 _60% 伤害_。\n\n可以通过武器的直刃部分来识别剑系武器。\n如果干枯的玫瑰的幽灵和其他盟友使用剑系武器，这一效果也会触发。
actors.hero.talent.spellblade_forgery.comment="改变挥击的轴心对你的战斗感知有奇效。"
actors.hero.talent.grassy_offense.title=草地攻势
actors.hero.talent.grassy_offense.desc=决斗家能够从她的库存中将 _最多 15_ 片草灌注进武器，使其武器充能（每一份提供3点草充能），增加伤害但消耗草。武器技能将消耗一些草而不是正常的武器充能。\n\n_+1:_ 灌注草的武器造成 _17% 更多伤害_。武器技能消耗 _6 草充能_。\n\n_+2:_ 灌注草的武器造成 _25% 更多伤害_。武器技能消耗 _5 草充能_。\n\n_+3:_ 装备草的武器造成 _50% 更多伤害_。武器技能消耗 _4 草充能_。决斗家每次使用装备草的武器击中目标时将治疗 _3 点生命值_。
actors.hero.talent.grassy_offense.comment="你以为成为一台割草机是猎手游戏中更糟糕的玩法吗？再想想吧。"
actors.hero.talent.sixth_sense.title=第六直觉
actors.hero.talent.sixth_sense.desc=_+1:_ 当决斗家选择一个位置时，_有未知的敌人的位置_ 将被突出显示一段时间，甚至可以显示附近墙体后面的东西。\n\n_+2:_ 当决斗家选择一个位置时，_有未知的敌人的位置_ 将被突出显示一段时间。决斗家还能够 _投掷物品和投掷武器进行射击标记的目标，无视阻碍_。这一项能力有15回合冷却。
actors.hero.talent.sixth_sense.comment="我闻到你的古龙香水味道！"
actors.hero.talent.helper_to_hero.title=虹卫英雄
actors.hero.talent.helper_to_hero.desc=_+1:_ 虹卫幻影 _不会被玩家的投射物和法杖击中_，并受益于副手武器的附魔和其他效果。\n\n_+2:_ 虹卫幻影 _不会被玩家的投射物和法杖击中_，受益于副武器的附魔和其他效果，其伤害增加 _副手武器伤害点数的 50%_，其死亡计时器不再减少。未激活时，虹卫幻影的再生受英雄再生提升影响。\n\n_+3:_ 虹卫幻影 _不会被玩家的投射物和法杖击中_，受益于副手武器的附魔和其他效果，其伤害增加 _副手武器伤害点数的 75%_。未激活时，虹卫幻影的再生速度加快两倍，并受英雄再生提升影响。当虹卫幻影濒临死亡时，将立即恢复为未激活状态，生命值为原来的 50%，并进入 _125 回合_ 的恢复状态。在恢复期间，它将无法再生并参与战斗。
actors.hero.talent.helper_to_hero.comment="把那把副武器交给你的朋友，他们会想办法使用的。"
actors.hero.talent.attunexploration.title=共鸣探索
actors.hero.talent.attunexploration.desc=_+1:_ 根据楼层的特殊感觉，武僧将_获得一种被动正面效果_，并且她的一个能力_将被强化或改变_。\n\n_+2:_ 根据楼层的特殊感觉，武僧将_获得一种被动正面效果_，并且她的一个能力_将被强化或改变_。将特殊感觉的机会从_50%_增加到_100%_。\n\n_+3:_ 根据楼层的特殊感觉，武僧将_获得一种被动正面效果_，并且她的一个能力_将被强化或改变_。将特殊感觉的机会从_50%_增加到_100%_。在发现隐藏门时，武僧将_获得 2.5 点内力_；这个数量不受无拘灵魂天赋的影响。
actors.hero.talent.attunexploration.comment="在第一人称中感受每个地牢深处的生活和故事！"
actors.hero.talent.grass_munching.title=啃食杂草
actors.hero.talent.grass_munching.desc=_+1:_ 食用_5份杂草_会使武僧草思_5回合_。此举清除大部分负面效果。\n\n_+2:_ 食用_5份杂草_会使武僧草思_10回合_。此举清除大部分负面效果并赋予她_7回合魔杖和神器充能_。\n\n_+3:_ 食用_5份杂草_会使武僧草思_15回合_。此举清除大部分负面效果，缓慢_治疗20%的已损失生命值_，并赋予她_14回合魔杖和神器充能_和40%伤害抗性。
actors.hero.talent.grass_munching.comment="你不知道吗？杂草让你完全恢复活力。这是事实。"
actors.hero.talent.dungeons_championship.title=地牢冠军赛
actors.hero.talent.dungeons_championship.desc=_+1:_ 决斗家的目标获得_2个冠军头衔_，但如果它在决斗结束前被击败，则掉落_一个财富之戒+12_生成物。\n\n_+2:_ 决斗家的目标获得_3个冠军头衔_，但如果它在决斗结束前被击败，则掉落_三个财富之戒+12_生成物。\n\n_+3:_ 决斗家的目标获得_4个冠军头衔_，但如果它在决斗结束前被击败，则掉落_五个财富之戒+12_生成物。\n\n_+4:_ 决斗家的目标获得_5个冠军头衔_，但如果它在决斗结束前被击败，则掉落_七个财富之戒+12_生成物。\n\n此天赋不对首领敌人触发。
actors.hero.talent.dungeons_championship.comment="我们来了，史上最受期待的死亡对决：史上最强敌人 VS. 聪明的深肤色女孩！"
actors.hero.talent.empowered_swipe.title=强化挥击
actors.hero.talent.empowered_swipe.desc=_+1:_ 元素打击效果的威力、射程和宽度增加_7.5% * 决斗家主武器充能数_，但使用元素打击会消耗所有主武器充能。\n\n_+2:_ 元素打击效果的威力、射程和宽度增加_10% * 决斗家主武器充能数_，但使用元素打击会消耗所有主武器充能。\n\n_+3:_ 元素打击效果的威力、射程和宽度增加_12.5% * 决斗家主武器充能数_，但使用元素打击会消耗所有主武器充能。\n\n_+4:_ 元素打击效果的威力、射程和宽度增加_15% * 决斗家主武器充能数_，但使用元素打击会消耗所有主武器充能。
actors.hero.talent.empowered_swipe.comment="麦杜利加农激光启动！等等——*一切都被奥术核弹抹掉了*"
actors.hero.talent.warped_aggression.title=扭曲侵略
actors.hero.talent.warped_aggression.desc=_+1:_ 佯攻效果持续时间和残影持续时间延长至_2回合_，但攻击残影的敌人将_受到平均扭曲效果影响_。能力消耗也从50增加到_65_。\n\n_+2:_ 佯攻效果持续时间和残影持续时间延长至_3回合_，但攻击残影的敌人将_受到高于平均的扭曲效果影响_。能力消耗也从50增加到_70_。\n\n_+3:_ 佯攻效果持续时间和残影持续时间延长至_4回合_，但攻击残影的敌人将_受到强力扭曲效果影响_。能力消耗也从50增加到_75_。\n\n_+4:_ 佯攻效果持续时间和残影持续时间延长至_5回合_，但攻击残影的敌人将_受到极强扭曲效果影响_。能力消耗也从50增加到_80_。
actors.hero.talent.warped_aggression.comment="你知道，被克罗默逼疯会让你质疑人生并受伤吗？是的，让你的敌人经历同样的精神痛苦吧。"
actors.hero.talent.party_feeling.title=派对氛围
actors.hero.talent.party_feeling.desc=_+1:_ 当尊者充能时，可见的盟友将拥有_+80%的精准和闪避加成_。\n\n_+2:_ 当尊者充能时，可见的盟友将拥有_+80%的精准和闪避加成_并以尊者两倍的速度治疗。\n\n_+3:_ 当尊者尊者充能时，可见的盟友将拥有_+80%的精准和闪避加成_，以尊者两倍的速度治疗，并且_他们的动作耗时减少50%_。
actors.hero.talent.party_feeling.comment="这次杂草盛宴没人会被落下！"
actors.hero.talent.slash_runner.title=斩击奔跑者
actors.hero.talent.slash_runner.desc=_+1:_ 当尊者充能时，击杀敌人获得_0.5点武器充能_。\n\n_+2:_ 当尊者充能时，击杀敌人获得_0.5点武器充能_并且附魔效力增加_100%_。\n\n_+3:_ 当尊者充能时，击杀敌人获得_0.5点武器充能_并且附魔效力增加_100%_。在充能状态下使用武器能力击杀敌人恢复_2回合充能时间_；此奖励不能超过一份杂草的最大回合数。
actors.hero.talent.slash_runner.comment="嗨了对你来说不是弱点！"
actors.hero.talent.prolonged_joy.title=持久欢愉
actors.hero.talent.prolonged_joy.desc=_+1:_ 每份杂草的充能时间增加至_5回合_（原为4），但恢复时长增幅增加_8%_。\n\n_+2:_ 每份杂草的充能时间增加至_6回合_（原为4），但恢复时长增幅增加_17%_。\n\n_+3:_ 每份杂草的充能时间增加至_7回合_（原为4），但恢复时长增幅增加_25%_。\n\n增幅也从消耗较少杂草时开始。
actors.hero.talent.prolonged_joy.comment="地牢里的杂草不错，但你不希望它们持续...更久吗？每次都有更多的刺激和强度？不？一点也不？？？"
actors.hero.talent.wound_ignorance.title=无视创伤
actors.hero.talent.wound_ignorance.desc=_+1:_ 进入充能状态瞬间治疗_最大生命值的12.5%_。\n\n_+2:_ 除了+1的收益外，在充能状态下承受伤害时，将_承受伤害的12.5%_转化为护盾。\n\n_+3:_ 除了+1和+2的收益外，尊者在恢复时承受_80%更少_元素伤害。
actors.hero.talent.wound_ignorance.comment="抵抗那种绿色多巴胺的感觉是徒劳的！然而，对它上瘾..."
actors.hero.talent.drug_moderation.title=药物节制
actors.hero.talent.drug_moderation.desc=_+1:_ 总体恢复时长增加33%，但在充能期间使用物品减少恢复时长_2.5回合_。\n\n_+2:_ 总体恢复时长增加33%，但在充能期间使用物品减少恢复时长_5回合_。\n\n_+3:_ 总体恢复时长增加33%，但在充能期间使用物品减少恢复时长_7.5回合_。\n\n这些物品包括物理武器、魔杖、神器、炸弹、食物、药水、卷轴、符文石、植物以及用它们制作的一切物品。
actors.hero.talent.drug_moderation.comment="起初似乎难以承受，但通过练习是可以达到适当的清醒状态的。"
actors.mobs.npcs.blacksmith.name=巨魔铁匠
actors.mobs.npcs.blacksmith.intro_quest_rat_king=鼠王？？？那就是你吗？我是你最忠实的粉丝！
actors.mobs.npcs.blacksmith.intro_quest_warrior=嘿，人类！你看起来像个强壮的家伙。
actors.mobs.npcs.blacksmith.intro_quest_mage=嘿，人类！你看起来像个聪明的家伙。
actors.mobs.npcs.blacksmith.intro_quest_rogue=嘿，人类！你看起来像个狡猾的家伙。
actors.mobs.npcs.blacksmith.intro_quest_huntress=嘿，人类！你看起来像个敏捷的家伙。
actors.mobs.npcs.blacksmith.intro_quest_duelist=嘿，人类！你看起来像个勇敢的家伙。
actors.mobs.npcs.blacksmith.intro_quest_cleric=嘿，人类！你看起来像个重要的家伙。
actors.mobs.npcs.blacksmith.intro_quest_start_rat_king=当你在这里的时候，如果你能帮我一个小忙，对我来说将无比重要。我在一座旧矿井上建了这个房间，就在那个梯子下面。拿着这把凿子，给我挖一些_暗金_。40---嗯，不，30块就够了。那边的岩石很软，所以_你可以费点力气穿过墙壁挖掘。_\n\n什么意思，你说，我怎么付钱？\n\n...\n\n好吧，好吧，我可以为你打造一些东西。算你走运，我是附近唯一的铁匠。
actors.mobs.npcs.blacksmith.intro_quest_start=想派上用场，啊？是的，我有些事情可以让你做。我在一座旧矿井上建了这个房间，就在那个梯子下面。拿着这把凿子，给我挖一些_暗金_。40---嗯，不，30块就够了。那边的岩石很软，所以_你可以费点力气穿过墙壁挖掘。_\n\n你说，我怎么付钱？你这个贪婪的...。\n\n好吧，好吧，我可以为你打造一些东西。算你走运，我是附近唯一的铁匠。
actors.mobs.npcs.blacksmith.bonus_item=另外，这里有几块预知石作为你的辛劳报酬。它们在这种情况下往往很有用。
actors.mobs.npcs.blacksmith.intro_quest_common=小心，对于像你这样的小人类来说，矿井很危险。
actors.mobs.npcs.blacksmith.intro_quest_common_rat_king=我不认为你会遇到任何麻烦，但这里有些事情需要注意。
actors.mobs.npcs.blacksmith.intro_quest_crystal=这里已经被废弃一段时间了，一堆水晶开始生长。它们闪闪发光，但太脆弱，不值得一提，而且它们有一些魔法保护。它们相当坚固，所以_在挖掘时要小心_，否则会引起它们的注意。\n\n还有一个_巨大的水晶_。它更加坚固，所以如果你开始破坏它，要做好战斗的准备。我敢打赌，砸碎它将减缓所有水晶的生长速度，所以如果你能做到，我会额外支付报酬。
actors.mobs.npcs.blacksmith.intro_quest_gnoll=一些豺狼人也想要这些黄金，现在他们正在破坏这个地方。它们很愚蠢，所以它们的挖掘导致了各种塌方和坍塌。你必须挖过去，所以_寻找最近被扰动的岩石_。\n\n我认为其中一个豺狼人引起了大部分麻烦，可能是_萨满地卜师_或者其他什么。如果你能找到并杀死它，我会额外支付报酬，但我肯定它会反击。
actors.mobs.npcs.blacksmith.intro_quest_fungi=那里长出了一种真菌怪物。它有一些蘑菇哨兵，如果它们看到你，就会非常致命，但至少它们无法起身追逐你。_如果想活命，要保持隐秘。_\n\n如果你能成功击败_最大的蘑菇_，我会额外支付报酬，但这需要真正的努力。它与隐藏在墙壁中的一堆菌丝节点相连。你必须破坏大部分节点，才能真正对它造成伤害。
actors.mobs.npcs.blacksmith.reminder=矿井入口就在那边，随时可以进入。
actors.mobs.npcs.blacksmith.reminder_crystal=尽可能给我带来更多的暗金，并尝试破坏那个大水晶。
actors.mobs.npcs.blacksmith.reminder_gnoll=尽可能给我带来更多的暗金，并尝试杀死萨满地卜师。
actors.mobs.npcs.blacksmith.reminder_fungi=尽可能给我带来更多的暗金，并尝试杀死巨大的蘑菇。
actors.mobs.npcs.blacksmith.lost_pick=你在逗我？我的镐子呢？！
actors.mobs.npcs.blacksmith.lost_pick_rat_king=你- ...我需要那把镐子。
actors.mobs.npcs.blacksmith.quest_start_prompt=准备好下去了吗？确保你有一些空间装下暗金。\n\n_我只让你下去一次！_
actors.mobs.npcs.blacksmith.enter_yes=我准备好了
actors.mobs.npcs.blacksmith.enter_no=还没有
actors.mobs.npcs.blacksmith.exit_warn_none=你已经完成了吗？你几乎没有得到任何暗金！你应该能够得到_30块_。\n\n_记住，一旦你上来，我就不让你再进去了。_
actors.mobs.npcs.blacksmith.exit_warn_low=你已经完成了吗？看起来你的暗金不是很多。你应该能够得到_30块_。\n\n_记住，一旦你上来，我就不让你再进去了。_
actors.mobs.npcs.blacksmith.exit_warn_med=你完成了吗？至少你有一些暗金，但矿井里肯定还有更多。你应该能够得到_30块_。\n\n_记住，一旦你上来，我就不让你再进去了。_
actors.mobs.npcs.blacksmith.exit_warn_high=你完成了吗？看起来你有相当多的暗金，但我可能需要更多一点。你应该能够得到_30块_。\n\n_记住，一旦你上来，我就不让你再进去了。_
actors.mobs.npcs.blacksmith.exit_warn_full=你完成了吗？你有很多暗金，但确保你没有留下任何装备。\n\n_记住，一旦你上来，我就不让你再进去了。_
actors.mobs.npcs.blacksmith.exit_warn_crystal=那个巨大的水晶还在下面。如果你摧毁它，我会额外支付报酬。
actors.mobs.npcs.blacksmith.exit_warn_gnoll=那个萨满地卜师还在下面。如果你杀死它，我会额外支付报酬。
actors.mobs.npcs.blacksmith.exit_warn_fungi=那个巨大的蘑菇还在下面。如果你杀死它，我会额外支付报酬。
actors.mobs.npcs.blacksmith.exit_yes=我完成了
actors.mobs.npcs.blacksmith.exit_no=还没有
actors.mobs.npcs.blacksmith.get_lost=祝你好运！
actors.mobs.npcs.blacksmith.entrance_blocked=下去的路被堵住了。
actors.mobs.npcs.blacksmith.cant_enter_old=这个区域在本轮游戏中无法访问。开始新游戏尝试新任务！
actors.mobs.npcs.blacksmith.def_verb=格挡
actors.mobs.npcs.blacksmith.desc=这个巨魔看起来和任何其他巨魔一样：又高又瘦，皮肤的色泽和纹理都像是石头。这位巨魔铁匠正在拿着一把与其体形极其不符的小锤子不停地修修补补。
actors.mobs.npcs.ghost.name=悲伤幽灵
actors.mobs.npcs.ghost.rat_1=你好，%s…曾经我像你一样——既强大又自信…但我被一个邪恶的野兽杀死了…我不能离开这个地方……直到我完成我的复仇…杀死_腐臭老鼠_，就是它夺走了我的生命…\n\n它就在这层…四处散播污秽…_小心它的周边的臭云以及带有腐蚀性的撕咬，它产生的粘液可溶于水…_
actors.mobs.npcs.ghost.rat_2=请帮助我…杀了那个令人憎恶的东西…\n\n_在水附近与它战斗…躲开它的恶臭…_
actors.mobs.npcs.ghost.gnoll_1=你好，%s…曾经我像你一样——既强大又自信…但我被一个狡猾的敌人杀死了…我不能离开这个地方……直到我完成我的复仇…杀死_豺狼猎手_，就是它夺走了我的生命…\n\n它与其他豺狼人不同…它会隐藏自己并使用投掷武器… _小心它的毒镖和火镖，尽量靠近它…_
actors.mobs.npcs.ghost.gnoll_2=请帮助我……杀了那个诡诈的家伙……\n\n_别让它打到你……离它越近越好……_
actors.mobs.npcs.ghost.crab_1=你好，%s…曾经我像你一样——既强大又自信…但我被一个古老的生物杀死了…我不能离开这个地方……直到我完成我的复仇…杀死_巨钳螃蟹_，就是它夺走了我的生命…\n\n它经历了无数岁月的洗礼…有一个巨大的蟹钳和非常厚重的蟹壳…_小心它的蟹钳，你必须偷袭这只巨蟹否则它会用钳子格挡你的攻击..._
actors.mobs.npcs.ghost.crab_2=拜托帮助我……杀了那个甲壳类……\n\n_如果它发现你……就会挡住你所有的攻击……_
actors.mobs.npcs.ghost.find_me=谢谢你……来找我吧……
actors.mobs.npcs.ghost.desc=这个幽灵几乎不能被看见。它看起来像是由一片无形的昏暗光斑和一张悲痛的面孔所组成的。
actors.mobs.npcs.imp.name=野心勃勃的小恶魔
actors.mobs.npcs.imp.intro=你是冒险者吗？我爱冒险者！如果有什么东西需要杀掉，你总是可以依靠他们，对吧？当然是为了赏金 ;)
actors.mobs.npcs.imp.intro_rat_king=鼠王？！！什么风把你吹来了？？？\n我很抱歉这么问，但我真的需要你帮个大忙！我会让你觉得值得的 ;)
actors.mobs.npcs.imp.golems_1=总之，我需要你杀一些_魔像_。你看，我要在这里开始搞点小本生意，但这些愚蠢的傀儡只会毁掉我的生意！跟这些发着光的大个子花岗岩根本没法交流，真是该死！所以请，杀死……我想想，_3个魔像_，然后奖励就是你的了。
actors.mobs.npcs.imp.monks_1=总之，我需要你杀一些_武僧_。你看，我要在这里开始搞点小本生意，但这些疯子不买任何东西还会吓跑顾客。所以请，杀死……我想想，_3个武僧_，然后奖励就是你的了。
actors.mobs.npcs.imp.golems_2=你的魔像狩猎做的怎么样了？
actors.mobs.npcs.imp.monks_2=喔，你还活着！我就知道你得功夫很好；) 只要别忘了拿来那些武僧的标记就好。
actors.mobs.npcs.imp.cya=我们会再见的，%s！
actors.mobs.npcs.imp.hey=喂喂喂，%s！
actors.mobs.npcs.imp.desc=小恶魔是一种低等恶魔。它们既没有强大的力量也没有魔法天赋，但他们相当聪明而且善于交际。许多小恶魔都喜欢和非恶魔生物生活。
actors.mobs.npcs.impshopkeeper.name=野心勃勃的小恶魔
actors.mobs.npcs.impshopkeeper.greetings=你好，%s！
actors.mobs.npcs.impshopkeeper.greetings_ascent=%s你都做了些什么？要做买卖就快点，我可不想在这里久留！
actors.mobs.npcs.impshopkeeper.thief=我以为我可以相信你！
actors.mobs.npcs.impshopkeeper.buyback=小恶魔高兴地把你的物品还给了你。
actors.mobs.npcs.impshopkeeper.desc=小恶魔在大厅的边缘开设了一家商店。能在这里看到友好的面孔确实不错，但是他的价格并不友好。
actors.mobs.npcs.mirrorimage.name=镜像
actors.mobs.npcs.mirrorimage.desc=这个幻象和你非常相似，甚至还装备着你当前的武器和护甲。\n\n镜像会猎寻敌人，并用它们的镜像武器对其发动攻击。镜像武器的使用方式与特性和你手中的一样，但造成的伤害会低些。镜像出生的时候隐形，但攻击后会显形。\n\n镜像有一定的攻击能力，但非常脆弱，受到伤害就会瞬间消散。
actors.mobs.npcs.prismaticimage.name=虹色幻影
actors.mobs.npcs.prismaticimage.desc=这个闪烁着虹光幻象和你非常相似，甚至还装备着你当前的武器和护甲。\n\n虹色幻影将通过吸引敌人的方式来利用它的护甲和生命保护你。虽然它没有和镜像一样有攻击性，但它有更高的生命值，以及和你一样的护甲。\n\n当幻影生命降至0时，它将保持一段时间的存在，在此期间仍能被治愈。在周围没有敌方单位时，幻影便会回到主人身边。
actors.mobs.npcs.ratking.name=老鼠王
actors.mobs.npcs.ratking.not_sleeping=我可不是在睡觉！
actors.mobs.npcs.ratking.what_is_it=你这是想干什么？我可没时间管这些破事。我的王国可不会自己运转下去！
actors.mobs.npcs.ratking.confused=这……我这是在哪？我的王国需要我！
actors.mobs.npcs.ratking.crownshard=嗯，你手里的碎片...不，我的王冠就在这里！
actors.mobs.npcs.ratking.crown_clothes=把衣服穿上！会见皇室的礼仪都不懂吗！
actors.mobs.npcs.ratking.crown_desc=哇，那个皇冠是要给本王的吗！？它看上去比我的皇冠更闪更亮，那我就好心好意地接受了！\n\n当然，我堂堂鼠王也不会白拿的。作为交换，本王能赐你一项配得上「英雄」之称的强大能力！怎么样？要不要？
actors.mobs.npcs.ratking.crown_yes=当然了！
actors.mobs.npcs.ratking.crown_info=我愿闻其详。
actors.mobs.npcs.ratking.crown_no=还是算了……
actors.mobs.npcs.ratking.crown_thankyou=嘿嘿嘿嘿，多谢了！不要让本王失望了，去宣扬我的威名吧！
actors.mobs.npcs.ratking.crown_fine=行吧！反正我也不怎么想要那个闪闪发光的皇冠……
actors.mobs.npcs.ratking.crown_after=新衣服穿着合身吗？诚信交易，概不退换！
actors.mobs.npcs.ratking.desc_crown=这只老鼠比普通的有袋鼠稍大。它头上戴着矮人国王的王冠。
actors.mobs.npcs.ratking.desc_birthday=这只老鼠比普通的有袋鼠稍大。它戴着一顶小小的绿色派对帽，而不是它通常的王冠。鼠王生日快乐！
actors.mobs.npcs.ratking.desc_winter=这只老鼠比普通的有袋鼠稍大。它戴着一顶小小的节日帽，而不是它通常的王冠。节日快乐！
actors.mobs.npcs.ratking.desc=这只老鼠比普通的啮齿小鼠大一点。它戴着一顶小小的的皇冠。
actors.mobs.npcs.ratking.rankings_desc=在不可能的战斗中击败了更高等的存在。
actors.mobs.npcs.ratking.amulet=这是怎么一回事？朕...\n\n等等，那是_护符_吗？朕已经等了这么久了。现在每个人都会知道鼠王的名号了，朕可以单独作为所谓的...\n\n你离开是什么意思？整个冒险过程中朕都在帮助你，而你却决定背叛？\n\n不可原谅！_准备战斗_，非啮齿动物！
actors.mobs.ratkingboss.name=鼠王
actors.mobs.ratkingboss.name_rat_king=鼠王的镜像
actors.mobs.ratkingboss.notice_have=准备哭泣吧！
actors.mobs.ratkingboss.notice_have_rat_king=准备！
actors.mobs.ratkingboss.enraged=什么鬼？我才没时间管那么多。我还得统治我的王国！能量过载！！！
actors.mobs.ratkingboss.enraged_2=我不能败给一个凡人！
actors.mobs.ratkingboss.enraged_2_rat_king=我不能死！
actors.mobs.ratkingboss.desc=这只老鼠把你视为盟友，一个为老鼠王国的荣耀而战的新英雄。但你为自己夺取Yendor护身符的私欲，是压垮伟大鼠王的最后一根稻草。现在你会感到痛苦，你这个叛徒和懦夫。\n你希望那些小老鼠错过离开这个地牢，获得无限力量的机会吗？多么愚蠢的灵长类动物！\n\n鼠王有不同的攻击模式，由战场的_颜色滤镜_指示。在失去HP的情况下，Boss会采取更具攻击性的行动，承受更多的伤害，请记住这一点。\n\n\_由于它的存在_，你的护盾会以更快的速度衰减。
actors.mobs.ratkingboss.desc_rat_king=这只老鼠只是你辉煌荣耀的残留镜像，但它非常强大，请小心。\n\n__由于它的存在_，你的护盾会以更快的速度衰减。
actors.mobs.ratkingboss.phase3=他曾经只是一只老鼠，但现在升到神格来消灭你。\n在这个状态下，老鼠王处于他的最强状态，对任何伤害或状态效果免疫，并全力战斗。由于能量集中，他将以2倍的速度切换模式，但会在循环结束时死亡。
actors.mobs.ratkingboss.phase3_rat_king=这个鬼魂是不死的，对吗？
actors.mobs.ratkingboss.emperor=老鼠王现在处于_皇帝_状态。他将迅速召集他的忠诚的老鼠子民和被称为_恶魔开膛手_的特种军团。
actors.mobs.ratkingboss.faster_summons=如果开启了_集群智能_，召唤的老鼠将包括更多的白化老鼠和恶魔开膛手。
actors.mobs.ratkingboss.gladiator=老鼠王现在处于_角斗士_状态。他增加了防御力，且会追赶你并用_尚方宝剑_攻击你，造成非常巨大的伤害。
actors.mobs.ratkingboss.healing=如果你开启了_缩餐节食_，鼠王会在攻击你时偷取你的饱腹值，并治愈他自己。
actors.mobs.ratkingboss.battlemage=老鼠王现在处于_战斗法师_状态。他将施展兵工厂里的各种魔杖，魔杖将随着_暴力Boss_的开启而变得更加强大。某些挑战也会增加新的魔法攻击种类。每个魔咒都会在目标地点的相邻4格造成十字AOE。
actors.mobs.ratkingboss.assassin=老鼠王现在处于_刺客_状态。他完全被阴影覆盖，会以更快的速度攻击你。每过一会，或在刺伤你的时候，他会准备_幽灵矛_，并在2个回合内射击并传送。在长矛之后，老鼠王可能也会使用一些_天狗把戏_。
actors.mobs.ratkingboss.dark=如果你开启了_没入黑暗_，鼠王将会向你射出能致盲的长矛。
actors.mobs.ratkingboss.sniper=老鼠王现在处于_狙击手_状态。他会用灵能弓向你射击，造成少量穿甲伤害，并到处布置陷阱。如果你想躲起来，每隔几回合你就会被传送到鼠王身边。
actors.mobs.ratkingboss.runes=如果你开启了_禁忌咒文_，鼠王的攻击将有几率暂时消除你的物品升级。
actors.mobs.ratkingboss.armor=如果你开启了_信念护体_，鼠王的攻击将有几率降低你的护甲防御并魅惑你。
actors.mobs.ratkingboss.bad_boss=如果你开启了_暴力Boss_，鼠王切换模式的时间间隔增加_75%_。
actors.mobs.ratkingboss$laststand.name=王朝余晖
actors.mobs.ratkingboss$laststand.desc=这个状态显示着鼠王的执念还剩下多少能量。
actors.mobs.npcs.sheep.name=绵羊
actors.mobs.npcs.sheep.baa!=咩！
actors.mobs.npcs.sheep.baa?=咩？
actors.mobs.npcs.sheep.baa.=咩。
actors.mobs.npcs.sheep.baa...=咩……
actors.mobs.npcs.sheep.def_verb=格挡
actors.mobs.npcs.sheep.desc=这是一只魔法绵羊。为什么叫它魔法绵羊？因为你杀不死它。它只会站在那里直到它消失，它会做的事情只有边反刍边对你翻白眼。
actors.mobs.npcs.shopkeeper.name=商人
actors.mobs.npcs.shopkeeper.thief=小偷，小偷！
actors.mobs.npcs.shopkeeper.warn=小心！我不会再警告你了。
actors.mobs.npcs.shopkeeper.flee=店主逃跑了！
actors.mobs.npcs.shopkeeper.sell=选择一件要出售的物品
actors.mobs.npcs.shopkeeper.talk=交谈
actors.mobs.npcs.shopkeeper.buyback=店主勉强把你的物品还给了你。
actors.mobs.npcs.shopkeeper.talk_prison_intro=我拥有你成功冒险所需的一切！
actors.mobs.npcs.shopkeeper.talk_prison_warrior=你手里的纹章很有趣，它们通常是完整的。你是一个被贬斥的英雄还是什么？不管你做了什么都不关我的事，你的硬币仍然有效。
actors.mobs.npcs.shopkeeper.talk_prison_mage=嘿嘿，我想我在城里某处看到过一张挂有你名字的通缉令。你在逃吗？哦，你是无辜的？当然，当然...别担心，我有更重要的事情要做，不会去告发你，但也许你应该买点东西以确保？
actors.mobs.npcs.shopkeeper.talk_prison_rogue=你是来自盗贼公会来清理这个区域吗？不，只是来购物？那么在这里杀几只怪物吧。也别指望有折扣，我向你们交了不少保护费，你们却没能保护好我。
actors.mobs.npcs.shopkeeper.talk_prison_huntress=小姐，你似乎离开了你的元素。狭窄的地牢走廊并不像宏伟的大厅或城市周围的森林那样宽敞，对吧？嘿嘿，不要在意我的唠叨，为什么不买点东西呢？
actors.mobs.npcs.shopkeeper.talk_prison_duelist=哦，这不是旅行英雄吗！如果你想拯救另一个城镇，祝你好运，这里的危险比小盗匪团还要严重。我相信你会比任何人都做得更好，只是不要死在我店外。
actors.mobs.npcs.shopkeeper.talk_prison_cleric=哎呀，殿下，或者说现在是圣下了？嘿嘿，不管怎样，这里可不是您该待的地方，要是您死了很多人会很难过的。不过您肯定有些硬币吧，为什么不买点东西来防止那种事发生呢？
actors.mobs.npcs.shopkeeper.talk_caves=花钱，活得更久。\n\n哦，如果你看到那个巨魔铁匠，请代我问候他。提醒那个蠢货，他上周买的锤子还欠我钱呢！
actors.mobs.npcs.shopkeeper.talk_city=我的商品可以让你在这里安全。\n\n...如果可以的话，请不要逗留。我花了很长时间才让这里的人别来打扰我，我不希望你招惹麻烦！
actors.mobs.npcs.shopkeeper.talk_halls=嘿，我为猎魔人提供特别价格！\n\n哦，在下面要小心！下面的恶魔不会在乎你有多勇敢。如果你死了，就不能再上来花钱了！ ;)\n\n那些恶魔像我吗？嘿嘿，一点也不像。我只是一个小家伙，不太会打架，但我设法保持了清醒。下面的恶魔可是更强大的存在，它们都被奴役了...嗯...在下面要小心。
actors.mobs.npcs.shopkeeper.talk_ascent=我不知道你打算用那个护身符做什么，但我不想参与其中。买点东西然后继续前行，我们都需要离开这个地方！
actors.mobs.npcs.shopkeeper.desc=这个矮胖的家伙看起来更适合在某些大城市里做买卖而不是这种地牢。这些商品的价格解释了为什么他会喜欢在这儿做生意。
actors.mobs.npcs.wandmaker.name=老杖匠
actors.mobs.npcs.wandmaker.intro_warrior=啊，能在这片压抑的地方遇见来自北方的战士可真是个惊喜！你肯定走了很远才来到这里吧！如果你想要冒险，你可以帮忙做一个任务。
actors.mobs.npcs.wandmaker.intro_rat_king=鼠王陛下？!您御驾亲临简直是神赐的祝福……本来我乐意为您效劳任何事，但现在我迫切需要您的皇家援助！我会为您的拨冗援助准备价值匹配的贡品。
actors.mobs.npcs.wandmaker.intro_rogue=天哪，你吓了我一跳！在这里这么久你是我见过的第一个尚有理智的强盗，所以你肯定是从地表下来的！如果你愿意帮助我这样一名陌生人的话，这有一个任务或许你能帮上忙。
actors.mobs.npcs.wandmaker.intro_mage=哦，你好啊%s！我好像听说你在法师学院那里搞了不少麻烦？算了这没关系，反正我也不喜欢那些墨守成规的榆木脑袋。如果你愿意的话，我这有个任务可以让你帮忙。
actors.mobs.npcs.wandmaker.intro_huntress=啊，你好啊姑娘！能在这下面见到一张友善的面孔真是太惊喜了，你说是吧？咦，说来，我敢打赌以前在哪见过你，但想不起具体……哦算了，不用在意，如果你是来这里冒险的话，我这有个任务交给你做。
actors.mobs.npcs.wandmaker.intro_duelist=噢，你好，小姐！在这样一个令人沮丧的地方遇到一个英雄真是个惊喜！如果你愿意帮助一个老人，我可能有一个任务给你。
actors.mobs.npcs.wandmaker.intro_cleric=哦，殿下您好！在这么个压抑的地方遇见您真是惊喜！虽然不好意思，但我可能有任务要交给您。
actors.mobs.npcs.wandmaker.intro_1=\n\n我在这里是为了寻找一个制作法杖需要的稀有材料，但我迷了路，而且身上的魔法盾也在慢慢减弱。我必须马上离开这里，但我不想空手而出。
actors.mobs.npcs.wandmaker.intro_dust=我在寻找一些_尸骨灰烬_。这是一种通常出现在这种地方的被诅咒的特殊骨灰。它应该就在附近某个被隔住的房间里，我很肯定你能在那里找到一些灰烬。不过要小心，灰烬上的诅咒相当强大，_尽快将它带回来_，我会净化其中的诅咒。
actors.mobs.npcs.wandmaker.intro_ember=我在寻找能从新生火元素身上获得的_元素余烬_。元素生物通常出现在无人控制的召唤仪式上，因此要召唤它只需要去找到一些蜡烛和一个能举行仪式的场地——我很确定你能找到这样的地方。你可能会需要_一些冰冻物品_元素生物异常强大，但用冰的话就能轻易消灭它们。
actors.mobs.npcs.wandmaker.intro_berry=这个监狱的老典狱长养着一株_腐莓_，它的种子就是我一直要寻找的东西。经过如此长的时间这株植物很可能已经出现了变异，所以让它放弃自己的种子可能会很棘手。它的花园应该就在这里的某个地方。如果你想活着回来的话，试着_远离那些触手_。纵火烧死它听起来很可行，但请别这么做，这样会杀死植被并毁坏其种子。
actors.mobs.npcs.wandmaker.intro_2=\n\n如果你可以帮我拿到它，我很愿意将自己的一把精制法杖交给你！我带了两把过来，所以你可以选择自己想要的法杖。
actors.mobs.npcs.wandmaker.reminder_dust=灰烬找到了吗，%s？试着寻找一些_障碍物_。
actors.mobs.npcs.wandmaker.reminder_ember=余烬找的怎么样了，%s？你需要找到_四根蜡烛_和一个_仪式场地_。
actors.mobs.npcs.wandmaker.reminder_berry=腐莓种子找的怎么样了，%s？它就在一个_充满植被的房间_里。
actors.mobs.npcs.wandmaker.def_verb=格挡
actors.mobs.npcs.wandmaker.desc=这位老先生的表情看起来十分困扰。他正在被一个力场护盾保护着。
actors.mobs.acidic.name=酸液蝎子
actors.mobs.acidic.desc=这些巨大的节肢类恶魔生物会尽可能避免一切近距离接触，并且会在远处射出能够致残的尖刺。它的身上甚至还滴落着腐蚀污泥。
actors.mobs.albino.name=白化老鼠
actors.mobs.albino.desc=这是一种珍稀的啮齿小鼠，有着纯白色的毛皮和锯齿状的牙齿。
actors.mobs.albino.desc_enemy=可悲的是，它和其他的人一样，一心想要违抗鼠王的皇家权威...
actors.mobs.albino.desc_enemy_no_rk=如此强大的动物战士四处游荡杀戮他人...
actors.mobs.armoredstatue.name=装甲石像
actors.mobs.armoredstatue.desc=你以为这只是地牢里的另一个丑陋雕像，但它发出红光的眼睛让你放弃了刚才的想法。\n\n雕像装备着精良的护甲，看上去相当坚硬很难对付。\n\n尽管雕像本身是用石头做的，但它装备着的_%1$s_和_%2$s_看起来像是真的。
actors.mobs.armoredstatue.desc_arm_wep=虽然雕像本身是石头做的，但它挥舞的_%1$s_和_%2$s_看起来是真的。
actors.mobs.bandit.name=疯狂强盗
actors.mobs.bandit.desc=一个精英盗贼，以其更华丽的紫色长袍为特征。尽管他们技巧更高，但已变得和普通盗贼一样毫无理智。\n\n除了偷你的东西，疯狂的强盗还会短暂致盲、削弱和毒害你！不过他们比普通盗贼更有可能携带额外战利品。
actors.mobs.bat.name=吸血蝙蝠
actors.mobs.bat.desc=这些敏捷且坚韧的洞穴穹顶生物比看上去可怕地多。它们会通过每次成功的攻击来恢复生命，从而击败比它们大得多的对手。
actors.mobs.bee.name=金色蜜蜂
actors.mobs.bee.desc_honey=尽管它们体积小，但金色蜜蜂对它们的家园有着强烈的保护欲。不过这一只看起来十分平静，而且还想要跟着你。
actors.mobs.bee.desc=尽管它们体积小，但金色蜜蜂有着强烈的保护家园的欲望。这只蜜蜂非常疯狂，最好和它保持距离。
actors.mobs.brute.name=老鼠战士
actors.mobs.brute.enraged=激怒
actors.mobs.brute.def_verb=格挡
actors.mobs.brute.desc=在被邪恶势力绑架并被迫与肮脏的豺狼人繁殖之前，这是鼠王的一个杰出卫士。他们名义上的能力是狂暴，允许他们欺骗死亡一会儿。
actors.mobs.brute.desc_no_rk=这是鼠王国的一位杰出守卫，在祖国崩溃后转投豺狼人。他们的招牌能力是狂暴，让他们能暂时欺骗死亡。
actors.mobs.brute$bruterage.name=野蛮狂暴
actors.mobs.brute$bruterage.desc=这个老鼠的死亡已经不可避免，但它想拉你作为陪葬品！\n\n时间的推移或是外界的伤害都会消磨护盾。在护盾消散殆尽之际，鼠战士会彻底消亡。然而，一定要小心，在这一阶段鼠战士会造成巨额伤害！\n\n剩余的护盾：%d。
actors.mobs.causticslime.name=蚀化史莱姆
actors.mobs.causticslime.desc=这个史莱姆似乎已经被下方渗透的黑暗能量完全侵蚀了。它已经失去了体表原有的绿色光泽，并且在不断滴落腐蚀污泥。
actors.mobs.crab.name=下水道螃蟹
actors.mobs.crab.desc=这些巨型的螃蟹位居下水道食物链的顶端。它们行动极其迅速且其厚重的甲壳能承受沉重的打击。
actors.mobs.crystalguardian.name=水晶守护者
actors.mobs.crystalguardian.def_verb=阻挡
actors.mobs.crystalguardian.desc=这些巨大的晶体守护者几乎看起来像雕像，如果不是它们明亮发光的眼睛。它们由坚硬的水晶制成，使它们行动迟缓但非常坚固，所以_最好让它们在水晶巢中长时间休眠。_\n\n由于它们的体积，水晶守护者在封闭空间中移动得更慢。它们如此耐久，以至于无法直接杀死它们。它们可以被打倒并暂时无法行动，但过一会儿它们会重新站起来。
actors.mobs.crystalmimic.name=水晶宝箱怪
actors.mobs.crystalmimic.ate=水晶宝箱怪吃掉了你的%s！
actors.mobs.crystalmimic.escaped=水晶宝箱怪逃跑了！
actors.mobs.crystalmimic.desc=宝箱怪是一种能随意改变外形的魔法生物。在地牢里它们几乎总会以宝箱形态出现，因为这样更能吸引不防备的冒险者。\n\n水晶宝箱怪相比于它们的近亲更为狡猾，会夺取财宝并尽量避免争斗。它们会在被发现后试图迅速逃离，还能在攻击时将敌人传送到别处。
actors.mobs.crystalspire.name=水晶尖塔
actors.mobs.crystalspire.warning=当你击打水晶时，水晶会震动。继续下去肯定会引起注意...
actors.mobs.crystalspire.alert=震动扩散并传遍整个洞穴！
actors.mobs.crystalspire.desc=这座巨大的超硬水晶尖塔可能是这个洞穴中所有奇怪的水晶生物的来源。你的常规武器对它无效，所以如果你想摧毁它，你需要使用凿子。\n\n_在开始破坏之前确保你做好准备。_这样一块大水晶可能需要一段时间才能挖掘透，而且你可能无法不受干扰地完成。尖塔本身甚至可能有一些自卫手段。_也许尖塔自己的攻击可以用来对付它的手下。_
actors.mobs.crystalwisp.name=水晶幽灵
actors.mobs.crystalwisp.beam_kill=光束杀死了你...
actors.mobs.crystalwisp.desc=一个小而愤怒的漂浮的坚硬水晶块，发出明亮的光芒。水晶幽灵虽然不是特别强大，但如果有明显的射击机会，它们会向你发射伤害光束。\n\n水晶幽灵足够小，可以轻松穿过各种水晶突起，但它们无法穿透它们。
actors.mobs.demonspawner.name=恶魔血巢
actors.mobs.demonspawner.on_death=此处的恶魔能量似乎随着血巢的毁灭而有所减弱。
actors.mobs.demonspawner.desc=这一团蠕动着的矮人血肉在利用惨死于这一区域的矮人源源不断地制造恶魔撕裂者。看来恶魔们为了对付入侵者可以不择手段。\n\n恶魔血巢虽然看上去非常恐怖，但它本身不具备移动或攻击能力。不过它庞大的体积使得它难以被迅速杀死，而且它在受到威胁时会加速产出恶魔撕裂者。\n\n_恶魔血巢似乎都与某个提供恶魔能量的源头相连。杀死它们或许能够弱化那个源头。_
actors.mobs.dm100.zap_kill=闪电球将你彻底击杀…
actors.mobs.dm100.desc=DM-100是一种矮人"防卫机械"的早期机型，用来保护下层矿洞中的矮人矿工。然而由于电击威力不足，它们之后被送给上层的人类监狱。典狱长起初认为DM-100太过残忍而没有启用，但随着时间推移，囚犯变得越来越难以控制，这使得DM-100成为了监狱的必备品。
actors.mobs.dm200.vent=DM-200喷射了一团有毒的废气！
actors.mobs.dm200.desc=DM-200是矮人研发的第二代城防器械，最初用来保护矿洞中的矮人矿工与下方的城市。比起第一代它们相当庞大笨重，并利用强力的液压锤碾压入侵者。\n\n臃肿的体型是它们的一大缺陷——它们无法进入狭窄的门与过道。为了弥补灵活性的缺陷，矮人设计了另一种功能：DM-200能向远处的或是它们无法触及的敌人喷射有毒的废气。
actors.mobs.dm201.vent=DM-201 投出了一枚腐蚀榴弹！
actors.mobs.dm201.desc=矮人曾做过一些围绕 DM-200 的机动性缺陷展开的实验，并据此设计制造了一批完全固定的 DM 系列机器。DM-201 是经过改装的 DM-200，其作为哨戒炮塔完全没有移动能力。作为交换，DM-201 们的坚固程度与攻击能力都得到了显著的提升。\n\n由于 DM-201 们并没有引擎来排放废气，矮人给它们装备了腐蚀气体榴弹！不过，DM-201 对榴弹的使用很谨慎，只有在受到来自远处的攻击时才会向敌人投掷榴弹。
actors.mobs.dm300.notice=侦 测 到 未 授 权 单 位 ！
actors.mobs.dm300.notice_rk=侦 测 到 老 鼠 王 ！消 灭！
actors.mobs.dm300.shield=DM-300从外露的管线中抽取能量，用护罩裹住自身！
actors.mobs.dm300.charging=受 到 伤 害 ！正 在 启 动 能 量 塔 ！
actors.mobs.dm300.charging_hint=DM-300 在接受能量塔供电时无法受到伤害！
actors.mobs.dm300.supercharged_rk=毁灭 ！
actors.mobs.dm300.supercharged=毁 灭 ！毁 灭 ！毁 灭 ！
actors.mobs.dm300.charge_lost=能 量 塔 损 坏 ！切 换 至 本 地 供 能 模 式 ！
actors.mobs.dm300.pylons_destroyed=警 告 ！检 测 到 电 网 故 障 ！
actors.mobs.dm300.rankings_desc=被DM-300碾压致死
actors.mobs.dm300.def_verb=格挡
actors.mobs.dm300.defeated=受 到 严 重 损 伤 ！正 在 尝 试 关-
actors.mobs.dm300.desc=DM-300是矮人有史以来发明的最强大的"防御机器"。这样一台令人生畏的机器是极难制造的，所以矮人们仅仅造出了几台来守护他们地下大都会的入口。\n\n它配备了可以喷出剧毒废气的通风口和一个可以用来攻击和破坏地表的高功率钻头。DM-300还可以连接到能源电网，进一步增强它的力量。
actors.mobs.dm300.desc_supercharged=DM-300已被完全充能。现在，DM-300能免疫外界的伤害，并以两倍速度移动！而且，它的电钻功率现在足以_钻透墙壁_，不过这会大幅降低它的移动速度。\n\n直接攻击充能状态下的DM-300毫无意义，不过这附近一定有为它_提供能量的装置_，摧毁了的话也许能削弱它。
actors.mobs.dwarfking.name=矮人国王
actors.mobs.dwarfking.notice=汝竟敢进犯王家重地！不知天高地厚！
actors.mobs.dwarfking.notice2_rat_king=等等...是你??? 鼠王!!朕才是最强大的王!!! 做好被征服的觉悟吧!!! *狂笑*
actors.mobs.dwarfking.notice2=汝自称是鼠王的使者？汝竟然臣服于伪王!! 为汝之无礼去死!!!
actors.mobs.dwarfking.notice2_no_rk=你绝无可能打算重建鼠王国！！！在我的领地不允许如此放肆！
actors.mobs.dwarfking.first_summon=王命急宣，王军立至！
actors.mobs.dwarfking.outmatched_rat_king=鼠王！汝败了！现在投降，朕可以赐汝一个痛快！
actors.mobs.dwarfking.strong=朕的军队何其强盛！不像汝那些可怜的草民! 哈哈哈哈哈哈!!
actors.mobs.dwarfking.golem=鼠王禁入！
actors.mobs.dwarfking.golem_no_rk=弱小的老鼠无法拥有这些！
actors.mobs.dwarfking.golem_rat_king=朕已经准备很久了，都是为！了！你!!!!
actors.mobs.dwarfking.first_special_rat_king=不像你那可笑的小国，朕的臣民绝对忠诚！
actors.mobs.dwarfking.corrupted=怎么可能?! 这个 %s 怎敢臣服于伪王! 汝将付出代价!!!
actors.mobs.dwarfking.lifelink_1=尔等奴虏，速将性命尽交予朕！
actors.mobs.dwarfking.lifelink_2=为了朕的大业，光荣牺牲吧！
actors.mobs.dwarfking.teleport_1=汝等，速速拿下此人！
actors.mobs.dwarfking.teleport_rat_king=给他看看朕的威能!!!
actors.mobs.dwarfking.teleport_2=汝等，拖住此人！
actors.mobs.dwarfking.wave_1=够了！为朕复生而战吧，汝等奴虏！
actors.mobs.dwarfking.wave_2=继续上！为了朕的江山而战！
actors.mobs.dwarfking.wave_2_no_rk=更多！为唯一的统治国王流血吧！！
actors.mobs.dwarfking.wave_3=废物！朕命你们立刻杀死此人！
actors.mobs.dwarfking.enraged=汝杀不掉朕，%s。朕・即・不・朽！
actors.mobs.dwarfking.losing=不！汝不得如此...汝不知晓朕的王国之下埋藏着什么...
actors.mobs.dwarfking.defeated_rat_king=被...一只老鼠...击败...
actors.mobs.dwarfking.defeated_1=朕...溃矣...
actors.mobs.dwarfking.defeated_2=一无所知的蠢货...汝会毁了一切的...
actors.mobs.dwarfking.hero_killed=这就是伪王走狗的下场！
actors.mobs.dwarfking.hero_killed_no_rk=让鼠王国的残余分子以此为戒...
actors.mobs.dwarfking.hero_killed_rat_king=果然朕才是至高的王！
actors.mobs.dwarfking.rankings_desc=屈服在矮人国王御前
actors.mobs.dwarfking.desc=许多年前，矮人议会中一名最强的巫师洞察了凌驾于生死之上的秘术。很快他就借助这种强大的力量，控制、腐化了王室与整个议会，并将魔爪伸向王国中的每一名矮人。现在他成为了矮人国的国王，统领着数量庞大的死灵。\n\n矮人国王是极具进攻性的强敌，会尝试利用他手下的死灵大军压制入侵者。\n\n他似乎执迷于证明自己是比鼠王更伟大的统治者。
actors.mobs.dwarfking.desc_no_rk=许多年前，矮人宫廷中最高的巫师之一发现了赋予他巨大生死力量的秘密。他很快将这种力量用于征服和腐化他的同僚、他的国王，最终腐化了每一个矮人公民。现在他是国王，统治着一支亡灵臣民大军。\n\n矮人国王是一个激进的敌人，他会试图用他的亡灵仆从大军包围并压倒敌人。\n\n他似乎异常执着于证明自己是唯一能维持家园的国王。
actors.mobs.dwarfking$dkghoul.rankings_desc=屈服在矮人国王御前
actors.mobs.dwarfking$dkmonk.rankings_desc=屈服在矮人国王御前
actors.mobs.dwarfking$dkwarlock.rankings_desc=屈服在矮人国王御前
actors.mobs.dwarfking$dkgolem.rankings_desc=屈服在矮人国王御前
actors.mobs.ebonymimic.name=黑檀宝箱怪
actors.mobs.ebonymimic.reveal=那里有一个宝箱怪！
actors.mobs.ebonymimic.hidden_name=可疑轮廓
actors.mobs.ebonymimic.hidden_desc=这里似乎有什么东西，但它几乎是完全透明的。
actors.mobs.ebonymimic.desc=宝箱怪是一种可以随心所欲改变形状的魔法生物。在地牢中，它们几乎总是选择宝箱的形状，以引诱粗心的冒险者。\n\n黑檀宝箱怪是隐形的宝箱怪，拥有使自己几乎不可见的能力。它们潜伏在冒险者可能与之互动的东西上，但自身也携带着战利品。一旦被发现，它们并不比普通宝箱怪更坚韧，但它们的突袭撕咬是毁灭性的。
actors.mobs.elemental$fireelemental.name=火元素
actors.mobs.elemental$fireelemental.desc=元素生物是一种由于施放强大魔法时的失误产生的混沌生物。元素生物缺乏最基础的智力，它们通常与一种特定的魔法密切相关。\n\n火元素是一种常见的借助火焰之力攻击的元素生物。在近战时它能使得目标燃起大火，对付远处的敌人也能偶尔向目标发射火球。
actors.mobs.elemental$newbornfireelemental.name=新生火元素
actors.mobs.elemental$newbornfireelemental.charging=元素正在充能！
actors.mobs.elemental$newbornfireelemental.desc=元素生物是一种由于施放强大魔法时的失误产生的混沌生物。元素生物缺乏最基础的智力，它们通常与一种特定的魔法密切相关。\n\n这只火元素刚刚被召唤出来，但还是非常危险！
actors.mobs.elemental$newbornfireelemental.desc_boss=由于其召唤的混乱性质，这个元素只能在充能一回合后以不准确的爆炸形式传播火焰。
actors.mobs.elemental$newbornfireelemental.desc_ally=由于这个元素是通过咒语召唤的，它对自己的火焰有更多的控制。它无法进行远程攻击，但会点燃它近身攻击的敌人。
actors.mobs.elemental$frostelemental.name=冰霜元素
actors.mobs.elemental$frostelemental.desc=元素生物是一种由于施放强大魔法时的失误产生的混沌生物。元素生物缺乏最基础的智力，它们通常与一种特定的魔法密切相关。\n\n冰霜元素是一种常见的借助冰霜之力弱化敌人的元素生物。它们近战会使敌人陷入冻伤，也能偶尔远程攻击，在水面上冰霜之力的效果会显著加强。
actors.mobs.elemental$shockelemental.name=电击元素
actors.mobs.elemental$shockelemental.desc=元素生物是一种由于施放强大魔法时的失误产生的混沌生物。元素生物缺乏最基础的智力，它们通常与一种特定的魔法密切相关。\n\n电击元素是一种利用电击与闪光攻击敌人，较为少见的元素生物。近战时它会向周遭敌人释放电弧，若主要攻击目标在水中将遭受额外伤害。对付远处的敌人时它们会偶尔释放致盲的强烈闪光。
actors.mobs.elemental$chaoselemental.name=混沌元素
actors.mobs.elemental$chaoselemental.desc=元素生物是一种由于施放强大魔法时的失误产生的混沌生物。元素生物缺乏最基础的智力，它们通常与一种特定的魔法密切相关。\n\n混沌元素是一种极其稀有的元素生物。它们不仅仅局限于一种特定的魔法，而是借助随机的魔法进行强力的攻击。
actors.mobs.eye.name=邪恶之眼
actors.mobs.eye.deathgaze_kill=死亡凝视夺取了你的生命…
actors.mobs.eye.desc=邪眼是一种将恶魔能量压抑在自己体内的漂浮球形生物。它们拥有近战能力，但其真正的力量蕴藏在它们的魔法之中。\n\n在短暂的蓄能过后邪眼将会释放一种名为_死亡凝视_的毁灭性能量射线。任何受到邪眼的这种凝视的生物都会受到极大的伤害，明智的冒险者都会及时寻求掩护。
actors.mobs.fetidrat.name=腐臭老鼠
actors.mobs.fetidrat.desc=这只老鼠很不对劲。它油腻的黑毛和腐烂的皮肤与你之前见过的健康老鼠很不同。浅绿色的眼睛让它显得更具威胁。\n\n这只老鼠周围盘绕着一片可怕恶臭，靠近时臭气尤为浓烈。\n\n黑色的淤泥从它的嘴中流出。淤泥腐蚀掉了地砖，但遇水似乎就会溶解。
actors.mobs.ally_desc=它向伟大的鼠王臣服了!
actors.mobs.fungalcore.name=真菌核心
actors.mobs.fungalcore.desc=这个巨大的蘑菇肯定是这个洞穴中所有真菌活动的源头。
actors.mobs.fungalsentry.name=真菌哨兵
actors.mobs.fungalsentry.desc=这个特别高的蘑菇充当着这个洞穴中更大真菌网络的防御点。\n\n它固定不动，但会向进入其视线范围的任何东西发射精准的毒液冲击。虽然这些冲击的影响相对较弱，_但它们可以迅速积累致命的毒素量。_虽然它可以被杀死，但最好还是避开它。
actors.mobs.fungalspinner.name=真菌旋转者
actors.mobs.fungalspinner.desc=这个洞穴旋转者似乎被一种寄生真菌控制。这种真菌还改变了它的能力，用真菌生长取代了网和毒囊。\n\n真菌旋转者会向你吐植物生长物而不是网，传播真菌植被，可能会让你定身。虽然它不能施加毒素，但如果它靠近任何蘑菇，真菌旋转者将获得相当的伤害抵抗力。
actors.mobs.ghoul.name=矮人尸群
actors.mobs.ghoul.desc=在矮人王国逐渐衰亡，现在的矮人国王掌握了绝对的权力时，一些较为弱小的或是反抗国王的矮人受到了不公的待遇。然而随着矮人国王逐渐精通黑暗魔法，这些矮人逐渐屈从于其意志，并最终沦为了其大军中的一枚棋子。\n\n矮人尸群中的个体本身没有强大的战斗力，但它们总是结伴作战，试图利用数量优势击败强大的对手。_一名矮人尸群成员被击倒时，如果周围仍有其他同类，它将会在几回合后重生_。
actors.mobs.gnoll.name=豺狼巡查
actors.mobs.gnoll.desc=豺狼是鬣狗状的类人生物。它们在下水道和地牢里游荡，不时向上行动试图向地表发起进攻。豺狼巡查是它们种群里最普通的一员，它们既没有豺狼暴徒强壮，也赶不上萨满聪明。
actors.mobs.gnollgeomancer.name=豺狼地卜师
actors.mobs.gnollgeomancer.warning=地卜师开始苏醒。在继续之前确保你已经准备好了！
actors.mobs.gnollgeomancer.alert=地卜师苏醒了！整个洞穴似乎在它狂笑着跳跃时发生了变化！
actors.mobs.gnollgeomancer.rock_kill=飞来的巨石杀死了你...
actors.mobs.gnollgeomancer.rockfall_kill=掉落的岩石杀死了你...
actors.mobs.gnollgeomancer.desc=这个令人印象深刻的高大老豺狼肯定是这里各种操控土地魔法的源头，以及所有豺狼活动的组织者。与该地区的豺狼工程师不同，地卜师在使用魔法方面非常娴熟，并且无法被投掷或掉落的岩石伤害。但它没有任何近战战斗的方式。
actors.mobs.gnollgeomancer.desc_armor=地卜师目前被一层岩石盔甲包裹着。_你需要靠近并用凿子打破它才能伤害地卜师。_
actors.mobs.gnollgeomancer.desc_armor_sapper=_附近的豺狼矿工手持一种装置，为地卜师的岩石盔甲提供动力。你现在根本无法伤害它！_
actors.mobs.gnollgeomancer.desc_sleeping=这个令人印象深刻的高大豺狼萨满被一层岩石包围，看起来几乎像雕像。仔细看，你可以看到岩石在与老豺狼的呼吸同步移动。在像这样的岩石包裹下无法伤害它，它似乎在享受着一场字面意义上的泥土之眠。\n\n你可能可以用凿子打破岩石层，但_在这样做之前确保你已经准备好战斗。_地卜师肯定是这里各种操控土地魔法的源头，以及所有豺狼活动的组织者。_在与它战斗之前击败这里散落的豺狼可能是个好主意。_
actors.mobs.gnollguard.name=豺狼守卫
actors.mobs.gnollguard.def_verb=格挡了
actors.mobs.gnollguard.spear_warn=豺狼用矛尖发动了猛烈一击！
actors.mobs.gnollguard.desc=一只持矛和盾牌但没有头盔的大而强壮的豺狼守卫。这些守卫很可能是被拉进来帮助保护矿山免受侵扰的野生动物。\n\n豺狼守卫足够强壮，可以单手挥舞矛，但使用不太熟练。_它需要相当开阔的空间才能远程攻击，如果你靠近它，它对你造成的伤害会明显减少。_
actors.mobs.gnollguard.desc_armor=_附近的豺狼矿工手持一种装置，为这个卫士提供土地护甲，大大降低了它受到的伤害。_
actors.mobs.gnollsapper.name=豺狼矿工
actors.mobs.gnollsapper.desc=一只体型小而虚弱但聪明的豺狼，毛色苍白，背着装满各种小工具的背包。它们很可能是来协助勘探和开采黑金的，并有附近的守卫保护。它们有能力战斗，但攻击力弱得可怜，不比豺狼巡查强。\n\n矿工们更喜欢使用他们手头的各种小工具让周围的岩石环境替他们攻击。不过，他们自己并不懂土地魔法，因此很可能会鲁莽地使用他们的小工具。_应该有很多方法可以利用他们的攻击反击他们，或者反击他们的守卫。_
actors.mobs.gnolltrickster.name=豺狼诡术师
actors.mobs.gnolltrickster.desc=即使以豺狼人的标准来看，这个生物也非常的诡异。它佝偻着腰，鬼鬼祟祟地行进着，大嘴咧开，露出邪恶的笑容，珍惜地抱着肩上挂着的挎包。它曾经是这片土地最臭名昭著的豺狼刺客，但是现在它已经因为这里的黑魔法失去了大部分理智，因此它比以前尝试刺杀鼠王陛下时更加危险。它的瞳孔中混杂着恐惧与兴奋，这似乎是它仅存的情感…但是我何必怜悯刺客呢？\n\n它的挎包里有一大批粗制滥造的飞镖，它们似乎包含着各种有害物质。
actors.mobs.goldenmimic.name=金色宝箱怪
actors.mobs.goldenmimic.desc=宝箱怪是一种能随意改变外形的魔法生物。在地牢里它们几乎一直以宝箱形态出现，因为这样总能吸引不防备的冒险者。\n\n金色宝箱怪是试图吸引顶尖冒险者的强大宝箱怪。它们拥有更丰厚的财宝，但相对通常的宝箱怪也更为强大。
actors.mobs.golem.name=魔像
actors.mobs.golem.def_verb=格挡
actors.mobs.golem.desc=魔像是矮人们试图利用魔法的新应用弥补机械设备长久以来的缺陷的产物。它们虽不似DM-300那样庞大笨重，但仍具有不可小觑的破坏力。\n\n魔像因体型过大无法进入过道，但矮人们赋予了魔像魔力来弥补这一点——魔像能在各个房间之间传送，并能将无法触及的敌人从远处拉回来。
actors.mobs.goo.name=粘咕
actors.mobs.goo.notice=咕-咕！
actors.mobs.goo.defeated=咕……咕……
actors.mobs.goo.pumpup=粘咕正在不断地抽动！
actors.mobs.goo.enraged=激怒
actors.mobs.goo.gluuurp=咕——————！
actors.mobs.goo.rankings_desc=被粘咕消化
actors.mobs.goo.bolt_kill=你被黏咕释放的扭曲魔法杀死了……
actors.mobs.goo.desc=我们对粘咕所知甚少。它甚至很有可能不是一个生物，而是下水道表面聚集的邪恶物质得到基本智能而产生的实体。不管怎样，很明显是黑暗魔法造就了这个生物。\n\n其凝胶性质让它吸收了很多黑暗能量，你光是靠近就感受到了一股寒意。如果粘咕使用这种能量对你进行攻击那你肯定支撑不了多久。
actors.mobs.greatcrab.name=巨大螃蟹
actors.mobs.greatcrab.noticed=巨型螃蟹用它硕大的钳子格挡了这次攻击。
actors.mobs.greatcrab.def_verb=格挡
actors.mobs.greatcrab.desc=曾经的螃蟹之王。由于黑暗魔法的入侵，它似乎不再做出理性的反应。它正在攻击一个以前的坚定盟友，考虑到它与伟大的鼠王有着悠久的历史，这是一个真正的耻辱…\n\n这只螃蟹的块头相当大，甚至超过了其他的下水道螃蟹。它的蓝色甲壳上布满了裂纹和藤壶，足以证明其经历的无数岁月。可惜他的伙伴鼠王最珍视的智慧已经不复存在。它爬行缓慢，那只巨大的钳子让它难以保持平衡。\n\n尽管这螃蟹只剩下一边的钳子，但钳子的个头完全弥补了这点不足。螃蟹只要发现危险就会把爪子举在身前，利用坚不可摧的甲壳进行防御。不过螃蟹无法格挡未察觉的攻击，也无法同时格挡多个敌人的进攻。
actors.mobs.greatcrab.desc_no_rk=曾经被称为蟹王，由于入侵的黑暗魔法，这只螃蟹似乎不再响应理智。它正在攻击一位先前坚定的盟友，考虑到它与威严的鼠类王室家族的悠久历史，真是令人遗憾...\n\n这只螃蟹非常巨大，甚至与其他下水道螃蟹相比也是如此。它的蓝色甲壳布满裂缝和藤壶，显示出其高龄。然而，鼠王国档案保管员最珍视的智慧早已消失。它缓慢地移动，用巨大的钳子勉强保持平衡。\n\n虽然螃蟹只有一只钳子，但其大小足以弥补。螃蟹将钳子挡在任何威胁面前，用坚不可摧的甲壳墙保护自己。然而，螃蟹无法格挡它没有看到的攻击，或者来自多个敌人的同时攻击。
actors.mobs.guard.name=监狱守卫
actors.mobs.guard.scorpion=给我过来！
actors.mobs.guard.def_verb=格挡
actors.mobs.guard.desc=作为曾经监狱的管理者，这些守卫和那些罪犯已经没什么区别了。它们蹒跚的步伐如同僵尸一般，毫无思绪地四处寻找不属于这片区域的生物，比如你！\n\n它的铁链缠在自己的胯部，也许可以用来将敌人拉扯到非常近的距离。\n\n它们已经逝去太长的时间，以至于没有意识到它们正在向一位国王发动攻击……
actors.mobs.mimic.name=宝箱怪
actors.mobs.mimic.reveal=这是一个宝箱怪！
actors.mobs.mimic.hidden_hint=这个宝箱看上去有些不对劲……上前直接打开似乎不太合适。
actors.mobs.mimic.desc=宝箱怪是一种能随意改变外形的生物。在地牢里它们几乎一直以宝箱形态出现，因为这样总能吸引不防备的冒险者。\n\n宝箱怪具有较强的攻击力，但也拥有比普通箱子更多的财宝。
actors.mobs.necromancer.name=死灵法师
actors.mobs.necromancer.desc=这些黑暗魔法的学徒大量涌入监狱，因为这里是它们磨练死灵法术的最佳地点。\n\n死灵法师通过召唤并加强骷髅作战。死灵法师被击杀后，其召唤的骷髅也会消散。
actors.mobs.necromancer$necroskeleton.name=死灵法师的骷髅
actors.mobs.necromancer$necroskeleton.desc=这个骷髅是被死灵法师召唤出来的。它的能力与习性和普通的骷髅一样，只是会在召唤者被击杀时跟着消逝。
actors.mobs.mob.died=你依稀听到远处有什么东西死掉了。
actors.mobs.mob.rankings_desc=死于：%s
actors.mobs.monk.name=矮人武僧
actors.mobs.monk.def_verb=格挡
actors.mobs.monk.parried=招架
actors.mobs.monk.desc=这些僧侣皆是狂热的信徒，倾其所能从一切异族手中保护国王的安全。狂热的信仰使得他们将自己的意志交给了国王，只剩下没有思想的躯壳在城市中游荡。\n\n矮人武僧既不披甲亦不执械，仅仅依靠自己的王来在王中进攻防守。王的王会必定王住一次王，哪怕是王的王。王在王时会更王地王，在王中就相对王些。
actors.mobs.monk$focus.name=精神集中
actors.mobs.monk$focus.desc=这个武僧已经完全集中于目标的一举一动，似乎能预料到目标的下一步动作。\n\n精神集中的武僧一定会格挡下一次物理攻击。格挡会分散武僧的注意力，使得他们需要一段时间重新集中精力来成功格挡攻击。在移动时武僧恢复地相对更快。
actors.mobs.phantompiranha.name=幻影食人鱼
actors.mobs.phantompiranha.teleport_away=幻影食人鱼传送离开了...
actors.mobs.phantompiranha.desc=幻影食人鱼是一种稀有的食人鱼品种，具有魔法能力和阴森透明的身体。它们在被攻击时能够传送，无论是逃跑还是迅速靠近敌人！\n\n虽然与它们战斗很烦人，但它们的肉因其魔法属性而备受珍视。
actors.mobs.piranha.name=巨型食人鱼
actors.mobs.piranha.desc=这些肉食性鱼类不是地下水池中的天然生物。它们被专门培育用来保护被水淹没的储藏室。
actors.mobs.pylon.name=能量塔
actors.mobs.pylon.desc_inactive=这是一座用于分配区域内机械用电的能量塔。\n\n这座能量塔未被激活，目前无法受到任何伤害。
actors.mobs.pylon.desc_active=这是一座用于分配区域内机械用电的能量塔。此刻能量塔电能涌动，定是它正在为DM-300充能！\n\n这时的能量塔可被摧毁，却会顺时针向四周释放电弧。厚重的金属结构为其提供了强劲的防御。
actors.mobs.rat.name=小鼠
actors.mobs.rat.enemy=反叛的%s
actors.mobs.rat.enemy_no_rk=啮齿%s
actors.mobs.rat.ally=忠诚的%s
actors.mobs.rat.desc=虽说啮齿小鼠们具有攻击性，可它们依旧是下水道居民里的弱者。它们的啮咬非常烦人，但只有数量巨大时才会有生命威胁。
actors.mobs.rat.desc_enemy_no_rk=在如此混乱的环境中无人引导它们。还是曾经有过？
actors.mobs.rat.desc_enemy=不幸的是，在最近的政变中，反叛的老鼠数量急剧增加，他们拒绝服从鼠王的圣旨。会是有人幕后操纵吗？
actors.mobs.rat.desc_ally=这只老鼠是鼠王的众多忠臣之一。它会为你而战，即使几乎失去所有的希望。因为它是一只老鼠，老鼠会完成任务！
actors.mobs.rat.desc_ally_no_rk=这只老鼠是鼠王国众多剩余幸存者之一。即使当所有希望似乎都已破灭时，它也会为你而战，因为它是老鼠，而老鼠能把事情搞定！
actors.mobs.ripperdemon.name=恶魔撕裂者
actors.mobs.ripperdemon.leap=恶魔撕裂者正准备扑杀！
actors.mobs.ripperdemon.desc=这种恐怖的生物是恶魔利用这里残留的众多矮人尸骸而组成的。恶魔撕裂者外观类似苍白瘦弱的矮人，具有残缺不全的躯干与尖利修长的骨爪。\n\n恶魔撕裂者难以承受沉重的打击，但它们行动迅捷并十分危险。它们能够瞬间扑过极远的距离，再用自己的骨爪刺穿目标。\n\n不过，谢天谢地，它们不是老鼠。如果它们是老鼠，这项任务就不可能完成。
actors.mobs.threadripper.name=恶魔开膛手
actors.mobs.threadripper.leap=恶魔开膛手正准备扑杀！
actors.mobs.threadripper.desc=最可怕的噩梦成真：一只老鼠，与恶魔撕裂者融合了。\n\n它的面板数据似乎随着每一章而增加。并且随着激活更多的挑战，它变得越来越强大，但越来越不常见。
actors.mobs.threadripper.desc_rat_king=这项创造完美老鼠的实验失败了，它的力量可能刚好足以模仿恶魔撕裂者的威胁。
actors.mobs.rotheart.name=腐烂之心
actors.mobs.rotheart.desc=腐莓的果实很独特。一般植物的果实会逐渐腐烂并给种子提供养分，但这种果实会生长，变硬，并把种子牢牢包裹在内。它为果实里生长的内部器官提供保护。这种巨大的球状物被视为成年的腐莓植物的心脏部分。
actors.mobs.rotlasher.name=腐烂触手
actors.mobs.rotlasher.desc=腐烂触手是成熟腐莓根系的一部分，也是其主要自卫手段。触手固扎土中不能移动，却会猛烈攻击任何靠近的威胁。当附近没有敌人，它们矗立不动，试图将自己融入周遭植被中。
actors.mobs.scorpio.name=老鼠侍从
actors.mobs.scorpio.desc=这是老鼠皇后的克隆人之一，合成它们是为了保护较小的啮齿动物和抵御对王国的攻击。不幸的是，在她死后，克隆人变得不稳定，突然地袭击了所有人。为了封锁他们，鼠王不得不与矮人王达成协议，将克隆的老鼠侍从送入所谓的"特殊地狱"。\n\n但是，既然叛徒已经在围剿战中丧生，那些人造老鼠会怎么样？？？
actors.mobs.senior.name=武僧大师
actors.mobs.senior.desc=这些僧侣皆是狂热的信徒，倾其所能从一切异族手中保护国王的安全。狂热的信仰使得他们将自己的意志交给了国王，只剩下没有思想的躯壳在城市中游荡。\n\n这只武僧掌握了精深的格斗技巧，相较于普通的武僧，他能在移动时更迅速恢复集中。精神集中的武僧会必定格挡住一次进攻，哪怕是必中的攻击。武僧在移动时会更快地集中精神，在战斗中就相对慢些。
actors.mobs.shaman.name=豺狼萨满
actors.mobs.shaman.bolt_kill=魔力的冲击粉碎了你...
actors.mobs.shaman.desc=那些最具有智慧的豺狼可以掌握萨满魔法，豺狼萨满由于缺少力量所以更喜欢使用战斗法术。它们在部落中享有很高的地位，即使它们的身形相对薄弱。
actors.mobs.shaman$redshaman.spell_desc=佩戴红色面具的萨满会利用魔法_削弱你的进攻能力_。
actors.mobs.shaman$blueshaman.spell_desc=佩戴蓝色面具的萨满会利用魔法_增加你受到的伤害_。
actors.mobs.shaman$purpleshaman.spell_desc=佩戴紫色面具的萨满会利用魔法_削减你的精准与闪避_。
actors.mobs.armoredbrute.name=重甲暴徒
actors.mobs.armoredbrute.desc=这些顶级的豺狼暴徒通常装备着强力的护甲来体现它们的地位。它们的护甲使得它们对物理伤害有着更高的防御，它们坚强的意志允许它们在弥留之际坚持更长的时间。
actors.mobs.skeleton.name=骷髅
actors.mobs.skeleton.explo_kill=你被骨头的爆炸杀掉了……
actors.mobs.skeleton.def_verb=格挡
actors.mobs.skeleton.desc=骷髅是从那些悲惨的冒险者及地牢原住民尸骨的聚合物产生的，来自下层地牢的邪恶力量将它们从死亡中唤起。在吸收了足够的伤害之后，它们就会在骨头的爆炸中消解。
actors.mobs.slime.name=史莱姆
actors.mobs.slime.def_verb=格挡
actors.mobs.slime.desc=史莱姆是一种具有胶质外形与液态内核的奇特魔法生物。城市的下水道为它们提供了充分的水源和富足的养分。\n\n史莱姆的外层胶膜具有极强的弹性，这使得任何单次攻击都难以对它们造成超过_6点的伤害_。
actors.mobs.snake.name=下水道巨蛇
actors.mobs.snake.hint=试试点击检查按钮再选择蛇，以了解如何击败它们。
actors.mobs.snake.desc=这些体型庞大的蛇能通过快速滑行以闪避普通的攻击，让它们难以命中。不过伏击与魔法攻击会使它们措手不及。\n\n在这条蛇的视野外攻击它时可以触发伏击。当这条蛇在追击你时，可以尝试躲入一扇门后，再_在蛇进门的瞬间发动攻击_。
actors.mobs.spectralnecromancer.name=招魂法师
actors.mobs.spectralnecromancer.desc=死灵法师们通常对召唤骷髅欲罢不能，但其中某些个体却偏爱使唤更为缥缈无形的造物。招魂法师们便选择了怨灵作为他们的爪牙！\n\n怨灵的个体战斗力或许不如骷髅，但这帮招魂法师无论一次性召唤出多少手下都不会嫌多！
actors.mobs.spinner.name=矿洞蜘蛛
actors.mobs.spinner.desc=绿色而多毛的洞穴蜘蛛们会试着去躲避直接的战斗，它们更喜欢在远处等待其猎物卷入蜘网，在剧毒中慢慢死去。它们也能向远处喷吐蛛网，阻挡敌人的行动路线。
actors.mobs.statue.name=活化石像
actors.mobs.statue.def_verb=格挡
actors.mobs.statue.desc=你以为这只是地牢里的另一个丑陋雕像，但它发出红光的眼睛让你放弃了刚才的想法。
actors.mobs.statue.desc_weapon=虽然雕像本身是石头做的，但它挥舞的_%s_看起来是真的。
actors.mobs.succubus.name=魅魔
actors.mobs.succubus.desc=魅魔是一种善于操纵敌人的精神的变形恶魔。这一只化为了哥特风的苍白人形，或许是为了吸引矮人术士或者鼠王？\n\n在攻击时，魅魔能够暂时魅惑目标，使其无法直接攻击魅魔本身。魅魔在攻击被魅惑的目标时能吸取其生命精华。
actors.mobs.succubus.desc_no_rk=魅魔是会改变形态并操纵猎物思想的恶魔。这只魅魔化身为一个苍白的哥特类人生物，也许是为了吸引矮人术士？\n\n魅魔在攻击时可能暂时魅惑敌人，使敌人无法直接攻击它们。当魅魔攻击被魅惑的敌人时，它们会偷取一些生命精华。
actors.mobs.swarm.name=蝇群
actors.mobs.swarm.desc=致命的飞蝇群愤怒地发出嗡嗡声。每次非魔法攻击都会把它分割成两群更小但同样危险的飞蝇群。
actors.mobs.tengu.name=天狗
actors.mobs.tengu.notice_gotcha=抓到你了，%s！
actors.mobs.tengu.interesting=是时候让这场战斗变得更有意思了…
actors.mobs.tengu.notice_have=你的命归我了，%s！
actors.mobs.tengu.defeated=终于...我解脱了...
actors.mobs.tengu.rankings_desc=被天狗暗杀
actors.mobs.tengu.desc=一位著名的神秘刺客，其名源于他脸上面具的蚀刻。\n\n天狗的手腕和膝下都带着镣铐，但他似乎很久以前就摆脱掉了锁链的束缚。\n\n他将利用陷阱、欺骗性的魔法、精准致命的攻击，来消灭唯一能阻止他逃脱的人：你。\n\n真可惜他疯了，否则你可能会原谅他。
actors.mobs.tengu$bombability$bombblob.desc=这里翻滚着一片过热的烟尘。当心，要爆炸了！
actors.mobs.tengu$bombability$bombitem.name=烟尘炸弹
actors.mobs.tengu$bombability$bombitem.cant_pickup=它固定在地面上，你无法搬动它！
actors.mobs.tengu$bombability$bombitem.desc=天狗往这里扔了一个奇形怪状的，不断鼓出滚烫浓烟的炸弹。它在滴答作响，似乎是爆炸的倒计时！\n\n炸弹嵌入了地面，你无法拾取它。
actors.mobs.tengu$fireability$fireblob.desc=天狗往这里洒了一把开始起烟的细腻粉末，要烧起来了！
actors.mobs.tengu$shockerability$shockerblob.desc=这里正积蓄着电能，站在这里的任何单位都会在下回合受到电击！
actors.mobs.tengu$shockerability$shockeritem.name=电击装置
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=它放出电能太强了，你无法触碰它！
actors.mobs.tengu$shockerability$shockeritem.desc=天狗往这里扔了一个奇怪的装置，好像是用DM-100的零件拼凑出来的。装置在持续地向周围放出电弧，但是范围好像有规律可循。\n\n有这么密集的高压电弧环绕着，你无从下手去拾取它。
actors.mobs.thief.name=老鼠盗贼
actors.mobs.thief.stole=小偷偷走了你的%s！
actors.mobs.thief.carries=\n\n这个小偷携带着一个_%s_。明显是偷来的。
actors.mobs.thief.escapes=小偷带着你的%s逃走了！
actors.mobs.thief.desc=变异的老鼠罪犯，逃离了鼠王的注视和不可避免的惩罚。他们将继续为自由而逃，而没有意识到他们行为的非道德性。\n\n这些敌人比起面对面地战斗，更倾向于偷走你的财物随后逃之夭夭。一定要看紧它们，否则你以后可能再也不会见到自己的被盗财物了。
actors.mobs.thief.desc_no_rk=变异的鼠罪犯，逃脱了鼠王国不公正的司法系统和不可避免的惩罚。他们会为了自由不断逃跑，没有意识到他们行为的不道德。\n\n这些敌人更倾向于偷窃和逃跑而非战斗。务必让他们保持在视线内，否则你可能再也见不到被偷的物品了。
actors.mobs.tormentedspirit.name=咒缚灵
actors.mobs.tormentedspirit.desc=咒缚灵原本是善良的幽灵，但受到了诅咒的影响。只要它们被诅咒，它们会像幽灵一样发起攻击，并且更加强大！\n\n通过在幽灵旁边使用正确的物品，可能可以净化诅咒。如果诅咒被解除，幽灵肯定会感激...
actors.mobs.tormentedspirit.thank_you=谢谢...
actors.mobs.warlock.name=矮人术士
actors.mobs.warlock.bolt_kill=暗影能量使你的生命衰竭了……
actors.mobs.warlock.desc=当矮人的兴趣从工程建设转向奥秘学术时，术士们开始在城市中掌权。它们从元素魔法起步，但很快就开始研究恶魔学和死灵术。最强大的术士掌握了矮人王国的王权，其他术士如果想继续练习黑暗魔法，就必须放弃精神的自由，将意志交给他控制。\n\n这些术士拥有具有强大的干扰性魔法，能暂时抑制装备的升级魔力。装备的等级越高，受降级魔法的影响就越严重。
actors.mobs.wraith.name=怨灵
actors.mobs.wraith.desc=怨灵是来自于墓穴中渴望复仇的罪人之魂。作为飘渺的非实体很难被正常武器击中。
actors.mobs.yogdzewa.notice=我  看  见  你  了
actors.mobs.yogdzewa.darkness=黑暗正在逼近……
actors.mobs.yogdzewa.hope=汝・之・希・望・皆・为・虚・妄
actors.mobs.yogdzewa.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogdzewa.desc=Yog-Dzewa是一个古老的神；一个将自己的力量延伸向凡间世界并吞噬它们、以为自身无尽的成长提供养分的巨大怪物。矮人一定是在玩弄黑暗魔法的时候引起了这个巨大恐怖的注意，并且从那以后就一直试图控制他，使之无法侵吞外界。\n\n这位古神起源于一个原始的、充满魔法与混沌的维度，且无法将他的真实形态带入这个世界。因此，他创造了自己的化身并召唤了恶魔们作为他的仆从来完成它的命令。\n\n这只巨眼是古神在这个世界上力量的焦点。虽然这只眼睛本身是不可移动的，但它能够射出强大的魔能光束，并召唤各种恶魔仆从来帮助它。
actors.mobs.yogdzewa.desc_spawners=你感觉到恶魔能量正从上层涌向古神之眼。你在上面活着留下的什么东西正在给古神回馈着能量。_古神会使用这股能量召唤更强大的手下！_
actors.mobs.yogdzewa$larva.name=古神幼虫
actors.mobs.yogdzewa$larva.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogdzewa$larva.desc=这些古神的小小造物是一种易于制造的简陋生物。虽然单个幼虫十分脆弱，但它们能够被迅速地制造出来，并会在形成一个大数目后变得难以抵挡。
actors.mobs.yogdzewa$yogripper.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogdzewa$yogeye.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogdzewa$yogscorpio.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogfist.invuln_warn=拳头邻接古神之眼时无法受到伤害！
actors.mobs.yogfist.rankings_desc=被Yog-Dzewa吞噬
actors.mobs.yogfist.desc=这个拳头是古神力量的部分体现。这些拳头与古神的力量相互联系，并且当它们靠近古神之眼时会免疫所有受到的伤害。
actors.mobs.yogfist$burningfist.name=燃烧之拳
actors.mobs.yogfist$burningfist.desc=燃烧之拳是由混沌的炽热魔法形成的。它在移动时会不断地引燃周围的环境。它还可以发射火焰能量形成魔法冲击，使目标地陷入一片熊熊烈火。\n\n燃烧之拳引燃环境的能力在靠近水的时候会被抑制，但是其热量实在太大，以至于周围的水很快就会蒸发掉！
actors.mobs.yogfist$soiledfist.name=大地之拳
actors.mobs.yogfist$soiledfist.desc=大地之拳是由混沌的大地魔法形成的。当它移动时，它会不断地使周围生出植物。它还可以发射精准的大地冲击，将它的目标困在迅速生长的藤蔓和根系间！\n\n大地之拳能从植物的生命中获得力量，并能根据其周围的植被数量来抵挡伤害！
actors.mobs.yogfist$rottingfist.name=腐烂之拳
actors.mobs.yogfist$rottingfist.desc=腐烂之拳是由活生生的腐败组成的。它是一团高塔般庞大的腐肉，可以在近战中喷溅腐蚀淤泥，并喷射毒气作为远程攻击。更糟糕的是，腐烂之拳的巨大质量导致它受到攻击时只会进入流血状态，而不会直接受到伤害。\n\n腐蚀淤泥可以被水洗去，但腐烂之拳也可以通过吸收水来治愈自己！此外，在其流血时对腐烂之拳造成伤害只会刷新其流血状态而不会加重效果！
actors.mobs.yogfist$rustedfist.name=锈蚀之拳
actors.mobs.yogfist$rustedfist.desc=锈蚀之拳是由一块活的金属形成的。它是一个高塔般庞大的移动金属块，具有强大的近战能力，并有在远距离外使目标残废的远程攻击能力。由于其巨大的质量，锈蚀之拳所受到的伤害都会被延缓，而非立即作用在其身上。\n\n尽管如此，锈蚀之拳那并不灵活的特性使得它无法通过较窄的走道。另外，虽然锈蚀之拳只会缓慢地受到伤害，但是延缓伤害还会在它受到多次攻击时继续叠加。
actors.mobs.yogfist$brightfist.name=辉耀之拳
actors.mobs.yogfist$brightfist.teleport=辉耀之拳在一道使你重度盲目的爆闪中传送到了别处！
actors.mobs.yogfist$brightfist.desc=辉耀之拳是由纯粹的光能量形成的。它能在每回合射出一道强烈的灼目光束！这些光束除了造成大量伤害外，还会暂时使你失明。辉耀之拳为了逃脱还能发出覆盖全场的刺眼爆闪！\n辉耀之拳在近战中并没有特殊能力。
actors.mobs.yogfist$darkfist.name=暗影之拳
actors.mobs.yogfist$darkfist.teleport=暗影之拳在一片使你光源熄灭的漆黑中传送到了别处！
actors.mobs.yogfist$darkfist.desc=暗影之拳是由纯粹的暗能量形成的。它能在每回合射出强大的暗黑法术！这些法术除了造成大量伤害外，还会削弱你的光源。暗影之拳为了逃脱还能瞬间使全场陷入一片漆黑！\n\n暗影之拳在近战中并没有特殊能力。
actors.mobs.abyssalspawner.name=深渊卵巢
actors.mobs.abyssalspawner.desc=这个扭曲的现实混合体负责从死亡的恶魔和亡灵中创造出深渊生物。\n\n虽然在视觉上很恐怖，但深渊卵巢无法移动或直接自卫。然而，它们巨大的质量和恢复能力使得它们很难迅速杀死，而且当它们受到威胁时，它们会更快地繁殖敌人。\n\n_最终击杀它可以产生一个特殊奖励。_
actors.mobs.abyssalspawner$clump.name=符文簇
actors.mobs.abyssalspawner$clump.desc=这块深渊物质的碎片似乎注入了奇异而熟悉的强化力量。一个簇的能量不足以实际升级你的装备。也许两个可以组合成可用的东西？
actors.mobs.abyssalspawner$clump.piece1=你收集了一个符文簇，但需要更多才能制作升级物品。
actors.mobs.abyssalspawner$clump.piece2=两个收集到的符文簇似乎融合在一起，创造了一个升级卷轴！
actors.mobs.darkestelf.name=黑暗精灵
actors.mobs.darkestelf.desc=这个实体是如此黑暗，你甚至看不到他的眼睛。他被绝望和空虚填满。使用深渊的混沌魔法，黑暗精灵召唤毁灭性的分裂暗黑史莱姆帮助他们战斗。
actors.mobs.spectrerat.name=魔化老鼠
actors.mobs.spectrerat.desc=这具老鼠尸体被深渊魔法复活了。在空闲状态下，它会在原地抽搐，试图爬起来。一旦被激怒，这种啮齿动物就会喷出有害的腐败气体，造成魔法伤害和负面效果。
actors.mobs.spectrerat.bolt_kill=腐化飞弹杀死了你...
actors.mobs.ghostchicken.name=雏鸡幽灵
actors.mobs.ghostchicken.desc=雏鸡幽灵是一种深渊幽灵，它可以以难以置信的速度移动，吸收所有的伤害，并对敌人施以穿透护甲的缩小诅咒。
actors.mobs.phantom.name=深渊幻影
actors.mobs.phantom.desc=深渊幻影是深渊的天然居民。它们是完全不可见的，只在它们所在的位置散发出少量的灰尘。一旦被唤醒，他们会散布辐射性瘴气，以保护自己免受近战打击。为了躲开它们，你可以离开房间，因为深渊幻影的体积对门来说太大了。
actors.mobs.trappet.name=陷阱捕猎者
actors.mobs.trappet.desc=这个类人生物可以使用无数的陷阱来围住他的敌人。他们没有伤害法术，所以你可以通过近战攻击来对抗那些捕猎者。
actors.mobs.lostspirit.name=迷失灵魂
actors.mobs.lostspirit.desc=迷失灵魂是深渊的精英怪物之一。他们是由人类的灵魂组成的，这些灵魂被这个地方的死光和虚空能量所消耗，这使得他们能够用精英突变来改造你的敌人，使他们变得更强大。突变可以使生物喷火、在水中游泳、吸收伤害或使用混乱魔法。\n\n由于同为人类，他们血量很少，且会拒绝攻击你或你的盟友，但会在施法时产生护盾，且如果受重伤，会主动撤退，同时从更深层次召唤其他深渊怪物寻求帮助。从远处攻击它们比近战攻击效率要低得多。
actors.buffs.shrink.name=缩小
actors.buffs.shrink.desc=宇宙中的一切不能都变得越来越大！\n\n缩小的角色将受到来自所有来源的更多伤害，精确度和闪避能力降低，近战攻击和魔法法术造成的伤害减少。\n\n缩小是永久性的！其效果只会以死亡告终。
actors.buffs.timedshrink.name=缩小
actors.buffs.timedshrink.desc=宇宙中的一切不能都变得越来越大！\n\n缩小的角色将受到来自所有来源的更多伤害，精确度和闪避能力降低，近战攻击和魔法法术造成的伤害减少。\n\n剩余回合数：%s.
actors.mobs.abyssalnightmare.name=深渊梦魇
actors.mobs.abyssalnightmare.desc=深渊梦魇是深渊中的精英怪物之一。他们完全不受任何魔法伤害和除狂乱外的所有减益的影响，可以复制自身以增加进攻性。它们的韧性随着损失血量减少。血量越低受到伤害越多。\n\n由于梦魇与深渊本身是结合在一起的，它们可以感知外界的任何干扰并寻找对手。躲在墙后只会让梦魇吞噬它们，然后接近你！
actors.mobs.blinkingman.name=闪烁者
actors.mobs.blinkingman.desc=那些深渊恶魔是距离大师。他们射出有机会将目标推开的灵魂标枪，如果它的敌人在近战范围内击中他们，闪烁者会向随机方向传送并继续攻击。
actors.mobs.dragon.name=深渊巨龙
actors.mobs.dragon.desc=深渊巨龙是深渊中的精英怪物之一。他们呼出深渊之火，造成霜冻灼伤，并在你周围繁殖小龙，他们的近战攻击会攻击你附近的盟友。
actors.mobs.dragon$smalldragon.name=深渊幼龙
actors.mobs.dragon$smalldragon.desc=虽然不像成年的深渊巨龙那样强壮，但它们仍然会在你身边制造麻烦。
actors.mobs.finalfroggit.name=末世魔蛙
actors.mobs.finalfroggit.bolt_kill=灭绝雷霆消灭了你...
actors.mobs.finalfroggit.desc=很久以前，这些青蛙是城市下层的人造守卫者。矮人文明结束后，最后一只青蛙被黑暗能量吸收，变成了消灭光明的化身。\n\n这种生物的存在不允许你去往更深层。
actors.mobs.finalfroggit$eradication.name=灭绝
actors.mobs.finalfroggit$eradication.desc=你更多地暴露在光线下。\n\n当此效果激活时，末世魔蛙将对您造成越来越大的伤害。\n\n剩余回合数：%1$s.\n\n受到伤害倍率：%2$sx.
actors.mobs.darkslime.name=暗黑史莱姆
actors.mobs.darkslime.desc=地下城暗能量的具现。每一次非魔法攻击都会把它分成两个稍小但同样危险的史莱姆。史莱姆受到的魔法伤害显著增多。
