challenges.fatique=体力衰竭
challenges.fatique_desc=长期拒绝进食对健康无益！\n\n_-_ 持续饥饿将大幅降低伤害减免、命中率、闪避率和攻速\n\n_-_ 饥饿后进食将暂时无法治疗玩家，持续时间随饥饿程度增加\n\n解锁_蛋白质饮食_挑战。
challenges.no_accuracy=预知战局
challenges.no_accuracy_desc=命中判定不过是害人的随机数！\n\n_-_ 敌我双方均无法闪避或未命中\n\n_-_ 角色根据超额闪避值获得最高_25%_伤害减免\n\n_-_ 角色根据超额命中值获得最高_25%_伤害加成\n\n解锁_过度反应_挑战。
challenges.no_hp=生命衰减
challenges.no_hp_desc=莽撞者不得安宁！\n\n_-_ 50%所受伤害转化为持续6回合的临时最大生命削减\n\n_-_ 后续伤害将使此效果额外延长3回合\n\n解锁_伤害失稳_挑战。
challenges.burn=地狱疆域
challenges.burn_desc=是否觉得自己玩得太过火了？\n\n_-_ 所有地面火焰永不熄灭但不会蔓延\n\n_-_ 可燃地块不会烧毁\n\n_-_ 所有草丛必定燃烧\n\n_-_ 敌人高度火焰抗性\n\n_-_ 禁用硫磺符文\n\n_-_ 每次下降时获得水球冲击（包括进入第1层）\n\n解锁_化学屏障_挑战。
challenges.hero_pathing=英雄徽记
challenges.hero_pathing_desc=你如此耀眼，众生皆欲觐见！\n\n_-_ 敌人游荡或传送时高概率锁定你的位置\n\n_-_ 移除敌人数量上限\n\n_-_ 敌人生成冷却缩短至25回合\n\n解锁_倾巢而出_挑战。
challenges.forget_path=暗影诅咒
challenges.forget_path_desc=有东西潜伏其中...\n\n_-_ 你快速遗忘已探索区域\n\n_-_ 怪物可从任意距离生成且移动稍快\n\n_-_ 20%概率物理攻击致盲\n\n解锁_热源追踪_挑战。
challenges.reduced_power=魔力枯竭
challenges.reduced_power_desc=此界强化之道已被禁绝...\n\n_-_ 掉落物品始终为0级\n\n_-_ 从第2层起，强化卷轴、力量药水、奥术笔和火把由宝箱怪守护\n\n_-_ 宝箱怪不额外掉落物品\n\n解锁_磨损之力_挑战。
challenges.random_hp=群体多样性
challenges.random_hp_desc=看这小牛多么迷你！\n\n_-_ 地牢敌人获得随机体型\n\n_-_ 体型决定其攻速移速、防御、闪避和近战伤害\n\n_-_ 首领和精英不受影响\n\n解锁_克罗默经济_挑战。
challenges.evil_mode=死敌模式
challenges.evil_mode_desc=对现状不满？\n\n_粘咕：_\n_-_ 伤害显著提高\n_-_ 移除充能攻击\n_-_ 受物理伤害时释放腐蚀泥云并召唤腐蚀史莱姆\n\n_天狗：_\n_-_ 平均伤害大幅提升\n_-_ 攻击概率减速\n_-_ 电击器和炸弹造成伤害后短暂眩晕\n_-_ 粉末攻击造成红莲燃烧而非普通燃烧\n\n_DM-300：_\n_-_ 需摧毁全部4个能量塔\n_-_ 免疫燃烧\n_-_ 使用炼狱粘团替代毒气粘团\n_-_ 超载时：召唤携带随机冠军头衔且拥有首领50%当前血量的DM-200\n\n_矮人国王：_\n_-_ 攻速与技能速度提升25%\n_-_ 第三阶段拥有满血\n_-_ 所有召唤仆从均为冠军\n\n_Yog-Dzewa：_\n_-_ 死亡射线数量翻倍且覆盖范围更大\n_-_ 根据战斗进度减免所受伤害\n_-_ 死亡射线攻击暂时削减33%最大生命\n_-_ 非相邻时拳头移速翻倍\n_-_ 古神幼虫生命值3倍\n\n解锁_无用之人_挑战。
challenges.no_vegan=蛋白质饮食
challenges.no_vegan_desc=_-_ 所有食物替换为神秘肉块\n\n_-_ 禁用丰饶之角和无味果
challenges.allergy=过度反应
challenges.allergy_desc=_-_ 英雄负面效果持续时间翻倍\n\n_-_ 治疗药水、生命之泉、冻生鱼片和梦叶草无法解除减益
challenges.unstable_damage=伤害失稳
challenges.unstable_damage_desc=_-_ 所受伤害在50%-200%间浮动，此效果作用于所有伤害减免之后
challenges.no_alchemy=化学屏障
challenges.no_alchemy_desc=_-_ 能量水晶限量生成\n\n无法补充或炼成更多能量\n\n_-_ 炼金工具包充能速度大幅降低
challenges.many_mobs=倾巢而出
challenges.many_mobs_desc=_-_ 常规房间数量4倍\n\n_-_ 怪物数量16倍
challenges.unlimited_vision=热源追踪
challenges.unlimited_vision_desc=_-_ 怪物可透视所有障碍(包括草丛和路障)\n\n_-_ 所有怪物拥有最大视野
challenges.no_str=软弱无力
challenges.no_str_desc=_-_ 禁用力量药水和根骨戒指
challenges.kromer=克罗默经济
challenges.kromer_desc=_-_ 每层非boss区域生成一枚克罗默\n\n_-_ _最好在知晓代价前夺取它们并逃离..._
challenges.no_talents=无用之人
challenges.no_talents_desc=_-_ 英雄获得零天赋点\n\n_-_ 英雄信息窗口天赋页不可用
challenges.too_many_mobs=独战千军
challenges.too_many_mobs_desc=_-_ 怪物将充斥除入口外的所有常规房间
challenges.just_kill_me=孱弱之躯
challenges.just_kill_me_desc=_-_ 最大生命削减50%
challenges.no_levels=无心向学
challenges.no_levels_desc=_-_ 敌人不提供经验\n\n_-_ 击败boss(含深渊)直接提升1级
utils.dungeonseed.rat-rat-rat.desc=- 所有怪物(boss除外)替换为鼠类\n\n- 鼠群随玩家进度成长
utils.dungeonseed.rog-ueb-uff.desc=- 将初始暗影斗篷替换为随机已鉴定神器
utils.dungeonseed.rev-ers-eed.desc=- 反转各区域视觉效果：下水道呈大厅状，大厅呈下水道状
utils.dungeonseed.now-all-she.desc=- 将房间间墙壁转化为余烬\n\n- 将书架和门转化为深渊裂隙
utils.dungeonseed.rng-ite-mss.desc=- 物品外观频繁幻化为其他物品\n\n- 不影响实际功能
utils.dungeonseed.ite-mch-est.desc=- 所有地牢物品存入宝箱\n\n- 非宝箱容器均转化为宝箱
utils.dungeonseed.exp-ans-ive.desc=- 标准/特殊房间数量2倍\n\n- 怪物数量2倍\n\n- 物品数量1.5倍
utils.dungeonseed.bes-tfr-end.desc=- 敌人被英雄直接击中时33%概率转为盟友
utils.dungeonseed.ech-ech-ech.desc=- 生成独特"艾克"盟友，跟随英雄并协助作战\n\n- 艾克拥有8生命、1-5攻击、1-3护甲，随英雄成长并共享抗性\n\n- 效果依职业而定：\n- 战士：2倍护甲\n- 法师：全距离攻击（伤害减半）\n- 盗贼：+50%命中/闪避\n- 女猎：触发弓附魔\n- 决斗家：+50%攻速，获得英雄武器25%伤害加值\n- 牧师：+50%生命\n\n- 艾克死亡时触发食物天赋，下一层重生
utils.dungeonseed.bob-pal-kia.desc=- 组合列表中所有种子效果\n\n- 可能不稳定且无法正常游玩
utils.dungeonseed.rot-inm-ind.desc=- 开局赠送免费克罗默\n\n- 通过设置最大值为1禁用传送
utils.dungeonseed.iwa-ntm-ony.desc=- 几乎所有生成或掉落的物品需现金购买\n\n- 造成/承受伤害时产生小额金钱
utils.dungeonseed.who-lep-ack.desc=- 物品堆25%概率额外生成物品\n\n- 怪物每3回合回复1生命\n\n- 所有物品存入宝箱容器\n- 非宝箱容器均转化\n\n- 标准/特殊房间2倍\n- 怪物2倍\n- 物品1.5倍
utils.dungeonseed.rrr-rrr-rrr.desc=- 所有文本首字母随机替换为'R'\n\n- 1/15概率音效被随机音量音调的'R'声替代\n\n- 所有怪物（首领除外）替换为鼠类\n- 鼠群随玩家成长\n\n- 初始暗影斗篷替换为随机神器\n\n- 区域视觉反转：下水道呈大厅状，大厅呈下水道状
utils.dungeonseed.ama-gen-erf.desc=- 将法师法杖初始魔弹法杖替换为其他类型
utils.dungeonseed.col-los-eum.desc=- 破印可用时新增蓄力格挡机制\n\n- 蓄力速度基于破印最大护盾与充能速度\n\n- 充能后可进入格挡状态，使下次攻击转化为护盾而非伤害\n\n- 成功格挡后3回合内命中率翻倍\n\n- 可格挡任何攻击（含魔法）
utils.dungeonseed.buf-hun-trs.desc=- 投射物100耐久不再无敌且无法存入魔法箭袋\n\n- 投射物不再触发乘胜追击\n\n- 狙击手专精不再破甲\n\n- 投射物与灵弓无距离命中加成\n\n- 女猎与疾行者失去投射物天赋加成
utils.dungeonseed.bet-ter-wep.desc=- 将初始武器替换为随机已鉴定武器（永久降为1阶）\n\n- 从5种常规武器阶位中抽取，1/22概率为6阶
utils.dungeonseed.god-chi-ldd.desc=- 英雄拥有牧师大部分先天增益\n\n- 开局赠送以全速充能的圣典\n\n- 所有法术初始解锁且满效能
utils.dungeonseed.rng-ski-lls.desc=- 所有通用天赋变异为另一套天赋
utils.dungeonseed.equ-alo-dds.desc=- 所有生成物品初始权重相等（稀有度一致）\n\n- 护甲武器在2阶和6阶生成概率相同（无视区域）\n\n- 强化卷轴与力量药水可进入常规池
utils.dungeonseed.lev-eld-own.desc=- 英雄初始24级（非1级）\n\n- 击杀敌人导致经验流失与降级\n\n- 低于1级游戏结束
utils.dungeonseed.cor-ros-ion.desc=- 开局获得+100腐蚀法杖\n\n- 其他武器（含投射物/炸弹/法杖）几乎绝迹
utils.dungeonseed.glo-win-ggg.desc=- 所有武器（含投射物）附魔\n\n- 所有护甲附魔\n\n- 附魔宝石自然生成且较常见\n\n- 可手动附魔远程武器\n\n- 所有物品与怪物随机发光
utils.dungeonseed.rog-uel-ike.desc=- 所有通用天赋变异\n\n- 初始武器替换为降阶随机武器（1/22概率6阶）\n\n- 法师法杖初始类型替换\n\n- 初始暗影斗篷替换为随机神器\n\n- 天狗掉落克罗默王冠（替代面具），英雄随机选择专精\n\n- 唯一可选的护甲能力为全能之力
utils.dungeonseed.ult-ima-tee.desc=- 所有天赋同时激活且满级
utils.dungeonseed.sup-erm-ann.desc=- 所有职业先天增益同时激活\n\n- 不含已鉴定物品或初始装备
utils.dungeonseed.iro-nma-nnn.desc=- 获得专精后所有专精能力同时激活
utils.dungeonseed.asc-end-ant.desc=- 所有天赋同时激活且满级\n\n- 所有职业先天增益同时激活\n\n- 不含已鉴定物品或初始装备\n\n- 获得专精后所有专精能力同时激活
utils.dungeonseed.vba-lan-ced.desc=- 锁定为鼠王角色\n\n- 所有职业先天增益同时激活\n\n- 获得专精后所有专精能力同时激活\n\n- 最大生命从20(+5)降至5(+3)\n\n- 新增破印蓄力格挡机制\n\n- 法师法杖初始类型替换\n\n- 初始暗影斗篷替换为随机神器\n\n- 投射物100耐久不再无敌且无法存入魔法箭袋\n\n- 投射物不再触发乘胜追击\n- 狙击手专精不再破甲\n- 投射物与灵弓无距离命中加成\n- 女猎与疾行者失去投射物加成
utils.dungeonseed.fun-fun-fun.desc=- 生成独特"艾克"盟友（效果依职业）\n- 死亡时触发食物天赋并于下层重生\n\n- 敌人被直接击中33%概率转为盟友\n\n- 开局赠送克罗默\n- 设置最大值为1禁用传送\n\n- 所有敌人为冠军（属性削弱33%）\n\n- 所有武器护甲附魔\n- 附魔宝石自然生成\n- 可手动附魔远程武器\n- 物品与怪物随机发光
rankings$record.chaosstone=获得%d颗混沌石
