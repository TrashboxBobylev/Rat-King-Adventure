actors.hero.talent.emendatio_icatus.title=圣光普惠
actors.hero.talent.recarga_addita.desc=_+1:_ 修道者的圣典每获得一个额外的法术，其负面效果便会减少1点。\n\n_+2:_ 在+1效果基础上，修道者圣典的基础充能时间减少28%。\n\n_+3:_ 在+2效果基础上，若圣典在施法前已完全充能，修道者的法术可额外获得75%的分支等级加成。
actors.hero.talent.petitio_magica.desc=_+1:_ 修道者可施展_秘法祷言_，此法术能让修道者在消耗4点充能后，在_100回合内_获得额外一个未掌握的法术。\n\n_+2:_ 修道者可施展_秘法祷言_，此法术能使其在消耗4点充能后，获得额外一个未掌握的法术，持续_150回合_。\n\n_+3:_ 修道者可施展_秘法祷言_，此法术使其在消耗4点能量后，获得额外一个未掌握的法术，持续_200回合_。\n\n若该法术源自天赋，则该天赋将变为最高等级。
actors.hero.spells.arsretractandi.transmutation_complete=所选层级已转化为一组 %s 专精天赋！
actors.buffs.buff.heromsg=
actors.hero.spells.shieldoflight$divineshield.def_verb=
actors.hero.talent.emendatio_icatus.comment="你再度现身令我欣喜；因借由你，我得以在尚未成形的现实边缘处，随心所欲地直面现实。"
actors.hero.herosubclass.cenobite_desc=修道者超越了对身体强度的追求，不再通过升级获得额外生命值，并掌握多种法术——这些法术能改造其天赋，并根据天赋类型提供不同增益。所有天赋均会获得_相应属性_加成，这些属性有其不同的用途。修道者的法术将根据属性_按比例增强威力_，视同额外天赋等级。部分法术可立即强化，而修道者专属法术需额外强化。新的天赋法术技能会给所有其他天赋法术技能带来增益。修道者还获得_蝶变之术_，该法术可以消耗圣典能量来重塑天赋形态，并增强圣典效力。
actors.hero.spells.messispotentiae.desc=修道者进入强化状态持续 %d 回合，期间每次击杀敌人可获得典籍能量。每次击杀可获得 %.1f典籍能量。
actors.hero.spells.arsretractandi.name_empower=统一视角
actors.hero.spells.spellempower$emendatioiactus.name=圣光普惠
actors.mobs.dm200.name=DM-200
actors.hero.abilities.cleric.trinity.soulofyendor_use=三位一体将提供等同于_英雄最大经验值的%1d%%_的额外经验，不受等级上限后倍率缩放影响，代价为消耗_%2s_点充能。
actors.hero.abilities.cleric.trinity.bookofwonder_use=三位一体将触发该神器的随机卷轴效果，有_%1d/10_的概率提供强化版本，代价为消耗扭曲效果与_%2s_点充能。
