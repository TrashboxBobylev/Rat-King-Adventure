utils.dungeonseed.loo-tgo-bbo.desc=- 给予英雄永久的财富戒指效果，效果随英雄等级成长，但无法获得财富戒指本身\n- 所有非必需物品不再生成\n- 除实验室外，所有特殊房间全部替换为普通房间\n- 怪物生成频率提升至2.5倍\n- 怪物数量提升至2倍\n- BOSS生命值大幅提高，随游戏进度成长\n- 恶魔与深渊生成器的怪物生成频率提升至2倍\n- 深渊怪物的强度成长速度提升至3倍\n- 英雄30级以后，经验等级上限的成长速度大幅放缓
utils.dungeonseed.all-tal-ent.desc=- 英雄全部可用天赋同时生效，并且全部升级至满级。