actors.blobs.blizzard.name=暴风雪
actors.blobs.blizzard.desc=这里刮起了一阵暴风雪。
actors.blobs.confusiongas.name=混乱气体
actors.blobs.confusiongas.desc=这里盘绕着一片致眩气体。
actors.blobs.electricity.name=电流
actors.blobs.electricity.desc=火花在这片电能力场中不断闪烁着。
actors.blobs.electricity.rankings_desc=触电
actors.blobs.electricity.ondeath=你因触电而亡……
actors.blobs.fire.name=火焰
actors.blobs.fire.desc=一团火焰正在这里肆虐。
actors.blobs.godslayerfire.desc=一团赤火烈焰正在这里肆虐。
actors.blobs.frostfire.desc=一团霜火冷焰正在这里肆虐。
actors.blobs.miasma.desc=暗能量的斑点正在这里聚集。不要触碰瘴气，它会给其中的每个目标带来负面影响。
actors.blobs.foliage.name=树叶
actors.blobs.foliage.desc=光柱刺破了地下花园中的黑暗。
actors.blobs.freezing.name=冻结空气
actors.blobs.freezing.desc=这里的空气寒冷刺骨，很不寻常。
actors.blobs.goowarn.name=黑暗能量
actors.blobs.goowarn.desc=黑暗能量正在这里涌动！
actors.blobs.gravery.desc=空气中弥漫着灰烬与绝望。
actors.blobs.gravery.ondeath=你变成了幽灵...
actors.blobs.gravery.rankings_desc=向死亡献祭了自己
actors.blobs.inferno.name=地狱火
actors.blobs.inferno.desc=此处已成为燃烧着烈焰的人间地狱。
actors.blobs.paralyticgas.name=麻痹气体
actors.blobs.paralyticgas.desc=这里盘绕着一片麻痹气体。
actors.blobs.regrowth.name=再生
actors.blobs.sacrificialfire.name=献祭之火
actors.blobs.sacrificialfire.desc=那是一个祭坛，承载着祭祀之火。在此被杀死的生物的灵魂会化作地牢的祭品。\n\n只要献祭够多，或许能得到回报？
actors.blobs.sacrificialfire.worthy=火焰吞噬了你的祭品，烧得愈发旺盛起来。
actors.blobs.sacrificialfire.unworthy=火焰吞噬了你的祭品，然而没有任何变化。
actors.blobs.sacrificialfire.reward=火焰喷薄而起，随后消散于空气，最终留下了一份奖励！
actors.blobs.smokescreen.name=浓烟
actors.blobs.smokescreen.desc=这里盘绕着一片乌黑的浓烟。
actors.blobs.stenchgas.name=恶臭气体
actors.blobs.stenchgas.desc=这里盘绕着一片腐烂的臭气。
actors.blobs.stormcloud.name=风暴云
actors.blobs.stormcloud.desc=这里盘绕着一片翻腾的水汽。
actors.blobs.toxicgas.name=毒气
actors.blobs.toxicgas.desc=这里盘绕着一片发绿的毒气。
actors.blobs.toxicgas.rankings_desc=窒息而死
actors.blobs.toxicgas.ondeath=你被毒气毒死了…
actors.blobs.corrosivegas.name=腐蚀气体
actors.blobs.corrosivegas.desc=这里盘绕着一片致命的侵蚀性酸雾。
actors.blobs.waterofawareness.name=觉查之水
actors.blobs.waterofawareness.procced=在你小酌一口时，你感觉到知识涌入了你的头脑。
actors.blobs.waterofawareness.desc=知识的力量正在从这口井的水里涌出。饮下井中的水以揭示所有已装备物品以及本层所有物品的秘密。
actors.blobs.waterofhealth.name=生命之水
actors.blobs.waterofhealth.procced=就在你小酌一口时，你感到你的伤口完全愈合了。
actors.blobs.waterofhealth.desc=生命的力量正在从这口井的水里涌出。\n饮下井中的水以治疗你的伤口并填满你的肚子。
actors.blobs.web.name=蜘蛛网
actors.blobs.web.desc=这里所有东西都被厚厚的蜘蛛网覆盖着。任何接触或丢向蛛网的东西都会打破它，但也都会被固定在原地。
actors.buffs.adrenaline.name=激素涌动
actors.buffs.adrenaline.desc=由肾上腺素带来的纯粹的潜能爆发，激素涌动能够增强一名角色的移动和攻击速度。\n\n激素涌动允许角色拥有2倍的移动速度和1.5倍的攻击速度。\n\n持续时间：%s 回合。
actors.buffs.adrenalinesurge.name=力量激发
actors.buffs.adrenalinesurge.desc=一股强大的力量，不过很可惜不是永久的。\n\n力量加成：+%d。\n距离效果衰减还有：%s回合。
actors.buffs.amok.name=狂乱
actors.buffs.amok.desc=狂乱导致状态下的生物进入一种极度愤怒和混乱的状态。 \n\n狂乱的生物会不分敌我地攻击任何靠近它们的人。\n\n剩余的狂乱效果时长：%s回合
actors.buffs.arcanearmor.name=秘法护盾
actors.buffs.arcanearmor.desc=一层淡薄的护盾环绕着你，可为你抵挡一定的魔法伤害。\n\n当前你的魔法护甲值为: 0~%d。\n\n秘法护盾会在 %s 回合后自我衰减。
actors.buffs.artifactrecharge.name=神器充能
actors.buffs.artifactrecharge.desc=魔力在你体内奔腾而过，提高你手中神器的充能速率。 \n\n每件神器受到的影响都不尽相同，但它们的充能速率都会大幅提升。\n\n剩余的神器充能效果时长：%s回合
actors.buffs.ascensionchallenge.name=护符诡咒
actors.buffs.ascensionchallenge.desc=不知为何Yog-Dzewa仍能借护身符维系自己对这个世界的影响，他正借此设法阻止你向上返程！\n\n古神运用他的力量使你的敌人变得更为众多、强大，整座地牢因此变得更危险了！所幸你可以通过击败古神所加强过的敌人来削弱他的力量，若是置之不理则会使古神之力愈发强大。
actors.buffs.ascensionchallenge.desc_clear=护身符中残余的黑暗能量现今已被最大程度的削弱了。
actors.buffs.ascensionchallenge.desc_beckon=护身符正在_呼唤远处的敌人_，向它们通告你的位置。
actors.buffs.ascensionchallenge.desc_haste=护身符正_为远处的敌人加速_，令它们得以更快接近你！
actors.buffs.ascensionchallenge.desc_slow=护身符正_使你减速_，并阻止了一切加速效果！
actors.buffs.ascensionchallenge.desc_damage=护身符中涌动的黑暗能量已极为强大，它正在_直接对你造成伤害_！
actors.buffs.ascensionchallenge.beckon=护身符开始呼唤远处的敌人前来。
actors.buffs.ascensionchallenge.haste=护身符开始为周遭的敌人提升移速！
actors.buffs.ascensionchallenge.slow=你背包中的护身符此刻恍如重逾千钧！
actors.buffs.ascensionchallenge.damage=护身符开始释放黑暗能量。它烧着了！
actors.buffs.ascensionchallenge.weaken_info=你必须通过击杀敌人来削弱护符诡咒！
actors.buffs.ascensionchallenge.weaken=你能感受到护身符上的诅咒正缓慢地消退。
actors.buffs.ascensionchallenge.break=你花上一点时间调整好了自己的呼吸，感受到获得的伤口重新开始愈合！
actors.buffs.ascensionchallenge.almost=你能感觉到古神对护身符的掌控愈发微弱了起来，胜利的曙光已然在你面前！
actors.buffs.ascensionchallenge.on_kill=黑暗能量最终吞噬了你……
actors.buffs.barkskin.name=树肤
actors.buffs.barkskin.desc=你的皮肤硬化了，摸起来如同树皮一样既粗糙且坚固。 \n\n硬化的皮肤增强了你的实际护甲，使你能更好地抵御物理攻击。这种额外的护甲数值会以每回合1点的速度降低，直到它彻底失去作用。\n\n当前增加的护甲值：%d。\n距离效果衰减还有：%s回合。
actors.buffs.barrier.name=奥术屏障
actors.buffs.barrier.desc=一团可以抵挡全部伤害的能量屏障。\n\n只要奥术屏障的能量仍然存在，它将完全抵挡单位所受到的任何伤害。同时这种能量会随时间逐渐衰减。\n\n护盾能量剩余：%d。
actors.buffs.berserk.angered=愤怒
actors.buffs.berserk.berserk=狂暴
actors.buffs.berserk.exhausted=力竭
actors.buffs.berserk.recovering=恢复
actors.buffs.berserk.angered_desc=%1$s所受的伤势程度会增强他的攻击力。%1$s受到物理伤害时会积攒怒气，赋予他更强的攻击力。被护甲抵挡的伤害也会积攒怒气。\n\n怒气会随时间而减淡。%1$s生命值越低，怒气存留的时间越长。\n\n积满怒气可以进入狂暴，获得双倍纹章护盾，若血量极低则增长到六倍。护盾会随时间衰减，消失之后%1$s需要休息才能再次积攒怒气。
actors.buffs.berserk.current_rage=当前怒气：_%.0f%%_\n_+%.0f%%_ 攻击
actors.buffs.berserk.berserk_desc=在濒死之际，恐惧和不安已经烟消云散，留存下来的只剩怒火。这种濒死情况下的%1$s会变得无比强大，造成%2$sx的伤害，获得额外的护盾值，并且无法死亡。_\n\n额外护盾为双倍纹章护盾，若血量极低则增长到六倍。当这一护盾衰减为0，狂暴将结束。\n\n在狂暴结束后，%1$s需要休息才能再次积攒怒气。
actors.buffs.berserk.recovering_desc=内在力量是有限的。%s必须充分休息才能再次释放他的狂暴。\n\n正在恢复的%s不能积攒怒气。\n\n在恢复中%s
actors.buffs.berserk.recovering_penalty_default=%s无法从受伤中得到任何怒气。
actors.buffs.berserk.recovering_desc_turns=恢复所需回合数: _%d_
actors.buffs.berserk.recovering_desc_levels=恢复所需等级数: _%.2f_
actors.buffs.berserk.recovering_penalty_berserk=%s获得怒气的能力受到限制，他无法_拒绝死亡_直到完全恢复。
actors.buffs.berserk.no_rages=濒死时的狂暴会造成永久性的创伤，每次都会降低他的生命上限。
actors.buffs.berserk.past_rages=狂战士狂暴次数：_%d_\n生命上限降至：_%d%%_
actors.buffs.berserk.rankings_desc=暴走至死
actors.buffs.berserk.action_name=狂暴
actors.buffs.berserk.no_seal=你需要你的破损印章才能狂暴！
actors.buffs.bleeding.name=流血
actors.buffs.bleeding.ondeath=你因失血过多而死……
actors.buffs.bleeding.heromsg=你正在流血！
actors.buffs.bleeding.rankings_desc=流血致死
actors.buffs.bleeding.desc=伤口正在令人不安地涌出大量血液。 \n\n流血每回合都会造成伤害。每回合这个伤害数值都会随机减少，直到出血最终停止。 \n\n当前流血伤害：%d
actors.buffs.bless.name=赐福
actors.buffs.bless.desc=你的集中力正在喷薄而出，有人说这是神赐的礼物。 \n\n赐福状态能够提高自己25%%的精准与闪避属性，使被赐福者在战斗中势如破竹。 \n\n剩余赐福效果时长：%s回合
actors.buffs.blindness.name=失明
actors.buffs.blindness.heromsg=你失明了！
actors.buffs.blindness.desc=失明使周遭的一切陷入黑暗。 \n\n失明时，角色不能看到周身一格以外的环境、致使远程攻击变得毫无作用、同时也很容易丢失正在追踪的敌人的动向。此外，失明的英雄也无法读书或使用卷轴。 \n\n剩余的失明效果时长：%s回合
actors.buffs.burning.name=燃烧
actors.buffs.brawlerbuff.name=临时力量
actors.buffs.brawlerbuff.action_name=特殊攻击
actors.buffs.brawlerbuff.desc=通过充能，街霸可以集中他的身体力量来增强他下一次攻击的伤害或打出特殊攻击。每次特殊攻击消耗10点充能。\n\n当前充能：_%s_\n\n伤害增益：_%s%%_
actors.buffs.burning.heromsg=你着火了！
actors.buffs.burning.burnsup=%s被烧毁了！
actors.buffs.burning.ondeath=你被燃烧至死…
actors.buffs.burning.rankings_desc=燃烧殆尽
actors.buffs.burning.desc=没什么比被火焰吞没更痛苦了。 \n\n火焰会每回合都会造成伤害直到它被液体扑灭或者自行消散。火会在你进入水中时熄灭，打碎药瓶产生的水花也具有同样的效果。 \n\n此外，火焰还会点燃所有接触到的可燃地形（以及可燃地形上的可燃物）。 \n\n剩余的燃烧效果时长：%s回合
actors.buffs.godslayerburning.name=剧烈燃烧
actors.buffs.godslayerburning.heromsg=你成了火人！
actors.buffs.godslayerburning.burnsup=%s被烧毁了！
actors.buffs.godslayerburning.ondeath=你被燃烧至渣…
actors.buffs.godslayerburning.rankings_desc=被烈火燃烧殆尽
actors.buffs.godslayerburning.desc=我希望你至少能活一分钟……\n\n这种变异的火对任何不能免疫常规火焰的生物来说都更危险三倍。它不能以任何方式熄灭，但英雄对它有抵抗力。\n\n剩余燃烧回合：%s
actors.buffs.championenemy.warn=你感受到了强敌的气场。
actors.buffs.championenemy$blazing.name=烈焰精英
actors.buffs.championenemy$blazing.desc=烈焰精英造成 25% 额外近战伤害，会点燃攻击目标，免疫火焰，且会在死亡时引燃周遭。
actors.buffs.championenemy$blazing.desc_rk=剑会燃烧，但我不会！
actors.buffs.championenemy$projecting.name=索敌精英
actors.buffs.championenemy$projecting.desc=索敌精英拥有 25% 额外近战伤害，且能攻击到他们看得见的任何目标。
actors.buffs.championenemy$projecting.desc_rk=我有额外2格近战攻击距离，且我的投掷武器可以穿墙！
actors.buffs.championenemy$antimagic.name=敌法精英
actors.buffs.championenemy$antimagic.desc=敌法精英拥有 25% 的伤害减免，且完全免疫所有魔法效果。
actors.buffs.championenemy$antimagic.desc_rk=魔法只能对我造成一半的伤害！
actors.buffs.championenemy$giant.name=巨型精英
actors.buffs.championenemy$giant.desc=巨型精英拥有 75% 的伤害减免与额外的一格近战攻击距离，但无法进入狭窄的空间。
actors.buffs.championenemy$giant.desc_rk=我进门困难，但拥有 50% 的伤害减免与额外的一格近战攻击距离！
actors.buffs.championenemy$blessed.name=天佑精英
actors.buffs.championenemy$blessed.desc=天佑精英拥有 200% 额外精准与躲避。
actors.buffs.championenemy$blessed.desc_rk=我的精准和闪避超乎常人！
actors.buffs.championenemy$stone.name=磐石精英
actors.buffs.championenemy$stone.desc=磐石精英血量越低伤害减免越高，最高可以拥有90% 的伤害减免。
actors.buffs.championenemy$splintering.name=分裂精英
actors.buffs.championenemy$splintering.desc=分裂精英在受到任何伤害时复制自己。
actors.buffs.championenemy$splintering.desc_rk=伤害将招致鼠群！
actors.buffs.championenemy$cursed.name=诅咒精英
actors.buffs.championenemy$cursed.desc=诅咒精英在近战攻击时施放诅咒魔杖效果。
actors.buffs.championenemy$cursed.desc_rk=诅咒的魔法正适合对付我的仇敌！
actors.buffs.championenemy$flowing.name=涌流精英
actors.buffs.championenemy$flowing.desc=涌流精英穿越水面单元格不耗费回合。
actors.buffs.championenemy$voodoo.name=巫毒精英
actors.buffs.championenemy$voodoo.desc=巫毒精英受到25%额外伤害，死亡时变成当前区域的另一种怪物。
actors.buffs.championenemy$explosive.name=爆破精英
actors.buffs.championenemy$explosive.desc=爆破精英在死亡时会剧烈爆炸。
actors.buffs.championenemy$growing.name=成长精英
actors.buffs.championenemy$growing.desc=成长精英拥有会稳步增长的额外精准、躲避、近战伤害与伤害减免。\n\n当前精准、躲避、近战伤害加成：%1$d%%\n当前伤害减免：%2$d%%
actors.buffs.championenemy$swiftness.name=迅捷精英
actors.buffs.championenemy$swiftness.desc=迅捷精英小巧而敏捷。
actors.buffs.championenemy$reflective.name=反射精英
actors.buffs.championenemy$reflective.desc=反射精英将50%的物理伤害回敬给攻击者。
actors.buffs.championenemy$paladin.name=圣骑精英
actors.buffs.championenemy$paladin.desc=圣骑精英不会攻击或移动，但拥有 75% 的伤害减免和更广阔的视野，并保护视野内的任何角色免受伤害和状态影响。
actors.buffs.championenemy$paladin.desc_rk=朕安坐中军，将士自去破敌！
actors.buffs.charm.name=魅惑
actors.buffs.charm.heromsg=你被魅惑了！
actors.buffs.charm.cant_attack=你被该敌人魅惑，无法攻击他们。
actors.buffs.charm.desc=魅惑是一种能让一对夙敌暂时陷入互相倾慕的控制类魔法。\n\n被魅惑的单位将无法对魅惑施行者进行直接攻击，但依然可以攻击其他敌人。伤痛会激醒被魅惑单位，减少魅惑状态的持续时间。\n\n魅惑剩余持续时间：%s回合。
actors.buffs.chill.name=冻伤
actors.buffs.chill.freezes=%s冻住了！
actors.buffs.chill.desc=还没有完全冻住，不过已经非常冷了。\n\n冻伤的目标所有行动都会更加缓慢，减速程度取决于剩余的冻伤效果时间。最严重的冻伤情况等同于迟缓效果。\n\n剩余的冻伤效果时长：%1$s回合\n当前减少的速度：%2$s%%
actors.buffs.combo.name=连击
actors.buffs.combo.action_name=连击
actors.buffs.combo.combo=%d连击！
actors.buffs.combo.bad_target=你的目标必须是攻击距离以内的敌人。
actors.buffs.combo.prompt=选择一个目标以攻击
actors.buffs.combo.desc=%s在连续打击对手的过程中渐入佳境，每次攻击命中都会提高一层_连击数，_但长时间不进行攻击会将连击数归零。\n\n积攒连击数可以激活必定命中的_处决技能_！连击数到达2，4，6，8，10时会分别激活不同的技能。部分处决技能会重置你的连击数，但每种处决技能在一次连击中只能使用一次。\n\n当前的连击数：%1$d。\n\n连击将在%2$s回合后丢失。
actors.buffs.combo$combomove.clobber.name=冲击
actors.buffs.combo$combomove.clobber.desc=将敌人击退2个格子，但不造成伤害，也不能击入陷阱。每使用一次连击加1。
actors.buffs.combo$combomove.clobber.empower_desc=将敌人击退 _3格_，造成眩晕，并能击入坑中，但不造成伤害。连击数增加1。
actors.buffs.combo$combomove.slam.name=冲击
actors.buffs.combo$combomove.slam.desc=根据你的伤害格挡能力的%d%% (连击*20%%) 作为额外伤害。使用后重置连击数。
actors.buffs.combo$combomove.slam.empower_desc=_跳跃至多 %1$d 格_，并造成相当于你格挡伤害力 %2$d%% (连击数*20%%) 的额外伤害。使用时重置连击数。
actors.buffs.combo$combomove.parry.name=格挡
actors.buffs.combo$combomove.parry.desc=激活后，在1回合内格挡下一次攻击，并立即进行反击。如果没有格挡任何攻击，则重置连击。
actors.buffs.combo$combomove.parry.empower_desc=激活时在1回合内_格挡所有攻击_，并立即进行反击。如果未格挡任何攻击则重置连击数。
actors.buffs.combo$combomove.crush.name=横扫
actors.buffs.combo$combomove.crush.desc=对主要目标造成你近战伤害的%d%% (连击*25%%)，并对7x7范围内的所有其他敌人造成一半伤害。使用后重置连击数。
actors.buffs.combo$combomove.crush.empower_desc=_跳跃至多 %1$d 格_，对主要目标造成 %2$d%% (连击数*25%%) 伤害，并对7x7范围内的所有其他敌人造成一半伤害。使用时重置连击数。
actors.buffs.combo$combomove.fury.name=暴雨
actors.buffs.combo$combomove.fury.desc=每次攻击一个敌人，每次攻击造成60%的伤害，并可以触发附魔效果。使用后重置连击数。
actors.buffs.combo$combomove.fury.empower_desc=_跳跃至多 %d 格_，并根据你的连击数对敌人进行多次攻击，每次攻击造成60%%伤害并可能触发附魔效果。使用时重置连击数。
actors.buffs.corruption.name=腐化
actors.buffs.corruption.desc=腐化魔法会侵入生物体的生命本质，扭转他们原有的天性。\n\n被腐化的生物会攻击他们的盟友，还会忽视其原先的敌人。腐化效果同时也是有伤害性的，会导致其目标缓慢走向死亡。\n\n腐化是永久性的，死后才能解脱。
actors.buffs.cripple.name=残废
actors.buffs.cripple.heromsg=你残废了！
actors.buffs.cripple.desc=你很确定自己的腿不该折成那样。 \n\n残废会减半移动速度，移动一格会消耗二回合而不是正常情况下的一回合。 \n\n剩余的残废效果时长：%s回合
actors.buffs.daze.name=眩晕
actors.buffs.daze.heromsg=你被眩晕了！
actors.buffs.daze.desc=头晕目眩使得战斗变得困难。\n\n在眩晕状态下，命中率和闪避率减少50%%，使得命中和躲避攻击都变得更加困难。\n\n剩余眩晕回合数: %s.
actors.buffs.powerfuldegrade.name=强力降级
actors.buffs.powerfuldegrade.desc=这个更强大的降级魔法将使所有物品（包括神器）的升级无效。\n\n降级剩余回合：%s。
actors.buffs.degrade.name=降级
actors.buffs.degrade.heromsg=你的装备被暂时弱化了！
actors.buffs.degrade.desc=强大的黑暗魔法正在吞噬升级卷轴注入你装备的魔力！\n\n降级状态下的装备会被视作比起原有等级更低的状态。_超过3级的每次升级都会遭受愈加严重的反噬。_物品的描述也会根据降级的影响而改变。\n\n不过，降级不会影响装备的力量需求，法杖充能，投武耐久以及神器。\n\n降级的剩余持续时间：%s回合。使用一张升级卷轴或驱邪卷轴可以立即驱散这种黑暗魔法。
actors.buffs.doom.name=定命
actors.buffs.doom.desc=当整个宇宙都看起来想置你于死地时，继续斗争还有什么意义呢？\n\n被定命的角色所接受的任何伤害都会增加67%。\n\n定命是永久性的，死后才能解脱。
actors.buffs.dread.name=魂飞魄散
actors.buffs.dread.desc=目标正在极度的恐慌下尝试逃出这座地牢！\n\n魂飞魄散的生物将快速逃离它们的敌人，并且会在脱离敌人视野后立即消失在整座地牢中。逃离的敌人不会掉落道具，也不会给予玩家经验值奖励。伤害所造成的痛楚将促使其镇定下来。\n\n逃命中，剩余时长：%d 回合。
actors.buffs.drowsy.name=催眠
actors.buffs.drowsy.desc=一股魔法力量使目标很难保持清醒。 \n\n英雄可以通过受到伤害或保持完整生命值来维持清醒。\n\n %s回合之后，目标将会陷入魔法睡眠。
actors.buffs.earthimbue.name=大地之力
actors.buffs.earthimbue.desc=你被灌注了大地的力量！\n\n直到该效果结束前，你所有的物理攻击都会使敌人被缠绕在原地无法动弹一段时间。\n\n大地之力还能持续%s回合。
actors.buffs.enhancedrings.name=戒指强化
actors.buffs.enhancedrings.desc=%s在使用神器时会强化装备中的戒指，在%d回合内使其获得+1升级。
actors.buffs.fireimbue.name=火焰之力
actors.buffs.fireimbue.desc=你被灌注了火焰的力量！\n\n所有物理攻击都有机会使敌人燃烧。与此同时你对火焰完全免疫。\n\n剩余火焰之力效果时长：%s回合
actors.buffs.flavourbuff.turns=剩余回合数：%s
actors.buffs.foresight.name=危险预知
actors.buffs.foresight.desc=你的感知力大幅度提升，允许你立刻发现你周围隐藏的事物。\n\n在危险预知的持续时间内，你的感知范围增加，并能立刻发现你感知范围内的隐藏事物。\n\n危险预知持续时间：%s。
actors.buffs.frost.name=冰冻
actors.buffs.frost.freezes=%s冻住了！
actors.buffs.frost.desc=不要认为被冻得很结实了，这种温和的冻结只是把目标包裹在冰里。 \n\n冻结效果类似于麻痹，使目标不能行动。与麻痹不同的是，冻结效果会在目标受到伤害时立即消失，因为冰会碎。\n\n剩余的冻结效果时长：%s回合
actors.buffs.frostburn.name=霜火燃烧
actors.buffs.frostburn.heromsg=你被霜火点燃了！
actors.buffs.frostburn.burnsup=%s 被霜火烧毁了！
actors.buffs.frostburn.ondeath=你在凛冬般的极寒中被烧死了……
actors.buffs.frostburn.rankings_desc=烧至干冰
actors.buffs.frostburn.desc=霜火的伤害可能不如普通火焰，但它会猛烈燃烧并冻结你的双手。\n\n霜火每回合都会造成伤害，直到它熄灭。这种类型的火只能通过摔碎某种药剂的溅射来扑灭。\n\n另外，霜火可能会点燃与其接触的易燃地形或物品。\n\n剩余霜火回合：%1$s。\n速度减少：%2$s%%
actors.buffs.frostimbue.name=晶触之力
actors.buffs.frostimbue.desc=你被灌注了寒霜的力量！\n\n所有形式的物理攻击都会在敌人身上累加冻伤效果。与此同时你对冻伤完全免疫。\n\n剩余晶触之力效果时长：%s回合
actors.buffs.fury.name=愤怒
actors.buffs.fury.heromsg=你陷入了暴怒之中！
actors.buffs.fury.desc=你非常暴怒，很明显敌人并不喜欢这样的你。\n\n一股猛烈的怒火在你体内燃烧，增加你50%的物理攻击伤害。\n\n只要你的生命还低于上限的50%，该效果就会存在。
actors.buffs.blobimmunity.name=净化屏障
actors.buffs.blobimmunity.desc=一种奇怪的能量环绕在你的周围，为你阻挡有害的环境效果。\n\n在净化屏障的持续时间内，你将免疫所有负面环境效果。\n\n剩余的免疫效果时长：%s回合。
actors.buffs.greaterhaste.name=极速
actors.buffs.greaterhaste.desc=一股惊人的速度提升，刹那间仿佛万物静止。\n\n在极速效果下，移动动作不消耗时间，但其他动作仍以正常速度执行。每移动一步消耗一回合的极速效果。\n\n剩余极速回合数：%d。
actors.buffs.haste.name=极速
actors.buffs.haste.desc=强大的能量灌入到你的双腿肌肉上，允许你以不可思议的速度移动！\n\n当你拥有极速状态时你将拥有3倍的移动速度，但是其他行动速度仍然和原来一样。\n\n极速持续时间：%s 回合。
actors.buffs.healing.name=治疗
actors.buffs.healing.desc=一股治愈魔力让你的伤口开始愈合。\n\n你的生命将逐回合稳定回复，直到治疗效果终止。治疗量将随着时间逐渐减少。\n\n下一回合治疗量：%d\n\n剩余治疗量：%d。
actors.buffs.herodisguise.name=伪装
actors.buffs.herodisguise.desc=幻象魔法改变了你的外表！效果仅是外观上的，但无论如何感觉都很奇怪。\n\n剩余伪装回合数：%s。
actors.buffs.hex.name=幻惑
actors.buffs.hex.heromsg=你的精神受到了魔法的干扰！
actors.buffs.hex.desc=干扰集中力的黑暗魔法，使目标无法准确地判断方位。\n\n幻惑状态会降低目标20%%的精准与闪避属性，使其在战斗中更容易处于下风。\n\n幻惑的剩余时长：%s回合。
actors.buffs.highnessbuff.name=高度充能
actors.buffs.highnessbuff.recovering=低潮恢复中
actors.buffs.highnessbuff.energized_desc=你的思想...和身体正溢出着收集来的杂草之力！\n\n充能状态下，尊者异常强大，以1.5倍速移动，武器射程增加2格，闪避和精准+50%%，物理伤害+33%%，承受伤害-33%%，并能快速充能神器、魔杖和恢复生命值。\n\n然而，这种力量并非没有代价：尊者必须每 _%d回合_ 消耗一份杂草来维持充能状态。一旦她耗尽杂草或手动取消充能，她将开始恢复；恢复时长取决于消耗的杂草量。
actors.buffs.highnessbuff.recovering_desc=杂草过后的清明终于到来！\n\n恢复状态下，尊者无法使用杂草进行充能。\n恢复时长取决于充能状态下消耗的杂草总量，在消耗三份杂草后恢复时长会急剧增加。\n\n剩余回合数：%s。
actors.buffs.highnessbuff.action_name=开始充能
actors.buffs.highnessbuff.stop_action_name=停止充能
actors.buffs.hpdebuff.name=健康恶化
actors.buffs.hpdebuff.desc=异界魔法会降低你的防御力。\n\n当这个减益激活时，你的最大生命值会减少_%d_，只要你的最大生命值高于1，这会随着你受到的伤害增加而叠加。\n\n剩余回合数：%s .
actors.buffs.holdfast.name=不动如山
actors.buffs.holdfast.desc=战士原地不动时会进入坚守状态，提升他的护甲%2$d-%3$d点，持续到他移动为止。
actors.buffs.holyflames.name=圣焰
actors.buffs.holyflames.heromsg=你被判处燃烧！
actors.buffs.holyflames.ondeath=你烧成了罪恶的灰烬...
actors.buffs.holyflames.rankings_desc=被圣焰化为灰烬
actors.buffs.holyflames.desc=你的罪孽终于被神圣力量所察觉...并以火焰的形式偿还。\n\n圣焰会造成伤害，且每回合伤害递增，并在其失效前移除所有正面效果。此外，它对亡灵和恶魔造成额外伤害。\n\n幸运的是，已知这种火焰不会与无生命物体（如杂草或卷轴）发生作用。\n\n剩余圣焰回合数：%s。
actors.buffs.hunger.hungry=饥饿
actors.buffs.hunger.starving=极度饥饿
actors.buffs.hunger.onhungry=你有点饿了。
actors.buffs.hunger.onstarving=你已经饥肠辘辘！
actors.buffs.hunger.ondeath=你活活饿死了……
actors.buffs.hunger.cursedhorn=就在你吃东西的时候被诅咒的号角偷走了一部分食物的能量。
actors.buffs.hunger.rankings_desc=饥饿致死
actors.buffs.hunger.desc_intro_hungry=你能感受到自己的肚子在不断寻求食物，不过还不算那么严重。
actors.buffs.hunger.desc_intro_starving=你的饥饿程度已经危及生命了。
actors.buffs.hunger.desc=\n\n饥饿会在你在地牢里花费时间的同时缓慢累计，直到你饿得难以忍受。在你极度饥饿时生命值会停止回复并且开始缓慢减少 。\n\n合理利用食物非常重要！如果你有足够的生命值来维持饥饿，你就该等到一会儿食物更多的时候再吃。正确的配给可以让食物更有效地发挥作用！
actors.buffs.invisibility.name=隐形
actors.buffs.invisibility.desc=你和周围的地形完全融为一体，使你不可能被看到。 \n\n当你在隐形时敌人无法追踪或攻击你。大部分物理攻击和魔法(比如卷轴和法杖)会立即解除隐形效果。 \n\n剩余的隐形效果时长：%s回合
actors.buffs.invulnerability.name=无敌
actors.buffs.invulnerability.desc=此角色充盈着强大的保护力量，赋予他们短暂的无敌时间！\n\n剩余回合数：%s。
actors.buffs.levitation.name=漂浮
actors.buffs.levitation.desc=一股魔力把你从地面托起，让你觉得自己身轻如燕。 \n\n在漂浮时你会无视所有以地面为基础的效果。陷阱不会被触发、火焰不会被水扑灭、植物不会被踩踏、根系无法缠绕你、并且能够跨越深渊。当心，在效果结束的那一刻上述效果都会失效！\n\n剩余的漂浮效果时长：%s回合
actors.buffs.lifelink.name=生命联结
actors.buffs.lifelink.desc=这个角色的生命力与另一位紧密相连，它们将共同分担所有受到的伤害。\n\n当它受到伤害时，半数的伤害将由另一方承担。\n\n系命效果将在%s回合后或是另一方阵亡时消失。
actors.buffs.light.name=发光
actors.buffs.light.desc=即使是在最黑暗的地牢中，身边有一个稳定的光源也总是令人欣慰。 \n\n光照能驱散黑暗，使你能够无视周遭的黑暗环境并拥有一个合理的视野范围。 \n\n剩余的发光效果时长：%s回合
actors.buffs.lockedfloor.name=背水一战
actors.buffs.lockedfloor.desc=当前楼层被彻底封锁，你无法离开这里！\n\n封锁持续期间，你不会更加饥饿，或因极度饥饿减少生命值。此外，如果你没有在与Boss战斗，所有的被动回复都会停止。\n\n另外，如果你在楼层封锁时被未祝福的重生十字架复活了，本层将被完全重置。\n\n击杀本层Boss以解除封锁。
actors.buffs.lostinventory.name=遗物
actors.buffs.lostinventory.desc=你的包裹已经丢失在地牢的某个地方了！您将无法拾取或使用大部分物品，直到你找到这玩意。
actors.buffs.magicalsight.name=魔能透视
actors.buffs.magicalsight.desc=不知为何你感觉你可以不用眼睛看到周围发生的一切。\n\n当处于魔能透视下，所有可能阻挡视野的东西都不再会阻挡你的视线。\n\n魔能透视持续时间：%s回合。
actors.buffs.magicalsleep.name=魔法睡眠
actors.buffs.magicalsleep.toohealthy=你十分健康，因此抵抗住了强烈的嗜睡感。
actors.buffs.magicalsleep.fallasleep=你深深地陷入了魔法睡眠。
actors.buffs.magicalsleep.wakeup=你醒来后，感觉浑身清爽并且十分健康。
actors.buffs.magicalsleep.desc=目标已深深陷入了魔法睡眠，不会自然醒来。\n\n魔法睡眠与一般的睡眠基本一样，但只有受伤会致使目标醒来。\n\n对于英雄，魔法睡眠有一些恢复性的效果，使他们能够在睡眠中迅速愈合伤口。
actors.buffs.magicimmune.name=魔法免疫
actors.buffs.magicimmune.desc=任何魔法都奈何不了你，你对魔法完全免疫。\n\n在魔法免疫状态下，所有魔法效果无论益害都无法影响你，包括但不限于诅咒、附魔、刻印、法杖、卷轴等。\n\n剩余魔法免疫时长：%s回合。
actors.buffs.mindvision.name=灵视
actors.buffs.mindvision.desc=你可以在脑海中以某种方式看到这一层的所有生物。这种感觉非常奇异。\n\n只要灵视效果依然存在，这层的所有生物都会在你的视野当中。通过灵视看到的生物同样算作视野中的目标，可以被很多魔法效果影响。\n\n剩余的灵视效果时长：%s回合
actors.buffs.warriorparry.name=格挡充能
actors.buffs.warriorparry.action_name=格挡
actors.buffs.warriorparry.desc=作为一名战士，战斗的魔法增强了你的防御能力。\n\n你只需要1点充能来格挡一次攻击；任何攻击都可以被格挡，包括魔法攻击，成功格挡将根据被格挡攻击的伤害给予你一定量的护盾。\n\n当前充能: _%1$s/%2$d_。这个充能取决于充能速率和破损印章的最大护盾值。
actors.buffs.warriorparry$blocktrock.name=凝神格挡
actors.buffs.warriorparry$blocktrock.desc=只要这个效果持续，下一次攻击将被格挡。\n\n但是朝任何方向移动都会使这个效果消失，哦哦哦...
actors.buffs.momentum.momentum=动量积蓄
actors.buffs.momentum.running=逸动
actors.buffs.momentum.resting=恢复
actors.buffs.momentum.action_name=逸动
actors.buffs.momentum.momentum_desc=移动的时候，%1$s会逐渐积蓄动量。%1$s可以消耗动量以开启逸动状态。\n\n每一点动量可以支持两个回合的逸动，最多可以储存10点动量。当%1$s停止移动时动量会快速消散。\n\n现有的动量：%2$d。
actors.buffs.momentum.running_desc=移动的时候，%1$s会逐渐积蓄动量。%1$s可以消耗动能以开启逸动状态。\n\n处于逸动状态时，%1$s能够以%3$dx速移动，并且基于自身等级获得额外的闪避属性。\n\n效果剩余回合数：%2$d。
actors.buffs.momentum.resting_desc=移动的时候，%1$s会逐渐积蓄动量。%1$s可以消耗动量以开启逸动状态。\n\n%1$s现在需要休息一会恢复体力才能重新积蓄动量。\n\n还需要休息%2$d回合。
actors.buffs.nodeath.name=不要死
actors.buffs.nodeath.desc=只要这种[饮料]在[满足你的饥渴]，你就不能[停止和中止]，但你必须[支付]一些[债务]！\n\n时间[在你的口袋]：%s。
actors.buffs.scam.name=骗局
actors.buffs.scam.desc=有了我的[仁慈]，每个店主都会把你当做[反复出现的浣熊]来看待，并在他们的商店里为你的[利益]增加赌注！\n\n时间[出售]: %s。
actors.buffs.monkenergy.name=能量
actors.buffs.monkenergy.action=武僧技能
actors.buffs.monkenergy.desc=当她击败敌人时，武僧会获得能量，她可以用来施展各种技能。大多数敌人在被击败时会授予1点能量，武僧不会随时间流逝而失去能量。\n\n当前能量: %1$d/%2$d。
actors.buffs.monkenergy.desc_chasm=_在虚空桥梁的楼层上，_ 武僧的远程武器将根据周围有多少深渊而增强，她的_登云_会在轨迹上释放伪装浓烟。
actors.buffs.monkenergy.desc_water=_在水域充满的楼层上，_ 武僧在水中时将获得护盾，她的_冥思_会喷射水柱，并将敌人击退。
actors.buffs.monkenergy.desc_grass=_在植被茂盛的楼层上，_ 武僧将在完全践踏之前耕耘，并且她的_凝神_在成功格挡时会恢复高草。
actors.buffs.monkenergy.desc_dark=_在非常黑暗的楼层上，_ 武僧可以使用火把创造十字形的危险红色火焰，她的_空振_会进行额外攻击。
actors.buffs.monkenergy.desc_large=_在巨大而宽阔的楼层上，_ 武僧将从击败敌人中获得少量金钱，她的_盘龙_将造成双倍击退
actors.buffs.monkenergy.desc_traps=_在布满陷阱的楼层上，_ 武僧可以从击败敌人中获得可用道具形式的陷阱，她的_凝神_将持续10回合而不是30回合，但在持续时间内提供+40%命中率。
actors.buffs.monkenergy.desc_secrets=_在一个非常神秘的楼层上，_ 武僧不会唤醒离她3个格子远的敌人，她的_冥思_将持续2回合而不是5回合，并失去任何再生能力，但会探测本层她周围的地形，并让她看透墙壁片刻。
actors.buffs.monkenergy.desc_cooldown=武僧最近使用了一个技能，必须等待才能再次使用。\n\n当前冷却时间: %d 回合。
actors.buffs.monkenergy$monkability$flurry.name=空振
actors.buffs.monkenergy$monkability$flurry.desc=进行两次即时打击，造成%1$d-%2$d的伤害并无视护甲。这个技能不能连续使用
actors.buffs.monkenergy$monkability$flurry.empower_desc=两次瞬发攻击，造成 %1$d-%2$d 伤害，无视护甲，_并使用你武器的附魔效果。_此能力无法连续使用。
actors.buffs.monkenergy$monkability$focus.name=凝神
actors.buffs.monkenergy$monkability$focus.desc=武僧花费一个回合保持专注，让她能格挡下一次针对她的攻击。
actors.buffs.monkenergy$monkability$focus.empower_desc=武僧_瞬间专注_，让她能格挡下一次针对她的攻击。
actors.buffs.monkenergy$monkability$focus$focusbuff.name=凝神
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=武僧专注于周围环境，预知对她发起的下一次物理攻击。在专注状态下，她保证能够格挡下一次物理攻击。\n\n剩余回合数: %s。
actors.buffs.monkenergy$monkability$dash.name=登云
actors.buffs.monkenergy$monkability$dash.prompt=选择一个位置
actors.buffs.monkenergy$monkability$dash.desc=瞬间冲刺至距离3格以内的位置。这个技能可以穿过危险区域，但不能穿过敌人或实体地形。
actors.buffs.monkenergy$monkability$dash.empower_desc=一次瞬发冲刺，最远_8格_。此能力可以越过危险地形，但不能穿过敌人或坚固地形。
actors.buffs.monkenergy$monkability$dragonkick.name=盘龙
actors.buffs.monkenergy$monkability$dragonkick.desc=一记毁灭性的踢击，造成%1$d-%2$d的伤害并无视护甲。这一踢会将目标击退，并使其每移动一格麻痹一回合。
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=毁灭性的一踢，造成 _%1$d-%2$d 伤害_并无视护甲。这一踢将击退并麻痹_所有相邻目标_，麻痹时间等于它们被击退的格数。
actors.buffs.monkenergy$monkability$meditate.name=冥思
actors.buffs.monkenergy$monkability$meditate.desc=武僧将能量集中到身体中，持续5回合。这将清除大部分负面效果，并并赋予她8回合的魔杖和神器充能。
actors.buffs.monkenergy$monkability$meditate.empower_desc=武僧将能量汇聚于体内，持续5回合。此举可清除大部分负面效果，并赋予她8回合的魔杖和神器充能。_她在冥想期间还获得80%的伤害抗性，并缓慢恢复20%的已损失生命值。_
actors.buffs.ooze.name=腐蚀淤泥
actors.buffs.ooze.heromsg=污泥在腐蚀你的身体。洗掉它！
actors.buffs.ooze.ondeath=你被彻底融化掉了...
actors.buffs.ooze.rankings_desc=被溶解
actors.buffs.ooze.desc=这种粘稠的酸性淤泥正在紧贴你的骨肉，并缓慢地将它们腐蚀融化。\n\n腐蚀淤泥会对受害者持续造成伤害，不过能够立刻在水中洗掉。\n\n剩余的腐蚀淤泥持续时长：%s回合
actors.buffs.paralysis.name=麻痹
actors.buffs.paralysis.heromsg=你被麻痹了！
actors.buffs.paralysis.out=解脱麻痹
actors.buffs.paralysis.desc=通常最坏的事就是什么事都做不出来。\n\n麻痹会停止目标的一切动作，使目标保持原状直到效果消失。受伤导致的疼痛也能帮助目标脱离麻痹。 \n\n剩余的麻痹效果时长：%s回合
actors.buffs.petrified.name=石化
actors.buffs.petrified.heromsg=你被石化了！
actors.buffs.petrified.desc=此生物的皮肤完全被坚固的花岗岩覆盖。\n\n被石化者完全停止所有行动，必须等待石头裂开。由于石头外壳的保护，被石化角色受到的伤害减少50%。\n\n剩余的石化效果时长：%s回合
actors.buffs.physicalempower.name=物理强化
actors.buffs.physicalempower.desc=你的打击被强化，增加了你用物理攻击造成的伤害量。\n\n额外伤害: %1$d。\n剩余次数: %2$d.
actors.buffs.pincushion.name=中矢
actors.buffs.pincushion.desc=你击中这个角色的投掷武器正卡在他们身上，打败他们后投掷武器将会掉在地上。\n\n正卡在其他角色身上的物品：
actors.buffs.poison.name=中毒
actors.buffs.poison.heromsg=你中毒了！
actors.buffs.poison.ondeath=你被毒死了……
actors.buffs.poison.rankings_desc=中毒致死
actors.buffs.poison.desc=毒素传遍全身，缓慢地损伤着各个脏器。 \n\n毒素每回合造成的伤害与其剩余的回合数成正比。 \n\n剩余的中毒效果时长：%s回合
actors.buffs.preparation.name=准备阶段
actors.buffs.preparation.action_name=蓄意打击
actors.buffs.preparation.desc=%s正耐心地等待着，准备从暗影中给出致命一击。
actors.buffs.preparation.desc_dmg=他的下一次攻击会造成_%1$d%%的额外伤害_，并瞬间斩杀生命低于_%2$d%%_的普通敌人，或生命低于_%3$d%%_的Boss。
actors.buffs.preparation.desc_dmg_likely=这一击也更有可能造成额外的伤害。
actors.buffs.preparation.desc_blink=他可以瞬间冲刺到敌人身边再攻击，最大冲刺距离为%d格。
actors.buffs.preparation.desc_invis_time=已经隐形了_%d_回合。
actors.buffs.preparation.desc_invis_next=这一击在_%d_回合后会变得更强。
actors.buffs.preparation.prompt=选择一个攻击的目标！\n最大冲刺距离：%d格
actors.buffs.preparation.no_target=这里没有可攻击的目标。
actors.buffs.preparation.out_of_reach=你无法冲刺到目标距离。
actors.buffs.preparation.assassinated=斩杀
actors.buffs.prismaticguard.name=虹色替身
actors.buffs.prismaticguard.desc=你正在被一个目前看不见的虹色替身所保护。当有敌人出现时这个虹色替身将出现并为你战斗！\n\n当虹色替身未激活时，它将逐渐恢复所有所受到的伤害。\n\n替身当前生命值：%d /%d。
actors.buffs.prismaticguard.desc_recover=你被一道虹卫幻影守护着，目前正在从上次死亡中恢复。在恢复结束前，它不会参与战斗。\n\n当前生命值: %d/%d.
actors.buffs.prismaticguard.desc_many=此棱光镜像也受益于“诸圣神力”。剩余回合数：%d。
actors.buffs.recharging.name=充能
actors.buffs.recharging.desc=魔力在你体内奔腾而过，提高你的魔杖和法杖的充能速率。 \n\n每回合这个效果都将给你的法杖/魔杖增加四分之一点充能，这个效果的充能不同于正常充能并且能与之叠加。\n\n剩余的充能效果时长：%s回合
actors.buffs.robotbuff.action_name=变形
actors.buffs.revealedarea.name=区域揭示
actors.buffs.revealedarea.desc=揭示地牢中一片区域的视野，无论你身处这层中的何处都能对那里一览无遗。\n\n剩余回合数：%s。
actors.buffs.revealedchar.name=已揭示
actors.buffs.revealedchar.desc=这个单位已被揭示，无论它在哪里都将是可见的。\n\n剩余回合数：%s。
actors.buffs.rkchampionbuff.action_name=请选择精英词条
actors.buffs.rkchampionbuff$championcooldown.name=精英词条冷却
actors.buffs.rkchampionbuff$championcooldown.desc=你最近使用了精英词条的能力，必须等一会才能再次使用。\n\n剩余回合数：%s.
actors.buffs.roots.name=缠绕
actors.buffs.roots.heromsg=你不能动了！
actors.buffs.roots.desc=根系(不论是自然或魔法产生)缠到了脚上，将它们牢牢拴在地面。 \n\n根系会让目标被困在当前区域，使其不能移动，但不会干扰其他行为。 \n\n剩余的缠绕效果持续时长：%s回合
actors.buffs.scrollempower.name=卷轴赋能
actors.buffs.scrollempower.desc=%s阅读卷轴时产生的能量会暂时强化他的法杖！\n\n法杖强化：+%d 级。\n剩余有效施法次数：%d。
actors.buffs.scrollempower.desc_huntress=%s阅读卷轴时产生的能量会暂时强化她的法杖！\n\n法杖强化：+%d 级。\n剩余有效施法次数：%d。
actors.buffs.scrollempower.desc_duelist=%s阅读卷轴时产生的能量会暂时强化她的法杖！\n\n法杖强化：+%d 级。\n剩余有效施法次数：%d。
actors.buffs.spiritbuff.name=灵魂充能
actors.buffs.spiritbuff.action_name=幽灵召唤
actors.buffs.spiritbuff.desc=作为唤灵者，你可以收集灵魂能量，用以召唤友军幽灵。每45回合，获得1个灵魂能量，最多存储90个。
actors.buffs.shadows.name=暗影融合
actors.buffs.shadows.desc=你和周围的阴影融为一体，使你隐形并减缓你的新陈代谢。\n\n当你在隐形时敌人无法追踪或攻击你。大部分物理攻击和魔法(比如卷轴和法杖)会立即解除隐形效果。此外，当你处于暗影融合状态下时，饥饿值增加的速率会降低。\n\n暗影融合状态会一直持续直到你离开阴影或与敌人直接接触。
actors.buffs.slow.name=迟缓
actors.buffs.slow.desc=减速魔法影响了目标的时间流速，在目标眼中所有的事物都移动得飞快。 \n\n迟缓下的角色执行所有行动花费的时间是其正常执行相同行动的两倍。\n\n剩余的迟缓效果持续时长：%s回合
actors.buffs.snipersmark.name=狙击标记
actors.buffs.snipersmark.action_name_snapshot=速射
actors.buffs.snipersmark.action_name_volley=齐射
actors.buffs.snipersmark.action_name_sniper=强射
actors.buffs.snipersmark.desc=%1$s会专注于%2$s最近射击的目标。%3$s能够用%4$s的灵能弓进行一次特殊攻击，攻击方式取决于弓的改造方式。\n\n若持有未改造的弓，狙击手可发射_瞬时箭矢_，造成低于正常箭矢的伤害，但不消耗时间。\n\n若持有加强了速度的弓，狙击手可进行_三箭连发_。每支箭造成低于正常箭矢的伤害，但能触发附魔。消耗一回合。\n\n若持有加强了伤害的弓，狙击手可发射_狙击箭矢_。狙击箭矢必定命中，造成基于与目标距离的额外伤害，消耗两回合。\n\n标记还有%5$s回合过期。
actors.buffs.snipersmark$freetarget.name=自由狙击标记
actors.buffs.snipersmark$freetarget.bonus_desc=这个标记可以放置在狙击手选择的任何目标上。
actors.buffs.soulmark.name=灵魂标记
actors.buffs.soulmark.desc=%s触及了这个生物的灵魂，每当其受到物理伤害，%s都能汲取一部分灵魂用于回复自身的血量。\n\n效果持续剩余回合数：%s
actors.buffs.soulmark.desc_huntress=%s触及了这个生物的灵魂，每当其受到物理伤害，%s都能汲取一部分灵魂用于回复自身的血量并填补饥饿值。\n\n效果持续剩余回合数：%s
actors.buffs.stamina.name=体力充沛
actors.buffs.stamina.desc=你感受到了体内无尽的精力，让你可以以更快的速度移动！\n\n当你处于体力充沛状态下你的移动速度将提升50%%，但是这不影响其他活动所消耗的时间。\n\n体力充沛持续时间：%s回合。
actors.buffs.vulnerable.name=易伤
actors.buffs.vulnerable.heromsg=你感到外界的伤害愈加疼痛！
actors.buffs.vulnerable.desc=易伤魔法会使得目标受到所有被护甲减免过的物理伤害增加33%%。\n\n易伤的剩余时长：%s回合。
actors.buffs.terror.name=恐惧
actors.buffs.terror.desc=恐惧是使敌人陷入不可控制的恐慌的操纵性魔法。 \n\n恐惧中的角色会远离自己的敌人，试图和敌人隔开尽可能多的门或墙。然而疼痛的冲击则会减少恐惧的持续时间。\n\n剩余的恐惧效果持续时长：%s
actors.buffs.toxicimbue.name=毒性之力
actors.buffs.toxicimbue.desc=你体内被灌注了毒性能量！ \n\n在你移动时毒气会从你的身体中翻腾而出，伤害你的敌人。持续时间内免疫毒气和中毒效果。 \n\n剩余的毒性之力时长：%s回合
actors.buffs.corrosion.name=酸蚀
actors.buffs.corrosion.heromsg=你正在被强酸溶解！
actors.buffs.corrosion.ondeath=你被彻底溶解掉了...
actors.buffs.corrosion.rankings_desc=被溶解
actors.buffs.corrosion.desc=强酸能以惊人的速度腐蚀掉血肉、金属和骨头。\n\n目标被腐蚀的时间越长，酸蚀伤害越高。\n\n剩余的酸蚀效果时长：%1$s回合。\n当前酸蚀伤害：%2$d。
actors.buffs.vertigo.name=眩晕
actors.buffs.vertigo.desc=如果整个世界都在旋转的话,想走直线会变得十分困难。 \n\n眩晕效果持续时，目标的移动将会向一个随机区域进行，而不是目标原本想到达的地方。\n\n剩余的眩晕效果时长：%s回合
actors.buffs.warp.name=扭曲
actors.buffs.warp.desc=屈从于黑暗魔法哪有那么容易！\n\n这个魔法腐蚀了你的心灵，当你承受着心智扭曲之时，#各种负面效果#会在你身上显现。根据这个魔法的强力程度，扭曲效果会缓缓#消退#。\n\n若是身处无光环境，则会让#扭曲效果更强#，最终会_腐蚀你脚边的一切_。\n\n当前的扭曲程度: _%s_\n消退速率: _%s_
actors.buffs.warpedenemy.name=扭曲
actors.buffs.warpedenemy.desc=黑暗魔法扭曲了这个生物，令它的行为变得错乱。\n\n这个扭曲魔法会腐蚀它接触到的所有怪物，令它们#变得失控且更具有攻击性#，还能使用超常的魔法。\n\n只有当地牢中存在#扭曲之源#的时候，扭曲生物才会出现……
actors.buffs.wandempower.name=盈能法杖
actors.buffs.wandempower.desc=你的伤害型法杖已被强化，接下来的几次施法将会造成额外伤害。\n\n额外伤害：%1$d。\n剩余施法次数：%2$d。
actors.buffs.weakness.name=虚弱
actors.buffs.weakness.heromsg=你感到力量正在被抽走！
actors.buffs.weakness.desc=你感觉自己的装备突然变得沉重起来。 \n\n虚弱魔法会减弱角色的物理力量，使其造成的伤害减少33%%。\n\n剩余虚弱效果持续时长：%s回合
actors.buffs.wellfed.name=饱腹
actors.buffs.wellfed.desc=你感觉自己吃的非常饱。\n\n当你处于饱腹状态时，你的饥饿值不会增加，并且会随着时间的推移恢复额外的生命值。\n\n状态剩余回合数：%d
actors.hero.abilities.armorability.self_target=你不能瞄准你自己！
actors.hero.abilities.armorability.no_target=这里没有任何目标！
actors.hero.abilities.armorability.prompt=选择释放能力的位置
actors.hero.abilities.armorability.cost=充能消耗：_%d_
actors.hero.abilities.warrior.heroicleap.name=英勇之跃
actors.hero.abilities.warrior.heroicleap.prompt=选择要飞跃到的地方
actors.hero.abilities.warrior.heroicleap.short_desc=战士能向指定地点使用_英勇跳跃_，越过所有的敌人与环境。
actors.hero.abilities.warrior.heroicleap.desc=战士向指定地点跳跃，越过路径上的所有敌人与环境。不过战士无法越过墙壁或是其它实体地形。
actors.hero.abilities.warrior.shockwave.name=震地冲击
actors.hero.abilities.warrior.shockwave.short_desc=战士大力锤击地面，向一个锥形区域施以_震地冲击_。被冲击波击中的敌人会受到一定伤害并陷入残废。
actors.hero.abilities.warrior.shockwave.desc=战士大力锤击地面产生冲击波，冲击波将震击距离5张角60度的锥形范围。\n\n被冲击波击中的敌人会陷入5回合残废并受到一定伤害。伤害基础为5~10点，战士超过10的每点力量会使得伤害增加1~2点。
actors.hero.abilities.warrior.endure.name=苦痛坚忍
actors.hero.abilities.warrior.endure$enduretracker.name=苦痛之怒
actors.hero.abilities.warrior.endure$enduretracker.desc=战士将忍受的原始伤害织成愤怒，将大量的额外伤害倾泻给敌人。\n\n额外伤害：%1$d\n剩余攻击次数：%2$d
actors.hero.abilities.warrior.endure.short_desc=战士_苦痛坚忍_，跳过若干回合并大幅抵抗伤害。接下来战士会根据忍受的原始伤害造成额外伤害。
actors.hero.abilities.warrior.endure.desc=战士首先忍耐2回合，减少第三方遭受的任何损失。此减伤效果优先于其它减伤计算。\n\n在此之后，战士在5回合内的下一次攻击将造成额外伤害。额外伤害等同于在忍耐期间所有伤害的三分之一。未经削减的原始伤害！\n\n如果战士处于连击状态，此能力将补偿2回合连击时间。
actors.hero.abilities.mage.elementalblast.name=元素风暴
actors.hero.abilities.mage.elementalblast.no_staff=没有法杖，无法使用该技能。
actors.hero.abilities.mage.elementalblast.short_desc=法师从老魔杖中释放_元素风暴_，打击以自身为中心的一大片圆形区域，造成伤害并基于灌注的法杖施加不同的效果。
actors.hero.abilities.mage.elementalblast.desc=法师释放出风暴般的魔力，席卷半径为4的圆形区域，对其中的目标造成相当于法杖近战攻击的伤害。元素风暴造成的特效随老魔杖灌注的法杖而变。
actors.hero.abilities.mage.elementalblast.generic_desc=元素风暴的效果与法杖向目标施法的效果类似。
actors.hero.abilities.mage.wildmagic.name=狂野魔法
actors.hero.abilities.mage.wildmagic.no_wands=你没有法杖可供施法！
actors.hero.abilities.mage.wildmagic.short_desc=法师引导出法杖中的_狂野魔法_，在单回合内对指定目标随机释放这些法杖多次。
actors.hero.abilities.mage.wildmagic.desc=法师倾泻出多只法杖的魔力，在一回合内随机释放法杖至多4次。该能力不会释放法师的老魔杖。\n\n这个能力释放法杖时，法杖视为原本等级+1，最多视为+2。这种方式的释放仍需要消耗法杖充能。每只法杖最多释放两次。
actors.hero.abilities.mage.warpbeacon.name=空间信标
actors.hero.abilities.mage.warpbeacon.depths=你无法传送到其它楼层！
actors.hero.abilities.mage.warpbeacon.locked_floor=楼层被封锁了，你无法离开！
actors.hero.abilities.mage.warpbeacon.too_far=这个位置太远了！
actors.hero.abilities.mage.warpbeacon.invalid_beacon=你不能将信标放在那里！
actors.hero.abilities.mage.warpbeacon.window_desc=你的信标目前设置在了第%d层。
actors.hero.abilities.mage.warpbeacon.window_tele=返回信标位置
actors.hero.abilities.mage.warpbeacon.window_clear=移除信标
actors.hero.abilities.mage.warpbeacon.window_cancel=取消
actors.hero.abilities.mage.warpbeacon.short_desc=法师在当前位置设置了一个_空间信标_，他能瞬间传送回信标所在位置。
actors.hero.abilities.mage.warpbeacon.desc=法师设置了一个可以随时返回的信标。信标设置需要1回合，但返回不消耗时间。\n\n法师在初始条件下无法传送至别的楼层，不能将其放入不可达的区域如上锁的房间。法师返回时若是目标地点有敌人，则会将其弹开。
actors.hero.abilities.rogue.smokebomb.name=烟幕爆炸
actors.hero.abilities.rogue.smokebomb.fov=你只能跳到视野范围内的空格子里
actors.hero.abilities.rogue.smokebomb.prompt=选择要跳到的位置
actors.hero.abilities.rogue.smokebomb$ninjalog.name=木桩替身
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=不知为何敌人坚信这就是盗贼本身。
actors.hero.abilities.rogue.smokebomb.short_desc=盗贼在原地制造一场_烟幕爆炸_后闪现离去。盗贼会暂时隐身，并使原地点周围的敌人失明。
actors.hero.abilities.rogue.smokebomb.desc=盗贼在原地制造一场烟幕爆炸，并闪现最多6格的距离。闪现无视敌人与环境，但仍会被实体地形如墙壁阻挡。\n\n盗贼原位置周围的敌人将失明5回合。
actors.hero.abilities.rogue.deathmark.name=夺命印记
actors.hero.abilities.rogue.deathmark.ally_target=你只能标记敌人。
actors.hero.abilities.rogue.deathmark.short_desc=盗贼向选中的敌人施加_夺命印记_。被标记的敌人将受到额外伤害，但不会在标记期间死亡。
actors.hero.abilities.rogue.deathmark.desc=盗贼标记选中的敌人，使其受到额外33%的伤害。标记不耗费时间且持续5回合。\n\n被标记的敌人受到额外伤害，但并不会在标记期间死亡。生命值耗尽的目标在标记结束时立即死亡。
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=夺命印记
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=这名被标记的敌人受到33%%的额外伤害，但不会在标记期间死亡。\n\n标记剩余：%s回合。
actors.hero.abilities.rogue.shadowclone.name=暗影映像
actors.hero.abilities.rogue.shadowclone.short_desc=盗贼召唤一个_暗影映像_，并能使唤其帮助自己战斗。
actors.hero.abilities.rogue.shadowclone.desc=盗贼召唤一个暗影映像，并能使唤其帮助自己战斗。使唤映像不会消耗充能。\n\n映像拥有100点生命与10-20点近战伤害，在激活天赋后这些属性可受到其主人武器与护甲的增益。
actors.hero.abilities.rogue.shadowclone$shadowally.name=暗影映像
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=你的分身移动到该位置。
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=你的映像正在跟随你。
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=你的映像正在发动攻击！
actors.hero.abilities.rogue.shadowclone$shadowally.desc=一具无形暗影塑造出的%1$s复制体，它一动不动双目空空，烟雾般的黑暗在周围缓缓升腾。\n\n它虽说不上是个完美的复制体，但也是个合格的杀手，并且在特定天赋加持下能从其主人的装备中获益。
actors.hero.abilities.rogue.shadowclone$shadowally.desc_rat=朕忠诚的影子，它从超凡的混乱中蒙召唤而生。它静静地侍立，随时准备攻击任何胆敢闯进朕视线的生物。\n\n它不是完美的，但对朕来说仍然是一个得力的臣子，通过良好的训练，它可以从朕的宝库收藏中受益。
actors.hero.abilities.huntress.spectralblades.name=灵魂飞刃
actors.hero.abilities.huntress.spectralblades.short_desc=女猎手向一个目标掷出_灵魂飞刃_，根据装备的近战武器造成伤害。
actors.hero.abilities.huntress.spectralblades.desc=女猎手向一名敌人掷出灵能飞刃，就像用近战武器进行远程攻击。该攻击保留包括附魔的所有近战攻击效果。此外，灵魂飞刃可以穿过1格固体以击中目标。若有敌人与目标相邻，则额外向其射出一把50%伤害的灵魂飞刃。
actors.hero.abilities.huntress.naturespower.name=自然之力
actors.hero.abilities.huntress.naturespower.short_desc=女猎手呼唤_自然之力_的协助，在短时间内增加其移动速度与灵能短弓射击速度。
actors.hero.abilities.huntress.naturespower.desc=女猎手与她的弓注入了自然的力量！这种力量持续8回合。\n\n在自然之力的加持下，女猎手拥有双倍的移动速度与+33%的灵能短弓射击速度。这种力量不影响狙击手的追加攻击。击杀敌人可以短暂地延长自然之力的持续时间。
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=自然之力
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=女猎手拥有了暂时的自然之力，增加其移动速度与灵能短弓射击速度。\n\n剩余回合数：%s。
actors.hero.abilities.huntress.spirithawk.name=灵能飞鹰
actors.hero.abilities.huntress.spirithawk.no_space=你附近没有可用于召唤的空地。
actors.hero.abilities.huntress.spirithawk.short_desc=女猎手召唤一只_灵能飞鹰_使魔，协助侦查地形并干扰敌人。
actors.hero.abilities.huntress.spirithawk.desc=女猎手召唤一只灵能飞鹰，飞鹰存在时使用此能力可指引其行动。飞鹰将存在60回合，指引飞鹰不消耗任何充能。\n\n灵能飞鹰脆弱且缺乏攻击性，但其迅捷的移动、灵敏的躲避与精准的攻击弥补了这些缺点。飞鹰与女猎手共享视野，免疫火焰毒气等环境，且只有在受到特定指引后才会发起攻击。
actors.hero.abilities.huntress.spirithawk$hawkally.name=灵能飞鹰
actors.hero.abilities.huntress.spirithawk$hawkally.name_rat=皇家夜枭
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=你的飞鹰正在跟随你。
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=你的飞鹰正在发动攻击！
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=你的猎鹰移动到该位置。
actors.hero.abilities.huntress.spirithawk$hawkally.desc=一只女猎手召唤的灵能飞鹰，它全身散发着明亮而空灵的蓝光，它不断扭头探查着周围环境。\n\n飞鹰并不适合武力战斗，但其速度与视野使其能够胜任高效的侦查与危险的引敌任务。\n\n飞鹰将在%d回合后消散。
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=剩余回合数：%d。
actors.hero.abilities.huntress.spirithawk$hawkally.desc_rat=朕的奥术使魔，由王国最好的猎人训练。它的眼睛闪耀着绿宝石般的光芒，皮肤的颜色和光泽同朕一般高贵。\n\n虽然它不能焚膏继晷地驻守，但它敏捷的身手和锐利的视觉非常适合发现并羞辱朕的敌人\n\n剩余回合数：%d。
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=飞鹰将必定闪避接下来的%d次攻击。
actors.hero.abilities.duelist.challenge.name=公平决斗
actors.hero.abilities.duelist.challenge.prompt=选择一个敌人进行公平决斗
actors.hero.abilities.duelist.challenge.already_dueling=你一次只能参与一场决斗。
actors.hero.abilities.duelist.challenge.ally_target=你只能与敌人决斗。
actors.hero.abilities.duelist.challenge.unreachable_target=你必须能够接近你的目标。
actors.hero.abilities.duelist.challenge.distant_target=那个敌人距离太远，无法发起决斗。
actors.hero.abilities.duelist.challenge.short_desc=决斗家向附近的敌人发起_决斗_，暂时冻结其他所有敌人。
actors.hero.abilities.duelist.challenge.desc=决斗家向附近的敌人发起决斗。被发起决斗的敌人被迫与她战斗，而所有其他敌人在短暂时间内被时间冻结。\n\n目标必须是可达的，并且距离决斗家不超过5格。决斗持续直到经过10回合、敌人死亡，或者决斗家与敌人之间距离超过5格。\n\n被冻结的敌人是无敌的。决斗家的盟友不会被这个能力冻结，但如果目标是boss，那么它的手下也不会被冻结。
actors.hero.abilities.duelist.challenge$duelparticipant.name=决斗参与者
actors.hero.abilities.duelist.challenge$duelparticipant.desc=这个角色正在参与一场决斗。他们及其任何盟友或手下可以正常行动，而其他人被冻结。\n\n决斗将持续一段时间，直到一方死亡，或者参与者之间的距离超过5格。\n\n剩余回合数: %d.
actors.hero.abilities.duelist.elementalstrike.name=元素打击
actors.hero.abilities.duelist.elementalstrike.short_desc=决斗家进行一次_元素打击_，根据其武器附魔在一个锥形范围内传播效果。
actors.hero.abilities.duelist.elementalstrike.desc=决斗家打击敌人或地点，进行一个必定命中的普通攻击，并在65度4格扇形范围内制造一次魔法效果。这个魔法效果取决于决斗家主武器上的附魔。
actors.hero.abilities.duelist.elementalstrike.generic_desc=没有附魔的元素打击会释放一小波魔法，对范围内所有敌人造成6-12点伤害。
actors.hero.abilities.duelist.feint.name=虚晃一招
actors.hero.abilities.duelist.feint.prompt=选择一个位置进行冲刺
actors.hero.abilities.duelist.feint.too_far=那个位置不与你相邻。
actors.hero.abilities.duelist.feint.bad_location=你不能移动到那个位置。
actors.hero.abilities.duelist.feint.short_desc=决斗家_虚晃一招_，并在原地留下一个残影。正在攻击决斗家的敌人会攻击她的残影。
actors.hero.abilities.duelist.feint.desc=决斗家在冲刺到相邻位置时佯装进攻，留下自己的瞬间残影。攻击决斗家的敌人会攻击她的残影。\n\n攻击残影的敌人会变得困惑，取消他们的下一个行动，并使他们暴露于突袭之下。
actors.hero.abilities.cleric.ascendedform.name=超凡升天
actors.hero.abilities.cleric.ascendedform.short_desc=牧师进入_超凡升天_，获得新法术、攻击距离和护盾。
actors.hero.abilities.cleric.ascendedform.desc=牧师自身散发出神圣能量，以神性之光开启%d 回合超凡升天。开启超凡升天时，牧师可以施放新法术，并获得2格攻击距离与30点护盾。此外，额外施放任何法术所使用的每点圣典充能都能使牧师获得10点护盾。\n\n通过超凡升天及其法术获得的护盾不会正常衰减，但在超凡升天结束时护盾会立即消失。该护甲技能可以重复使用，以刷新超凡升天的持续时间。\n\n_激活此能力不消耗时间_。
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=超凡升天
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=神性之光从牧师身上辐射而出。在这种形态中，牧师通过自身散发的神圣能量获得2格攻击距离，并且每次使用圣书充能牧师都能获得10点护盾。此外，牧师还可以施放通过超凡升天天赋解锁的法术。\n\n通过超凡升天及其法术获得的护盾不会正常衰减，但在超凡升天结束时护盾会立即消失。\n\n当前护盾值: %1$d\n剩余回合数: %2$d
actors.hero.abilities.cleric.trinity.name=三位一体
actors.hero.abilities.cleric.trinity.no_imbue=三位一体目前没有为任何形态设置效果，请使用其法术！
actors.hero.abilities.cleric.trinity.no_duplicate=三位一体无法复制你已装备的效果！
actors.hero.abilities.cleric.trinity.ench_glyph_use=三位一体将以消耗 _%2$s 充能_为代价应用此效果 _%1$d 回合_。
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=三位一体将以消耗 _%2$s 充能_为代价应用此_强力_效果 _%1$d 回合_。
actors.hero.abilities.cleric.trinity.wand_use=三位一体将以消耗 _%2$s 充能_为代价以 _+%1$d_ 等级施放此法杖。
actors.hero.abilities.cleric.trinity.wand_multi_use=三位一体将以消耗 _%2$s 充能_为代价以 _+%1$d_ 等级施放此_多充能_法杖。
actors.hero.abilities.cleric.trinity.thrown_use=三位一体将以消耗 _%2$s 充能_为代价以 _+%1$d_ 等级投掷此武器。
actors.hero.abilities.cleric.trinity.ring_use=三位一体将以消耗 _%2$s 充能_为代价应用此戒指的效果 _+%1$d_ 等级，持续20回合。
actors.hero.abilities.cleric.trinity.talent_use=三位一体将以消耗 _%2$s 充能_为代价以最大效力应用此天赋的效果 _+%1$d 回合_。
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=三位一体将以消耗 _%2$s 充能_为代价应用此神器的远程炼金效果。
actors.hero.abilities.cleric.trinity.chaliceofblood_use=三位一体将以消耗 _%2$s 充能_为代价应用此神器的被动生命恢复效果 _+%1$d_ 等级，持续20回合。
actors.hero.abilities.cleric.trinity.driedrose_use=三位一体将以消耗 _%2$s 充能_为代价使用此神器效果召唤一个腐化的友好幽灵，其生命值相当于 _+%1$d_ 等级的幽灵。
actors.hero.abilities.cleric.trinity.etherealchains_use=三位一体将以消耗 _%2$s 充能_为代价以 _+%1$d_ 射程应用此神器的释放锁链效果。
actors.hero.abilities.cleric.trinity.hornofplenty_use=三位一体将以消耗 _%2$s 充能_为代价应用此神器的进食效果。
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=三位一体将以消耗 _%2$s 充能_为代价以 _+%1$d_ 等级应用此神器的偷取敌人效果。
actors.hero.abilities.cleric.trinity.sandalsofnature_use=三位一体将以消耗 _%2$s 充能_为代价应用此神器的扎根能力，触发一个随机有害种子效果。
actors.hero.abilities.cleric.trinity.talismanofforesight_use=三位一体将以消耗 _%2$s 充能_为代价以 _+%1$d_ 等级应用此神器的侦察效果。
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=三位一体将以消耗 _%2$s 充能_为代价应用此神器的时间冻结效果，持续 _%1$d_ 回合。
actors.hero.abilities.cleric.trinity.unstablespellbook_use=三位一体将以消耗 _%2$s 充能_为代价应用此神器的随机卷轴效果，并有 _%1$d/10_ 的几率免费提供秘卷版本。
actors.hero.abilities.cleric.trinity.cost=此能力的充能消耗不定，但通常是 _%d_。
actors.hero.abilities.cleric.trinity.short_desc=牧师获得_三位一体_能力，可模拟他们见过的装备，并通过使用新法术来分配。
actors.hero.abilities.cleric.trinity.desc=牧师获得_三位一体_的护甲能力，可以通过使用三个新法术来分配不同的物品效果。每个法术专注于模拟牧师在此次游戏中鉴定过的不同类型的装备效果：躯体形态（武器和护甲）、心智形态（魔杖和投掷武器）、灵体形态（戒指和神器）以及蜕变形态（天赋）。\n\n每个三位一体形态一次只能注入一种效果，牧师在使用三位一体时选择激活哪一个。三位一体不会复制你已装备物品的效果。
actors.hero.abilities.cleric.trinity$wndusetrinity.text=选择要使用的三位一体形态。不同形态的效果可以同时生效。
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_体之位格：%s。_
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_智之位格：%s。_
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_魂之位格：%s。_
actors.hero.abilities.cleric.trinity$wndusetrinity.meta=_蜕变位格：%s。_
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=选择要注入三位一体的效果。确认前将显示额外信息。
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=选择体之位格效果
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=选择智之位格效果
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=选择魂之位格效果
actors.hero.abilities.cleric.trinity.select_talent=选择天赋
actors.hero.abilities.cleric.trinity$wndtalentselect.desc=选择要注入三位一体的天赋。确认前将显示额外信息。
actors.hero.abilities.cleric.powerofmany.name=诸圣神力
actors.hero.abilities.cleric.powerofmany.prompt_default=选择盟友或位置
actors.hero.abilities.cleric.powerofmany.prompt_ally=指挥你的神圣誓盟
actors.hero.abilities.cleric.powerofmany.ally_exists=你已有一个被强化的盟友。
actors.hero.abilities.cleric.powerofmany.no_vision=你无法瞄准看不到的位置。
actors.hero.abilities.cleric.powerofmany.only_allies=你只能强化盟友。
actors.hero.abilities.cleric.powerofmany.short_desc=牧师引导_诸圣神力_，强化现有盟友或创造一个新盟友。
actors.hero.abilities.cleric.powerofmany.desc=牧师引导_诸圣神力_，它可以强化一个现有盟友或创造一个持续100回合的新强化盟友。瞄准空地会创造一个新盟友。\n\n被万众之力强化的盟友造成+25%伤害，承受-25%伤害，并与牧师共享视野。使用此能力时他们还会获得25点护盾值。\n\n牧师还会获得四个新法术，这些法术只能在有强化盟友时施放。当这些法术之一生效时，万众之力不会结束。
actors.hero.abilities.cleric.powerofmany$powerbuff.name=诸圣神力
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=此盟友已被诸圣神力强化，获得+25%%造成的伤害和-25%%承受的伤害。他们还会与牧师共享视野范围，并能受益于诸圣神力法术。\n\n当盟友（如棱光镜像）隐藏时，诸圣神力效果依然存在，但其持续时间仍在倒计时。\n\n剩余回合数：%s。
actors.hero.abilities.cleric.powerofmany$lightally.name=神圣誓盟
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=你的盟友移动到该位置。
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=你的盟友跟随你移动。
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=你的盟友前去攻击！
actors.hero.abilities.cleric.powerofmany$lightally.desc=牧师冒险同伴之一的复制体，由实光构成。虽然它具有其他英雄的外形，但不具备任何其独特能力。只要诸圣神力效果作用于其上，此盟友就会一直存在。\n\n此盟友可以通过重新使用诸圣神力护甲能力免费指挥。
actors.hero.abilities.ratmogrify.name=鼠化术
actors.hero.abilities.ratmogrify.cant_transform=这个目标无法被鼠化！
actors.hero.abilities.ratmogrify.too_strong=这名敌人过于强大，鼠化术无效！
actors.hero.abilities.ratmogrify.short_desc=你可以施展_鼠化术_将目标敌人变形！敌人会暂时变为失去所有特殊能力的老鼠。
actors.hero.abilities.ratmogrify.short_desc_rat_king=你可以施展_鼠化术_将目标敌人变形！它将永久变成没有特殊能力的老鼠。
actors.hero.abilities.ratmogrify.desc=你能将敌人变为小鼠6回合！不过你无法变形 Boss，盟友或是小鼠本身。\n\n鼠化的敌人会继承原属性值，但失去所有特殊能力。
actors.hero.abilities.ratmogrify.desc_rat_king=你能将敌人_永久_地变为小鼠！不过你无法变形 Boss，盟友或是小鼠本身。\n\n鼠化的敌人会继承原属性值，但失去所有特殊能力。
actors.hero.abilities.ratmogrify$transmograt.name=鼠化%s
actors.hero.abilities.ratmogrify$transmograt.desc=这名敌人已被变为老鼠。至少对我而言是个好消息！——鼠王
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=死于：鼠化敌人
actors.hero.spells.auraofprotection.name=守御灵光
actors.hero.spells.auraofprotection.short_desc=提升圣骑士及其附近盟友的防御力。
actors.hero.spells.auraofprotection.desc=圣骑士开始向周围散发保护能量，形成围绕自身的闪耀光环，持续%3$d回合。圣骑士2格范围内的任何盟友（包括自身）承受%1$d%%更少伤害，并以+%2$d%%效力获得圣骑士护甲符印的效果。\n\n此伤害减免在其他减伤效果（如护甲）之前生效。符印效力提升始终生效，但如果角色已受益于该符印（例如圣骑士自身或棱光镜像），此法术不会导致圣骑士的符印多次生效。\n\n在此光环生效时施放法术，每消耗1点充能将延长其持续时间%4$d回合。
actors.hero.spells.auraofprotection.name_empower=界·守御灵光
actors.hero.spells.auraofprotection.short_desc_empower=提升圣骑士及其附近盟友的防御力。比普通版持续时间更长，并将部分伤害反弹给攻击者。
actors.hero.spells.auraofprotection.desc_empower=圣骑士开始向周围散发保护能量，形成围绕自身的闪耀光环，持续_%3$d回合_。圣骑士2格范围内的任何盟友（包括自身）承受%1$d%%更少伤害，并以+%2$d%%效力获得圣骑士护甲符印的效果。\n\n此伤害减免在其他减伤效果（如护甲）之前生效，_随后减免的伤害会被反弹给目标_。符印效力提升始终生效，但如果角色已受益于该符印（例如圣骑士自身或棱光镜像），此法术不会导致圣骑士的符印多次生效。\n\n在此光环生效时施放法术，每消耗1点充能将延长其持续时间%4$d回合。
actors.hero.spells.auraofprotection$aurabuff.name=守御灵光
actors.hero.spells.auraofprotection$aurabuff.desc=圣骑士正在向周围散发保护能量。\n\n任何附近的盟友（包括圣骑士自身）承受的伤害减少，并以提升的效力获得圣骑士护甲符印的效果。\n\n在此光环生效时施放法术会略微延长其持续时间。%s
actors.hero.spells.auraofprotection$retributionbuff.name=复仇灵光
actors.hero.spells.auraofprotection$retribtuionbuff.empower=\n\n此强化版持续时间更长，并将双倍减免的伤害反弹给目标！
actors.hero.spells.beamingray.name=呼神护卫
actors.hero.spells.beamingray.no_space=那里没有空间让你的盟友出现。
actors.hero.spells.beamingray.out_of_range=该位置超出射程。
actors.hero.spells.beamingray.short_desc=传送你的盟友并赋予额外伤害。
actors.hero.spells.beamingray.desc=牧师引导盟友身上的力量形成一道光之射线，将他们传送到一个位置。如果射线击中敌人，会将盟友放置在敌人附近并引导他们攻击该敌人。\n\n射线最大射程为%1$d格，并使诸圣神力的伤害加成在10回合内对4格内最近的敌人提升至+%2$d%%。光束射线甚至可以传送通常无法移动的盟友，但在此情况下射程减半。
actors.hero.spells.beamingray$beamingrayboost.name=呼神护卫
actors.hero.spells.beamingray$beamingrayboost.desc=此盟友最近被光束射线传送过，使其在传送后对最近的敌人造成额外伤害。当此增益生效时，诸圣神力也不会结束。\n\n剩余回合数：%s。
actors.hero.spells.blessspell.name=神圣祝福
actors.hero.spells.blessspell.short_desc=祝福并护盾牧师，祝福并治疗他人。如果目标已被祝福则加速。
actors.hero.spells.blessspell.desc=牧师对自己或另一个可见角色施加神圣祝福。\n\n当对自己施放时效果较弱，赋予%1$d回合祝福和%2$d点护盾值。\n\n当对其他角色施放时法术更强力，赋予%3$d回合祝福和%4$d点治疗量。过量治疗转化为护盾值。\n\n当对已被祝福的目标施放时，目标将获得%5$d点肾上腺素。
actors.hero.spells.blessspell.name_empower=界·神圣祝福
actors.hero.spells.blessspell.short_desc_empower=祝福并护盾牧师，祝福并治疗他人。影响所有盟友且效果提升，并额外加速受影响者。
actors.hero.spells.blessspell.desc_empower=牧师对_所有友方角色_施加神圣祝福，赋予牧师%1$d回合祝福和%2$d点护盾值，赋予其他角色%3$d回合祝福和%4$d点治疗量。过量治疗转化为护盾值。\n\n所有受影响角色还将获得%5$d回合肾上腺素。\n\n此法术一次最多只能给予相当于两次施放的护盾量。
actors.hero.spells.bodyform.name=体之位格
actors.hero.spells.bodyform.short_desc=将三位一体分配给附魔或符印。
actors.hero.spells.bodyform.desc=牧师选择一个在此次游戏中鉴定过的附魔或符印，将其效果注入三位一体。\n\n当使用三位一体时，牧师获得所选附魔或符印的效果%d回合。此临时附魔或符印将与常规附魔或符印一样作用于任何相关效果。\n\n此法术会替换三位一体当前注入的任何其他躯体效果。
actors.hero.spells.bodyform$bodyformbuff.name=体之位格
actors.hero.spells.bodyform$bodyformbuff.desc=三位一体的体之位格目前赋予你一个附魔或符印的力量，如同你当前武器或护甲上装备了它一样。\n\n注意，体之位格无法提供你已受益效果的另一个副本。\n\n当前效果：%1$s。\n\n剩余回合数：%2$s。
actors.hero.spells.cleanse.name=神圣净化
actors.hero.spells.cleanse.short_desc=清除减益效果并赋予护盾。
actors.hero.spells.cleanse.desc=牧师立即清除自身和可见盟友身上的所有有害效果。法术结束后，所有受影响的角色还获得%1$d回合的减益免疫和%2$d点护盾值。
actors.hero.spells.cleanse.name_empower=界·神圣净化
actors.hero.spells.clericspell.prompt=选择目标
actors.hero.spells.clericspell.no_target=那里没有目标。
actors.hero.spells.clericspell.no_targets=没有有效目标！
actors.hero.spells.clericspell.invalid_target=你无法瞄准该位置。
actors.hero.spells.clericspell.invalid_enemy=你无法瞄准那个敌人。
actors.hero.spells.clericspell.charge_cost=充能消耗：%s
actors.hero.spells.clericspell$paladinspellextendable.extendable=当%s生效时施放其他法术，每消耗1点充能将延长其持续时间%d回合。
actors.hero.spells.divinesense.name=神圣感知
actors.hero.spells.divinesense.name_empower=界·神圣感知
actors.hero.spells.divinesense.short_desc=在广阔范围内获得临时的精神视野。
actors.hero.spells.divinesense.short_desc_empower=获得多回合的精神视野
actors.hero.spells.divinesense.desc=牧师将感官集中在周围环境上，获得%1$d格范围的灵视，持续60回合。
actors.hero.spells.divinesense.desc_empower=牧师将感官集中在周围环境上，获得_无限范围_的灵视，持续%2$d回合。
actors.hero.spells.divinesense$divinesensetracker.name=神圣感知
actors.hero.spells.divinesense$divinesensetracker.desc=此角色暂时能够用心灵感知附近的其他生物！\n\n剩余回合数：%s。
actors.hero.spells.divineintervention.name=神圣干预
actors.hero.spells.divineintervention.short_desc=为牧师和盟友提供大量护盾提升。
actors.hero.spells.divineintervention.desc=牧师将圣典中的巨大能量倾注于自身和盟友，将所有人提升至%1$d点护盾值，并将升腾形态延长%2$d回合。此法术惊人的防御力与其极高的充能消耗相权衡。\n\n就像超凡升天赋予的其他护盾一样，此护盾不会自然衰减，但会在超凡升天结束时立即消失。
actors.hero.spells.flash.name=天堂阶梯
actors.hero.spells.flash.prompt=选择位置
actors.hero.spells.flash.short_desc=传送到附近位置。
actors.hero.spells.flash.desc=牧师在附近位置引导其超凡升天并传送至该处。闪现可以将牧师传送到射程内任何已探索且未被占据的位置。在同一次超凡升天中每次使用此法术都会消耗更多圣典充能。
actors.hero.spells.guidinglight.name=神导之光
actors.hero.spells.guidinglight.short_desc=造成远程魔法伤害并保证一次命中。
actors.hero.spells.guidinglight.desc=牧师发射一枚魔法能量箭，击中目标造成2-6伤害并使其发光。下一次对发光敌人进行的未受阻碍物理攻击必定命中。
actors.hero.spells.guidinglight.desc_priest=_当由祭司施放时，此法术更加强力。_每50回合的第一次施法不消耗圣典充能，并且发光效果可以被魔杖、其他角色以及直接影响敌人的神器效果消耗。当发光效果以此方式被消耗时，会造成等同于祭司等级的额外魔法伤害。
actors.hero.spells.guidinglight.name_empower=界·神导之光
actors.hero.spells.guidinglight.short_desc_empower=对所有敌人造成远程魔法伤害并保证一次命中。此法术瞬间施放。
actors.hero.spells.guidinglight.desc_empower=牧师_瞬间_向_每个可见目标_发射魔法能量箭，造成2-6伤害并使其发光。下一次对发光敌人进行的非力竭物理攻击必定命中并造成一些额外伤害。
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=神导之光
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=在此增益结束后，祭司将能再次免费施放引导之光。\n\n剩余回合数：%s。
actors.hero.spells.guidinglight$illuminated.name=发光
actors.hero.spells.guidinglight$illuminated.desc=此角色因被引导之光击中而发光。虽然光芒不足以照亮周围区域，但魔法效果将使牧师更容易对其造成打击。
actors.hero.spells.guidinglight$illuminated.desc_priest=祭司还可以用魔杖施法、盟友的攻击或某些神器的效果来消耗发光效果。以此方式消耗发光效果会造成额外伤害。
actors.hero.spells.guidinglight$illuminated.desc_generic=其他英雄仍可利用发光效果从灼热之光天赋中受益，但不会获得任何精准加成。
actors.hero.spells.hallowedground.name=神圣领域
actors.hero.spells.hallowedground.name_empower=界·神圣领域
actors.hero.spells.hallowedground.prompt=选择位置
actors.hero.spells.hallowedground.short_desc=治疗盟友，减速敌人，并在AOE范围内蔓延草。
actors.hero.spells.hallowedground.short_desc_empower=所见之地皆为圣域。
actors.hero.spells.hallowedground.desc=祭司将神圣魔法注入附近地面，创造一个%1$dx%1$d的神圣领域区域，持续20回合。\n\n施放时，此法术治疗所有盟友%2$d生命值（英雄获得护盾），短暂缠绕敌人，并蔓延短草。\n\n神圣领域每回合治疗盟友1生命值，削弱敌人，并随机使高草生长。\n\n神圣之地会被火焰摧毁，如果被动恢复效果被禁用或祭司有一段时间未获得经验，它将产生枯草并停止治疗英雄。
actors.hero.spells.hallowedground.desc_empower=祭司将神圣魔法注入地面，将他们的整个视野转变为神圣领域。\n\n施放时，此法术治疗所有盟友%2$d生命值（英雄获得护盾），缠绕敌人%3$d回合，并蔓延草。\n\n神圣地形每回合治疗盟友1生命值（健康的盟友获得护盾），削弱敌人，并随机使高草生长。\n\n神圣之地会被火焰摧毁，如果被动恢复效果被禁用或祭司有一段时间未获得经验，它将产生枯草并停止治疗英雄。
actors.hero.spells.hallowedground$hallowedterrain.desc=此处地面已被神圣化。神圣之地减缓敌人，治疗盟友，并导致草蔓延。
actors.hero.spells.holyintuition.name=神圣预知
actors.hero.spells.holyintuition.name_empower=界·神圣预知
actors.hero.spells.holyintuition.prompt=选择物品
actors.hero.spells.holyintuition.cursed=你感觉到此物品内潜伏着恶意魔法。
actors.hero.spells.holyintuition.uncursed=此物品没有恶意魔法。
actors.hero.spells.holyintuition.short_desc=识别物品是否被诅咒。有时会鉴定或解除物品诅咒。
actors.hero.spells.holyintuition.short_desc_empower=移除被诅咒物品的诅咒，鉴定它，或两者兼得。
actors.hero.spells.holyintuition.desc=牧师将感官集中在一个物品上，无需装备即可确定其是否被诅咒。\n\n\n\n此法术还有25%的几率鉴定未被诅咒的物品或解除未被诅咒物品的诅咒。对已知被诅咒或未被诅咒的物品使用此法术时，此几率提升至33%。
actors.hero.spells.holyintuition.desc_empower=牧师将神圣能量注入一个物品。\n\n_如果物品被诅咒_，诅咒将被移除，并且有33%的几率鉴定该物品（如果已知被诅咒则为50%）。\n\n_如果物品未被诅咒_，物品将被鉴定。
actors.hero.spells.holylance.name=神圣之枪
actors.hero.spells.holylance.name_empower=界·神圣之枪
actors.hero.spells.holylance.short_desc=造成高额远程魔法伤害。每个可见敌人使用一次。
actors.hero.spells.holylance.desc=祭司将大量能量凝聚成一道毁灭性的神圣之枪投掷出去。此长枪造成%1$d-%2$d伤害，并且对亡灵和恶魔目标总是造成最大伤害。
actors.hero.spells.holylance.cooldown=此法术非常昂贵，有15回合冷却时间。
actors.hero.spells.holylance.charge_cost_scale_empower=每目标
actors.hero.spells.holylance.cooldown_empower=此法术将对每个可见敌人施放一次神圣长枪，但神圣长枪本身的消耗会比平时低。如果视野中只有一个敌人，该角色将被瞄准两次。它仍会触发15回合冷却时间。
actors.hero.spells.holylance$lancecooldown.name=神圣之枪冷却
actors.hero.spells.holylance$lancecooldown.desc=祭司最近施放过神圣之枪，必须等待才能再次施放。\n\n剩余回合数：%s。
actors.hero.spells.holyward.name=神圣护甲
actors.hero.spells.holyward.name_empower=界·神圣护甲
actors.hero.spells.holyward.glyph_name=神圣%s
actors.hero.spells.holyward.glyph_desc=这个刻印略微增加了护甲可防御的伤害量。
actors.hero.spells.holyward.short_desc=临时覆盖刻印以强化护甲防御。
actors.hero.spells.holyward.short_desc_empower=临时减少盟友受到的攻击伤害。
actors.hero.spells.holyward.desc=牧师用神圣光之符印灌注其穿戴的护甲，使护甲的防御增加1-2点。\n\n此刻印持续50回合，并在持续时间内覆盖护甲原有的任何有益刻印。即使牧师没有护甲，也能从此效果中受益。
actors.hero.spells.holyward.desc_empower=牧师散发出神圣能量，使_所有盟友的伤害格挡_增加3点。\n\n此效果持续_120回合_。即使牧师没有护甲_或受到魔法攻击_，也能从此效果中受益。
actors.hero.spells.holyward.desc_paladin=_当由圣骑士施放时，此法术更加强力。_额外伤害格挡增加至3点，法术不再覆盖现有符印，并且在神圣护佑生效时施放其他法术，每消耗1点充能将延长其持续时间10回合。
actors.hero.spells.holyward.desc_paladin_empower=_当由圣骑士施放时，此法术更加强力。_额外伤害格挡增加至4-5点，并且在神圣守护生效时施放其他法术，每消耗1点充能将延长其持续时间_15回合_。
actors.hero.spells.holyward$holyarmbuff.name=神圣护甲
actors.hero.spells.holyward$holyarmbuff.desc=牧师已用神圣能量灌注其穿戴的护甲，临时覆盖任何现有符印，使护甲的防御增加1-2点。
actors.hero.spells.holyward$holyarmbuff.desc_paladin=圣骑士已用神圣能量灌注其穿戴的护甲，使护甲能防御额外3点伤害。
actors.hero.spells.holyward$holyarmbuff$empowered.name=界·神圣护甲
actors.hero.spells.holyward$holyarmbuff$empowered.desc=牧师正散发着力量，使针对他们或任何盟友的所有攻击减少3点伤害。
actors.hero.spells.holyward$holyarmbuff$empowered.desc_paladin=圣骑士的护甲正散发着力量，使针对他们的所有攻击减少4-5点伤害。
actors.hero.spells.holyweapon.name=神圣武器
actors.hero.spells.holyweapon.name_empower=界·神圣武器
actors.hero.spells.holyweapon.ench_name=神圣%s
actors.hero.spells.holyweapon.ench_desc=被神圣武器击中的敌人将承受额外的魔法伤害。
actors.hero.spells.holyweapon.short_desc=临时覆盖附魔以提升伤害。
actors.hero.spells.holyweapon.desc=牧师用神圣能量附魔其穿戴的武器，使武器在每次击中敌人时造成额外的%d点魔法伤害。\n\n此附魔持续50回合，并在持续时间内覆盖武器原有的任何有益附魔。徒手攻击也能从此效果中受益。
actors.hero.spells.holyweapon.desc_empower=牧师的武器散发着力量，使_他们和盟友的所有攻击_造成额外的%d点魔法伤害。\n\n此附魔持续100回合。
actors.hero.spells.holyweapon.desc_paladin=_当由圣骑士施放时，此法术更加强力。_额外的魔法伤害增加，法术不再覆盖现有附魔，并且在神圣武器生效时施放其他法术，每消耗1点充能将延长其持续时间10回合。
actors.hero.spells.holyweapon.desc_paladin_empower=_当由圣骑士施放时，此法术更加强力。_额外的魔法伤害增加，并且在神圣武器生效时施放其他法术，每消耗1点充能将延长其持续时间15回合。
actors.hero.spells.holyweapon$holywepbuff.name=神圣武器
actors.hero.spells.holyweapon$holywepbuff.desc=牧师已用神圣能量灌注其穿戴的武器，临时覆盖任何现有附魔，并使武器每次攻击额外造成3点魔法伤害。
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=圣骑士已用神圣能量灌注其穿戴的武器，使其攻击额外造成%d点魔法伤害。
actors.hero.spells.holyweapon$holywepbuff$empowered.name=神圣武器
actors.hero.spells.holyweapon$holywepbuff$empowered.desc=牧师的武器正散发着神圣能量，使所有攻击额外造成%d点魔法伤害。
actors.hero.spells.holyweapon$holywepbuff$empowered.desc_paladin=圣骑士的武器正散发着神圣能量，使所有攻击额外造成%d点魔法伤害。
actors.hero.spells.judgement.name=终末天启
actors.hero.spells.judgement.short_desc=对视野内所有敌人造成伤害。
actors.hero.spells.judgement.desc=牧师撕裂苍穹，以圣光之名审判视野内所有敌人。法术会在造成%1$d~%2$d点伤害的基础之上，再根据牧师自进入超凡升天以来(或自上次施放终末天启以来)的每次施法额外造成5~10点伤害。\n\n当前终末天启会造成%3$d~%4$d点伤害。
actors.hero.spells.layonhands.name=圣疗之触
actors.hero.spells.layonhands.short_desc=立即加速并治疗一个相邻角色，或为圣骑士提供护盾。
actors.hero.spells.layonhands.desc=圣骑士通过双手引导神圣能量，恢复所接触之物。\n\n圣骑士可以对任何相邻角色施放此法术，给予他们%1$d治疗和%2$d回合肾上腺素，或者对自己施放以获得%1$d护盾和%2$d回合肾上腺素。此法术的过量治疗转化为护盾值。\n\n此法术瞬间施放且可重复施放，但一次最多只能给予%5$d点护盾值。
actors.hero.spells.layonhands.name_empower=界·圣疗之触
actors.hero.spells.layonhands.short_desc_empower=立即治疗相邻盟友并为圣骑士提供护盾。加速所有受影响者。对目标角色效果翻倍。
actors.hero.spells.layonhands.desc_empower=圣骑士通过双手引导神圣能量，治疗或保护所接触之物。\n\n圣骑士可以对任何相邻角色施放此法术，给予他们%3$d治疗并给予圣骑士%1$d护盾，或者对自己施放以获得%3$d护盾。目标还将获得%4$d回合肾上腺素。\n\n目标的所有相邻盟友将获得%1$d治疗和%2$d回合肾上腺素。\n\n此法术的过量治疗转化为护盾值。\n\n此法术瞬间施放且可重复施放，但一次最多只能给予%5$d点护盾值。
actors.hero.spells.lifelinkspell.name=血色羁绊
actors.hero.spells.lifelinkspell.short_desc=与盟友分担伤害，并减少他们承受的伤害。
actors.hero.spells.lifelinkspell.desc=牧师强化自身与强化盟友之间的链接。在此血色羁绊下，任何承受的伤害将在英雄与其盟友之间分担%1$d回合，并将诸圣神力防御加成提升至-%2$d%%承受伤害。注意，伤害是在护甲减免后分担，但在诸圣神力的伤害减免之前。\n\n当此效果生效时，如果原本只作用于牧师或其盟友其中一方的3级或以下的增益牧师法术，将同时作用于两者。
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=血色护卫
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=牧师最近对此盟友施放了血色羁绊。\n\n除了生命链接的常规收益外，此角色承受的伤害减少，任何增益牧师法术会同时作用于牧师和此盟友而非仅一方，并且当此增益生效时诸圣神力不会结束。\n\n剩余回合数：%s。
actors.hero.spells.enragespell.name=激怒
actors.hero.spells.enragespell.short_desc=使盟友激怒，让他们造成更多伤害但也承受更多伤害。
actors.hero.spells.enragespell.desc=牧师激怒其强化盟友，使其在%1$d回合内造成1.5倍物理伤害，但也承受1.5倍物理伤害。注意，伤害是在护甲减免后分担，但在诸圣神力的伤害减免之前。
actors.hero.spells.enragespell$enragebuff.name=狂怒
actors.hero.spells.enragespell$enragebuff.desc=牧师最近对此盟友施放了激怒。\n\n激怒状态下，此盟友将造成1.5倍伤害，但也承受1.5倍伤害，并且当此增益生效时诸圣神力不会结束。\n\n剩余回合数：%s。
actors.hero.spells.metaform.name=蜕变位格
actors.hero.spells.metaform.short_desc=将三位一体分配给一个天赋。
actors.hero.spells.metaform.desc=牧师从10个可能选项中选择一个天赋，将其效果注入三位一体。\n\n当使用三位一体时，牧师获得所选天赋的效果%d回合。此临时天赋将被完全升级，并像常规天赋一样作用于任何相关效果。\n\n此法术会替换三位一体当前注入的任何其他元效果。\n\n此法术在选择效果前消耗充能。
actors.hero.spells.metaform$metaformbuff.name=蜕变位格
actors.hero.spells.metaform$metaformbuff.desc=三位一体的蜕变形态目前赋予你一个天赋的力量，如同你拥有它和其他天赋一样。\n\n注意，蜕变形态无法提供你已受益效果的另一个副本。\n\n当前效果：%1$s。\n\n%2$s\n\n剩余回合数：%3$s。
actors.hero.spells.mindform.name=智之位格
actors.hero.spells.mindform.short_desc=将三位一体分配给一个魔杖或投掷武器。
actors.hero.spells.mindform.desc=牧师选择一个在此次游戏中鉴定过的魔杖或投掷武器，将其效果注入三位一体。\n\n当使用三位一体时，牧师可以进行一次攻击，如同使用所选物品在+%d等级一样。这将触发使用该类物品通常会触发的所有效果。\n\n此法术会替换三位一体当前注入的任何其他智之位格效果。
actors.hero.spells.mnemonicprayer.name=祈祷诗篇
actors.hero.spells.mnemonicprayer.name_power=界·祈祷诗篇
actors.hero.spells.mnemonicprayer.short_desc=延长盟友/敌人身上的增益/减益效果，并重新施加发光效果。
actors.hero.spells.mnemonicprayer.short_desc_empower=瞬间延长所有可见角色身上的增益/减益效果，并重新施加发光效果。
actors.hero.spells.mnemonicprayer.desc=祭司瞬间念出祷言，将特定目标身上的所有增益或减益效果延长%1$d回合。正面效果在盟友（包括祭司自身）身上持续时间更长，负面效果在敌人身上持续时间更长。此法术还会对之前被发光效果影响的敌人重新施加发光效果。\n\n祈祷诗篇只能延长特定增益或减益效果实例一次，并且无法延长护甲能力赋予的增益。
actors.hero.spells.mnemonicprayer.desc_empower=祭司瞬间念出祷言，将_所有可见角色_身上的所有增益或减益效果延长%1$d回合。正面效果在盟友（包括祭司自身）身上持续时间更长，负面效果在敌人身上持续时间更长。此法术还会对之前被发光效果影响的敌人重新施加发光效果。\n\n愿景诗篇只能延长特定增益或减益效果实例一次，并且无法延长护甲能力赋予的增益。
actors.hero.spells.mnemonicprayer.charge_cost_scale_empower=每目标
actors.hero.spells.radiance.name=破晓辐光
actors.hero.spells.radiance.name_empower=界·破晓辐光
actors.hero.spells.radiance.short_desc=点亮并暂时击晕视野内敌人。
actors.hero.spells.radiance.short_desc_empower=使可见敌人发光、造成伤害并短暂眩晕。
actors.hero.spells.radiance.desc=祭司爆发出神圣之光，眩晕所有可见敌人3回合，并使他们如同被引导之光击中般发光。如果当前楼层黑暗，光辉还会使祭司发光100回合。
actors.hero.spells.radiance.empowered=敌人在光中燃烧！
actors.hero.spells.recallinscription.name=符文复制
actors.hero.spells.recallinscription.name_empower=界·符文复制
actors.hero.spells.recallinscription.short_desc=重复最近使用的符石或卷轴效果。
actors.hero.spells.recallinscription.desc=牧师使用神圣魔法复制最近使用的符文以再次触发%s回合前使用的卷轴或符石的魔法效果。\n\n符文复制不能复制升级卷轴，充能消耗根据最近一次使用的物品变化而变化：符石2点充能、卷轴3点充能、秘卷4点充能。复制嬗变卷轴或嬗变/升级卷轴的符石/秘卷时，充能消耗还会翻倍。\n\n这一法术可以多次释放，但是每次花费会增加50%，除非该法术被增强。
actors.hero.spells.recallinscription.preserved=符文被保留了！
actors.hero.spells.recallinscription$useditemtracker.name=最近使用的符文
actors.hero.spells.recallinscription$useditemtracker.desc=牧师近期已使用一个兼容符文复制法术效果的物品，可以通过施法再次触发物品效果。\n\n已使用物品：%1$s\n\n剩余回合数：%2$s
actors.hero.spells.shieldoflight.name=神圣护盾
actors.hero.spells.shieldoflight.name_empower=界·神圣护盾
actors.hero.spells.shieldoflight.short_desc=针对目标提供临时护甲。
actors.hero.spells.shieldoflight.short_desc_empower=吸收攻击并反弹来自目标的投射物。
actors.hero.spells.shieldoflight.desc=牧师瞬间在自己与一个敌人之间创造一道薄薄的光之屏障，使自己的护甲格挡力针对该敌人提升%1$d-%2$d点，持续%3$d回合。
actors.hero.spells.shieldoflight.desc_empower=牧师瞬间在自己与一个敌人之间创造一道相当坚固的光之屏障。此护盾能够抵挡%4$d次攻击，甚至能反弹投射物，但如果未被使用会缓慢失效。
actors.hero.spells.shieldoflight$shieldoflighttracker.name=神圣护盾
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=一道薄薄的光之护盾正挡在此角色与一个敌人之间。它虽不足以完全阻挡攻击，但能使其减弱。\n\n剩余回合数：%s
actors.hero.spells.shieldoflight$divineshield.name=界·神圣护盾
actors.hero.spells.shieldoflight$divineshield.desc=一道相当坚固的光之护盾正挡在此角色与一个敌人之间。它能抵挡几乎任何攻击，甚至能反弹大多数投射物。\n\n剩余耐久度：%s\n神圣护盾弱化前的回合数：%s
actors.hero.spells.spiritform.name=魂之位格
actors.hero.spells.spiritform.short_desc=将三位一体分配给一个戒指或神器。
actors.hero.spells.spiritform.desc=牧师选择本局已鉴定的戒指或神器(神圣法典除外)并使三位一体获得其效果。\n\n如果所选道具为戒指，三位一体会获得所选戒指的%1$d级效果20回合。\n\n如果所选道具为神器，三位一体会复制所选神器的%2$d级效果。三位一体使用神器时的具体效果与护甲充能消耗因神器而异。\n\n该法术会更替三位一体当前已有的任何魂之位格效果。
actors.hero.spells.spiritform$spiritformbuff.name=魂之位格
actors.hero.spells.spiritform$spiritformbuff.desc魂之位格法术正使你获得道具的效果，仿佛你已将其装备于装备栏。\n\n注意，魂之位格无法复制你已经装备的装备效果。\n\n当前的效果：%1$s\n\n剩余回合数：%2$s
actors.hero.spells.smite.name=至圣斩击
actors.hero.spells.smite.short_desc=一次带有额外伤害与附魔强化的必中攻击。
actors.hero.spells.smite.desc=圣骑士将正义的破坏力量注入一次近战攻击。\n\n除了造成正常的近战伤害外，至圣斩击使未受阻击必定命中，拥有+300%%附魔效力，并造成%1$d - %2$d点额外魔法伤害。\n\n至圣斩击的额外魔法伤害随圣骑士等级提升，并且对亡灵或恶魔敌人总是造成最大额外魔法伤害。
actors.hero.spells.smite.desc_override=以此方式使用它不会消耗任何极限突破充能，除非没有足够的充能来使用至圣斩击。\n\n\n_极限突破版本：_
actors.hero.spells.smite$omnismite.name=界·至圣斩击
actors.hero.spells.smite$omnismite.short_desc=消耗极限突破来释放极至圣斩击敌人%d次。
actors.hero.spells.smite$omnismite.desc=消耗极限突破以%s效力极至圣斩击范围内的随机敌人，最多%d次（极限突破充能数 + 圣典充能数）。\n\n即使提前终止，也总是结束极限突破。
actors.hero.spells.smite$omnismite.leap=施放此法术时，圣骑士可能自动_跳跃至多%d格_（圣别天赋加成）以寻找新目标。
actors.hero.spells.smite$omnismite.charge_cost=每次命中%s，最多%d充能
actors.hero.spells.stasis.name=星界投射
actors.hero.spells.stasis.short_desc=将盟友移出地牢并保存他们。
actors.hero.spells.stasis.desc=牧师将其与盟友的联系集中于自身，使盟友暂时化为牧师体内的某种凝滞状态的能量。盟友最多会被凝滞%d回合，而在凝滞状态下，其所有的正面效果均不受时间影响。\n\n法术效果自然结束时盟友会出现在牧师附近，牧师也可无消耗地立即再次施放该法术以提前结束法术效果。星界投射还可移动无法移动的盟友，但无法将其跨层移动。
actors.hero.spells.stasis$stasisbuff.name=星界投射
actors.hero.spells.stasis$stasisbuff.left_behind=你无法移动的盟友被落在了后面。
actors.hero.spells.stasis$stasisbuff.desc=牧师当前已有盟友被星界投射凝滞状态。该盟友包括诸圣神力在内的所有正面效果都会被凝滞，并且法术效果结束时盟友会在牧师附近再次出现。法术效果还可被再次施放星界投射提前结束。\n\n彼岸盟友：%1$s\n剩余回合数：%2$s
actors.hero.spells.sunray.name=阳炎射线
actors.hero.spells.sunray.name_empower=界·阳炎射线
actors.hero.spells.sunray.short_desc=造成远程魔法伤害并使目标失明一次。
actors.hero.spells.sunray.short_desc_empower=造成远程魔法伤害并使目标失明。瞄准所有敌人。
actors.hero.spells.sunray.desc=牧师向目标发射致盲光束，造成%1$d~%2$d伤害并使其失明%3$d回合。阳炎射线必定对亡灵和恶魔目标造成最大伤害。\n\n被该法术击中后敌人会调节其视觉，以防被射线再次致盲。然而，如果在被该法术致盲后再次被该法术击中，那么压倒性的强光会将其麻痹而非致盲。
actors.hero.spells.sunray.multi_target=_此法术将对视野中的每个目标施放一次，但不少于两次。_
actors.hero.spells.sunray.charge_cost_scale_empower=每目标
actors.hero.spells.walloflight.name=神圣屏障
actors.hero.spells.walloflight.name_empower=界·神圣屏障
actors.hero.spells.walloflight.charge_cost_scale_empower=每格
actors.hero.spells.walloflight.short_desc=创造一堵阻挡敌人的墙。
actors.hero.spells.walloflight.short_desc_empower=在视野内任何地方绘制一堵阻挡敌人的墙。
actors.hero.spells.walloflight.desc=圣骑士将圣光凝聚为墙壁，在自身面前创造一面1格厚，%1$d格宽，持续20回合的神圣屏障。\n\n神圣屏障除不遮挡视野外与正常墙壁无异。在屏障被创造时，屏障所困住的敌人会被短暂击晕并在条件允许的情况下被击退。屏障所卡住的任何东西都可移动出去。\n\n神圣屏障可被八向施放。如果已有屏障存在，则该法术可被免费再次使用以立即驱散屏障。
actors.hero.spells.walloflight.desc_empower=圣骑士将圣光凝聚为墙壁，在自身面前创造一面1格厚，%1$d格宽，持续20回合的神圣屏障。\n\n神圣屏障除不遮挡视野外与正常墙壁无异。在屏障被创造时，屏障所困住的敌人会被短暂击晕并在条件允许的情况下被击退。屏障所卡住的任何东西都可移动出去                                                                                                                                                                                                                                                                                                                                                                                                                         。\n\n神圣屏障可被八向施放。如果已有屏障存在，则该法术可被免费再次使用以立即驱散屏障。
actors.hero.spells.walloflight.early_end=你驱散了光之墙。
actors.hero.spells.walloflight.existing=无法在现有墙旁边放置新墙
actors.hero.spells.walloflight$lightwall.desc=闪烁的光之面板阻挡了此处的通道。
actors.hero.spells.metaexpression.name=唤饰祷言
actors.hero.spells.metaexpression.name_empower=界·唤饰祷言
actors.hero.spells.metaexpression.short_desc=为英雄注入随机小饰品的力量，持续短时间。
actors.hero.spells.metaexpression.short_desc_empower=为英雄注入更强的随机小饰品力量，持续短时间。
actors.hero.spells.metaexpression.desc=牧师祈求来自上界的伟大建议，获得一个随机小饰品的力量，升级至+%1$d。此力量持续%2$d回合。
actors.hero.spells.metaexpression.trinket=你被注入了%s的力量！
actors.hero.spells.metaexpression$trinketholder.name=唤饰祷言
actors.hero.spells.metaexpression$trinketholder.desc=你祈求了，并且你将获得随机数之神的力量。\n\n你目前被注入了_%s_的力量。%s\n\n剩余回合数：_%s_。
actors.hero.spells.radiantgrappler.name=圣光勾爪
actors.hero.spells.radiantgrappler.name_empower=界·圣光勾爪
actors.hero.spells.radiantgrappler.short_desc=施放一个可以抓取物体的抓钩。
actors.hero.spells.radiantgrappler.short_desc_empower=创造一群钩爪来收集所有当前可见的物品。
actors.hero.spells.radiantgrappler.desc=牧师向目标格子施放一个抓钩，可以与环境互动。它可以从安全距离收集物品或激活陷阱。\n\n升级天赋后，可以抓取实体将其拉至英雄身边，或者钩住空地将英雄移动到该处。这不允许穿墙。
actors.hero.spells.radiantgrappler.desc_empower=牧师召唤大量钩爪，它们将抓住所有当前对他可见的物品，甚至穿墙抓取。
actors.hero.spells.radiantgrappler.locked_item=你无法从容器中或出售时拾取物品。
actors.hero.spells.radiantgrappler$grappleritem.name=圣光勾爪
actors.hero.spells.radiantgrappler$grappleritem.desc=这个看似空灵但坚固的圣光钩爪可用于通过锚定和拉动与环境互动。你可以更快地旅行、抓取物品或怪物、拉下陷阱的开关。\n\n抓钩是消耗品，但你可以在每个商店补充或在地牢层级中找到它们。
actors.hero.spells.spellempower.instant=法术被瞬间施放！
actors.hero.spells.spellempower.short_desc=暂时强化法术并忽略充能限制。
actors.hero.spells.spellempower.depleted=_圣典因过度使用而耗尽，需要充能更多才能施放此法术。_
actors.hero.spells.spellempower$buff.desc=牧师的法术当前被强化，使其更加强大，并且允许施放时无视圣典的当前充能限制。\n\n剩余充能：%s\n法术强化弱化前的回合数：%s
actors.hero.spells.spellempower$divineadvent.name=神圣降临
actors.hero.spells.spellempower$divineadvent.desc=祭司暂时强化圣典，允许他们_无视限制使用最多 _%d 充能_的法术，但是效果结束后有_100回合冷却_。\n\n_只要圣典当前未处于神圣降临的恢复期，即可施放此法术。_
actors.hero.spells.spellempower$divineadvent$buff.name=神圣降临
actors.hero.spells.spellempower$divineadvent$buff.cooldown=增益结束后的冷却时间：%d
actors.hero.spells.spellempower$divineadvent$cooldown.name=神圣降临冷却
actors.hero.spells.spellempower$divineadvent$cooldown.desc=祭司最近施放了神圣降临，必须等待才能再次施放。\n\n剩余回合数：%s
actors.hero.spells.spellempower$limitbreak.name=界限突破
actors.hero.spells.spellempower$limitbreak.desc=圣骑士暂时强化圣典，允许他们在施放法术时，_无视限制使用最多 _%d 充能_的法术，代价是法术施放后进入 _%d 回合_冷却。
actors.hero.spells.spellempower$limitbreak.not_critical=在30%生命值以下时，冷却时间和充能消耗减半，并且可以在充能不足时施放法术。
actors.hero.spells.spellempower$limitbreak.critical=_因为圣骑士濒临死亡，可以在充能不足时施放法术，并且其冷却时间和充能消耗当前减半。_
actors.hero.spells.spellempower$limitbreak$buff.name=界限突破
actors.hero.spells.spellempower$limitbreak$buff.cooldown=距离能再次使用极限突破的回合数：%s
actors.hero.spells.spellempower$limitbreak$cooldown.name=极限突破冷却
actors.hero.spells.spellempower$limitbreak$cooldown.desc=圣骑士最近施放了极限突破，必须等待才能再次施放。\n\n剩余回合数：%s
actors.hero.abilities.rat_king.omniability.name=全能
actors.hero.abilities.rat_king.omniability.short_desc=为什么在朕不需要的时候选择？_全能_让朕可以使用每一种能力！
actors.hero.abilities.rat_king.omniability.desc=每次使用该技能时，都会随机生成一个护甲技能，所有天赋都将转化为对应技能的天赋。\n\n只要对应的召唤保持激活状态，召唤物品的技能就会一直可用。
actors.hero.abilities.rat_king.omniability.ability_desc=当朕下次使用此能力时，会发生以下情况：
actors.hero.abilities.rat_king.wrath.name=鼠王之怒
actors.hero.abilities.rat_king.wrath.short_desc=朕把无限的_怒火_倾泻在王国的敌人身上。然而，这需要几个回合的时间。伟大的力量带来伟大的责任！
actors.hero.abilities.rat_king.wrath.desc=通过拒绝所有常规能力，朕得到了无上的伟力！使用这个能力，朕可以无视墙壁闪现至10格内的任意位置，并且在原位置释放一团烟雾使附近的所有人失明。朕不会被墙壁阻挡。出现在落点时，朕的御座将撞击地板产生冲击波，对落点附近的所有敌人造成5-10点伤害，每1点超过10的力量能增加1-2点伤害，并使他们残废5回合。然后，朕将释放魔杖的元素风暴造成10-20点伤害，攻击落点4格范围内的所有生物，随后触发以附近所有敌人为目标的灵魂飞刃。\n\n当目标有多个时，灵魂飞刃的伤害较低，不过这可以通过天赋来加强。
actors.hero.abilities.rat_king.wrath.desc_shadow_step=朕是隐形的，所以能够立即闪烁到我视野内的6个方块的任何附近位置，并且不会被墙挡住。
actors.hero.abilities.rat_king.wrath$ratstatue.name=老鼠雕像
actors.hero.abilities.rat_king.wrath$ratstatue.desc=这件华丽的艺术作品几乎完美地刻画了他作为老鼠的伟岸形象，这将充实地牢博物馆的精品收藏。事实上，由于它太过栩栩如生，敌人似乎很容易把它和真实的东西混淆起来！
actors.hero.abilities.rat_king.legacywrath.name=神圣审判
actors.hero.abilities.rat_king.legacywrath.short_desc=朕以神灵的名义向背叛者发起_审判_！尽管这会暴露朕的位置几回合并耗费所有的护甲充能。所有力量都有代价！
actors.hero.abilities.rat_king.legacywrath.desc=神赋予朕在凡间无上的权柄！朕可以闪现到6个格子内的任意位置，使原本位置周围的所有敌人失明。一旦到了目标地点，朕将对6格内可见的每个单位施放一个熔壤魔咒（效果取决于天赋），并在_隐形_之前，对6格内的任何敌人释放灵魂飞刃。\n\n这个技能需要2个回合跳跃，1个回合释放熔壤魔咒，1个回合释放灵魂飞刃，在看不到敌人的情况下使用它将跳过攻击阶段。\n\n这个能力需要耗费_所有的护甲充能_或_33%当前生命值_。
actors.hero.abilities.rat_king.musrexira.name=鼠王武库
actors.hero.abilities.rat_king.musrexira.short_desc=朕召唤_朕的王国_抵御外敌！它可以以各种形式实质化，具体取决于这个能力被引导的位置。
actors.hero.abilities.rat_king.musrexira.desc=如果选择自己，朕将召唤_皇家夜枭_和_暗影映像_来护驾，每位花费10充能。如果朕还剩下_20_充能，会给灵能短弓注入_自然之力_，如果还剩下_40_充能，会使用_苦痛坚忍_自卫！\n\n\ 如果选择空地，并且它离自身的距离小于3格，朕将在这里放置_空间信标_；如果信标已经存在，就能够选择花费_40_充能传送到彼处，或者清除它。信标放置的范围可以通过天赋来增大。\n\n如果选择了敌人，朕将使用国库中的法杖瞄准其位置释放_狂野魔法_，花费_40_充能。\n\n要施展这个能力，至少需要_40_点充能。
actors.hero.hero.name=你
actors.hero.hero.leave=现在还不能离去，埋藏在地牢之下的名利正呼唤着你！
actors.hero.hero.leave_rk=你不能逃避！这是你的错误决定搞出的烂摊子。
actors.hero.hero.level_up=升级！
actors.hero.hero.new_level=升级！精准+，闪避+，最大生命值 +5！
actors.hero.hero.level_down=等级下降！
actors.hero.hero.low_level=等级下降！精准-，闪避-，最大生命值-5！
actors.hero.hero.new_talent=天赋点 +1！
actors.hero.hero.new_talents=天赋点 +2！
actors.hero.hero.unspent=你还有尚未使用的天赋点！
actors.hero.hero.level_cap=你不能变得更强了，不过你的经验给了你一股力量！
actors.hero.hero.you_now_have=你获得了：%s。
actors.hero.hero.you_cant_have=你无法携带：%s。
actors.hero.hero.locked_chest=箱子锁着而你没有对应的钥匙
actors.hero.hero.locked_door=你没有对应的钥匙。
actors.hero.hero.noticed_smth=你注意到了些什么。
actors.hero.hero.search=搜索
actors.hero.hero.search_distracted=你没办法集中精力，探索周边异常费力。
actors.hero.hero.pain_resist=疼痛使你得以抵抗睡意。
actors.hero.hero.revive=重生十字章迸裂出苏生的能量！
actors.hero.heroclass.warrior=战士
actors.hero.heroclass.warrior_desc_short=战士通过他的破碎印章提供的护盾承受额外伤害。这个印章可以在护甲之间转移，并转移一个升级。
actors.hero.heroclass.warrior_desc=战士初始携带一枚可以贴附于护甲的_独特破损纹章。_他在装备附着纹章的护甲时会随时间产生生命值之上的护盾值。纹章可以在护甲之间转移，并且可以携带一级升级。\n\n同时，战士初始携带一柄_破旧的短剑_，_三块投石_，布甲，水袋与所有包裹。\n\n战士以2倍的速度鉴定武器和护甲。\n\n战士开局鉴定的物品有：\n_-_鉴定卷轴\n_-_治疗药水\n_-_盛怒卷轴\n\n_进食时_，战士受到更少伤害，而且在血量较少时恢复血量。\n\n战士_等待之后获得1-2护甲_。\n\n战士_从力量药水获得少量额外力量_。
actors.hero.heroclass.warrior_unlock=战士自动解锁。
actors.hero.heroclass.mage=法师
actors.hero.heroclass.mage_desc_short=法师是奥术专家，携带一根比法杖更强大的老魔杖。这根老魔杖可以被灌输任何法杖法术。
actors.hero.heroclass.mage_desc=法师初始携带一把_老魔杖_。老魔杖的自动充能速度显著快于一般法杖，并且有 1 点额外最大充能数。法师可以将地牢中找到的各式法杖灌注到老魔杖中。\n\n法师天生的高精神力使他能在使用法杖时视为有额外+2等级。\n\n同时，法师初始携带一把已灌注了_魔弹法杖_的老魔杖、布甲、水袋与所有包裹。重新灌注老魔杖可以回收魔弹法杖\n\n法师开局鉴定的物品有：\n_- _鉴定卷轴\n_- _液火药剂\n_-_ 升级卷轴
actors.hero.heroclass.mage_unlock=法师精通各类法杖，并在开局时持有一根_独特的法师魔杖_。\n\n_在游戏中用升级卷轴强化一个道具_以解锁法师。
actors.hero.heroclass.rogue=盗贼
actors.hero.heroclass.rogue_desc_short=盗贼可以躲避敌人并从隐身中发动攻击，使用他的暗影斗篷。他还可以从更远处探测秘密和陷阱。
actors.hero.heroclass.rogue_desc=多年来与国家税务局在逃税问题上的斗争使得盗贼精熟于对_暗影斗篷_的使用，它的充能速度提高了50%并能在激活时将部分能量导入他的武器。他还可以在不装备的条件下使用暗影斗篷，但是充能速度会减慢。\n\n盗贼能从更远的距离_探测秘密与陷阱_。\n\n同时，盗贼初始携带一柄_匕首_，_三把飞刀_，布甲，水袋与所有包裹。\n\n多年的职业经验也使盗贼成为了珠宝方面的行家，他现在能在装备戒指时立刻鉴定出它的类型，并以2倍的速度完全鉴定。\n\n盗贼开局鉴定的物品有：\n_-_鉴定卷轴\n_-_隐形药剂\n_-_探地卷轴
actors.hero.heroclass.rogue_unlock=盗贼可使用他特有的_暗影斗篷_操控战局，并通过隐身伏击敌人。\n\n_在一局游戏中伏击敌人10次_以解锁盗贼。_
actors.hero.heroclass.huntress=女猎手
actors.hero.heroclass.huntress_desc_short=猎手是投掷武器的大师，拥有一把带有无限箭矢的灵能短弓。她还可以在高草中行走而不会践踏它。
actors.hero.heroclass.huntress_desc=女猎手初始携带一把独特的_灵能弓_，拥有无限的魔法弹药。\n\n女猎手可以穿过高草丛而_不将其践踏成草地_。\n\n女猎手使用投掷武器时_更具破坏性_。\n\n女猎手能感知到附近的敌人，即使他们藏在障碍物后面。\n\n同时，女猎手初始携带一副_带钉手套_，布甲，水袋与所有包裹。\n\n女猎手还初始携带_武装披风_，这使她能够给箭矢充能以使用_超级射击_。\n\n女猎手可以用她的箭标记地格以无视障碍地_获得视野_。这个能力有20回合的冷却时间。\n\n女猎手开局便已鉴定的道具有：\n_-_鉴定卷轴\n_-_灵视药剂\n_-_催眠卷轴
actors.hero.heroclass.huntress_unlock=女猎手精通投掷武器，并且具有一把能无限射击的_独特灵能弓_。\n\n_在一局游戏中使用投掷武器击中 15 名不同敌人_以解锁女猎手。
actors.hero.heroclass.duelist=决斗家
actors.hero.heroclass.duelist_desc_short=决斗家是一名武器大师，可以利用她的武器触发特殊的武技。不同武器的武技效果不同。
actors.hero.heroclass.duelist_desc=决斗家初始携带具有特殊武技的刺剑，武技随时间重新充能。\n\n游戏中的每把武器都有不同的特殊武技，决斗家可以使用这些能力。\n\n武技充能还可以用来收割高草并储存以备后用。\n\n决斗家还会携带两把飞刺、布甲、水袋和所有包袋。\n\n决斗家还会自动鉴定：\n_-_ 鉴定卷轴\n_-_ 力量药剂\n_-_ 镜像卷轴\n\n决斗家_鉴定武器护甲更快_。\n\n决斗家_血量较少时使用武技获得少量护盾_。\n\n决斗家进食_恢复少量武技充能_。
actors.hero.heroclass.duelist_unlock=解锁决斗家，请装备一把没有力量惩罚的二级或更高级武器。
actors.hero.heroclass.cleric=牧师
actors.hero.heroclass.cleric_desc_short=牧师是一位神圣施法者，使用其独特的_圣典_引导神圣魔法。他们可以通过天赋_学习和升级法术_。
actors.hero.heroclass.cleric_desc=牧师初始携带一本_独特的圣典_，可用于施放各种法术。圣典本身拥有大量的充能，并且每级获得两点充能。\n\n牧师的大部分天赋专注于学习或升级法术。\n\n牧师还初始携带_一根权杖_、布甲、一个水袋和所有包袋。\n\n牧师还会自动鉴定：\n_-_ 鉴定卷轴\n_-_ 净化药剂\n_-_ 祛邪卷轴\n\n进食之后，牧师恢复少量充能并在下次施法获得少量护盾。\n\n圣典不装备也能使用，但是充能速度大幅降低。
actors.hero.heroclass.cleric_unlock=要解锁牧师，请_完全净化任何一件被诅咒装备上的诅咒。_
actors.hero.heroclass.rat_king=鼠王
actors.hero.heroclass.rat_king_desc=朕有能力独行，何必钻营于一门职业？\n\n朕随身携带着所有能找到的宝物：一个皇室传承的_破损纹章_，一根御前法师制作的_老魔杖_，一件来自皇家宝库的无价的_阴影斗篷_，还有一把来自军械库的_灵能弓_。\n\n 朕明察秋毫，可以从更远的距离检测到陷阱和秘密。  \n\n朕爱惜王国的草木，可以在高草中行走而不践踏之。
actors.hero.heroclass.rat_king_desc_short=瞧！终极职业的降临，将实现你所有的梦想。由于其可以获得每个破碎地牢职业的机制、天赋和独特物品，鼠王的勇武与才智天下无双。
actors.hero.heroclass.rat_king_unlock=看看这个终极职业，它将让你所有的梦想成真。由于他能接触到每一个破碎地牢职业的机制、天赋和独特物品，他的强度和多功能性无与伦比。\n\n要解锁他，你可以用任何职业_获得胜利_。
actors.hero.herosubclass.berserker=狂战士
actors.hero.herosubclass.berserker_short_desc=_狂战士_在受到伤害的时候会积累怒气，怒气能提高狂战士的攻击力，并使其短时间抗拒死亡。
actors.hero.herosubclass.berserker_desc=_狂战士_在受到物理伤害时会积累怒气，这种怒气甚至可以由被其护甲抵挡的伤害转化而来！怒气会随时间稳定消逝，但将在狂战士生命值较低时流失得更慢。\n狂战士最高可在拥有90%怒气时拥有100%的伤害加成。在100%怒气时他可以进入狂暴状态，根据自身已损失生命值获得2-6倍的纹章护盾，并在还有护盾剩余时使得怒气保持在100%。但是在狂暴结束后狂战士需要时间恢复。
actors.hero.herosubclass.gladiator=角斗士
actors.hero.herosubclass.gladiator_short_desc=_角斗士_会在成功进行攻击时积累连击数。角斗士可以消耗连击数以使用特殊战技。
actors.hero.herosubclass.gladiator_desc=每当使用其装备的武器或投掷武器造成一次成功的攻击时，角斗士都会积累一点连击数。若角斗士没能在五回合内造成一次成功的攻击，则其连击数将被重置（可以被天赋影响）。击杀敌人可以保留25回合连击。\n\n随着连击数的积累，角斗士将解锁数种必中连击战技。\n2连击：击退敌人，保留连击。\n4连击：根据护甲值造成伤害。\n6连击：招架反击，保留连击。\n8连击：伤害目标以及附近敌人。\n10连击：每有一连击点进行一次攻击。
actors.hero.herosubclass.brawler=街霸
actors.hero.herosubclass.brawler_short_desc=_街霸_可以通过充能来发动特殊攻击，具体的手段取决于他手中的武器。
actors.hero.herosubclass.brawler_desc=街霸随着时间的推移逐渐增强打击的力量。这可以用来为下一次打击增加伤害或使用特殊攻击。每种武器都有特殊的攻击手段。\n街霸也可以从快捷栏装备武器，并且这一过程不花费时间。
actors.hero.herosubclass.battlemage=战斗法师
actors.hero.herosubclass.battlemage_short_desc=_战斗法师_在使用老魔杖近战攻击时会附带额外的法术效果。这些效果取决于老魔杖内灌注的法杖类型。
actors.hero.herosubclass.battlemage_desc=战斗法师使用老魔杖近战时会附带类似附魔的额外效果，效果取决于老魔杖吸收的法杖类型，每种法杖各不相同。老魔杖在近战中还会恢复0.5点充能。
actors.hero.herosubclass.warlock=术士
actors.hero.herosubclass.warlock_short_desc=_术士_在对敌人使用法杖时有几率为其带上灵魂标记。无论何时，术士都将在对被标记的敌人造成物理伤害时回复生命值。
actors.hero.herosubclass.warlock_desc=术士在对敌人使用法杖时有几率为其带上灵魂标记。施加标记的几率与标记的持续时间随法杖等级增加而上升。\n\n在攻击被标记的敌人时，每当造成5点伤害，术士都将回复2点生命值。这种效果只会在造成物理伤害时出现，若使用法杖造成伤害则不会触发它。
actors.hero.herosubclass.warlock_short_desc_huntress=_术士_在对敌人使用法杖时有几率为其带上灵魂标记。无论何时，她都将在对被标记的敌人造成物理伤害时回复生命值。
actors.hero.herosubclass.warlock_desc_huntress=术士在对敌人使用法杖时有几率为其带上灵魂标记。施加标记的几率与标记的持续时间随法杖等级增加而上升。\n\n在攻击被标记的敌人时，每当造成5点伤害，她都将回复2点生命值。这种效果只会在造成物理伤害时出现，若使用法杖造成伤害则不会触发它。
actors.hero.herosubclass.spiritualist=唤灵者
actors.hero.herosubclass.spiritualist_short_desc=_唤灵者_可以召唤幽灵来帮助他打败怪物。
actors.hero.herosubclass.spiritualist_desc=随着时间推移，唤灵者积聚他的灵魂能量，并可以以此召唤出为他而战的幽灵。\n\n幽灵有33%额外的闪避，每回合攻击1.5次。幽灵的抗性和能力会随着天赋进阶而增强。
actors.hero.herosubclass.assassin=刺客
actors.hero.herosubclass.assassin_short_desc=_刺客_使用的武器视为有额外+2等级。隐形时，_刺客_会准备一次致命的攻击。耐心等得越久，这一击的威力越强。
actors.hero.herosubclass.assassin_desc=刺客在隐形中准备着强力的一击。隐形时间越长，下次攻击就越致命，9回合时达到最大效果。\n\n刺客遁出阴影，对目标打出强力一击。刺客可以闪现到目标背后，也能立刻处决较弱的目标。\n\n刺客也更精通近战武器，他使用任何近战武器视为额外+2等级。
actors.hero.herosubclass.sniper=狙击手
actors.hero.herosubclass.sniper_short_desc=_狙击手_获得额外33%精准值，且她的远程攻击能穿透护甲。用投掷武器击中目标后，狙击手能以灵能弓进行一次特殊追击。
actors.hero.herosubclass.sniper_desc=狙击手是远程战斗大师。她的攻击精准值增加33%且远程攻击穿透防御。使用投武击中敌人后，女猎手能对目标施以狙击标记，并使用灵能短弓对此敌人发射一次追击，追击的形式取决于弓的改造模式。\n\n未改造的弓会发射一只伤害稍低的箭矢，但不消耗任何时间。改造速度的弓会三箭连发，每只箭的伤害较低但能触发附魔，消耗1回合。改造伤害的弓会发射一只必定命中的狙击箭矢，根据距离造成额外伤害，但需要消耗2回合。
actors.hero.herosubclass.warden=守望者
actors.hero.herosubclass.warden_short_desc=_守望者_具有穿透高草的视野，而且在种植和踩踏植物时会获得额外效果。
actors.hero.herosubclass.warden_desc=守望者与自然之力有强大的联结，这赋予了她多项有关植物的能力。守望者具有穿透高草与枯草的视野。\n\n守望者种下的种子周围会生出草，在踩踏植物时会获得额外效果取代原本效果，使得所有植株对其完全无害。
actors.hero.herosubclass.champion=勇士
actors.hero.herosubclass.champion_short_desc=_勇士_可以双持武器。她的普通攻击使用主武器，但她可以交换武器并使用任意一把武器的能力。
actors.hero.herosubclass.champion_desc=勇士是近战武器大师，可以装备次要武器以补充主武器。她的普通攻击使用主武器，但她可以立即交换主武器，并使用主或副武器的武技。\n\n她拥有2点额外武器充能上限，并有额外50%武器充能速度
actors.hero.herosubclass.monk=武僧
actors.hero.herosubclass.monk_short_desc=_武僧_在战斗中积累能量。这种能量可以用于各种独特的能力。
actors.hero.herosubclass.monk_desc=武僧是体术大师。当她击败敌人时，她会获得内力，可以用于各种防御和实用能力。内力不会随时间减少，但根据武僧的等级有一个内力上限。\n\n1内力：用拳头快速攻击。\n2内力：专注以躲避下次攻击。\n3内力：立刻冲刺到附近。\n4内力：踢飞敌人。\n5内力：冥想以清除状态并恢复法杖和神器充能。
actors.hero.herosubclass.priest=祭司
actors.hero.herosubclass.priest_short_desc=_祭司_获得新的远程法术和强化版的引导之光。
actors.hero.herosubclass.priest_desc=祭司获得各种新的和升级的法术，强调远程战斗以及与魔法物品的协同作用。\n\n祭司每50回合可以免费施放一次_引导之光_，并且可以通过盟友、魔杖和一些神器消耗发光减益效果，造成等同于其等级的额外伤害。\n\n祭司还获得_破晓辐光_法术，以2点充能为代价驱散黑暗、照亮并短暂眩晕所有可见敌人。
actors.hero.herosubclass.paladin=圣骑士
actors.hero.herosubclass.paladin_short_desc=_圣骑士_获得新的近战法术和强化版的神圣武器与护佑。
actors.hero.herosubclass.paladin_desc=圣骑士获得各种新的和升级的法术，强调近战战斗以及与武器和护甲的协同作用。\n\n圣骑士的_神圣武器_和_神圣护佑_法术提供更大的加成，不再覆盖现有附魔和符印，并且可以通过施放其他法术来延长持续时间。\n\n圣骑士还获得_至圣斩击_法术，使其能进行一次保证命中的近战攻击，附带额外伤害和附魔效力。
actors.hero.herosubclass.highness=尊者
actors.hero.herosubclass.highness_short_desc=_尊者_可以使用储存在物品栏中的杂草进行充能，获得短暂的强力增益爆发。
actors.hero.herosubclass.highness_desc=尊者是专注与绿叶植物的大师。她可以消耗物品栏中的杂草来充能她的思想和身体，使其在战斗中更加强大，并快速充能神器、魔杖和恢复生命值。然而，尊者必须持续消耗杂草来维持这些增益效果。\n\n增益停止后，尊者需要恢复；恢复的时长取决于充能期间消耗了多少杂草，并且随着一次充能中使用更多杂草而变得越来越长。
actors.hero.herosubclass.freerunner=疾行者
actors.hero.herosubclass.freerunner_short_desc=_疾行者_在奔跑时会累积动量，并且精通魔法和远程攻击手段。动量可以用于开启逸动效果，让他在短时间内拥有更高的移动速度和更强的闪避能力。
actors.hero.herosubclass.freerunner_desc=_疾行者_在奔跑时会累积动量。动量最多累积10点，在不动时会迅速衰减。动能可以开启逸动状态，每点动量可供疾行者飞奔两回合。\n\n逸动状态下的疾行者以双倍速度跑动，并获得正比于自身等级的闪避。逸动状态结束后，疾行者需小休一会以重新积累动量。此外，疾行者还可以熟练掌握各种远程作战手段，使他能够比以前更有效地使用投掷武器、魔杖和触手可及的武器。
actors.hero.herosubclass.decepticon=暗影之熠
actors.hero.herosubclass.decepticon_short_desc=盗贼被改造成一台代号_暗影之熠_的杀戮机器，他的战斗能力和机动性得到了强化。
actors.hero.herosubclass.decepticon_desc=盗贼被改造成一台代号_暗影之熠_的全金属机械装置，具有强大的攻击能力，且能在人形和备用形态之间转换的能力。\n\n\在这两种模式下，暗影之熠对睡眠、流血、中毒和有毒气体免疫。\n\n\在人形模式下，暗影之熠对有负面状态的敌人造成更多伤害（每种增加15%的伤害，指数叠加），并且他的武器有额外的射程。\n\n\在备用模式下，暗影之熠的机动性更强，能够以2倍的速度飞行移动，但不能使用他的武器和护甲，也不能通过魔杖造成伤害。他的闪避能力增强，且敌人更难注意到他。他可以远距离攻击敌人，并伴随着力量的增加而产生少量穿甲伤害。
actors.hero.herosubclass.king=鼠皇大帝
actors.hero.herosubclass.king_short_desc=...\n\n等等，这是什么？\n\n王不会被规则束缚！被迫选择某个方向简直是愚不可及！\n\n朕渴望_一切力量!!!_
actors.hero.herosubclass.king_desc=朕可以通过天赋来选择想要的任何能力，而不是做选择一个转职这样蹩脚的事情\n\n（如果有多个特殊操作处于激活状态，可以通过相应的buff或长按特殊动作按钮来切换激活的特殊动作。）
actors.hero.herosubclass.rk_champion=全能战神
actors.hero.herosubclass.rk_champion_short_desc=但是如果朕乐意，当然也可以选择些什么！这种情况下，你将在朕的_全能战神_形态下畏惧地屈服。\n\n朕将能够轮换使用原本属于敌方精英的_8种能力_，它们现在_为我所用_！
actors.hero.herosubclass.rk_champion_desc=朕聚集不可思议的力量，从8种精英词条中选择一种。每种形态都具有优点和缺点，但可以通过使用天赋进行调整。\n\n只有当获得相应的精英词条时，新的天赋才会被激活。
actors.hero.talent$provokedangertracker.name=受衅怒火
actors.hero.talent$provokedangertracker.desc=战士最近失去了他的护盾，他的下一次物理攻击将造成额外伤害。\n\n剩余回合数：%s。
actors.hero.talent$lingeringmagictracker.name=残留魔法
actors.hero.talent$lingeringmagictracker.desc=法师最近使用了法杖或魔杖，他的下一次物理攻击将造成额外伤害。\n\n剩余回合数：%s。
actors.hero.talent$followupstriketracker.name=追加打击
actors.hero.talent$followupstriketracker.desc=猎手最近用投掷武器攻击了一个敌人，她对同一目标的下一个近战攻击将造成额外伤害。\n\n剩余回合数：%s.
actors.hero.talent$patientstriketracker.name=沉稳一击
actors.hero.talent$patientstriketracker.desc=决斗家在攻击前等待一个回合，该次攻击将造成额外伤害。
actors.hero.talent$improvisedprojectilecooldown.name=即兴投掷-冷却
actors.hero.talent$improvisedprojectilecooldown.desc=你刚刚发动过这个天赋，需要稍等才能再次发动。\n\n剩余的冷却回合：%s。
actors.hero.talent$rkpd2lethalmomentumtracker$chain.name=手起刀落
