buildscript {
    repositories {
        maven { url 'https://jitpack.io'}
        google()
        mavenCentral()
        maven {
            url = uri("https://storage.googleapis.com/r8-releases/raw")
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.2'
    }
}

allprojects {

    ext {
        appName = 'Rat King Adventures'
        appPackageName = 'com.zrp200.rkpd2abyssal'

        appVersionCode = 855
        appVersionName = '2.3.3'

        appJavaCompatibility = JavaVersion.VERSION_11

        appAndroidCompileSDK = 36   //Android 16
        appAndroidMinSDK = 21       //Android 5.0
        appAndroidTargetSDK = 36    //Android 16

        gdxVersion = '1.14.0' //using snapshot as 1.13.5 has issues with Android R8
        gdxControllersVersion = '2.2.4'
        robovmVersion = '2.3.21'
    }
    version = appVersionName

    repositories {
        maven { url 'https://jitpack.io'}
        google()
        mavenCentral()
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    }

}